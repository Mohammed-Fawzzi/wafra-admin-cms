<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وفرا | لوحة إدارة المنصّة — نموذج الشاشات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Expo Arabic is the typeface named in the Figma design system (Buttons: Expo Arabic Bold 14/14).
     It is a licensed font and is not served from a public CDN, so it is referenced first and
     falls back to Tajawal/Cairo. Install it locally to see the intended rendering. -->
<style>
:root{
  /* ===== Brand — kept per brief, navy taken from the DS token Buttons/secondary/default ===== */
  /* هوية وفرا من الشعار: الكحلي للهوية والأحمر للإجراء الأساسي. */
  --navy:#23386D; --navy-700:#315192; --navy-900:#162C5C;
  --coral:#FA0001; --coral-soft:#FFF0F0;

  /* ===== Neutrals — DS Text scale ===== */
  --ink:#111217;      /* Text/500 */
  --ink-2:#444A5B;    /* Text/400 */
  --muted:#666F89;    /* Text/300 */
  --muted-2:#90949E;  /* Text/200 */
  --line:#D3D6DE;         /* Border-Divider/Light */
  --line-strong:#C3C6D2;  /* Border-Divider/Dark */
  --bg:#FAFAFB;       /* BG/Light */
  --card:#FFFFFF;     /* BG/White */
  --grey-bg:#E4E5EB;  /* BG/Dark */

  /* ===== Semantic — DS Success / Error / Info / Primary(as warning) =====
     surface tints derived from the 100 step; ink steps darkened to clear AA at 12px */
  --green:#00AD5F; --green-ink:#00713F; --green-bg:#E9F8F1; --green-line:#AAE4CA;
  /* الأحمر الدلالي أغمق من أحمر الهوية، لتبقى الأخطاء مميزة وواضحة. */
  --red:#C40202;   --red-ink:#990000;   --red-bg:#FEECEC;   --red-line:#FDCCCC;
  --blue:#428BC1;  --blue-ink:#2E6F9F;  --blue-bg:#ECF3F9;  --blue-line:#81B2D6;
  --amber:#F1C111; --amber-ink:#8A6A00; --amber-bg:#FDF6E3; --amber-line:#FAEAB0;

  /* ===== Radius — DS Radius System ===== */
  --r-xxs:2px; --r-xs:2px; --r-s:4px; --r-sm:6px; --r-m:10px;
  --r-ml:16px; --r-lg:24px; --r-xl:36px; --r-round:999px;
  --r:var(--r-ml);      /* cards */
  --r-ctl:var(--r-m);   /* buttons, inputs, dropdowns */

  /* ===== Elevation — DS Shadows ===== */
  --sh-s:0px 1px 3px 0px rgba(16,24,40,.1), 0px 1px 2px -1px rgba(16,24,40,.1);
  --sh-m:0px 4px 6px -1px rgba(16,24,40,.1), 0px 2px 4px -2px rgba(16,24,40,.1);
  --sh-l:0px 10px 15px -3px rgba(16,24,40,.1), 0px 4px 6px -4px rgba(16,24,40,.1);
  --sh-xl:0px 20px 25px -5px rgba(16,24,40,.1), 0px 8px 10px -6px rgba(16,24,40,.1);
  --shadow:var(--sh-s);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Expo Arabic','Tajawal','Cairo',system-ui,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Expo Arabic','Cairo',sans-serif;margin:0;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.native-input{width:100%;border:1px solid var(--line);border-radius:var(--r-ctl);background:#fff;color:var(--ink);font:inherit;padding:10px 12px;outline:0;resize:vertical}
.native-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(34,56,111,.12)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-round)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* ============ SHELL ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:246px;flex:0 0 246px;background:var(--navy);color:#fff;
  position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:28px;
}
.sidebar::-webkit-scrollbar-thumb{background:#3B558F}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;justify-content:flex-start}
.brand .mark{width:34px;height:34px;border-radius:var(--r-sm);background:#fff;display:grid;place-items:center;
  font-family:'Expo Arabic','Cairo';font-weight:800;color:var(--navy);font-size:15px}
.brand .mark span{color:var(--coral)}
.brand b{font-family:'Expo Arabic','Cairo';font-size:15px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;color:#9FB0D8;font-weight:400;margin-top:-3px}
.nav-group{margin-top:6px}
.nav-group>.gh{
  padding:12px 18px 6px;font-size:10.5px;letter-spacing:.6px;color:#8FA2CF;font-weight:700;
  font-family:'Expo Arabic','Cairo';text-transform:none;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:13px;color:#CBD5EE;
  border-right:3px solid transparent;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--coral);color:#fff;border-right-color:#fff;font-weight:600}
.nav-item .ic{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav-item .count{
  margin-inline-start:auto;background:rgba(255,255,255,.16);color:#fff;font-size:10.5px;
  min-width:20px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 6px;font-weight:700
}
.nav-item.active .count{background:rgba(0,0,0,.22)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:64px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30
}
.seg{display:flex;background:var(--navy);border-radius:99px;padding:3px;gap:2px}
.seg b{width:30px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:12px;color:#9FB2E4}
.seg b.on{background:#fff;color:var(--navy)}
.pill-btn{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:99px;
  padding:6px 13px;font-size:12.5px;color:var(--ink-2);background:#fff
}
.icon-btn{position:relative;width:34px;height:34px;border-radius:99px;border:1px solid var(--line-strong);
  display:grid;place-items:center;background:#fff;font-size:14px;color:var(--navy)}
.icon-btn i{font-style:normal}
.dot{position:absolute;top:-4px;left:-4px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:700;
  min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.search-top{
  flex:0 1 330px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);
  border-radius:99px;padding:7px 14px;color:var(--muted);font-size:12.5px;background:#fff
}
.search-top input{border:0;outline:0;flex:1;font-family:inherit;font-size:12.5px;background:transparent}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px}
.user-chip .av{width:32px;height:32px;border-radius:99px;background:linear-gradient(135deg,var(--navy-700),var(--navy));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:'Expo Arabic','Cairo'}
.user-chip .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.user-chip .rl{font-size:10.5px;color:var(--muted);line-height:1.3}

.view{padding:22px 24px 60px;max-width:1560px;width:100%}

/* ============ PAGE HEADER ============ */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.phead h1{font-size:21px;font-weight:700;color:var(--ink)}
.phead p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.phead .acts{margin-inline-start:auto;display:flex;gap:9px;flex-wrap:wrap}
.reqs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;direction:ltr;justify-content:flex-end}
.req{
  font-family:'Expo Arabic','Cairo';font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--navy);
  background:var(--grey-bg);border:1px solid var(--line);border-radius:var(--r-s);padding:1px 6px;direction:ltr
}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border-radius:var(--r-ctl);
  padding:12px 18px;font-size:14px;font-weight:700;line-height:14px;font-family:'Expo Arabic','Cairo'}
.btn:hover{background:var(--navy-700)}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--bg)}
.btn.coral{background:var(--coral)}
.btn.coral:hover{background:#D8402A}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.danger{background:#fff;color:var(--red-ink);border:1px solid var(--red-line)}

/* ============ CARD ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-s);margin-bottom:18px}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:700}
.card-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.card-h .r{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}

/* ============ TABS / FILTERS ============ */
.tabs{display:flex;gap:6px;padding:14px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:var(--r-m) var(--r-m) 0 0;font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:-1px;
  border:1px solid transparent}
.tab.on{background:var(--navy);color:#fff;font-weight:600;border-radius:var(--r-m);margin-bottom:6px}
.tab .n{font-size:11px;opacity:.7;margin-inline-start:4px}
.filters{display:flex;gap:9px;align-items:center;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.fd{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);
  padding:8px 13px;font-size:12.5px;color:var(--ink-2);background:#fff;white-space:nowrap}
.fd .cv{color:var(--muted);font-size:10px}
.fsearch{margin-inline-start:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);
  border-radius:var(--r-ctl);padding:8px 13px;color:var(--muted);font-size:12.5px;min-width:280px}
.fsearch input{border:0;outline:0;flex:1;font-family:inherit;font-size:12.5px;background:transparent}

/* ============ TABLE ============ */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{
  background:var(--bg);color:var(--muted);font-weight:600;font-size:11.5px;text-align:right;
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap
}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
td.strong{color:var(--ink);font-weight:600}
td.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.g{background:var(--green-bg);color:var(--green-ink)}
.badge.a{background:var(--amber-bg);color:var(--amber-ink)}
.badge.r{background:var(--red-bg);color:var(--red-ink)}
.badge.b{background:var(--blue-bg);color:var(--blue-ink)}
.badge.n{background:var(--grey-bg);color:var(--ink-2)}
.badge.flat::before{display:none}
.acts-cell{display:flex;gap:6px}
tr.grp td{background:var(--bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:10px 14px}
tr.grp:first-child td{border-top:0}
.grp-h{display:flex;align-items:center;gap:11px}
.grp-h .gm{width:30px;height:30px;border-radius:var(--r-sm);background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;font-family:'Expo Arabic','Cairo';flex:0 0 30px}
.grp-h .gn b{font-size:13.5px;display:block;color:var(--ink)}
.grp-h .gn span{font-size:11.5px;color:var(--muted)}
.grp-h .btn{margin-inline-start:auto}
.grp-h .badge{margin-inline-start:auto}
.grp-h .badge + .btn{margin-inline-start:0}
tr.in-grp td:first-child{padding-inline-start:34px}
.iact{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line-strong);display:grid;place-items:center;
  font-size:12px;color:var(--ink-2);background:#fff}
.iact:hover{background:var(--bg);color:var(--navy)}
.iact.d{color:var(--red-ink);border-color:var(--red-line)}
.pager{display:flex;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager .tot{color:var(--muted);font-size:12px}
.pager .pages{margin-inline-start:auto;display:flex;gap:5px;align-items:center}
.pg{min-width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:12.5px;
  color:var(--ink-2);border:1px solid transparent;direction:ltr}
.pg.on{background:var(--navy);color:#fff;font-weight:700}
.pg.nav{border-color:var(--line-strong)}
.rows-sel{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:5px 10px;font-size:12px;color:var(--ink-2)}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh-s)}
.kpi .lb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin-bottom:9px}
.kpi .lb .ic{width:22px;height:22px;border-radius:var(--r-sm);background:var(--bg);color:var(--navy);display:grid;place-items:center;font-size:11px}
.kpi .vl{font-family:'Expo Arabic','Cairo';font-size:22px;font-weight:700;color:var(--ink);direction:ltr;text-align:right}
.kpi .vl small{font-size:12px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.kpi .dl{font-size:11px;margin-top:5px;font-weight:600}
.dl.up{color:var(--green)} .dl.dn{color:var(--red)} .dl.fl{color:var(--muted)}

/* ============ MISC BLOCKS ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.g-2-1{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.g-1-2{display:grid;grid-template-columns:1fr 1.9fr;gap:18px}
@media(max-width:1180px){.grid2,.grid3,.g-2-1,.g-1-2{grid-template-columns:1fr}}

.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px}
.dl-grid .it .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.dl-grid .it .v{font-size:13.5px;font-weight:600;color:var(--ink)}

.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.bar-row .nm{font-size:12.5px;min-width:150px;color:var(--ink-2)}
.bar{flex:1;height:7px;background:var(--grey-bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar-row .pc{font-size:12px;font-weight:700;min-width:42px;text-align:left;direction:ltr;color:var(--ink)}

.spark{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.spark i{flex:1;background:#CBD4E8;border-radius:4px 4px 0 0;min-height:5px;position:relative}
.spark i.hi{background:var(--navy)}

.donut{width:150px;height:150px;border-radius:99px;display:grid;place-items:center;margin:0 auto;flex:0 0 150px}
.donut .ctr{width:104px;height:104px;background:#fff;border-radius:99px;display:grid;place-items:center;text-align:center}
.donut .ctr b{font-family:'Expo Arabic','Cairo';font-size:22px;display:block;line-height:1.2}
.donut .ctr small{font-size:10.5px;color:var(--muted)}
.lgd{flex:1;min-width:180px}
.lgd .li{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px}
.lgd .sw{width:9px;height:9px;border-radius:3px}
.lgd .vv{margin-inline-start:auto;color:var(--muted);font-size:11.5px;direction:ltr}

.todo{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.todo .tx b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.todo .tx span{font-size:11.5px;color:var(--muted)}
.todo .n{margin-inline-start:auto;font-family:'Expo Arabic','Cairo';font-weight:700;font-size:17px}
.todo .go{color:var(--muted);font-size:15px}

.tl{position:relative;padding-inline-start:26px}
.tl::before{content:'';position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:18px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:'';position:absolute;inset-inline-start:-24px;top:5px;width:12px;height:12px;border-radius:99px;
  background:#fff;border:2.5px solid var(--navy)}
.tl .ev.sys::before{border-color:var(--muted)}
.tl .ev.adm::before{border-color:var(--coral)}
.tl .ev .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tl .ev .hd b{font-size:13px}
.tl .ev .who{font-size:11px;color:#fff;background:var(--navy);border-radius:5px;padding:1px 7px;font-weight:600}
.tl .ev .who.v{background:var(--navy-700)} .tl .ev .who.c{background:var(--green-ink)} .tl .ev .who.s{background:#8B94AB}
.tl .ev .who.a{background:var(--coral)}
.tl .ev .tm{font-size:11px;color:var(--muted);direction:ltr}
.tl .ev p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}

.note{display:flex;gap:11px;border-radius:var(--r-m);padding:12px 14px;font-size:12.5px;line-height:1.65;margin-bottom:14px}
.note b{display:block;margin-bottom:2px;font-family:'Expo Arabic','Cairo';font-size:13px}
.note.warn{background:var(--amber-bg);color:var(--amber-ink);border:1px solid var(--amber-line)}
.note.dngr{background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red-line)}
.note.info{background:var(--blue-bg);color:var(--blue-ink);border:1px solid var(--blue-line)}
.note.ok{background:var(--green-bg);color:var(--green-ink);border:1px solid var(--green-line)}

label.fl{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.inp{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:10px 13px;font-size:13px;
  font-family:inherit;background:#fff;color:var(--ink);outline:0}
.inp:focus{border-color:var(--navy)}
.inp::placeholder{color:var(--muted-2)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.7}
.fld{margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.sw-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:0}
.sw-row .tx b{display:block;font-size:13px} .sw-row .tx span{font-size:11.5px;color:var(--muted)}
.sw-row .tg{margin-inline-start:auto}
.tg{width:38px;height:21px;border-radius:var(--r-round);background:var(--line-strong);position:relative;flex:0 0 38px}
.tg::after{content:'';position:absolute;top:2.5px;inset-inline-end:2.5px;width:16px;height:16px;border-radius:99px;background:#fff}
.tg.on{background:var(--navy)}
.tg.on::after{inset-inline-end:auto;inset-inline-start:2.5px}

.chk{width:16px;height:16px;border-radius:var(--r-s);border:1.5px solid var(--line-strong);display:inline-grid;place-items:center;
  font-size:10px;color:#fff;flex:0 0 16px}
.chk.on{background:var(--navy);border-color:var(--navy)}

<script>
/* ===================== helpers ===================== */
const h = (s) => s;
const esc = (s) => String(s);

function phead(t, s, reqs, acts){
  return `<div class="phead"><div><h1>${t}</h1><p>${s||''}</p>
    </div>
    ${acts?`<div class="acts">${acts}</div>`:''}</div>`;
}
function card(inner, cls){ return `<div class="card ${cls||''}">${inner}</div>`; }
function cardH(t, s, right){
  return `<div class="card-h"><div><h3>${t}</h3>${s?`<p>${s}</p>`:''}</div>${right?`<div class="r">${right}</div>`:''}</div>`;
}
function tabs(items){
  return `<div class="tabs">${items.map(i=>`<div class="tab ${i.on?'on':''}">${i.t}${i.n!==undefined?`<span class="n">${i.n}</span>`:''}</div>`).join('')}</div>`;
}
function filters(fs, ph){
  return `<div class="filters">${fs.map(f=>`<div class="fd">${f}<span class="cv">▾</span></div>`).join('')}
    <div class="fsearch">🔍<input placeholder="${ph||'ابحث…'}"></div></div>`;
}
function table(cols, rows){
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td${typeof c==='object'?` class="${c.c||''}"`:''}>${typeof c==='object'?c.v:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function groupTable(cols, groups){
  let body='';
  groups.forEach(g=>{
    body += `<tr class="grp"><td colspan="${cols.length}">
      <div class="grp-h"><span class="gm">${g.mark}</span>
        <div class="gn"><b>${g.name}</b><span>${g.meta}</span></div>
        ${g.tag||''}
        <button class="btn ghost sm" onclick="go('vendorFile')">ملف الشركة</button></div></td></tr>`;
    g.rows.forEach(r=>{
      body += `<tr class="in-grp">${r.map(c=>`<td${typeof c==='object'?` class="${c.c||''}"`:''}>${typeof c==='object'?c.v:c}</td>`).join('')}</tr>`;
    });
  });
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function pager(total, pages){
  pages = pages || 10;
  let ps = '';
  for(let i=1;i<=Math.min(3,pages);i++) ps += `<span class="pg ${i===1?'on':''}">${i}</span>`;
  if(pages>4) ps += `<span class="pg">…</span><span class="pg">${pages}</span>`;
  return `<div class="pager"><div class="rows-sel">5 <span style="color:var(--muted)">▾</span></div>
    <span class="tot">إجمالي النتائج: ${total}</span>
    <div class="pages"><span class="pg nav">‹</span>${ps}<span class="pg nav">›</span></div></div>`;
}
function bdg(t, tone){ return `<span class="badge ${tone||'n'}">${t}</span>`; }
function acts(list){ return `<div class="acts-cell">${list.map(a=>a.h
  ? `<a class="iact ${a.d?'d':''}" href="#${a.h}" title="${a.t||'عرض'}">${a.i}</a>`
  : `<span class="iact ${a.d?'d':''}" title="${a.t||''}">${a.i}</span>`).join('')}</div>`; }
function kpi(items){
  return `<div class="kpis">${items.map(k=>`<div class="kpi">
    <div class="lb"><span class="ic">${k.i}</span>${k.l}</div>
    <div class="vl">${k.v}${k.u?`<small>${k.u}</small>`:''}</div>
    ${k.d?`<div class="dl ${k.t||'fl'}">${k.d}</div>`:''}</div>`).join('')}</div>`;
}
function dl(pairs){
  return `<div class="dl-grid">${pairs.map(p=>`<div class="it"><div class="k">${p[0]}</div><div class="v">${p[1]}</div></div>`).join('')}</div>`;
}
function bars(items){
  return items.map(b=>`<div class="bar-row"><span class="nm">${b[0]}</span>
    <span class="bar"><i style="width:${b[1]}%;${b[2]?`background:${b[2]}`:''}"></i></span>
    <span class="pc">${b[1]}%</span></div>`).join('');
}
function spark(vals, hiIdx){
  const mx = Math.max(...vals);
  return `<div class="spark">${vals.map((v,i)=>`<i class="${i===hiIdx?'hi':''}" style="height:${Math.round(v/mx*100)}%"></i>`).join('')}</div>`;
}
function donut(segs, total, label){
  let acc=0; const stops = segs.map(s=>{const a=acc; acc+=s[1]; return `${s[2]} ${a}% ${acc}%`;}).join(',');
  return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
    <div class="donut" style="background:conic-gradient(${stops})"><div class="ctr"><b>${total}</b><small>${label}</small></div></div>
    <div class="lgd">${segs.map(s=>`<div class="li"><span class="sw" style="background:${s[2]}"></span>${s[0]}<span class="vv">${s[3]} (${s[1]}%)</span></div>`).join('')}</div></div>`;
}
function timeline(evs){
  return `<div class="tl">${evs.map(e=>`<div class="ev ${e.k||''}">
    <div class="hd"><b>${e.t}</b><span class="who ${e.wk||''}">${e.w}</span><span class="tm">${e.d}</span></div>
    ${e.p?`<p>${e.p}</p>`:''}</div>`).join('')}</div>`;
}
function note(kind, title, body){
  return `<div class="note ${kind}"><span>${kind==='warn'?'⚠':kind==='dngr'?'⛔':kind==='ok'?'✓':'ⓘ'}</span><div><b>${title}</b>${body}</div></div>`;
}
function fld(label, inner, hint){
  return `<div class="fld"><label class="fl">${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function inp(ph, val){ return `<div class="inp">${val||`<span style="color:var(--muted-2)">${ph}</span>`}</div>`; }
function sel(val){ return `<div class="inp" style="display:flex;align-items:center"><span>${val}</span><span style="margin-inline-start:auto;color:var(--muted)">▾</span></div>`; }
function swRow(t, s, on){
  return `<div class="sw-row"><div class="tx"><b>${t}</b><span>${s}</span></div><div class="tg ${on?'on':''}"></div></div>`;
}
const M = {};
function openM(html){ document.getElementById('mc').innerHTML = html; document.getElementById('mw').classList.add('open'); }
function closeM(){ document.getElementById('mw').classList.remove('open'); }
function modal(title, body, footer, sm){
  return `<div class="modal ${sm?'sm':''}"><div class="modal-h"><h3>${title}</h3><span class="x" onclick="closeM()">✕</span></div>
    <div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div>`;
}
</script>

<script id="enhance">
(function(){
/* ---------- utils ---------- */
const norm = t => (t||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[«»"'.,:،]/g,'').trim();
const base = t => norm(t).replace(/^ال/,'');
const stem = t => base(t).replace(/(ات|ون|ين|ة)$/,'');
const cellText = td => {
  const c = td.cloneNode(true);
  c.querySelectorAll('.sub').forEach(e=>e.remove());
  return norm(c.textContent).replace(/\s+/g,' ').trim();
};
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on'); setTimeout(()=>t.remove(),300);},2300);
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
document.addEventListener('click',e=>{
  if(!e.target.closest('.fd')) document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});

/* ---------- modal host (the static build has no app shell) ---------- */
if(typeof window.openM !== 'function'){
  const mount = ()=>{
    if(document.getElementById('mw')) return;
    const w = document.createElement('div');
    w.className='modal-wrap'; w.id='mw'; w.innerHTML='<div id="mc"></div>';
    w.addEventListener('click', e=>{ if(e.target===w) window.closeM(); });
    document.body.appendChild(w);
  };
  window.openM = h=>{ mount(); document.getElementById('mc').innerHTML=h;
    document.getElementById('mw').classList.add('open'); };
  window.closeM = ()=>{ document.getElementById('mw')?.classList.remove('open'); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') window.closeM(); });
}

/* ---------- generic confirm / form modals ---------- */
function sheet(title, bodyHtml, footerHtml, sm){
  return `<div class="modal ${sm?'sm':''}"><div class="modal-h"><h3>${title}</h3>
    <span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${bodyHtml}</div>
    ${footerHtml?`<div class="modal-f">${footerHtml}</div>`:''}</div>`;
}
const doneBtn = (label,msg) => `<button class="btn" onclick="closeM();__toast('${msg}')">${label}</button>
  <button class="btn ghost" onclick="closeM()">إلغاء</button>`;
const dangerBtn = (label,msg) => `<button class="btn danger" onclick="closeM();__toast('${msg}')">${label}</button>
  <button class="btn ghost" onclick="closeM()">إلغاء</button>`;
window.__toast = toast;

/* ---------- table engine ---------- */
function setupTable(table){
  if(table.__wired) return; table.__wired = true;
  const card = table.closest('.card') || table.parentElement;
  const heads = [...table.querySelectorAll('thead th')].map(th=>norm(th.textContent));
  const body  = table.querySelector('tbody'); if(!body) return;
  const all   = [...body.querySelectorAll('tr')];
  const grouped = all.some(r=>r.classList.contains('grp'));
  const dataRows = all.filter(r=>!r.classList.contains('grp'));
  const actIdx = heads.findIndex(h=>h.includes('الإجراءات'));

  // group name for each data row
  let gname = '';
  const rowGroup = new Map();
  all.forEach(r=>{
    if(r.classList.contains('grp')){ gname = norm(r.querySelector('.gn b')?.textContent||''); }
    else rowGroup.set(r, gname);
  });

  const state = { f:{}, q:'', tab:null, page:1, per:5 };

  /* ---- column resolution for a filter label ---- */
  const SYN = {
    'تاريخ':['توقيت','فترة','تاريخ','منذ','صلاحية','عمر','مدة'],
    'فترة':['فترة','تاريخ','توقيت','مدة'],
    'مدينة':['مدينة','منطقة','نطاق','موقع'],
    'اولوية':['اولوية','خطورة','اهمية'],
    'نوع':['نوع','تصنيف','فئة']
  };
  function colFor(label){
    const L = base(label);
    let i = heads.findIndex(h=>base(h)===L);
    if(i>=0) return i;
    i = heads.findIndex(h=>base(h).includes(L)||L.includes(base(h)));
    if(i>=0) return i;
    const toks = L.split(/\s+/).filter(t=>t.length>2);
    i = heads.findIndex(h=>toks.some(t=>base(h).includes(t)));
    if(i>=0) return i;
    for(const [key,alts] of Object.entries(SYN)){
      if(!L.includes(key)) continue;
      i = heads.findIndex(h=>alts.some(a=>base(h).includes(a)));
      if(i>=0) return i;
    }
    return -1;
  }
  function optionsFor(label){
    const L = base(label);
    if(grouped && (L.includes('مزود')||L.includes('شركة')))
      return [...new Set(all.filter(r=>r.classList.contains('grp'))
        .map(r=>norm(r.querySelector('.gn b')?.textContent||'')))];
    const i = colFor(label);
    let vals;
    if(i>=0 && i!==actIdx){
      vals = dataRows.map(r=>cellText(r.cells[i])).filter(Boolean);
    } else {
      vals = dataRows.flatMap(r=>[...r.querySelectorAll('.badge')].map(b=>norm(b.textContent)));
    }
    vals = [...new Set(vals)].filter(v=>v && v.length<46);
    if(!vals.length){ // last resort: the most distinctive non-action column
      const j = heads.findIndex((h,n)=>n!==actIdx && n!==0);
      if(j>=0) vals = [...new Set(dataRows.map(r=>cellText(r.cells[j])).filter(Boolean))];
    }
    return vals.slice(0,40);
  }

  /* ---- filtering ---- */
  function rowMatches(r){
    const txt = norm(r.textContent);
    if(state.q && !txt.includes(state.q)) return false;
    if(state.tab && !txt.includes(stem(state.tab))) return false;
    for(const [label,val] of Object.entries(state.f)){
      if(!val) continue;
      const L = base(label);
      if(grouped && (L.includes('مزود')||L.includes('شركة'))){
        if(rowGroup.get(r) !== val) return false;
        continue;
      }
      const i = colFor(label);
      if(i>=0 && i!==actIdx){ if(cellText(r.cells[i]) !== val) return false; }
      else if(!txt.includes(val)) return false;
    }
    return true;
  }

  function apply(){
    const pass = dataRows.filter(rowMatches);
    const total = pass.length;
    const pages = Math.max(1, Math.ceil(total/state.per));
    if(state.page>pages) state.page = pages;
    const from = (state.page-1)*state.per, to = from + state.per;
    dataRows.forEach(r=>{ r.classList.add('hide'); r.classList.remove('pghide'); });
    pass.forEach((r,n)=>{ r.classList.remove('hide'); if(n<from||n>=to) r.classList.add('pghide'); });
    // group headers follow their children
    if(grouped){
      let head=null, any=false;
      const flush=()=>{ if(head) head.classList.toggle('hide', !any); };
      all.forEach(r=>{
        if(r.classList.contains('grp')){ flush(); head=r; any=false; }
        else if(!r.classList.contains('hide') && !r.classList.contains('pghide')) any=true;
      });
      flush();
    }
    // empty state
    let empty = body.querySelector('tr.no-res');
    if(total===0){
      if(!empty){
        empty=document.createElement('tr'); empty.className='no-res';
        empty.innerHTML=`<td colspan="${heads.length}"><b>لا توجد نتائج مطابقة</b>
          جرّب تعديل الفلاتر أو مسحها</td>`;
        body.appendChild(empty);
      }
    } else if(empty) empty.remove();
    renderPager(total, pages);
  }

  /* ---- pager ---- */
  const pager = card.querySelector('.pager');
  function renderPager(total, pages){
    if(!pager) return;
    const tot = pager.querySelector('.tot');
    if(tot) tot.textContent = `إجمالي النتائج: ${total.toLocaleString('en-US')}`;
    const box = pager.querySelector('.pages'); if(!box) return;
    let h = `<span class="pg nav ${state.page===1?'dis':''}" data-go="prev">‹</span>`;
    const list=[];
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||Math.abs(i-state.page)<=1) list.push(i);
      else if(list[list.length-1]!=='…') list.push('…');
    }
    list.forEach(i=> h += i==='…' ? `<span class="pg dis">…</span>`
      : `<span class="pg ${i===state.page?'on':''}" data-go="${i}">${i}</span>`);
    h += `<span class="pg nav ${state.page===pages?'dis':''}" data-go="next">›</span>`;
    box.innerHTML = h;
    box.querySelectorAll('[data-go]').forEach(p=>p.onclick=()=>{
      const v=p.dataset.go;
      if(v==='prev') state.page=Math.max(1,state.page-1);
      else if(v==='next') state.page=Math.min(pages,state.page+1);
      else state.page=+v;
      apply(); table.scrollIntoView({block:'nearest'});
    });
  }
  const rowsSel = card.querySelector('.rows-sel');
  if(rowsSel) rowsSel.onclick = e=>{
    e.stopPropagation();
    openMenu(rowsSel, ['5','10','25','50'], String(state.per), v=>{
      state.per=+v; state.page=1; rowsSel.firstChild.textContent = v+' ';
      apply();
    });
  };

  /* ---- filters ---- */
  card.querySelectorAll('.filters .fd').forEach(fd=>{
    const label = norm(fd.childNodes[0].textContent);
    fd.dataset.label = label;
    fd.onclick = e=>{
      e.stopPropagation();
      const opts = optionsFor(label);
      openMenu(fd, opts, state.f[label]||'', v=>{
        if(v===null){ delete state.f[label]; fd.classList.remove('act'); fd.childNodes[0].textContent = label; }
        else { state.f[label]=v; fd.classList.add('act'); fd.childNodes[0].textContent = v+' '; }
        state.page=1; apply();
      }, label);
    };
  });

  /* ---- search ---- */
  const search = card.querySelector('.fsearch input');
  if(search){
    search.addEventListener('input',()=>{ state.q = norm(search.value); state.page=1; apply(); });
  }

  /* ---- tabs ---- */
  const tabs = [...card.querySelectorAll('.tabs .tab')];
  tabs.forEach(t=>{
    t.onclick = ()=>{
      tabs.forEach(x=>x.classList.remove('on')); t.classList.add('on');
      const lbl = norm(t.childNodes[0].textContent);
      state.tab = (lbl==='الكل') ? null : lbl;
      state.page=1; apply();
    };

  /* ---- row actions ---- */
  const detailOf = {vendors:'vendorFile', kyc:'kycReview', users:'customer', bookings:'booking',
    disputes:'dispute', tickets:'ticket', settlements:'settlement', branches:'vendorFile', fleet:'models'};

              الحجوزات القائمة لا تتأثّر وتستمر حتى نهايتها.</div></div>
             <div class="fld"><label class="fl">سبب الإيقاف</label>
               <div class="inp" style="display:flex"><span>اختر سبباً</span>

/* ---------- dropdown menu ---------- */
function openMenu(anchor, options, current, onPick, headLabel){
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  let m = anchor.querySelector(':scope > .menu');
  if(m) m.remove();
  m = document.createElement('div'); m.className='menu';
  let h = headLabel ? `<div class="hd">${headLabel}</div>` : '';
  h += `<div class="op ${!current?'on':''}" data-v="">الكل</div>`;
  options.forEach(o=> h += `<div class="op ${o===current?'on':''}" data-v="${o.replace(/"/g,'&quot;')}">${o}</div>`);
  m.innerHTML = h;
  anchor.appendChild(m);
  requestAnimationFrame(()=>m.classList.add('open'));
  m.querySelectorAll('.op').forEach(op=>op.onclick=e=>{
    e.stopPropagation();
    m.classList.remove('open');
    onPick(op.dataset.v === '' ? null : op.dataset.v);
  });
}

/* ---------- list cards (notifications, conversations) ---------- */
const TAB_PRED = {};
TAB_PRED[base('غير مقروءة')] = el => el.classList.contains('unread') || !!el.querySelector('.nb');
TAB_PRED[base('المزوّدون')]  = el => !!el.querySelector('.av.v');
TAB_PRED[base('العملاء')]    = el => !!el.querySelector('.av.c');
function setupList(card){
  if(card.__list) return; card.__list = true;
  const items = [...card.querySelectorAll('.n-item, .conv')];
  if(!items.length) return;
  const state = { f:{}, q:'', tab:null };
  const apply = ()=>{
    let shown = 0;
    items.forEach(el=>{
      const txt = norm(el.textContent);
      let ok = true;
      if(state.q && !txt.includes(state.q)) ok = false;
      if(ok && state.tab){
        const pred = TAB_PRED[base(state.tab)];
        ok = pred ? pred(el) : txt.includes(stem(state.tab));
      }
      if(ok) for(const v of Object.values(state.f)){ if(v && !txt.includes(v)){ ok=false; break; } }
      el.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    let e = card.querySelector('.list-empty');
    if(!shown){
      if(!e){ e=document.createElement('div'); e.className='list-empty empty';
        e.innerHTML='<b>لا توجد نتائج مطابقة</b><p>جرّب تعديل الفلاتر أو مسحها</p>';
        items[0].parentElement.appendChild(e); }
    } else if(e) e.remove();
    const tot = card.querySelector('.pager .tot');
    if(tot) tot.textContent = `إجمالي النتائج: ${shown}`;
  };
  const opts = label => {
    const explicit = card.querySelector(`.fd[data-opts]`);
    const own = [...card.querySelectorAll('.filters .fd')].find(f=>norm(f.childNodes[0].textContent)===label);
    if(own && own.dataset.opts) return own.dataset.opts.split('|');
    return [...new Set(items.flatMap(el=>[...el.querySelectorAll('.badge')].map(b=>norm(b.textContent))))];
  };
  card.querySelectorAll('.filters .fd').forEach(fd=>{
    const label = norm(fd.childNodes[0].textContent);
    fd.onclick = e=>{ e.stopPropagation();
      openMenu(fd, opts(label), state.f[label]||'', v=>{
        if(v===null){ delete state.f[label]; fd.classList.remove('act'); fd.childNodes[0].textContent=label; }
        else { state.f[label]=v; fd.classList.add('act'); fd.childNodes[0].textContent=v+' '; }
        apply();
      }, label); };
  });
  const s2 = card.querySelector('.fsearch input');
  if(s2) s2.addEventListener('input',()=>{ state.q = norm(s2.value); apply(); });
  const tabs = [...card.querySelectorAll('.tabs .tab')];
  tabs.forEach(t=>t.onclick=()=>{
    tabs.forEach(x=>x.classList.remove('on')); t.classList.add('on');
    const lbl = norm(t.childNodes[0].textContent);
    state.tab = lbl==='الكل' ? null : lbl; apply();
  });
  // mark a notification read on click
  items.forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.closest('.btn')) return;
    el.classList.remove('unread'); el.querySelector('.nb')?.remove();
  }));
  apply();
}

/* ---------- non-table controls ---------- */
function setupControls(root){
  root.querySelectorAll('.tg').forEach(t=>{ if(t.__w) return; t.__w=1;
    t.onclick=()=>t.classList.toggle('on'); });
  root.querySelectorAll('.chk').forEach(c=>{ if(c.__w) return; c.__w=1;
    c.onclick=()=>{ if(c.classList.contains('no')) return;
      c.classList.toggle('on'); c.textContent = c.classList.contains('on')?'✓':''; }; });
  root.querySelectorAll('.conv').forEach(c=>{ if(c.__w) return; c.__w=1;
    c.onclick=()=>{ root.querySelectorAll('.conv').forEach(x=>x.classList.remove('on')); c.classList.add('on'); }; });
  root.querySelectorAll('.thumb').forEach(t=>{ if(t.__w) return; t.__w=1;
    t.onclick=()=>{ const p=t.parentElement;
      p.querySelectorAll('.thumb').forEach(x=>x.classList.remove('on')); t.classList.add('on'); }; });
  // standalone filter chips outside a table card (page headers, report filters)
  root.querySelectorAll('.phead .fd, .card-b .fd').forEach(fd=>{
    if(fd.__w || fd.closest('.filters')) return; fd.__w=1;
    const label = norm(fd.childNodes[0].textContent);
    fd.onclick = e=>{ e.stopPropagation();
      openMenu(fd, ['آخر 7 أيام','آخر 30 يوماً','آخر 90 يوماً','هذا العام'], '', v=>{
        fd.childNodes[0].textContent = (v||label)+' ';
        fd.classList.toggle('act', !!v);
      }, label); };
  });
  // export buttons
  root.querySelectorAll('.btn').forEach(b=>{ if(b.__w) return; b.__w=1;
    const t=b.textContent;
    if(/تصدير|تنزيل|تحميل/.test(t) && !b.getAttribute('onclick')) b.onclick=()=>toast('جارٍ تحضير الملف…');
  });
}

window.enhance = function(root){
  root = root || document;
  root.querySelectorAll('table').forEach(setupTable);
  root.querySelectorAll('.card').forEach(c=>{ if(!c.querySelector('table')) setupList(c); });
  setupControls(root);
};

/* self-init for the static build (no router present) */
if(typeof window.S === 'undefined'){
  if(document.readyState!=='loading') window.enhance(document);
  else document.addEventListener('DOMContentLoaded',()=>window.enhance(document));
}
})();
</script>

/* ================= wiring ================= */
(function(){
  const baseEnhance = window.enhance;

  function panelize(root){
    Object.keys(PANELS).forEach(key=>{
      const scope = root.querySelector('#'+key) || (window.cur===key ? root : null);
      if(!scope) return;
      const card = scope.querySelector('.card .tabs')?.closest('.card');
      if(!card || card.__panels) return;
      card.__panels = true;
      const tabsEl = card.querySelector('.tabs');
      const original = [...card.children].filter(c=>c!==tabsEl).map(c=>c.outerHTML).join('');
      [...tabsEl.children].forEach((t,i)=>{
        t.addEventListener('click',()=>{
          [...tabsEl.children].forEach(x=>x.classList.remove('on'));
          t.classList.add('on');
          const p = PANELS[key][i];
          if(p===null || p===undefined) return;                 // هذا التبويب يفلتر ولا يبدّل المحتوى
          [...card.children].filter(c=>c!==tabsEl).forEach(c=>c.remove());
          card.insertAdjacentHTML('beforeend', i===0 ? original : (typeof p==='function' ? p() : p));
          card.__list = false;
          if(baseEnhance) baseEnhance(card);
        });
      });
    });
  }

  function backlinks(root){
    root.querySelectorAll('.phead').forEach(ph=>{
      if(ph.__back) return; ph.__back = true;
      const screen = ph.closest('.screen')?.id || window.cur || '';
      const parent = (window.SUBOF||{})[screen];
      if(!parent) return;
      if(ph.textContent.includes('رجوع')) return;
      const h1 = ph.querySelector('h1'); if(!h1) return;
      h1.insertAdjacentHTML('beforebegin',
        `<a class="back-lnk" href="#${parent}">‹ رجوع إلى ${(window.TITLES||{})[parent]||'القائمة'}</a>`);
    });
  }

  window.enhance = function(root){
    root = root || document;
    if(baseEnhance) baseEnhance(root);
    panelize(root);
    backlinks(root);
  };
  if(typeof window.S === 'undefined'){
    const run = ()=>window.enhance(document);
    if(document.readyState!=='loading') run(); else document.addEventListener('DOMContentLoaded',run);
  }
})();

<script id="feature-integrations">
/*
 * API boundary for production.  This project did not include a backend, auth client,
 * environment loader, or map SDK. Requests are made only when WAFRA_API_BASE_URL is
 * explicitly configured; otherwise the UI presents the real configuration-required state.
 */
const WafraFeatureApi = (() => {
  const base = String(window.WAFRA_API_BASE_URL || '').replace(/\/$/, '');
  const request = async (path, options={}) => {
    if(!base) throw Object.assign(new Error('API_NOT_CONFIGURED'), {code:'API_NOT_CONFIGURED'});
    const response = await fetch(base + path, {credentials:'include', headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options});
    if(!response.ok) throw Object.assign(new Error('HTTP_'+response.status), {status:response.status});
    return response.status===204 ? null : response.json();
  };
  return {
    configured:()=>Boolean(base),
    passwordReset:(email)=>request('/admin/auth/password-reset',{method:'POST',body:JSON.stringify({email})}),
    confirmReset:(token,password)=>request('/admin/auth/password-reset/confirm',{method:'POST',body:JSON.stringify({token,password})}),
    load:(resource, query='')=>request('/admin/'+resource+query),
    update:(resource,id,body)=>request('/admin/'+resource+'/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)}),
    audit:(body)=>request('/admin/audit-log',{method:'POST',body:JSON.stringify(body)}),
    startImpersonation:(userId,reason)=>request('/admin/impersonations',{method:'POST',body:JSON.stringify({userId,reason})}),
    endImpersonation:(id)=>request('/admin/impersonations/'+encodeURIComponent(id),{method:'DELETE'}),
  };
})();

const featureState = (kind, title, copy, action='') => `<div class="state-box"><div><span style="font-size:28px">${kind==='loading'?'◌':kind==='error'?'⚠':kind==='success'?'✓':'⌁'}</span><b>${title}</b><p>${copy}</p>${action}</div></div>`;
const featureSkeleton = ()=>`<div class="state-box"><div style="width:min(430px,100%)"><div class="skeleton" style="width:42%"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>`;
async function mountResource(hostId, resource, renderData){
  const host=document.getElementById(hostId); if(!host) return;
  host.innerHTML=featureSkeleton();
  try { const data=await WafraFeatureApi.load(resource); host.innerHTML=renderData(data); }
  catch(error){
    const missing=error.code==='API_NOT_CONFIGURED';
    host.innerHTML=featureState('error',missing?'تحتاج هذه الميزة إلى ربط API':'تعذّر تحميل البيانات',missing?'لم يُضبط WAFRA_API_BASE_URL بعد. بيانات هذه الشاشة لا تُحاكى كخدمة خلفية.':'تحقّق من الاتصال والصلاحيات ثم أعد المحاولة.',`<button class="btn sm" onclick="mountResource('${hostId}','${resource}',${renderData.name})">إعادة المحاولة</button>`);
  }
}
function initFeatureRoute(route, resource, renderData){ requestAnimationFrame(()=>mountResource('resource-'+route,resource,renderData)); }

/* Password reset: the token is deliberately supplied by the reset email URL, never stored locally. */
S.resetPassword = () => `<div style="min-height:calc(100vh - 150px);display:grid;place-items:center"><div style="width:min(430px,100%)">${phead('إعادة تعيين كلمة المرور','أرسل رابطًا آمنًا إلى بريدك الإداري')}
  <div class="card"><div class="card-b" id="reset-password-form">${fld('البريد الإلكتروني الإداري',`<input id="reset-email" class="native-input" type="email" autocomplete="email" placeholder="name@wafra.sa">`,'سنرسل رابطًا صالحًا لمرة واحدة فقط.')}
  <div style="margin-top:18px"><button class="btn coral" onclick="requestPasswordReset()">إرسال رابط إعادة التعيين</button><a class="btn ghost" href="#login">رجوع للدخول</a></div></div></div></div></div>`;
window.requestPasswordReset = async ()=>{
  const email=document.getElementById('reset-email')?.value.trim(); const host=document.getElementById('reset-password-form');
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ host.insertAdjacentHTML('beforeend',`<p style="color:var(--red-ink);font-size:12px">أدخل بريدًا إلكترونيًا صالحًا.</p>`); return; }
  host.innerHTML=featureSkeleton();
  try{ await WafraFeatureApi.passwordReset(email); host.innerHTML=featureState('success','تحقّق من بريدك','إذا كان الحساب موجودًا ومخوّلًا، أُرسل إليه رابط إعادة التعيين.'); }
  catch(e){ host.innerHTML=featureState('error',e.code==='API_NOT_CONFIGURED'?'خدمة إعادة التعيين غير مهيأة':'تعذّر إرسال الرابط',e.code==='API_NOT_CONFIGURED'?'يلزم ربط POST /admin/auth/password-reset بخدمة الهوية والبريد.':'أعد المحاولة لاحقًا.'); }
};
S.confirmPasswordReset = () => { const token=new URLSearchParams(location.hash.split('?')[1]||'').get('token')||''; return `<div style="min-height:calc(100vh - 150px);display:grid;place-items:center"><div style="width:min(430px,100%)">${phead('تعيين كلمة مرور جديدة','اختر كلمة قوية لحساب الإدارة')}<div class="card"><div class="card-b" id="confirm-password-form">${token?`${fld('كلمة المرور الجديدة',`<input id="new-password" class="native-input" type="password" autocomplete="new-password">`,'8 أحرف على الأقل، وتتضمن حرفًا ورقمًا.')}${fld('تأكيد كلمة المرور',`<input id="confirm-password" class="native-input" type="password" autocomplete="new-password">`)}<button class="btn coral" onclick="confirmPasswordReset('${esc(token)}')">حفظ كلمة المرور</button>`:featureState('error','رابط غير صالح','لم نجد رمز إعادة التعيين. اطلب رابطًا جديدًا.')}</div></div></div></div>`; };
window.confirmPasswordReset=async token=>{const a=document.getElementById('new-password')?.value||'',b=document.getElementById('confirm-password')?.value||'',host=document.getElementById('confirm-password-form');if(a.length<8||!/[A-Za-z]/.test(a)||!/[0-9]/.test(a)||a!==b){host.insertAdjacentHTML('beforeend',`<p style="color:var(--red-ink);font-size:12px">تحقّق من تطابق كلمة المرور ومن استيفاء متطلبات القوة.</p>`);return;}host.innerHTML=featureSkeleton();try{await WafraFeatureApi.confirmReset(token,a);host.innerHTML=featureState('success','تم تحديث كلمة المرور','يمكنك الآن تسجيل الدخول.',`<a class="btn" href="#login">الانتقال للدخول</a>`)}catch(e){host.innerHTML=featureState('error','تعذّر تحديث كلمة المرور',e.code==='API_NOT_CONFIGURED'?'يلزم ربط POST /admin/auth/password-reset/confirm بخدمة الهوية.':'ربما انتهت صلاحية الرابط أو استُخدم سابقًا.');}};

/* New route surfaces reuse phead/card/table/filters/pager from the existing design system. */
S.bookingMap=()=>phead('خريطة الحجوزات','توزيع الحجوزات حسب المدينة والموقع',['FR-ADB-MAP-01'])+card(cardH('الحجوزات النشطة','تحتاج بيانات الموقع إلى API أو إعداد مزوّد الخرائط')+`<div id="resource-bookingMap"></div>`);
function renderBookingMap(data){ const cities=data.cities||[]; return `<div class="card-b"><div class="map-canvas">${cities.map((c,i)=>`<button class="map-point" style="inset-inline-start:${c.x||20+i*18}%;top:${c.y||40+(i%2)*22}%" title="${esc(c.name)}: ${c.count}">${c.count}</button>`).join('')}</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">${cities.map(c=>`<span class="badge flat b">${esc(c.name)} · ${c.count} حجز</span>`).join('')}</div></div>`; }
S.objections=()=>phead('اعتراضات الرسوم والغرامات','مراجعة اعتراض العميل على رسوم أو غرامة مرتبطة بحجز',['FR-ADO-01','FR-ADO-02'])+card(tabs([{t:'مفتوحة',on:1},{t:'بانتظار قرار'},{t:'مغلقة'}])+filters(['الحالة','المزوّد','المدينة','النوع'],'ابحث برقم الاعتراض أو الحجز…')+`<div id="resource-objections"></div>`);
function renderObjections(data){return table(['الاعتراض','الحجز','العميل','المزوّد','المبلغ','السبب','الحالة','الإجراءات'],(data.items||[]).map(x=>[{v:x.id,c:'strong num'},{v:x.bookingId,c:'num'},x.customer,x.provider,{v:x.amount,c:'num'},x.reason,bdg(x.status,x.status==='مغلق'?'g':'a'),`<a class="btn sm" href="#objection?id=${encodeURIComponent(x.id)}">فتح</a>`]))+pager(data.total||0,Math.max(1,Math.ceil((data.total||0)/5)));}
S.objection=()=>phead('تفاصيل اعتراض رسوم/غرامة','الحجز والقرار والسجل الكامل',['FR-ADO-02'],`<a class="btn ghost" href="#objections">‹ رجوع</a>`)+`<div id="resource-objection"></div>`;
function renderObjection(data){return `<div class="g-2-1"><div>${card(cardH('تفاصيل الاعتراض')+`<div class="card-b">${dl([['رقم الاعتراض',data.id],['الحجز',data.bookingId],['العميل',data.customer],['المزوّد',data.provider],['المبلغ',data.amount],['سبب الرسوم',data.reason],['تفاصيل الاعتراض',data.details],['الحالة',bdg(data.status,'a')]])}</div>`)}${card(cardH('قرار الإدارة')+`<div class="card-b">${fld('القرار',`<select id="objection-status" class="native-input"><option>قبول الاعتراض</option><option>رفض الاعتراض</option><option>طلب معلومات إضافية</option></select>`)}${fld('توضيح القرار',`<textarea id="objection-note" class="native-input" rows="3"></textarea>`)}<button class="btn coral" onclick="updateObjection('${esc(data.id)}')">حفظ القرار</button></div>`)}</div><div>${card(cardH('سجل الاعتراض')+`<div class="card-b">${timeline(data.history||[])}</div>`)}</div></div>`;}
window.updateObjection=async id=>{try{await WafraFeatureApi.update('fee-objections',id,{status:document.getElementById('objection-status').value,note:document.getElementById('objection-note').value});__toast('تم حفظ القرار وتسجيله في السجل.');}catch(e){__toast(e.code==='API_NOT_CONFIGURED'?'لا يمكن حفظ القرار قبل ربط API.':'تعذّر حفظ القرار.');}};

S.supportReports=()=>phead('تقارير الدعم','اتجاهات التذاكر وأوقات الاستجابة والالتزام بالاتفاقية',['FR-ADS-RPT-01'])+card(tabs([{t:'ملخص الدعم',on:1},{t:'التذاكر'},{t:'أداء الفريق'}])+filters(['من تاريخ','إلى تاريخ','الحالة','الفريق'],'ابحث…')+`<div id="resource-supportReports"></div>`);
function renderSupportReports(data){return `<div class="card-b">${kpi((data.kpis||[]).map(x=>({i:x.icon||'◌',l:x.label,v:x.value,u:x.unit||'',d:x.note||'',t:x.tone||'up'}))) }${card(cardH('التفصيل حسب الحالة')+table(['الحالة','العدد','متوسط أول رد','نسبة الالتزام'],data.rows||[]))}</div>`;}
S.integrationStatus=()=>phead('حالة التكاملات','متابعة اتصال الدفع والرسائل والخرائط',['FR-ADX-INT-01'])+card(cardH('الخدمات المتصلة','تظهر الحالة من نقطة الصحة الخلفية')+`<div id="resource-integrationStatus"></div>`);
function renderIntegrationStatus(data){return `<div class="card-b">${table(['الخدمة','الحالة','آخر فحص','التهيئة','الإجراء'],(data.items||[]).map(x=>[x.name,`<span class="integration-dot ${x.tone}"></span>${x.status}`,x.checkedAt||'—',x.configured?'مهيّأة':'تحتاج إعدادًا',`<button class="btn sm" onclick="mountResource('resource-integrationStatus','integrations/status',renderIntegrationStatus)">إعادة الفحص</button>`]))}</div>`;}
S.welcomeCoupon=()=>phead('كوبون الترحيب','تعيين كوبون تلقائيًا للعميل عند التسجيل',['FR-CPN-WELCOME-01'])+card(cardH('إعداد قاعدة الترحيب','يُطبّق فقط على التسجيلات الجديدة بعد التفعيل')+`<div id="resource-welcomeCoupon"></div>`);
function renderWelcomeCoupon(data){return `<div class="card-b"><div class="frow">${fld('الحالة',`<select class="native-input" id="welcome-active"><option ${data.active?'selected':''}>مفعّل</option><option ${!data.active?'selected':''}>معطّل</option></select>`)}${fld('الكوبون',`<input class="native-input" id="welcome-code" value="${esc(data.code||'')}">`)}</div><div class="frow">${fld('النوع',`<select class="native-input" id="welcome-type"><option>${esc(data.type||'نسبة مئوية')}</option><option>مبلغ ثابت</option></select>`)}${fld('القيمة',`<input class="native-input" id="welcome-value" value="${esc(data.value||'')}">`)}</div><div class="frow">${fld('حد الاستخدام لكل عميل',`<input class="native-input" id="welcome-limit" value="${esc(data.perCustomerLimit||1)}">`)}${fld('الحد الإجمالي',`<input class="native-input" id="welcome-total" value="${esc(data.totalLimit||'')}">`)}</div>${note('info','سجل التعيين','يجب أن يحتفظ الخادم بسجل لكل كوبون أُسند تلقائيًا لمنع تكرار التعيين.') }<button class="btn coral" onclick="saveWelcomeCoupon()">حفظ الإعداد</button></div>`;}
window.saveWelcomeCoupon=async()=>{const body={active:document.getElementById('welcome-active').value==='مفعّل',code:document.getElementById('welcome-code').value,type:document.getElementById('welcome-type').value,value:document.getElementById('welcome-value').value,perCustomerLimit:document.getElementById('welcome-limit').value,totalLimit:document.getElementById('welcome-total').value};try{await WafraFeatureApi.update('settings','welcome-coupon',body);__toast('تم حفظ إعداد كوبون الترحيب.')}catch(e){__toast(e.code==='API_NOT_CONFIGURED'?'لا يمكن حفظ الإعداد قبل ربط API.':'تعذّر حفظ الإعداد.');}};

/* Authorized, server-issued impersonation only. No client-side role escalation or local audit fallback. */
let impersonation=null;
function renderImpersonation(){document.getElementById('impersonation-banner')?.remove();if(!impersonation)return;const b=document.createElement('div');b.id='impersonation-banner';b.className='impersonation';b.innerHTML=`أنت تشاهد كـ ${esc(impersonation.name)}. الإجراءات الحساسة معطّلة. <button onclick="endViewAsUser()">إنهاء العرض</button>`;document.body.prepend(b);document.body.classList.add('restricted');}
window.startViewAsUser=async()=>{const id=document.getElementById('view-user-id')?.value.trim(),reason=document.getElementById('view-user-reason')?.value.trim();if(!id||reason.length<20){__toast('أدخل معرّف المستخدم وسببًا من 20 حرفًا على الأقل.');return;}try{const result=await WafraFeatureApi.startImpersonation(id,reason);impersonation={id:result.id,name:result.user?.name||id};await WafraFeatureApi.audit({action:'VIEW_AS_USER_STARTED',entity:id,reason});closeM();renderImpersonation();__toast('بدأ العرض المقيد وسُجل في سجل التدقيق.');}catch(e){__toast(e.code==='API_NOT_CONFIGURED'?'ميزة العرض كمستخدم تتطلب API وخدمة تدقيق موثوقة.':'تعذّر بدء العرض.');}};
window.endViewAsUser=async()=>{if(!impersonation)return;try{await WafraFeatureApi.endImpersonation(impersonation.id);await WafraFeatureApi.audit({action:'VIEW_AS_USER_ENDED',entity:impersonation.id});impersonation=null;renderImpersonation();__toast('تم إنهاء العرض كمستخدم.');}catch(e){__toast('تعذّر إنهاء الجلسة؛ أبقينا القيود مفعلة للحماية.');}};
M.viewAsUser=()=>modal('العرض كمستخدم',`${note('warn','وضع مقيد ومراقَب','يتطلب صلاحية خادمية، ويعطّل الإجراءات الحساسة ويكتب قيد تدقيق غير قابل للتعديل.')}${fld('معرّف المستخدم',`<input class="native-input" id="view-user-id" placeholder="USR-… أو البريد">`)}${fld('سبب العرض (20 حرفًا على الأقل)',`<textarea class="native-input" id="view-user-reason" rows="3"></textarea>`)}`,`<button class="btn coral" onclick="startViewAsUser()">بدء العرض المقيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`);

/* Existing report route gains all requested domains without duplicating its filters/layout. */
const baseReports=S.reports;
S.reports=()=>baseReports()+card(cardH('تقارير تفصيلية','الحجوزات · المالية · الأداء · نمو المستخدمين · المزوّدون · العملاء')+`<div class="card-b"><div class="grid3">${[['الحجوزات','booking-report'],['المالية','finance-report'],['الأداء','performance-report'],['نمو المستخدمين','user-growth-report'],['المزوّدون','providers-report'],['العملاء','customers-report']].map(x=>`<a href="#reports?report=${x[1]}" class="card" style="padding:16px"><b>${x[0]}</b><span class="sub">تاريخ · حالة · مزوّد · مدينة</span></a>`).join('')}</div><div id="resource-reports"></div></div>`);
function renderReports(data){return `<div style="margin-top:16px">${note('info','نتائج التقرير','تمت قراءة النتائج من خدمة التقارير مع الفلاتر المحددة.')}${table(data.columns||[],data.rows||[])}</div>`;}
const oldRender=window.render;
window.render=function(){oldRender();renderImpersonation();const route=window.cur;const objectionId=new URLSearchParams(location.hash.split('?')[1]||'').get('id');const mounts={bookingMap:['bookings/map',renderBookingMap],objections:['fee-objections',renderObjections],objection:[objectionId?'fee-objections/'+encodeURIComponent(objectionId):'fee-objections/current',renderObjection],supportReports:['support/reports',renderSupportReports],integrationStatus:['integrations/status',renderIntegrationStatus],welcomeCoupon:['settings/welcome-coupon',renderWelcomeCoupon],reports:['reports',renderReports]};if(mounts[route])initFeatureRoute(route,mounts[route][0],mounts[route][1]);};
/* p8 is appended after the original router so that it can extend existing routes. */
window.addEventListener('hashchange', window.render);
window.render();
</script>

<script>
/* إكمال العناصر التفصيلية: تبويبات ذات محتوى، حالة مركبة موحّدة، وإجراءات تشغيلية. */
(function(){
  const tabBar=(items,active,handler)=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${items.map(x=>`<button class="btn ${active===x.k?'coral':'ghost'} sm" onclick="${handler}('${x.k}')">${x.t}</button>`).join('')}</div>`;
  const message=(text)=>`<div style="padding:12px 14px;background:#F5F8FF;border-radius:10px;color:var(--navy);font-size:12px">${text}</div>`;
  Object.assign(WafraOps,{
    switchMakeTab(tab){window.__makeTab=tab;render();},
    switchProviderTab(tab){window.__providerTab=tab;render();},
    switchAvailability(tab){window.__availabilityTab=tab;render();},
    editPrice(car){openM(modal('تعديل تسعير '+car,`<div class="frow">${fld('السعر اليومي',`<input class="native-input" value="190">`)}${fld('السعر الأسبوعي',`<input class="native-input" value="1,140">`)}</div>${fld('السعر الشهري',`<input class="native-input" value="4,200">`)}${message('يُسجَّل التعديل في سجل السيارة ويظهر فوراً في شاشة المزود.')}`,`<button class="btn coral" onclick="closeM();__toast('تم حفظ تسعير السيارة.')">حفظ التسعير</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    bulkAvailability(){openM(modal('تحديث إتاحة سيارات مزود',`${fld('المزود',`<select class="native-input"><option>شركة الصحراء لتأجير السيارات</option><option>كي رنت</option><option>مسار</option></select>`)}${fld('الإجراء',`<select class="native-input"><option>تفعيل جميع السيارات المطابقة</option><option>إيقاف جميع السيارات المطابقة</option><option>تحديث الإتاحة إلى صفر</option></select>`)}${message('يطبّق التحديث على السيارات المطابقة للفلاتر الحالية فقط.')}`,`<button class="btn coral" onclick="closeM();__toast('تم تحديث إتاحة سيارات المزود.')">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    requestAction(status){const txt={review:'تم تحويل الطلب للمراجعة مع قائمة تحقق.',docs:'تم إرسال طلب الوثائق للمزود.',approved:'تم اعتماد المزود وتفعيل حسابه.',rejected:'تم رفض الطلب مع تسجيل السبب.'}[status]; openM(modal('إجراء الطلب',`${message(txt)}${fld('ملاحظة للإجراء',`<textarea class="native-input" rows="3">تمت مراجعة الطلب وتوثيق القرار.</textarea>`)}`,`<button class="btn coral" onclick="closeM();__toast('تم حفظ الإجراء.')">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));}
  });
