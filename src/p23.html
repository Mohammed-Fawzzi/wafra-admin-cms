<script>
/* طبقة بيانات الواجهات: لا يوجد Backend في هذا المشروع، لذلك تحفظ التغييرات محلياً في المتصفح. */
(function(){
  const seed={
    approvals:[
      {id:'AR-2026-770',provider:'شركة أسطول الشمال لتأجير السيارات',city:'تبوك',commercial:'1018276211',docs:4,total:4,status:'طلب وثائق',date:'28 سبتمبر 2026',note:'يرجى إرفاق وثيقة التأمين السارية وصور واجهة الفرع.'},
      {id:'AR-2026-412',provider:'شركة ركن المركبات لتأجير السيارات',city:'جدة',commercial:'1012499983',docs:4,total:4,status:'مكتمل',date:'26 سبتمبر 2026',note:''},
      {id:'AR-2026-191',provider:'درب الخليج لتأجير السيارات',city:'الرياض',commercial:'1014003244',docs:4,total:4,status:'معتمد',date:'22 سبتمبر 2026',note:'اعتماد نهائي بعد التحقق من المستندات.'},
      {id:'AR-2026-098',provider:'الرحال لتأجير السيارات',city:'الرياض',commercial:'1010983341',docs:2,total:4,status:'مرفوض',date:'20 سبتمبر 2026',note:'السجل التجاري منتهي ولا توجد وثيقة تأمين صالحة.'}
    ],
    documents:[
      {id:'DOC-01',name:'السجل التجاري',number:'1010893442',expiry:'31 ديسمبر 2027',status:'مكتمل',file:'السجل-التجاري.pdf'},
      {id:'DOC-02',name:'رخصة مزاولة النشاط',number:'RL-55021',expiry:'15 مايو 2027',status:'مكتمل',file:'رخصة-النشاط.pdf'},
      {id:'DOC-03',name:'وثيقة التأمين',number:'INS-2026-92',expiry:'30 أكتوبر 2026',status:'بانتظار التجديد',file:'وثيقة-التأمين.pdf'}
    ],
    branches:[
      {id:'BR-014',name:'مطار الملك خالد',provider:'شركة الصحراء',city:'الرياض',contracts:186,utilization:81,commission:12,status:'نشط'},
      {id:'BR-021',name:'جدة الشمالية',provider:'كي رنت',city:'جدة',contracts:139,utilization:75,commission:10,status:'نشط'},
      {id:'BR-031',name:'الخبر التشغيلي',provider:'مسار',city:'الخبر',contracts:18,utilization:0,commission:10,status:'غير نشط'}
    ]
  };
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('wafra-admin-state-v2')||'null')}catch(_){return null}})();
  const state=window.WAFRA_DATA=window.WAFRA_DATA||saved||seed;
  const persist=()=>localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));
  const badge=s=>bdg(s,s==='معتمد'||s==='مكتمل'||s==='نشط'?'g':s==='مرفوض'||s==='غير نشط'?'r':'a');
  const modal=(title,body,foot='')=>`<div class="modal"><div class="modal-h"><h3>${title}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</div>`;
  const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const csv=(name,headers,rows)=>{
    const enc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const content='\ufeff'+[headers,...rows].map(r=>r.map(enc).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})); a.download=`${name}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  const tableRows=a=>a.map(x=>[x.id,x.provider,x.city,x.commercial,`${x.docs}/${x.total}`,badge(x.status),x.date,`<button class="btn ghost sm" onclick="WafraOps.viewApproval('${x.id}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.requestDocs('${x.id}')">طلب وثائق</button>`]);
  Object.assign(WafraOps,{
    exportApprovals:()=>{const a=filteredApprovals();csv('طلبات-الاعتماد',['الطلب','المزود','المدينة','السجل التجاري','المستندات','الحالة','تاريخ التقديم'],a.map(x=>[x.id,x.provider,x.city,x.commercial,`${x.docs}/${x.total}`,x.status,x.date]));window.__toast(`تم تصدير ${a.length} طلباً حسب الفلاتر الحالية.`);},
    approvalFilter:()=>{window.__approvalFilter={q:document.getElementById('approval-q')?.value||'',status:document.getElementById('approval-status')?.value||'',city:document.getElementById('approval-city')?.value||''}; render();},
    viewApproval:id=>{const a=state.approvals.find(x=>x.id===id); if(!a)return;openM(modal(`طلب الاعتماد ${a.id}`,`<div class="prev-row"><span class="k">المزود</span><span class="v">${safe(a.provider)}</span></div><div class="prev-row"><span class="k">المدينة</span><span class="v">${a.city}</span></div><div class="prev-row"><span class="k">السجل التجاري</span><span class="v">${a.commercial}</span></div><div class="prev-row"><span class="k">الحالة</span><span class="v">${a.status}</span></div><div class="prev-row"><span class="k">الملاحظات / سبب القرار</span><span class="v">${safe(a.note||'لا توجد ملاحظات')}</span></div><h4 style="margin:16px 0 8px">المستندات المرفقة</h4>${state.documents.map(d=>`<div class="prev-row"><span class="k">${d.name}</span><span class="v">${d.file} · ${d.status}</span></div>`).join('')}`,`<button class="btn" onclick="closeM();location.hash='vendorFile'">فتح ملف المزود</button><button class="btn ghost" onclick="closeM()">إغلاق</button>`));},
    requestDocs:id=>{const a=state.approvals.find(x=>x.id===id);if(!a)return;openM(modal('طلب وثائق إضافية',`<p class="sub">ستظهر هذه الملاحظة للمزود وتُحفظ في سجل طلب الاعتماد.</p><label class="fl">الملاحظات المطلوبة</label><textarea id="approval-note" class="native-input" style="min-height:100px" placeholder="اكتب المستندات أو التعديلات المطلوبة…">${safe(a.note||'')}</textarea>`,`<button class="btn coral" onclick="WafraOps.saveDocumentRequest('${id}')">إرسال الطلب</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    saveDocumentRequest:id=>{const a=state.approvals.find(x=>x.id===id);const note=document.getElementById('approval-note')?.value.trim();if(!a||!note){window.__toast('أضف ملاحظة قبل الإرسال.');return;}a.status='طلب وثائق';a.note=note;persist();closeM();render();window.__toast('تم إرسال طلب الوثائق وحفظ الملاحظة.');},
    changeApproval:(id,status)=>{const a=state.approvals.find(x=>x.id===id);if(!a)return;a.status=status;if(status==='معتمد')a.note='تم اعتماد الطلب بعد اكتمال المراجعة.';persist();render();window.__toast(`تم تغيير حالة الطلب إلى ${status}.`);},
    providerDocTab:t=>{window.__providerDocTab=t;render();},
    previewDocument:id=>{const d=state.documents.find(x=>x.id===id);if(!d)return;openM(modal(`استعراض ${d.name}`,`<div style="min-height:220px;border:1px dashed var(--line-strong);border-radius:12px;display:grid;place-items:center;text-align:center;padding:22px"><div><b style="font-size:18px">${d.file}</b><p class="sub">نسخة مستند محفوظة محلياً للنموذج</p><p>الرقم: ${d.number}<br>الانتهاء: ${d.expiry}</p></div></div>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`));},
    editDocument:id=>{const d=state.documents.find(x=>x.id===id);if(!d)return;openM(modal(`تعديل ${d.name}`,`<label class="fl">رقم المستند</label><input id="doc-number" class="native-input" value="${safe(d.number)}"><label class="fl" style="margin-top:12px;display:block">تاريخ الانتهاء</label><input id="doc-expiry" class="native-input" value="${safe(d.expiry)}">`,`<button class="btn coral" onclick="WafraOps.saveDocument('${id}')">حفظ التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    saveDocument:id=>{const d=state.documents.find(x=>x.id===id);if(!d)return;d.number=document.getElementById('doc-number').value.trim();d.expiry=document.getElementById('doc-expiry').value.trim();d.status='مكتمل';persist();closeM();render();window.__toast('تم حفظ تعديل المستند.');},
    branchFilter:()=>{window.__branchFilter={q:document.getElementById('branch-q')?.value||'',city:document.getElementById('branch-city')?.value||'',provider:document.getElementById('branch-provider')?.value||'',status:document.getElementById('branch-status')?.value||''};render();},
    toggleBranch:id=>{const b=state.branches.find(x=>x.id===id);if(!b)return;b.status=b.status==='نشط'?'غير نشط':'نشط';persist();render();window.__toast(`تم ${b.status==='نشط'?'تنشيط':'إلغاء تنشيط'} الفرع.`);},
    viewBranch:id=>{const b=state.branches.find(x=>x.id===id);if(!b)return;openM(modal(`تفاصيل ${b.name}`,`<div class="prev-row"><span class="k">المزود</span><span class="v">${b.provider}</span></div><div class="prev-row"><span class="k">المدينة</span><span class="v">${b.city}</span></div><div class="prev-row"><span class="k">إجمالي العقود</span><span class="v">${b.contracts}</span></div><div class="prev-row"><span class="k">نسبة التشغيل</span><span class="v">${b.utilization}%</span></div><div class="prev-row"><span class="k">نسبة العمولة</span><span class="v">${b.commission}%</span></div><h4 style="margin:16px 0 8px">صلاحيات الفرع</h4><p>الحجوزات، الاستلام والتسليم، إدارة الإتاحة، التسعير ضمن الفرع، ومشاهدة التقارير الخاصة بالفرع.</p>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`));}
  });
  function filteredApprovals(){const f=window.__approvalFilter||{};return state.approvals.filter(a=>(!f.q||`${a.id} ${a.provider} ${a.commercial}`.includes(f.q))&&(!f.status||a.status===f.status)&&(!f.city||a.city===f.city));}
  const dashboardBase=S.dashboard;S.dashboard=()=>dashboardBase()+`<div class="grid2">${card(cardH('طلبات الاعتماد والمخاطر','متابعة مباشرة للطلبات والمخاطر التشغيلية')+`<div class="card-b">${table(['المؤشر','العدد','الإجراء'],[['طلبات وثائق معلقة','1','<a class="btn sm" href="#kyc">فتح طلبات الاعتماد</a>'],['طلبات معتمدة اليوم','3','<a class="btn ghost sm" href="#kyc">عرض السجل</a>'],['مخاطر عالية الخطورة','7','<a class="btn ghost sm" href="#fleetReview">مراقبة الجودة</a>']])}</div>`) }${card(cardH('التسويق','ملخص الحملات والكوبونات وإعلانات المزودين')+`<div class="card-b">${table(['المؤشر','القيمة','الإجراء'],[['حملات نشطة','4','<a class="btn sm" href="#campaigns">إدارة الحملات</a>'],['كوبونات مفعلة','12','<a class="btn ghost sm" href="#coupons">إدارة الكوبونات</a>'],['إعلانات مزودين بانتظار المراجعة','5','<a class="btn ghost sm" href="#vendorAds">مراجعة الإعلانات</a>']])}</div>`)}</div>`;
  S.kyc=()=>{const f=window.__approvalFilter||{};const rows=filteredApprovals();return phead('طلبات الاعتماد','مراجعة بيانات المزود والمستندات وحالة كل طلب',[],`<button class="btn ghost" onclick="WafraOps.exportApprovals()">Excel ⤓</button><button class="btn ghost" onclick="window.print()">PDF ⤓</button>`)+card(`<div class="filters"><label class="fsearch">⌕ <input id="approval-q" value="${safe(f.q||'')}" placeholder="ابحث بالطلب أو اسم المزود أو السجل التجاري" oninput="WafraOps.approvalFilter()"></label>${fld('الحالة',`<select id="approval-status" class="native-input" onchange="WafraOps.approvalFilter()"><option value="">كل الحالات</option>${['طلب وثائق','مكتمل','معتمد','مرفوض'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('المدينة',`<select id="approval-city" class="native-input" onchange="WafraOps.approvalFilter()"><option value="">كل المدن</option>${['الرياض','جدة','تبوك'].map(x=>`<option ${f.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}</div><div class="card-b">${table(['رقم الطلب','المزود','المدينة','السجل التجاري','المستندات','الحالة','تاريخ التقديم','الإجراءات'],tableRows(rows))}</div>`)+note('info','حالات الطلب','طلب وثائق، مكتمل، معتمد، مرفوض. يعرض الاستعراض البيانات والمستندات والملاحظات أو سبب القرار كاملاً.');};
  const vendorBase=S.vendorFile;S.vendorFile=()=>{const active=window.__providerTab||'overview';if(active!=='documents')return vendorBase();const t=window.__providerDocTab||'all';const docs=state.documents.filter(d=>t==='all'||(t==='valid'&&d.status==='مكتمل')||(t==='renewal'&&d.status!=='مكتمل'));return phead('ملف المزود','المستندات المرفقة قابلة للاستعراض والتعديل حسب الصلاحية',[],`<button class="btn coral" onclick="WafraOps.editEntity('شركة الصحراء لتأجير السيارات','مزود')">تعديل بيانات المزود</button>`)+card(`<div class="tabs"><button class="tab" onclick="WafraOps.switchProviderTab('overview')">نظرة عامة</button><button class="tab" onclick="WafraOps.switchProviderTab('branches')">الفروع</button><button class="tab" onclick="WafraOps.switchProviderTab('fleet')">الأسطول</button><button class="tab" onclick="WafraOps.switchProviderTab('bookings')">الحجوزات</button><button class="tab" onclick="WafraOps.switchProviderTab('ratings')">التقييمات</button><button class="tab" onclick="WafraOps.switchProviderTab('pricing')">التسعير</button><button class="tab" onclick="WafraOps.switchProviderTab('services')">الخدمات</button><button class="tab on">المستندات</button><button class="tab" onclick="WafraOps.switchProviderTab('team')">الفريق</button></div><div class="tabs" style="padding-top:10px"><button class="tab ${t==='all'?'on':''}" onclick="WafraOps.providerDocTab('all')">كل المستندات</button><button class="tab ${t==='valid'?'on':''}" onclick="WafraOps.providerDocTab('valid')">مكتملة</button><button class="tab ${t==='renewal'?'on':''}" onclick="WafraOps.providerDocTab('renewal')">تحتاج تجديد</button></div><div class="card-b">${table(['المستند','الرقم / الإصدار','تاريخ الانتهاء','الحالة','الإجراءات'],docs.map(d=>[d.name,d.number,d.expiry,badge(d.status),`<button class="btn ghost sm" onclick="WafraOps.previewDocument('${d.id}')">فتح</button> <button class="btn ghost sm" onclick="WafraOps.editDocument('${d.id}')">تعديل</button>`]))}</div>`);};
  S.branches=()=>{const f=window.__branchFilter||{};const rows=state.branches.filter(b=>(!f.q||`${b.name} ${b.provider}`.includes(f.q))&&(!f.city||b.city===f.city)&&(!f.provider||b.provider===f.provider)&&(!f.status||b.status===f.status));return phead('إدارة الفروع','بحث وفلترة وتفعيل وصلاحيات لكل فرع',[],`<button class="btn coral" onclick="WafraOps.openBranchForm()">＋ إضافة فرع</button>`)+card(`<div class="filters"><label class="fsearch">⌕ <input id="branch-q" value="${safe(f.q||'')}" placeholder="ابحث باسم الفرع" oninput="WafraOps.branchFilter()"></label>${fld('المدينة',`<select id="branch-city" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المدن</option>${['الرياض','جدة','الخبر'].map(x=>`<option ${f.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('المزود',`<select id="branch-provider" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المزودين</option>${['شركة الصحراء','كي رنت','مسار'].map(x=>`<option ${f.provider===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('الحالة',`<select id="branch-status" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل الحالات</option><option ${f.status==='نشط'?'selected':''}>نشط</option><option ${f.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}</div><div class="card-b">${table(['المرجع','الفرع','المزود','المدينة','إجمالي العقود','التشغيل','العمولة','الحالة','الإجراءات'],rows.map(b=>[b.id,b.name,b.provider,b.city,b.contracts,`${b.utilization}%`,`${b.commission}%`,badge(b.status),`<button class="btn ghost sm" onclick="WafraOps.viewBranch('${b.id}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.editEntity('${b.name}','فرع')">تعديل</button> <button class="btn ${b.status==='نشط'?'danger':'coral'} sm" onclick="WafraOps.toggleBranch('${b.id}')">${b.status==='نشط'?'إلغاء التنشيط':'تنشيط'}</button>`]))}</div>`);};
})();
</script>
