<script>
/* إصلاح التفاعل وإكمال التحليلات وفق نماذج المراجعة. */
(function(){
  const toast=msg=>{
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const tabButtons=(items,active,handler)=>`<div class="tabs">${items.map(x=>`<button class="tab ${active===x.k?'on':''}" onclick="${handler}('${x.k}')">${x.t}</button>`).join('')}</div>`;
  const k=(i,l,v,d,t='up')=>({i,l,v,d,t});
  const amt=v=>({v:v+' ر.س',c:'num'});
  const status=(v,t='g')=>bdg(v,t);
  const bars=(items)=>`<div style="padding:12px 8px">${items.map(([n,v,c])=>`<div style="display:grid;grid-template-columns:100px 1fr 42px;gap:9px;align-items:center;margin:10px 0;font-size:12px"><span>${n}</span><i style="height:14px;border-radius:5px;background:${c||'var(--navy)'};width:${v}%"></i><b>${v}%</b></div>`).join('')}</div>`;
  const tableWith=(heads,rows)=>table(heads,rows);
  Object.assign(WafraOps,{
    switchAnalyticsTab:t=>{window.__analyticsTab=t;render();},
    switchProviderTab:t=>{window.__providerTab=t;render();},
    demoAction:t=>toast(`${t}: تم تنفيذ المثال التجريبي وتحديث البيانات.`),
    mapCity:t=>toast(`تم عرض تفاصيل ${t}:  ${t==='الرياض'?'1,620':'734'} حجزاً خلال الفترة.`),
    notice:t=>toast(`${t} — تم تنفيذ الإجراء التجريبي.`),
    dynamicRule:()=>toast('تم حفظ قاعدة التسعير الديناميكي.'),
    bookingAction:t=>toast(`${t} — تم تحديث بيانات الحجز تجريبياً.`),
    requestAction:t=>toast(`تم تحديث طلب الموديل إلى حالة: ${t}`),
    toggleVehicle:t=>toast(`تم تغيير حالة السيارة ${t} بنجاح.`),
    editPrice:t=>toast(`تم فتح تعديل سعر ${t}.`),
    bulkAvailability:()=>toast('تم تجهيز تحديث الإتاحة الجماعي للمزود.'),
    addProvider:()=>toast('تم فتح نموذج إضافة مزود جديد.'),
    editEntity:(n,t)=>toast(`تم فتح تعديل ${t}: ${n}.`)
  });

  S.analytics=()=>{
    const active=window.__analyticsTab||'search';
    const tabs=[{k:'search',t:'البحث والتحليل'},{k:'compare',t:'المقارنات'},{k:'technical',t:'التحليل الفني'},{k:'operations',t:'المؤشرات التشغيلية'},{k:'financial',t:'النظرة المالية'},{k:'map',t:'الخريطة التفاعلية'},{k:'delivery',t:'خدمة التوصيل'},{k:'scheduled',t:'التقارير المجدولة'},{k:'sla',t:'مراقبة مستوى الخدمة'},{k:'transfer',t:'النقل بين الفروع'}];
    const quick=`<div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="WafraOps.demoAction('تصدير CSV')">CSV ⤓</button><button class="btn ghost sm" onclick="WafraOps.demoAction('تصدير Excel')">Excel ⤓</button><button class="btn ghost sm" onclick="WafraOps.demoAction('تصدير PDF')">PDF ⤓</button><button class="btn ghost sm" onclick="WafraOps.demoAction('حفظ التقرير')">حفظ التقرير</button></div>`;
    const search=`${quick}<div class="card-b"><div class="grid3">${[['الكيانات','المزودون · العملاء · السيارات'],['حالة الحجز','جاري · مكتمل · ملغي'],['المدينة','الرياض · جدة · الخبر']].map(x=>`<div>${fld(x[0],`<select class="native-input"><option>${x[1]}</option><option>الكل</option></select>`)}</div>`).join('')}</div><div style="margin-top:12px"><button class="btn coral" onclick="WafraOps.demoAction('تشغيل التحليل')">تشغيل التحليل</button></div></div>${card(cardH('نتائج البحث','28 نتيجة مطابقة')+tableWith(['الاسم','النوع','المدينة','الحالة','الحجوزات','الإيرادات'],[['شركة الصحراء','مزود','الرياض',status('نشط'),'642',amt('286,400')],['أحمد الشمري','عميل','الرياض',status('نشط'),'14',amt('12,840')],['كامري 2026','سيارة','الرياض',status('متاحة'),'486',amt('92,340')]]))}`;
    const compare=`${quick}<div class="grid2">${card(cardH('مقارنة الفترتين','سبتمبر 2026 مقابل أغسطس 2026')+`<div class="card-b">${tableWith(['المؤشر','سبتمبر','أغسطس','التغير'],[['الإيرادات',amt('3,730,000'),amt('3,420,000'),'▲ 9.1%'],['الحجوزات','4,182','3,906','▲ 7.1%'],['التشغيل','74%','69%','▲ 5%'],['الإلغاء','9.6%','10.8%','▼ 1.2%']])}</div>`)}${card(cardH('البصمة الأدائية')+`<div class="card-b">${bars([['الإيرادات',92,'#293B85'],['الإتاحة',86,'#F04438'],['التشغيل',74,'#EAA631'],['الرضا',89,'#20A16E']])}</div>`)}</div>`;
    const operations=`<div class="card-b">${kpi([k('🚗','إجمالي السيارات','4,194','▲ 2.1%'),k('📍','الفروع النشطة','184','6 تحتاج إتاحة'),k('📅','الحجوزات','4,182','▲ 8.4%'),k('✓','المكتملة','3,540','84.6% من الإجمالي'),k('⏱','متوسط التأكيد','31 د','▼ 4 دقائق'),k('⚠','تجاوزات SLA','59','تحتاج إجراء')])}</div><div class="grid2">${card(cardH('حالة العقود')+`<div class="card-b">${bars([['مفتوح',78,'#2C68D8'],['مغلق',86,'#20A16E'],['ملغي',32,'#F04438'],['متأخر',24,'#EAA631']])}</div>`)}${card(cardH('الالتزام التشغيلي')+`<div class="card-b">${donut([['قبول الحجز',73,'var(--green)','73%'],['استلام العميل',91,'var(--navy)','91%'],['تحديث الإتاحة',89,'var(--green)','89%'],['تأخر الإرجاع',11,'var(--coral)','11%']],'89%','مؤشر الالتزام')}</div>`)}</div>`;
    const financial=`<div class="card-b">${kpi([k('💵','إجمالي الإيرادات','3,730,000','▲ 9.8%'),k('💰','صافي الربح','1,044,000','▲ 11.4%'),k('🏦','عمولات المنصة','447,600','12% من الإيرادات'),k('↩','المستردات','62,940','▼ 4.1%'),k('📄','إجمالي العقود','3,878','▲ 6.2%')])}</div><div class="grid2">${card(cardH('تدفق الإيرادات','أبريل إلى سبتمبر')+`<div class="card-b">${spark([40,61,60,58,63,84],32)}<div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>أبريل</span><span>مايو</span><span>يونيو</span><span>يوليو</span><span>أغسطس</span><span>سبتمبر</span></div></div>`)}${card(cardH('توزيع الإيرادات حسب المدينة')+`<div class="card-b">${donut([['الرياض',31,'var(--navy)','1.16M'],['جدة',24,'var(--coral)','895K'],['الخبر',18,'var(--amber)','671K'],['الدمام',13,'var(--green)','485K'],['مكة',14,'#8367C7','522K']],'3.73M','ر.س')}</div>`)}</div>`;
    const map=`<div class="card-b"><div style="position:relative;min-height:350px;border-radius:16px;overflow:hidden;background:#EAF0FF;border:1px solid #C7D4FA"><svg viewBox="0 0 900 360" width="100%" height="350" aria-label="خريطة المملكة التفاعلية"><path d="M110 200 L240 80 L390 110 L520 190 L650 215 L760 310 L650 335 L490 315 L360 342 L180 310 Z" fill="#DCE6FF" stroke="#A9BCEB" stroke-width="3"/><g font-family="Cairo" font-weight="700" fill="#23386D" text-anchor="middle"><text x="220" y="180">تبوك</text><text x="370" y="230">حائل</text><text x="470" y="280">بريدة</text><text x="570" y="300">الرياض</text><text x="690" y="255">الخبر</text><text x="730" y="230">الدمام</text></g><g>${[['220','195','تبوك','#293B85','18'],['370','245','حائل','#5267A9','18'],['470','292','بريدة','#5267A9','20'],['570','315','الرياض','#F06C6C','42'],['690','268','الخبر','#F0A632','30']].map(([x,y,n,c,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity=".8" stroke="#fff" stroke-width="3" style="cursor:pointer" onclick="WafraOps.mapCity('${n}')"/>`).join('')}</g></svg><div style="position:absolute;top:14px;left:14px;background:#fff;border-radius:10px;padding:9px;font-size:11px">● طلب مرتفع<br><span style="color:#F06C6C">●</span> يحتاج إتاحة<br><span style="color:#F0A632">●</span> توصيل نشط</div></div></div>${card(cardH('مؤشرات المدن')+tableWith(['المدينة','الحجوزات','الإتاحة','التشغيل','التوصيل'],[['الرياض','1,620','92%','78%','486'],['جدة','1,105','89%','74%','322'],['الخبر','734','81%','69%','186'],['تبوك','216','94%','63%','58']]))}`;
    const delivery=`<div class="card-b">${kpi([k('🚚','طلبات التوصيل','1,589','38% من الحجوزات'),k('⏱','متوسط وقت التوصيل','34 د','▼ 3 دقائق'),k('💵','إيراد التوصيل','63,120','▲ 7.2%'),k('★','تقييم التوصيل','4.83','من 5')])}</div><div class="grid2">${card(cardH('أفضل المدن بالتوصيل')+`<div class="card-b">${bars([['مكة',96,'#293B85'],['المدينة',94,'#F04438'],['الرياض',91,'#EAA631'],['جدة',88,'#20A16E'],['تبوك',76,'#8367C7']])}</div>`)}${card(cardH('توزيع أوقات التوصيل')+`<div class="card-b">${bars([['أقل من 20 د',18,'#8367C7'],['20–40 د',42,'#8367C7'],['40–60 د',55,'#8367C7'],['60–80 د',36,'#8367C7'],['أكثر من 80 د',93,'#8367C7']])}</div>`)}</div>${card(cardH('أداء السائقين')+tableWith(['السائق','طلبات التوصيل','متوسط الوقت','التقييم','الحالة'],[['محمد الحربي','9','48 د','4.69 ★',status('ممتاز')],['سارة المطيري','11','76 د','4.88 ★',status('ممتاز')],['وليد الدوسري','11','100 د','4.19 ★',status('يحتاج متابعة','a')]]))}`;
    const sla=`<div class="card-b">${kpi([k('◷','بنود متأخرة','70','تحتاج متابعة'),k('△','تجاوزات SLA','59','▲ 5 اليوم'),k('△','قريبة من التجاوز','5','خلال الساعة'),k('⌁','نسبة الالتزام','84%','▲ 3%')])}</div>${card(cardH('التجاوزات حسب مستوى الخدمة')+tableWith(['الخدمة','المهلة','التجاوز','ضمن المهلة','قريب','متأخر','الالتزام','الإجراء'],[['تأكيد الحجز','48 ساعة','9','39','1','1','92%',`<button class="btn ghost sm" onclick="WafraOps.demoAction('فتح تذاكر التأكيد')">فتح التذاكر</button>`],['التسليم','72 ساعة','14','8','0','2','84%',`<button class="btn ghost sm" onclick="WafraOps.demoAction('فتح تذاكر التسليم')">فتح التذاكر</button>`],['الاستردادات','96 ساعة','7','9','1','1','89%',`<button class="btn ghost sm" onclick="WafraOps.demoAction('فتح تذاكر الاسترداد')">فتح التذاكر</button>`]]))}`;
    const scheduled=`${quick}${card(cardH('التقارير المجدولة')+tableWith(['التقرير','التكرار','آخر إرسال','المستلمون','الحالة','الإجراء'],[['ملخص الأداء','أسبوعي','الخميس 09:00','الإدارة',status('مفعّل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل التقرير')">تعديل</button>`],['تقرير التحصيل','شهري','1 سبتمبر 08:00','المالية',status('مفعّل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('إرسال التقرير')">إرسال الآن</button>`],['جودة الأسطول','يومي','اليوم 07:00','التشغيل',status('مفعّل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل التقرير')">تعديل</button>`]]))}`;
    const transfer=`${quick}${card(cardH('النقل بين الفروع')+tableWith(['الطلب','السيارة','الفرع المصدر','الفرع المستهدف','المدينة','الحالة','المطلوب','الإجراء'],[['TR-118','كامري 2026','مطار الملك خالد','طريق الملك عبدالعزيز','الرياض',status('قيد المراجعة','a'),'3 سيارات',`<button class="btn coral sm" onclick="WafraOps.demoAction('اعتماد النقل')">اعتماد</button>`],['TR-114','إلنترا 2025','جدة الشمالية','مطار الملك عبدالعزيز','جدة',status('نشط'),'4 سيارات',`<button class="btn ghost sm" onclick="WafraOps.demoAction('عرض النقل')">إطلاع</button>`]]))}`;
    const content={search,compare,technical:compare,operations,financial,map,delivery,scheduled,sla,transfer}[active];
    return phead('التحليلات','بحث وتحليل بيانات المنصة وتشغيلها وماليتها، مع أمثلة واقعية قابلة للتفاعل',[],`<button class="btn coral" onclick="WafraOps.demoAction('إنشاء تقرير')">＋ إنشاء تقرير</button>`)+card(tabButtons(tabs,active,'WafraOps.switchAnalyticsTab')+content);
  };

  S.vendorFile=()=>{
    const active=window.__providerTab||'overview'; const tabs=[{k:'overview',t:'نظرة عامة'},{k:'branches',t:'الفروع'},{k:'fleet',t:'الأسطول'},{k:'bookings',t:'الحجوزات'},{k:'ratings',t:'التقييمات'},{k:'pricing',t:'التسعير'},{k:'services',t:'الخدمات'},{k:'documents',t:'المستندات'},{k:'permissions',t:'الصلاحيات'}];
    const overview=`<div class="grid2">${card(cardH('بيانات المزود')+`<div class="card-b">${dl([['الحالة',status('نشط')],['رقم السجل التجاري','1010893442'],['التصنيف','مزوّد ذهبي'],['المدينة الرئيسية','الرياض'],['عدد الفروع','7'],['الخدمات','استلام · توصيل · بين المدن']])}</div>`)}${card(cardH('المؤشرات')+`<div class="card-b">${dl([['نسبة التشغيل','78%'],['نسبة العمولة','12%'],['إجمالي الإيرادات',amt('286,400')],['إجمالي العقود','642'],['السيارات المتاحة','214'],['الحجوزات النشطة','23']])}</div>`)}</div>`;
    const branches=tableWith(['الفرع','المدينة','النوع','السيارات المتاحة','الحجوزات','الإيرادات','الإجراء'],[['مطار الملك خالد','الرياض','مطار','48','12',amt('86,400'),`<a class="btn ghost sm" href="#branchDetail">إطلاع</a>`],['طريق الملك عبدالعزيز','الرياض','داخلي','36','7',amt('62,200'),`<a class="btn ghost sm" href="#branchDetail">تعديل</a>`],['جدة الشمالية','جدة','داخلي','31','4',amt('45,600'),`<a class="btn ghost sm" href="#branchDetail">إطلاع</a>`]]);
    const carImg=n=>`<img src="assets/${n}.png" alt="صورة السيارة" style="width:72px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--line)">`;
    const fleet=tableWith(['السيارة','الصورة','الفئة','الموديل','المتاح','الحالة','الإجراء'],[['كامري 2026',carImg('camry'),'سيدان','كامري','48',status('مفعلة'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل السيارة')">تعديل</button>`],['إلنترا 2025',carImg('elantra'),'اقتصادية','إلنترا','36',status('مفعلة'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل السيارة')">تعديل</button>`],['K5 2026',carImg('k5'),'سيدان','K5','0',status('إتاحتها صفر','r'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('فتح السيارة')">إطلاع</button>`]]);
    const bookings=tableWith(['رقم الحجز','السيارة','العميل','تاريخ الاستلام','تاريخ التسليم','فرع الاستلام','إجمالي المدفوع','الحالة','الإجراء'],[['BK-2048','كامري 2026','أحمد الشمري','25 أغسطس','28 أغسطس','مطار الملك خالد',amt('570'),status('نشط'),`<a class="btn ghost sm" href="#booking">إطلاع</a>`],['BK-2039','إلنترا 2025','نورة القحطاني','24 أغسطس','26 أغسطس','جدة الشمالية',amt('380'),status('مكتمل'),`<a class="btn ghost sm" href="#booking">إطلاع</a>`]]);
    const docs=tableWith(['المستند','الرقم','تاريخ الانتهاء','الحالة','الإجراء'],[['السجل التجاري','1010893442','30 ديسمبر 2027',status('مكتمل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('عرض السجل')">إطلاع</button>`],['الرخصة التجارية','RL-55021','15 مايو 2027',status('مكتمل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('تحديث الرخصة')">تعديل</button>`],['وثيقة التأمين','INS-2026-92','02 يناير 2027',status('مكتمل'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('عرض التأمين')">إطلاع</button>`]]);
    const permissions=`<div class="card-b">${[['فرع النزهة — التميّز لتأجير السيارات','الحجوزات','توصيل','تأجير داخلي'],['فرع السلامة — التميّز لتأجير السيارات','الحجوزات','توصيل','فاتورة البحث']].map((x,i)=>`<div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px"><b>${x[0]}</b><span class="sub">الطاقم: ${i?38:3} سيارة</span><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:9px">${x.slice(1).map((p,j)=>`<button class="btn ${j===0?'coral':'ghost'} sm" onclick="WafraOps.demoAction('تبديل صلاحية ${p}')">${p} ${j===0?'✓':'○'}</button>`).join('')}<button class="btn danger sm" onclick="WafraOps.demoAction('إيقاف الفرع')">إيقاف</button></div></div>`).join('')}</div>`;
    const data={overview,branches,fleet,bookings,ratings:tableWith(['العميل','التقييم','الملاحظة','التاريخ'],[['أحمد الشمري','5 / 5','سهولة الاستلام وحسن الخدمة','اليوم'],['نورة القحطاني','4 / 5','السيارة نظيفة','أمس']]),pricing:tableWith(['الموديل','يومي','أسبوعي','شهري'],[['كامري',amt('190'),amt('1,140'),amt('4,200')],['إلنترا',amt('145'),amt('870'),amt('3,220')]]),services:tableWith(['الخدمة','الرسوم','الفروع','الحالة'],[['استلام من الفرع',amt('0'),'7',status('مفعلة')],['توصيل',amt('45'),'6',status('مفعلة')]]),documents:docs,permissions}[active];
    return phead('ملف المزود','تفاصيل الفروع والأسطول والحجوزات والمستندات والصلاحيات',[],`<a class="btn ghost" href="#vendors">‹ رجوع لقائمة المزودين</a><button class="btn coral" onclick="WafraOps.demoAction('تعديل بيانات المزود')">تعديل بيانات المزود</button>`)+card(tabButtons(tabs,active,'WafraOps.switchProviderTab')+`<div class="card-b">${data}</div>`);
  };

  const vn=NAV.find(g=>g.g==='المزوّدون'); if(vn){const vf=vn.items.find(x=>x.k==='vendorFile');if(vf)delete vf.sub;}
  document.getElementById('stag').style.display='none';
  document.addEventListener('click',e=>{
    const btn=e.target.closest('button.btn');
    if(btn&&!btn.hasAttribute('onclick')) toast(`${btn.textContent.trim()||'الإجراء'} — تم تنفيذ المثال التجريبي.`);
  });
  render();
})();
</script>
