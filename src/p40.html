<style id="wafra-ops3">
/* خدمة التوصيل · التقارير المجدولة · النقل بين الفروع */
.ox-wrap{display:flex;flex-direction:column;gap:14px;padding:14px}
.ox-badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font:800 11.5px Cairo;margin-bottom:8px}
.ox-badge.red{background:#FFE4EC;color:#D12B5B}
.ox-badge.coral{background:#F04438;color:#fff}
.ox-badge.coral i,.ox-badge.red i{width:14px;height:14px;border-radius:99px;background:rgba(255,255,255,.95);color:#F04438;display:grid;place-items:center;font-size:9px;font-style:normal;font-weight:900}
.ox-badge.red i{background:#D12B5B;color:#fff}
.ox-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ox-kpi{background:#fff;border:1px solid #E4E9F3;border-radius:14px;padding:14px 14px;box-shadow:0 4px 12px rgba(25,42,84,.04)}
.ox-kpi .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;margin-bottom:8px}
.ox-kpi .l{font:700 12px Cairo;color:var(--muted);margin-bottom:4px}
.ox-kpi .v{font:800 22px Cairo;color:var(--ink);line-height:1.15}
.ox-kpi .v small{font-size:13px;font-weight:700;color:var(--muted)}
.ox-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox-panel{background:#fff;border:1px solid #E4E9F3;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(25,42,84,.04)}
.ox-panel-h{padding:14px 16px;border-bottom:1px solid #EEF1F7;font:800 14px Cairo;color:var(--ink)}
.ox-panel-b{padding:12px 14px 16px}
.ox-panel-b svg{width:100%;height:auto;display:block}
.ox-info{display:flex;gap:10px;align-items:flex-start;background:#EAF2FF;border:1px solid #C9DBFF;border-radius:12px;padding:12px 14px;font:600 12.5px Cairo;color:#2A4578;line-height:1.6}
.ox-info .ic{flex:0 0 auto;width:28px;height:28px;border-radius:99px;background:#2C68D8;color:#fff;display:grid;place-items:center;font-size:13px}
.ox-sched{display:flex;flex-direction:column;gap:10px}
.ox-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid #E4E9F3;border-radius:14px;padding:14px 16px;box-shadow:0 4px 12px rgba(25,42,84,.04)}
.ox-card .ico{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.ox-card .meta{flex:1;min-width:200px}
.ox-card .meta b{display:block;font:800 14px Cairo;color:var(--ink);margin-bottom:4px}
.ox-card .meta span{font:600 12px Cairo;color:var(--muted)}
.ox-card .side{display:flex;align-items:center;gap:12px;margin-inline-start:auto;flex-wrap:wrap}
.ox-card .next{text-align:start;font:600 11.5px Cairo;color:var(--muted);line-height:1.45}
.ox-card .next strong{display:block;color:var(--ink);font-weight:800}
.ox-tog{position:relative;width:46px;height:26px;border-radius:99px;background:#CDD3E0;border:0;cursor:pointer;transition:background .15s;flex:0 0 auto}
.ox-tog.on{background:#20A16E}
.ox-tog i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:inset-inline-start .15s;font-style:normal}
.ox-tog.on i{inset-inline-start:23px}
.ox-pill{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 10px;border-radius:99px;font:800 12px Cairo}
.ox-pill.g{background:#E8F8F0;color:#148A5A}
.ox-pill.r{background:#FDECEC;color:#C62828}
.ox-hbar{display:grid;gap:10px;padding:6px 0}
.ox-hbar .row{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center}
.ox-hbar .nm{font:700 12px Cairo;color:#44506A;text-align:start}
.ox-hbar .track{height:14px;background:#EEF2FA;border-radius:7px;overflow:hidden}
.ox-hbar .track i{display:block;height:100%;border-radius:7px}
.ox-hbar .pc{font:700 11px Cairo;color:var(--muted);text-align:end}
@media(max-width:1100px){
  .ox-kpis{grid-template-columns:repeat(3,1fr)}
  .ox-grid2{grid-template-columns:1fr}
}
@media(max-width:700px){
  .ox-kpis{grid-template-columns:1fr 1fr}
}
</style>
<script>
/* خدمة التوصيل · التقارير المجدولة · النقل بين الفروع — مطابق للتصميم. */
(function(){
  const tabs=[['search','البحث والتحليل'],['compare','المقارنات'],['technical','التحليل الفني'],['operations','المؤشرات التشغيلية'],['financial','النظرة المالية'],['map','الخريطة التفاعلية'],['delivery','خدمة التوصيل'],['scheduled','التقارير المجدولة'],['sla','مراقبة مستوى الخدمة'],['transfer','النقل بين الفروع']];
  const tabbar=active=>`<div class="tabs">${tabs.map(([key,label])=>`<button class="tab ${active===key?'on':''}" onclick="WafraOps.switchAnalyticsTab('${key}')">${label}</button>`).join('')}</div>`;
  const C={navy:'#293B85',red:'#E23D3D',amber:'#EAA631',green:'#20A16E',blue:'#2C68D8',purple:'#8367C7',teal:'#1AA6A6',pink:'#E85D8E',ink:'#1E2A44',muted:'#7A869E',line:'#E4E9F3'};

  const toast=msg=>{
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };

  if(!window.__schedState){
    window.__schedState=[
      {on:true,ico:'💵',t:'التقرير المالي اليومي',d:'يومي · 08:00 ص · PDF · الإدارة المالية',next:'غداً 08:00 ص'},
      {on:true,ico:'📊',t:'ملخص الإيرادات الأسبوعي',d:'أسبوعي · الأحد 08:00 ص · Excel · الإدارة التجارية',next:'الأحد القادم'},
      {on:true,ico:'📈',t:'تقرير الأداء الشهري الشامل',d:'شهري · يوم 1 · PDF و Excel · مجلس الإدارة',next:'1 الشهر القادم'},
      {on:false,ico:'📑',t:'تحليل العمولات والتحصيل',d:'أسبوعي · الخميس 02:00 م · Excel · قسم المحاسبة',next:'الخميس 02:00 م'},
      {on:true,ico:'📦',t:'مؤشرات النمو الربعية',d:'ربع سنوي · نهاية الربع · PDF · المساهمون',next:'30 يونيو'}
    ];
  }

  Object.assign(WafraOps,{
    schedToggle:i=>{const s=window.__schedState[i]; if(!s) return; s.on=!s.on; render();},
    schedGenerate:i=>{const s=window.__schedState[i]; toast(`توليد الآن: ${s?s.t:'التقرير'} — جاهز للتنزيل.`);},
    schedNew:()=>toast('تم فتح نموذج تقرير مجدول جديد.')
  });

  const kpi=(ic,bg,label,value)=>`<div class="ox-kpi"><div class="ic" style="background:${bg}">${ic}</div><div class="l">${label}</div><div class="v">${value}</div></div>`;

  const vbars=(items,max,h=220)=>{
    const W=420,H=h,p={l:36,r:12,t:16,b:48},pw=W-p.l-p.r,ph=H-p.t-p.b;
    const y=v=>p.t+ph-(v/max)*ph;
    const gap=pw/items.length,bw=gap*0.5;
    const ticks=4;
    const grid=Array.from({length:ticks+1},(_,i)=>{
      const v=Math.round(max*(i/ticks));
      return `<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-family="Cairo" font-size="10" fill="${C.muted}">${v}</text>`;
    }).join('');
    const bars=items.map(([n,v,c],i)=>{
      const cx=p.l+i*gap+gap/2;
      return `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${p.t+ph-y(v)}" rx="5" fill="${c}"/><text x="${cx}" y="${H-14}" text-anchor="middle" font-family="Cairo" font-size="10" font-weight="700" fill="${C.muted}">${n}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg>`;
  };

  const hbars=(items,max)=>`<div class="ox-hbar">${items.map(([n,v,c])=>`<div class="row"><span class="nm">${n}</span><div class="track"><i style="width:${Math.round(v/max*100)}%;background:${c}"></i></div><span class="pc">${v}</span></div>`).join('')}</div>`;

  const scatter=()=>{
    const pts=[[80,420],[120,580],[160,700],[200,900],[240,1100],[280,1300],[320,1500],[360,1700],[400,1900],[440,2100],[480,2300],[520,2500],[560,2800],[600,3100],[640,3400],[180,500],[300,900],[420,1600],[500,2000],[580,2700],[650,3800]];
    const W=420,H=240,p={l:44,r:14,t:16,b:40},pw=W-p.l-p.r,ph=H-p.t-p.b;
    const X=v=>p.l+(v/700)*pw, Y=v=>p.t+ph-(v/4000)*ph;
    const grid=[0,1000,2000,3000,4000].map(v=>`<line x1="${p.l}" y1="${Y(v)}" x2="${W-p.r}" y2="${Y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-family="Cairo" font-size="9" fill="${C.muted}">${v}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}
      <text x="${W/2}" y="${H-8}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}">المسافة (كم)</text>
      <text x="12" y="${H/2}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}" transform="rotate(-90 12 ${H/2})">التكلفة (ر.س)</text>
      ${pts.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${C.red}" fill-opacity=".7"/>`).join('')}
      <circle cx="${X(650)}" cy="${Y(3800)}" r="10" fill="${C.red}" fill-opacity=".9" stroke="#fff" stroke-width="2"/>
      <text x="${X(650)+12}" y="${Y(3800)+4}" font-family="Cairo" font-size="11" font-weight="800" fill="${C.ink}">نقل</text>
    </svg>`;
  };

  const deliveryUI=()=>{
    const cities=[['مكة',24,C.navy],['المدينة',21,C.red],['نجران',18,C.amber],['حائل',16,C.green],['جدة',14,C.blue],['أبها',12,C.purple],['تبوك',10,C.teal]];
    const times=[['<20',18,C.purple],['20-40',42,C.purple],['40-60',55,C.purple],['60-80',36,C.purple],['80+',90,C.purple]];
    const drivers=[
      ['ناصر المطيري','11','55 د','★ 4.82',bdg('ممتاز')],
      ['محمد الحربي','11','78 د','★ 4.60',bdg('ممتاز')],
      ['سامي المطيري','9','51 د','★ 4.55',bdg('ممتاز')],
      ['وليد الرشيدي','9','75 د','★ 4.51',bdg('ممتاز')],
      ['يوسف العنزي','8','54 د','★ 4.39',bdg('ممتاز')],
      ['ثامر الحربي','7','94 د','★ 4.03',bdg('جيد','a')]
    ];
    return `<div class="ox-wrap">
      <div class="ox-kpis">
        ${kpi('🚚','#EAF0FF','عدد طلبات التوصيل','240')}
        ${kpi('📍','#EAF0FF','إجمالي المسافة','5,380 <small>كم</small>')}
        ${kpi('⏱','#FFF4E5','متوسط وقت التوصيل','74 <small>د</small>')}
        ${kpi('💳','#FDECEC','إجمالي التكلفة','19.3 <small>ألف ر.س</small>')}
        ${kpi('👤','#E8F8F0','متوسط تقييم السائقين','★ 4.03')}
      </div>
      <div class="ox-grid2">
        <div class="ox-panel"><div class="ox-panel-h">أفضل المدن (عدد الطلبات)</div><div class="ox-panel-b">${vbars(cities,25)}</div></div>
        <div class="ox-panel"><div class="ox-panel-h">توزيع أوقات التوصيل</div><div class="ox-panel-b">${vbars(times,100)}</div></div>
      </div>
      <div class="ox-panel"><div class="ox-panel-h">أداء السائقين</div><div class="ox-panel-b">${table(['السائق','عدد التوصيلات','متوسط الوقت','التقييم','الحالة'],drivers)}</div></div>
    </div>`;
  };

  const scheduledUI=()=>{
    const rows=window.__schedState.map((s,i)=>`<div class="ox-card">
      <div class="ico">${s.ico}</div>
      <div class="meta"><b>${s.t}</b><span>${s.d}</span></div>
      <div class="side">
        <div class="next">التفعيل القادم<strong>${s.next}</strong></div>
        <button type="button" class="ox-tog ${s.on?'on':''}" onclick="WafraOps.schedToggle(${i})" aria-label="تفعيل الجدول"><i></i></button>
        <button type="button" class="btn ghost sm" onclick="WafraOps.schedGenerate(${i})">✨ توليد الآن</button>
      </div>
    </div>`).join('');
    return `<div class="ox-wrap">
      <div class="ox-info"><div class="ic">◷</div><div>تُولَّد التقارير تلقائياً في الأوقات المحددة وتُرسل للمستلمين. يمكنك إيقاف أي جدول فوراً أو توليد تقرير يدوياً.</div></div>
      <div class="ox-sched">${rows}</div>
    </div>`;
  };

  const transferUI=()=>{
    const routes=[['جدة — جدة',12,C.navy],['الرياض — الرياض',10,C.red],['مكة — جدة',8,C.amber],['جدة — الرياض',7,C.green],['الرياض — جدة',6,C.blue],['جدة — مكة',5,C.purple],['الرياض — مكة',4,C.teal]];
    const best=[
      ['مطار الملك خالد','18',`<span class="ox-pill g">3.2</span>`],
      ['جدة الشمالية','14',`<span class="ox-pill g">3.5</span>`],
      ['طريق الملك عبدالعزيز','12',`<span class="ox-pill g">3.8</span>`],
      ['المدينة المركزية','11',`<span class="ox-pill g">3.9</span>`],
      ['مكة التشغيلية','9',`<span class="ox-pill g">4.1</span>`]
    ];
    const worst=[
      ['الخبر التشغيلي','7',`<span class="ox-pill r">8.5</span>`],
      ['تبوك','5',`<span class="ox-pill r">8.3</span>`],
      ['نجران','4',`<span class="ox-pill r">8.2</span>`],
      ['حائل','4',`<span class="ox-pill r">8.1</span>`],
      ['أبها','3',`<span class="ox-pill r">8.0</span>`]
    ];
    return `<div class="ox-wrap">
      <div class="ox-kpis">
        ${kpi('⇄','#EAF0FF','عدد عمليات النقل','190')}
        ${kpi('💵','#FDECEC','إجمالي التكلفة','276.1 <small>ألف ر.س</small>')}
        ${kpi('📍','#EAF0FF','إجمالي المسافة','58,060 <small>كم</small>')}
        ${kpi('⏱','#FFF4E5','متوسط الوقت','5.8 <small>س</small>')}
        ${kpi('💳','#F3EEFF','متوسط التكلفة/عملية','1.5 <small>ألف ر.س</small>')}
      </div>
      <div class="ox-grid2">
        <div class="ox-panel"><div class="ox-panel-h">أكثر مسارات النقل</div><div class="ox-panel-b">${hbars(routes,12)}</div></div>
        <div class="ox-panel"><div class="ox-panel-h">التكلفة مقابل المسافة</div><div class="ox-panel-b">${scatter()}</div></div>
      </div>
      <div class="ox-grid2">
        <div class="ox-panel"><div class="ox-panel-h">أفضل الفروع (كفاءة تكلفة/كم)</div><div class="ox-panel-b">${table(['الفرع','العمليات','ر.س/كم'],best)}</div></div>
        <div class="ox-panel"><div class="ox-panel-h">أسوأ الفروع (الأعلى تكلفة)</div><div class="ox-panel-b">${table(['الفرع','العمليات','ر.س/كم'],worst)}</div></div>
      </div>
    </div>`;
  };

  const heads={
    delivery:{t:'خدمة التوصيل',s:'عدد الطلبات، المسافة، الوقت، التكلفة، تقييم السائقين، وأفضل المدن',badge:'<div class="ox-badge coral"><i>✓</i> كافة المناطق</div>',acts:`<button class="btn ghost" onclick="WafraOps.demoAction('تصدير خدمة التوصيل')">⤒ تصدير</button>`},
    scheduled:{t:'التقارير المالية المجدولة',s:'جدولة تقارير مالية تلقائية للبيانات التاريخية وإرسالها دورياً للجهات المعنية',badge:'<div class="ox-badge red"><i>◷</i> تحت التطوير</div>',acts:`<button class="btn coral" onclick="WafraOps.schedNew()">＋ تقرير جديد</button>`},
    transfer:{t:'النقل بين الفروع',s:'تحليل عمليات نقل المركبات بين الفروع: العدد، التكلفة، المسافة، الوقت، وأفضل/أسوأ الفروع',badge:'<div class="ox-badge coral"><i>✓</i> كل البيانات</div>',acts:`<button class="btn ghost" onclick="WafraOps.demoAction('تصدير النقل بين الفروع')">⤒ تصدير</button>`}
  };

  const baseAnalytics=S.analytics;
  S.analytics=()=>{
    const active=window.__analyticsTab||'search';
    if(!['delivery','scheduled','transfer'].includes(active)) return baseAnalytics();
    const h=heads[active];
    const body=active==='delivery'?deliveryUI():active==='scheduled'?scheduledUI():transferUI();
    return `<div class="phead"><div>${h.badge}<h1>${h.t}</h1><p>${h.s}</p></div><div class="acts">${h.acts}</div></div>`
      +card(tabbar(active)+body);
  };
})();
</script>
