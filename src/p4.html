window.TITLES = {};
NAV.forEach(g=>g.items.forEach(i=>{ window.TITLES[i.k]=i.t; }));
NAV.forEach(g=>g.items.forEach(i=>{ if(i.sub) SUBOF[i.k]=i.sub; }));
let cur = 'dashboard';
function renderNav(){
  let html = `<div class="brand"><div class="mark">و<span>.</span></div><div><b>وفرا</b><small>لوحة إدارة المنصّة</small></div></div>`;
  NAV.forEach(g=>{
    html += `<div class="nav-group">`;
    if(g.g) html += `<div class="gh">${g.g}</div>`;
    g.items.forEach(i=>{
      if(i.sub) return;                                  // detail screens are reached from their list, not the sidebar
      const on = i.k===cur || i.k===(SUBOF[cur]||'');     // highlight the parent while a detail screen is open
      html += `<a class="nav-item ${on?'active':''}" href="#${i.k}"><span class="ic">${i.i}</span>${i.t}${i.n?`<span class="count">${i.n}</span>`:''}</a>`;
    });
    html += `</div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}
function go(k){ location.hash = k; }
/* topbar bell / chat now resolve to real screens */
document.addEventListener('click', e=>{
  const b = e.target.closest('.topbar .icon-btn');
  if(!b) return;
  const i = [...document.querySelectorAll('.topbar .icon-btn')].indexOf(b);
  go(i===2 ? 'inbox' : i===1 ? 'messages' : 'tickets');
});
function render(){
  const k = (location.hash.replace('#','').split('?')[0]) || 'dashboard';
  cur = S[k] ? k : 'dashboard';
  window.cur = cur;
  document.getElementById('view').innerHTML = S[cur]();
  renderNav();
  if(window.enhance) window.enhance(document.getElementById('view'));
  const idx = (()=>{let n=0;for(const g of NAV){for(const i of g.items){if(i.sub)continue;n++;if(i.k===cur)return n;}}return 0;})();
  const tot = NAV.reduce((a,g)=>a+g.items.filter(i=>!i.sub).length,0);
  document.getElementById('stag').textContent = `${idx} / ${tot} — ${cur}`;
  window.scrollTo(0,0);
  if(window.enhance) window.enhance(document.getElementById('view'));
}
window.addEventListener('hashchange', render);
