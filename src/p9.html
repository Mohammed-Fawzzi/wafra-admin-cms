<style id="wafra-premium-design">
/* Premium visual direction: an executive control room, layered over the existing component system. */
:root{--bg:#F4F6FB;--card:#FFFFFF;--line:#E3E7F0;--line-strong:#CAD3E2;--r:20px;--r-ctl:11px;--sh-s:0 2px 7px rgba(19,42,85,.055);--sh-m:0 12px 28px rgba(19,42,85,.09);--sh-l:0 24px 48px rgba(19,42,85,.13)}
body{background:radial-gradient(circle at 92% -8%,#E5ECFF 0,rgba(229,236,255,0) 28%),radial-gradient(circle at 18% 88%,#FFF1F0 0,rgba(255,241,240,0) 29%),var(--bg);color:#18233A}
.sidebar{width:276px;flex-basis:276px;padding:12px 12px 32px;background:linear-gradient(160deg,#172A58 0%,var(--navy) 57%,#1B3166 100%);box-shadow:8px 0 36px rgba(21,42,89,.13);border:0}
.brand{margin:2px 2px 15px;padding:18px 15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:18px;backdrop-filter:blur(10px)}
.brand .mark{width:42px;height:42px;border-radius:14px;color:var(--navy);font-size:19px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.brand b{font-size:17px}.brand small{font-size:10px;color:#CED8F4;margin-top:0}.nav-group{margin:7px 0 15px}.nav-group>.gh{padding:8px 13px 7px;color:#AFC0E8;font-size:10px;letter-spacing:1px}.nav-item{min-height:42px;border:0;border-radius:11px;padding:9px 13px;color:#D6DFF5;transition:transform .18s,background .18s,color .18s}.nav-item:hover{background:rgba(255,255,255,.11);transform:translateX(-2px)}.nav-item.active{background:linear-gradient(135deg,var(--coral),#D90009);box-shadow:0 8px 18px rgba(250,0,1,.27);border:0}.nav-item .count{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14)}
.topbar{height:76px;padding:0 30px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(202,211,226,.7);box-shadow:0 4px 18px rgba(20,42,83,.035)}.seg{padding:4px;background:#EDF1FA}.seg b{color:var(--navy)}.seg b.on{box-shadow:0 2px 7px rgba(19,42,85,.12)}.search-top{background:#F8FAFE;border-color:transparent;min-height:40px}.icon-btn{border-color:transparent;background:#F4F6FB;width:38px;height:38px}.user-chip{padding:5px 13px 5px 6px;background:#fff;box-shadow:var(--sh-s);border-color:#E9EDF4}.user-chip .av{width:36px;height:36px;background:linear-gradient(135deg,var(--coral),#B8000A)}
.view{padding:30px 34px 76px;max-width:1700px}.phead{position:relative;align-items:center;margin-bottom:25px;padding:3px 0 3px 16px}.phead:before{content:'';position:absolute;inset-inline-start:0;width:5px;height:44px;border-radius:99px;background:linear-gradient(var(--coral),#FF7373)}.phead h1{font-size:26px;letter-spacing:-.35px}.phead p{font-size:13px}.reqs{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 8px;box-shadow:var(--sh-s)}.req{border:0;background:#F0F3FA;border-radius:99px;padding:3px 8px;color:var(--navy)}
.btn{border-radius:11px;padding:12px 17px;box-shadow:0 7px 15px rgba(35,56,109,.15);transition:transform .16s,box-shadow .16s,background .16s}.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(35,56,109,.21)}.btn.coral{box-shadow:0 8px 17px rgba(250,0,1,.2)}.btn.coral:hover{background:#D80000}.btn.ghost{box-shadow:none;background:rgba(255,255,255,.86)}
.card{border-color:rgba(218,225,237,.9);box-shadow:var(--sh-s);border-radius:20px;overflow:hidden;transition:box-shadow .18s,transform .18s}.card:hover{box-shadow:var(--sh-m)}.card-h{padding:19px 22px;background:linear-gradient(100deg,#fff,#FBFCFF);border-bottom-color:#E9EDF4}.card-h h3{font-size:15.5px}.card-b{padding:20px 22px}.card-b.flush{padding:0}
.tabs{padding:14px 22px 0;gap:8px;border-bottom-color:#E9EDF4}.tab{border-radius:10px;padding:9px 14px;margin-bottom:8px;background:#F5F7FB;color:#56627A}.tab.on{background:var(--navy);box-shadow:0 6px 14px rgba(35,56,109,.18);margin-bottom:8px}.filters{padding:15px 22px;background:#FBFCFF;border-bottom-color:#E9EDF4}.fd,.fsearch{border-color:#E1E7F0;background:#fff;border-radius:10px}.fd:hover,.fsearch:focus-within{border-color:#9AAAD0;box-shadow:0 0 0 3px rgba(35,56,109,.08)}
thead th{padding:13px 16px;background:#F5F7FB;color:#66738B;font-size:11px;letter-spacing:.15px}tbody td{padding:15px 16px;border-bottom-color:#EEF1F6}tbody tr{transition:background .14s}tbody tr:hover{background:#F7F9FD}.iact{border-radius:9px;border-color:#E1E7F0;background:#fff}.iact:hover{background:#EAF0FF;color:var(--navy)}.pager{padding:15px 22px;background:#FBFCFF;border-top-color:#E9EDF4}.pg{border-radius:9px}.pg.on{box-shadow:0 5px 12px rgba(35,56,109,.2)}
.kpis{gap:16px;margin-bottom:22px}.kpi{position:relative;overflow:hidden;padding:19px 18px;border-radius:18px;border-color:#E5EAF2;box-shadow:var(--sh-s)}.kpi:after{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--navy),#6D89CA);opacity:.88}.kpi:nth-child(2n):after{background:linear-gradient(90deg,var(--coral),#FF9292)}.kpi .lb .ic{width:28px;height:28px;border-radius:9px;background:#EAF0FF}.kpi .vl{font-size:26px}.kpi:hover{transform:translateY(-2px)}
.badge{padding:5px 10px;border-radius:99px;font-size:11px}.note{border-radius:15px!important;border-width:1px!important;box-shadow:var(--sh-s)}.todo{padding:15px 18px}.todo .ic{border-radius:11px}.spark i{background:#D6E0F5;border-radius:6px 6px 2px 2px}.spark i.hi{background:linear-gradient(var(--coral),var(--navy))}.donut .ctr{box-shadow:inset 0 0 0 1px #E8EDF5}.dl-grid{gap:18px 24px}.tl::before{background:linear-gradient(var(--navy),#DDE4F3)}
@media(max-width:800px){.sidebar{width:246px;flex-basis:246px}.view{padding:22px 16px 56px}.topbar{padding:0 14px}.phead{align-items:flex-start}.phead h1{font-size:22px}.search-top{display:none}.reqs{display:none}}
</style>
<script>
/* A subtle, non-destructive layer: current user data is reflected in the new chrome. */
document.querySelectorAll('.user-chip .nm').forEach(el=>{ if(el.textContent.includes('محمد')) el.setAttribute('title','محمد الصغير — مسؤول أعلى'); });
</script>
