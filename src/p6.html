<style>
.fd{position:relative;user-select:none;cursor:pointer}
.fd.act{border-color:var(--navy);color:var(--navy);background:#fff;font-weight:600}
.fd .clr{margin-inline-start:2px;color:var(--muted);font-size:11px}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:70;background:#fff;
  border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-l);min-width:210px;max-width:320px;
  max-height:290px;overflow-y:auto;padding:6px;display:none}
.menu.open{display:block}
.menu .op{padding:8px 11px;border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-2);white-space:normal;line-height:1.5}
.menu .op:hover{background:var(--bg)}
.menu .op.on{background:var(--navy);color:#fff;font-weight:600}
.menu .hd{padding:6px 11px 4px;font-size:10.5px;color:var(--muted);font-family:'Expo Arabic','Cairo';font-weight:700}
.tab,.pg,.rows-sel,.iact,.chk,.tg,.conv{cursor:pointer}
.pg.dis{opacity:.35;cursor:default}
.tw tbody tr.hide,.tw tbody tr.pghide{display:none}
.no-res td{padding:38px 14px;text-align:center;color:var(--muted);font-size:13px}
.no-res b{display:block;font-family:'Expo Arabic','Cairo';color:var(--ink);margin-bottom:5px}
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:var(--ink);color:#fff;font-size:12.5px;
  padding:12px 18px;border-radius:var(--r-m);box-shadow:var(--sh-l);z-index:120;opacity:0;transform:translateY(10px);
  transition:.22s;font-family:'Expo Arabic','Cairo'}
.toast.on{opacity:1;transform:none}
.prev-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.prev-row:last-child{border-bottom:0}
.prev-row .k{color:var(--muted);min-width:150px;font-size:12px}
.prev-row .v{color:var(--ink);font-weight:500;flex:1}
</style>
<script id="enhance">
(function(){
/* ---------- utils ---------- */
const norm = t => (t||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[«»"'.,:،]/g,'').trim();
const base = t => norm(t).replace(/^ال/,'');
const stem = t => base(t).replace(/(ات|ون|ين|ة)$/,'');
const cellText = td => {
  const c = td.cloneNode(true);
  c.querySelectorAll('.sub').forEach(e=>e.remove());
  return norm(c.textContent).replace(/\s+/g,' ').trim();
};
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on'); setTimeout(()=>t.remove(),300);},2300);
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
document.addEventListener('click',e=>{
  if(!e.target.closest('.fd')) document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});

/* ---------- modal host (the static build has no app shell) ---------- */
if(typeof window.openM !== 'function'){
  const mount = ()=>{
    if(document.getElementById('mw')) return;
    const w = document.createElement('div');
    w.className='modal-wrap'; w.id='mw'; w.innerHTML='<div id="mc"></div>';
    w.addEventListener('click', e=>{ if(e.target===w) window.closeM(); });
    document.body.appendChild(w);
  };
  window.openM = h=>{ mount(); document.getElementById('mc').innerHTML=h;
    document.getElementById('mw').classList.add('open'); };
  window.closeM = ()=>{ document.getElementById('mw')?.classList.remove('open'); };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') window.closeM(); });
}

/* ---------- generic confirm / form modals ---------- */
function sheet(title, bodyHtml, footerHtml, sm){
  return `<div class="modal ${sm?'sm':''}"><div class="modal-h"><h3>${title}</h3>
    <span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${bodyHtml}</div>
    ${footerHtml?`<div class="modal-f">${footerHtml}</div>`:''}</div>`;
}
const doneBtn = (label,msg) => `<button class="btn" onclick="closeM();__toast('${msg}')">${label}</button>
  <button class="btn ghost" onclick="closeM()">إلغاء</button>`;
const dangerBtn = (label,msg) => `<button class="btn danger" onclick="closeM();__toast('${msg}')">${label}</button>
  <button class="btn ghost" onclick="closeM()">إلغاء</button>`;
window.__toast = toast;

/* ---------- table engine ---------- */
function setupTable(table){
  if(table.__wired) return; table.__wired = true;
  const card = table.closest('.card') || table.parentElement;
  const heads = [...table.querySelectorAll('thead th')].map(th=>norm(th.textContent));
  const body  = table.querySelector('tbody'); if(!body) return;
  const all   = [...body.querySelectorAll('tr')];
  const grouped = all.some(r=>r.classList.contains('grp'));
  const dataRows = all.filter(r=>!r.classList.contains('grp'));
  const actIdx = heads.findIndex(h=>h.includes('الإجراءات'));

  // group name for each data row
  let gname = '';
  const rowGroup = new Map();
  all.forEach(r=>{
    if(r.classList.contains('grp')){ gname = norm(r.querySelector('.gn b')?.textContent||''); }
    else rowGroup.set(r, gname);
  });

  const state = { f:{}, q:'', tab:null, page:1, per:5 };

  /* ---- column resolution for a filter label ---- */
  const SYN = {
    'تاريخ':['توقيت','فترة','تاريخ','منذ','صلاحية','عمر','مدة'],
    'فترة':['فترة','تاريخ','توقيت','مدة'],
    'مدينة':['مدينة','منطقة','نطاق','موقع'],
    'اولوية':['اولوية','خطورة','اهمية'],
    'نوع':['نوع','تصنيف','فئة']
  };
  function colFor(label){
    const L = base(label);
    let i = heads.findIndex(h=>base(h)===L);
    if(i>=0) return i;
    i = heads.findIndex(h=>base(h).includes(L)||L.includes(base(h)));
    if(i>=0) return i;
    const toks = L.split(/\s+/).filter(t=>t.length>2);
    i = heads.findIndex(h=>toks.some(t=>base(h).includes(t)));
    if(i>=0) return i;
    for(const [key,alts] of Object.entries(SYN)){
      if(!L.includes(key)) continue;
      i = heads.findIndex(h=>alts.some(a=>base(h).includes(a)));
      if(i>=0) return i;
    }
    return -1;
  }
  function optionsFor(label){
    const L = base(label);
    if(grouped && (L.includes('مزود')||L.includes('شركة')))
      return [...new Set(all.filter(r=>r.classList.contains('grp'))
        .map(r=>norm(r.querySelector('.gn b')?.textContent||'')))];
    const i = colFor(label);
    let vals;
    if(i>=0 && i!==actIdx){
      vals = dataRows.map(r=>cellText(r.cells[i])).filter(Boolean);
    } else {
      vals = dataRows.flatMap(r=>[...r.querySelectorAll('.badge')].map(b=>norm(b.textContent)));
    }
    vals = [...new Set(vals)].filter(v=>v && v.length<46);
    if(!vals.length){ // last resort: the most distinctive non-action column
      const j = heads.findIndex((h,n)=>n!==actIdx && n!==0);
      if(j>=0) vals = [...new Set(dataRows.map(r=>cellText(r.cells[j])).filter(Boolean))];
    }
    return vals.slice(0,40);
  }

  /* ---- filtering ---- */
  function rowMatches(r){
    const txt = norm(r.textContent);
    if(state.q && !txt.includes(state.q)) return false;
    if(state.tab && !txt.includes(stem(state.tab))) return false;
    for(const [label,val] of Object.entries(state.f)){
      if(!val) continue;
      const L = base(label);
      if(grouped && (L.includes('مزود')||L.includes('شركة'))){
        if(rowGroup.get(r) !== val) return false;
        continue;
      }
      const i = colFor(label);
      if(i>=0 && i!==actIdx){ if(cellText(r.cells[i]) !== val) return false; }
      else if(!txt.includes(val)) return false;
    }
    return true;
  }

  function apply(){
    const pass = dataRows.filter(rowMatches);
    const total = pass.length;
    const pages = Math.max(1, Math.ceil(total/state.per));
    if(state.page>pages) state.page = pages;
    const from = (state.page-1)*state.per, to = from + state.per;
    dataRows.forEach(r=>{ r.classList.add('hide'); r.classList.remove('pghide'); });
    pass.forEach((r,n)=>{ r.classList.remove('hide'); if(n<from||n>=to) r.classList.add('pghide'); });
    // group headers follow their children
    if(grouped){
      let head=null, any=false;
      const flush=()=>{ if(head) head.classList.toggle('hide', !any); };
      all.forEach(r=>{
        if(r.classList.contains('grp')){ flush(); head=r; any=false; }
        else if(!r.classList.contains('hide') && !r.classList.contains('pghide')) any=true;
      });
      flush();
    }
    // empty state
    let empty = body.querySelector('tr.no-res');
    if(total===0){
      if(!empty){
        empty=document.createElement('tr'); empty.className='no-res';
        empty.innerHTML=`<td colspan="${heads.length}"><b>لا توجد نتائج مطابقة</b>
          جرّب تعديل الفلاتر أو مسحها</td>`;
        body.appendChild(empty);
      }
    } else if(empty) empty.remove();
    renderPager(total, pages);
  }

  /* ---- pager ---- */
  const pager = card.querySelector('.pager');
  function renderPager(total, pages){
    if(!pager) return;
    const tot = pager.querySelector('.tot');
    if(tot) tot.textContent = `إجمالي النتائج: ${total.toLocaleString('en-US')}`;
    const box = pager.querySelector('.pages'); if(!box) return;
    let h = `<span class="pg nav ${state.page===1?'dis':''}" data-go="prev">‹</span>`;
    const list=[];
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||Math.abs(i-state.page)<=1) list.push(i);
      else if(list[list.length-1]!=='…') list.push('…');
    }
    list.forEach(i=> h += i==='…' ? `<span class="pg dis">…</span>`
      : `<span class="pg ${i===state.page?'on':''}" data-go="${i}">${i}</span>`);
    h += `<span class="pg nav ${state.page===pages?'dis':''}" data-go="next">›</span>`;
    box.innerHTML = h;
    box.querySelectorAll('[data-go]').forEach(p=>p.onclick=()=>{
      const v=p.dataset.go;
      if(v==='prev') state.page=Math.max(1,state.page-1);
      else if(v==='next') state.page=Math.min(pages,state.page+1);
      else state.page=+v;
      apply(); table.scrollIntoView({block:'nearest'});
    });
  }
  const rowsSel = card.querySelector('.rows-sel');
  if(rowsSel) rowsSel.onclick = e=>{
    e.stopPropagation();
    openMenu(rowsSel, ['5','10','25','50'], String(state.per), v=>{
      state.per=+v; state.page=1; rowsSel.firstChild.textContent = v+' ';
      apply();
    });
  };

  /* ---- filters ---- */
  card.querySelectorAll('.filters .fd').forEach(fd=>{
    const label = norm(fd.childNodes[0].textContent);
    fd.dataset.label = label;
    fd.onclick = e=>{
      e.stopPropagation();
      const opts = optionsFor(label);
      openMenu(fd, opts, state.f[label]||'', v=>{
        if(v===null){ delete state.f[label]; fd.classList.remove('act'); fd.childNodes[0].textContent = label; }
        else { state.f[label]=v; fd.classList.add('act'); fd.childNodes[0].textContent = v+' '; }
        state.page=1; apply();
      }, label);
    };
  });

  /* ---- search ---- */
  const search = card.querySelector('.fsearch input');
  if(search){
    search.addEventListener('input',()=>{ state.q = norm(search.value); state.page=1; apply(); });
  }

  /* ---- tabs ---- */
  const tabs = [...card.querySelectorAll('.tabs .tab')];
  tabs.forEach(t=>{
    t.onclick = ()=>{
      tabs.forEach(x=>x.classList.remove('on')); t.classList.add('on');
      const lbl = norm(t.childNodes[0].textContent);
      state.tab = (lbl==='الكل') ? null : lbl;
      state.page=1; apply();
    };
  });

  /* ---- row actions ---- */
  const detailOf = {vendors:'vendorFile', kyc:'kycReview', users:'customer', bookings:'booking',
    disputes:'dispute', tickets:'ticket', settlements:'settlement', branches:'vendorFile', fleet:'models'};
  dataRows.forEach(r=>{
    const cells = [...r.cells].map(td=>({h:heads[td.cellIndex]||'', v:cellText(td)}))
      .filter(x=>x.h && !x.h.includes('الإجراءات'));
    const title = cells[0]?.v || 'السجل';
    const previewHtml = cells.map(c=>`<div class="prev-row"><span class="k">${esc(c.h)}</span>
      <span class="v">${esc(c.v)||'—'}</span></div>`).join('');
    const editHtml = cells.map(c=>`<div class="fld"><label class="fl">${esc(c.h)}</label>
      <div class="inp">${esc(c.v)||'—'}</div></div>`).join('');

    r.querySelectorAll('.iact').forEach(a=>{
      const g = a.textContent.trim();
      a.onclick = ev=>{
        ev.stopPropagation();
        const cur = (location.hash||'#dashboard').slice(1);
        const go2 = detailOf[cur];
        if(g==='👁'){
          openM(sheet(`معاينة — ${esc(title)}`, previewHtml,
            (go2?`<button class="btn" onclick="closeM();location.hash='${go2}'">فتح الشاشة الكاملة</button>`:'')+
            `<button class="btn ghost" onclick="closeM()">إغلاق</button>`));
        } else if(g==='✎'){
          openM(sheet(`تعديل — ${esc(title)}`, editHtml, doneBtn('حفظ التعديلات','حُفظت التعديلات')));
        } else if(g==='⏸'){
          openM(sheet(`إيقاف — ${esc(title)}`,
            `<div class="note warn"><span>⚠</span><div><b>الإيقاف يخفي هذا السجل عن العملاء فوراً</b>
              الحجوزات القائمة لا تتأثّر وتستمر حتى نهايتها.</div></div>
             <div class="fld"><label class="fl">سبب الإيقاف</label>
               <div class="inp" style="display:flex"><span>اختر سبباً</span>
               <span style="margin-inline-start:auto;color:var(--muted)">▾</span></div></div>
             <div class="fld"><label class="fl">تفاصيل (إلزامية)</label>
               <div class="inp" style="min-height:70px;color:var(--muted-2)">لا تقلّ عن 30 حرفاً — تصل للمزوّد وتُسجَّل في سجل التدقيق</div></div>`,
            dangerBtn('تأكيد الإيقاف','تم الإيقاف وسُجّل في سجل التدقيق')));
        } else if(g==='▶'){
          openM(sheet('إعادة التفعيل',
            `<p style="margin:0 0 12px;font-size:13px">إعادة تفعيل <b>${esc(title)}</b> وإظهاره للعملاء من جديد.</p>
             <div class="fld"><label class="fl">ملاحظة (اختيارية)</label><div class="inp">—</div></div>`,
            doneBtn('تفعيل','أُعيد التفعيل'), true));
        } else if(g==='🗑'){
          openM(sheet('تأكيد الحذف',
            `<p style="margin:0;font-size:13px;line-height:1.8">سيُحذف <b>${esc(title)}</b> نهائياً.
             لا يمكن التراجع عن هذا الإجراء.</p>`,
            dangerBtn('حذف','تم الحذف'), true));
        } else if(g==='⤫'){
          openM(sheet(`إخفاء — ${esc(title)}`,
            `<div class="note warn"><span>⚠</span><div><b>السيارة معروضة للعملاء الآن</b>
              الإخفاء إجراء لاحق يتطلّب سبباً ويُشعَر به المزوّد.</div></div>
             <div class="fld"><label class="fl">سبب الإخفاء</label>
               <div class="inp" style="display:flex"><span>صور دون المعيار</span>
               <span style="margin-inline-start:auto;color:var(--muted)">▾</span></div></div>
             <div class="fld"><label class="fl">مهلة التصحيح</label><div class="inp">5 أيام عمل</div></div>`,
            dangerBtn('إخفاء السيارة','أُخفيت السيارة وأُشعِر المزوّد')));
        } else if(g==='⚑'){
          openM(sheet('ملاحظة إدارية على السجل',
            `<div class="fld"><label class="fl">الملاحظة</label>
              <div class="inp" style="min-height:80px;color:var(--muted-2)">تظهر لفريق الإدارة فقط</div></div>`,
            doneBtn('حفظ الملاحظة','أُضيفت الملاحظة'), true));
        } else if(g==='✉'){
          openM(sheet('إعادة الإرسال',
            `<p style="margin:0;font-size:13px">إعادة إرسال <b>${esc(title)}</b> إلى بريد المستلم المسجّل.</p>`,
            doneBtn('إرسال','أُعيد الإرسال'), true));
        } else if(g==='⤓'){ toast('جارٍ تحضير الملف…'); }
        else if(g==='🕘'){ location.hash='audit'; }
        else if(g==='📊'){ location.hash='reports'; }
        else if(g==='✓'){
          openM(sheet(`اعتماد — ${esc(title)}`, previewHtml, doneBtn('اعتماد','تم الاعتماد')));
        } else if(g==='⚠'){ location.hash='fleetReview'; }
        else { openM(sheet(esc(title), previewHtml, `<button class="btn ghost" onclick="closeM()">إغلاق</button>`)); }
      };
    });
  });

  apply();
}

/* ---------- dropdown menu ---------- */
function openMenu(anchor, options, current, onPick, headLabel){
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  let m = anchor.querySelector(':scope > .menu');
  if(m) m.remove();
  m = document.createElement('div'); m.className='menu';
  let h = headLabel ? `<div class="hd">${headLabel}</div>` : '';
  h += `<div class="op ${!current?'on':''}" data-v="">الكل</div>`;
  options.forEach(o=> h += `<div class="op ${o===current?'on':''}" data-v="${o.replace(/"/g,'&quot;')}">${o}</div>`);
  m.innerHTML = h;
  anchor.appendChild(m);
  requestAnimationFrame(()=>m.classList.add('open'));
  m.querySelectorAll('.op').forEach(op=>op.onclick=e=>{
    e.stopPropagation();
    m.classList.remove('open');
    onPick(op.dataset.v === '' ? null : op.dataset.v);
  });
}

/* ---------- list cards (notifications, conversations) ---------- */
const TAB_PRED = {};
TAB_PRED[base('غير مقروءة')] = el => el.classList.contains('unread') || !!el.querySelector('.nb');
TAB_PRED[base('المزوّدون')]  = el => !!el.querySelector('.av.v');
TAB_PRED[base('العملاء')]    = el => !!el.querySelector('.av.c');
function setupList(card){
  if(card.__list) return; card.__list = true;
  const items = [...card.querySelectorAll('.n-item, .conv')];
  if(!items.length) return;
  const state = { f:{}, q:'', tab:null };
  const apply = ()=>{
    let shown = 0;
    items.forEach(el=>{
      const txt = norm(el.textContent);
      let ok = true;
      if(state.q && !txt.includes(state.q)) ok = false;
      if(ok && state.tab){
        const pred = TAB_PRED[base(state.tab)];
        ok = pred ? pred(el) : txt.includes(stem(state.tab));
      }
      if(ok) for(const v of Object.values(state.f)){ if(v && !txt.includes(v)){ ok=false; break; } }
      el.style.display = ok ? '' : 'none';
      if(ok) shown++;
    });
    let e = card.querySelector('.list-empty');
    if(!shown){
      if(!e){ e=document.createElement('div'); e.className='list-empty empty';
        e.innerHTML='<b>لا توجد نتائج مطابقة</b><p>جرّب تعديل الفلاتر أو مسحها</p>';
        items[0].parentElement.appendChild(e); }
    } else if(e) e.remove();
    const tot = card.querySelector('.pager .tot');
    if(tot) tot.textContent = `إجمالي النتائج: ${shown}`;
  };
  const opts = label => {
    const explicit = card.querySelector(`.fd[data-opts]`);
    const own = [...card.querySelectorAll('.filters .fd')].find(f=>norm(f.childNodes[0].textContent)===label);
    if(own && own.dataset.opts) return own.dataset.opts.split('|');
    return [...new Set(items.flatMap(el=>[...el.querySelectorAll('.badge')].map(b=>norm(b.textContent))))];
  };
  card.querySelectorAll('.filters .fd').forEach(fd=>{
    const label = norm(fd.childNodes[0].textContent);
    fd.onclick = e=>{ e.stopPropagation();
      openMenu(fd, opts(label), state.f[label]||'', v=>{
        if(v===null){ delete state.f[label]; fd.classList.remove('act'); fd.childNodes[0].textContent=label; }
        else { state.f[label]=v; fd.classList.add('act'); fd.childNodes[0].textContent=v+' '; }
        apply();
      }, label); };
  });
  const s2 = card.querySelector('.fsearch input');
  if(s2) s2.addEventListener('input',()=>{ state.q = norm(s2.value); apply(); });
  const tabs = [...card.querySelectorAll('.tabs .tab')];
  tabs.forEach(t=>t.onclick=()=>{
    tabs.forEach(x=>x.classList.remove('on')); t.classList.add('on');
    const lbl = norm(t.childNodes[0].textContent);
    state.tab = lbl==='الكل' ? null : lbl; apply();
  });
  // mark a notification read on click
  items.forEach(el=>el.addEventListener('click',ev=>{
    if(ev.target.closest('.btn')) return;
    el.classList.remove('unread'); el.querySelector('.nb')?.remove();
  }));
  apply();
}

/* ---------- non-table controls ---------- */
function setupControls(root){
  root.querySelectorAll('.tg').forEach(t=>{ if(t.__w) return; t.__w=1;
    t.onclick=()=>t.classList.toggle('on'); });
  root.querySelectorAll('.chk').forEach(c=>{ if(c.__w) return; c.__w=1;
    c.onclick=()=>{ if(c.classList.contains('no')) return;
      c.classList.toggle('on'); c.textContent = c.classList.contains('on')?'✓':''; }; });
  root.querySelectorAll('.conv').forEach(c=>{ if(c.__w) return; c.__w=1;
    c.onclick=()=>{ root.querySelectorAll('.conv').forEach(x=>x.classList.remove('on')); c.classList.add('on'); }; });
  root.querySelectorAll('.thumb').forEach(t=>{ if(t.__w) return; t.__w=1;
    t.onclick=()=>{ const p=t.parentElement;
      p.querySelectorAll('.thumb').forEach(x=>x.classList.remove('on')); t.classList.add('on'); }; });
  // standalone filter chips outside a table card (page headers, report filters)
  root.querySelectorAll('.phead .fd, .card-b .fd').forEach(fd=>{
    if(fd.__w || fd.closest('.filters')) return; fd.__w=1;
    const label = norm(fd.childNodes[0].textContent);
    fd.onclick = e=>{ e.stopPropagation();
      openMenu(fd, ['آخر 7 أيام','آخر 30 يوماً','آخر 90 يوماً','هذا العام'], '', v=>{
        fd.childNodes[0].textContent = (v||label)+' ';
        fd.classList.toggle('act', !!v);
      }, label); };
  });
  // export buttons
  root.querySelectorAll('.btn').forEach(b=>{ if(b.__w) return; b.__w=1;
    const t=b.textContent;
    if(/تصدير|تنزيل|تحميل/.test(t) && !b.getAttribute('onclick')) b.onclick=()=>toast('جارٍ تحضير الملف…');
  });
}

window.enhance = function(root){
  root = root || document;
  root.querySelectorAll('table').forEach(setupTable);
  root.querySelectorAll('.card').forEach(c=>{ if(!c.querySelector('table')) setupList(c); });
  setupControls(root);
};

/* self-init for the static build (no router present) */
if(typeof window.S === 'undefined'){
  if(document.readyState!=='loading') window.enhance(document);
  else document.addEventListener('DOMContentLoaded',()=>window.enhance(document));
}
})();
</script>
