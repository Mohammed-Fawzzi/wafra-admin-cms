<style id="wafra-rbac-cms">
/* إدارة الصلاحيات وCMS */
.cms-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.cms-tab{border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:9px 13px;font:700 12px Cairo;cursor:pointer;color:var(--ink-2)}.cms-tab.on{background:var(--navy);border-color:var(--navy);color:#fff}.cms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.cms-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-s)}.cms-visual{min-height:116px;padding:18px;display:flex;align-items:end;color:#fff;background:linear-gradient(135deg,#233A72,#647FB7);position:relative}.cms-visual:after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);inset-inline-start:-38px;top:-54px}.cms-visual.warm{background:linear-gradient(135deg,#C93E33,#F39478)}.cms-visual.gold{background:linear-gradient(135deg,#8A651A,#E4B84B)}.cms-visual b{font-size:17px;position:relative;z-index:1}.cms-body{padding:15px}.cms-body h3{font-size:14px;margin:0 0 3px}.cms-meta{font-size:11.5px;color:var(--muted);margin:6px 0 12px}.cms-actions{display:flex;gap:7px;flex-wrap:wrap}.cms-actions button{border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:6px 9px;font:700 11px Cairo;cursor:pointer}.cms-actions .primary{background:var(--navy);color:#fff;border-color:var(--navy)}.role-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.role-card h3{font-size:14px;margin:0 0 4px}.role-card p{font-size:11.5px;color:var(--muted);margin:0 0 10px}.perm-chips{display:flex;gap:5px;flex-wrap:wrap}.perm-chip{font-size:10.5px;border-radius:99px;padding:3px 8px;background:#EEF2FB;color:var(--navy);font-weight:700}.cms-field{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px;font:13px Cairo;background:#fff;margin-top:5px}.cms-field:focus{outline:2px solid rgba(35,56,109,.15);border-color:var(--navy)}textarea.cms-field{min-height:108px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-label{display:block;font:700 12px Cairo;color:var(--ink);margin-top:8px}.audit-mini{font-size:11px;color:var(--muted);padding:10px 12px;border-right:3px solid var(--coral);background:#FFF8F7;border-radius:7px;margin-top:10px}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.cms-grid{grid-template-columns:1fr}}
</style>
<script>
/* هذه طبقة عرض تجريبية: تحفظ التعديلات محلياً في المتصفح فقط. في الإنتاج يجب
   أن تُفرض الأذونات ونشر المحتوى وسجل التدقيق من الخادم. */
(function(){
  const KEY='wafra-cms-rbac-v2';
  const defaults={
    admins:[
      {name:'محمد الصغير',email:'mohammed@wafra.sa',role:'مدير النظام (Super Admin)',scope:'كل البيانات',last:'اليوم 08:12',sessions:1,twofa:true,active:true},
      {name:'سعد الشمري',email:'saad@wafra.sa',role:'المدير المالي',scope:'كل المنصة',last:'أمس 17:40',sessions:2,twofa:true,active:true},
      {name:'ليلى الدوسري',email:'laila@wafra.sa',role:'مدير العمليات',scope:'كل المنصة',last:'اليوم 09:02',sessions:1,twofa:true,active:true},
      {name:'ريم العتيبي',email:'reem@wafra.sa',role:'مدير إقليمي — الرياض',scope:'نطاق: الرياض',last:'اليوم 08:35',sessions:1,twofa:true,active:true},
      {name:'ماجد القحطاني',email:'majed@wafra.sa',role:'مدير المحتوى والتسويق',scope:'كل البيانات',last:'أمس 13:10',sessions:1,twofa:true,active:true},
      {name:'محمد العنزي',email:'mohammed.support@wafra.sa',role:'مسؤول دعم',scope:'كل المنصة',last:'اليوم 07:55',sessions:1,twofa:true,active:true}
    ],
    banners:[
      {id:1,title:'عروض نهاية الصيف',slot:'الرئيسية — أعلى',audience:'كل العملاء',status:'منشور',from:'2026-08-20',to:'2026-09-30',priority:1,style:'warm',clicks:'8,940',impressions:'184,200'},
      {id:2,title:'استأجر سيارتك الآن',slot:'الرئيسية — وسط',audience:'زوّار غير مسجّلين',status:'منشور',from:'2026-08-01',to:'2026-12-31',priority:2,style:'',clicks:'3,120',impressions:'96,400'},
      {id:3,title:'التوصيل مجاناً في الرياض',slot:'صفحة البحث',audience:'عملاء الرياض',status:'مسودة',from:'2026-09-18',to:'2026-09-25',priority:1,style:'gold',clicks:'—',impressions:'—'}
    ],
    pages:[
      {id:1,title:'الشروط والأحكام',type:'صفحة قانونية',lang:'العربية والإنجليزية',status:'منشور',updated:'12 أغسطس 2026',body:'نسخة الشروط النافذة 3.2. تُعرض الموافقة قبل أي عملية حرجة.'},
      {id:2,title:'سياسة الخصوصية',type:'صفحة قانونية',lang:'العربية والإنجليزية',status:'منشور',updated:'03 مايو 2026',body:'توضح آلية جمع البيانات واستخدامها وحقوق المستخدم.'},
      {id:3,title:'رسالة الترحيب',type:'نص واجهة',lang:'العربية',status:'مسودة',updated:'18 سبتمبر 2026',body:'أهلاً بك في وفرا، احجز سيارتك بسهولة وثقة.'}
    ],
    slots:[
      {title:'بانر الرئيسية العلوي',channel:'تطبيق العميل + الويب',state:'مشغول',content:'عروض نهاية الصيف'},
      {title:'خانة الترويج في البحث',channel:'نتائج البحث',state:'مشغول',content:'التوصيل مجاناً في الرياض'},
      {title:'بطاقة قبل الدفع',channel:'رحلة الحجز',state:'متاح',content:'لا يوجد محتوى منشور'}
    ],audit:[]
  };
  function state(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return JSON.parse(JSON.stringify(defaults))}}
  function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
  function log(action,detail){const s=state();s.audit.unshift({action,detail,time:new Date().toLocaleString('ar-SA')});save(s)}
  const roles=[
    {name:'مدير النظام (Super Admin)',scope:'كل البيانات',desc:'وصول كامل لكل البيانات والوحدات وصلاحيات التعديل والاعتماد.',perms:['عرض المالية','تصدير','إدارة المستخدمين','تعديل عام','إدارة المزوّدين','إدارة المستأجرين','إدارة الإعلانات','اعتماد المحتوى','خانات الظهور']},
    {name:'المدير المالي',scope:'كل البيانات',desc:'تحليلات وتقارير مالية شاملة، دون إدارة أو تعديل.',perms:['عرض المالية','تصدير']},
    {name:'مدير العمليات',scope:'كل البيانات',desc:'التشغيل والأسطول، مع تعديل بيانات المزوّدين والمستأجرين والمالية مخفية.',perms:['تصدير','تعديل عام','إدارة المزوّدين','إدارة المستأجرين']},
    {name:'مدير إقليمي — الرياض',scope:'نطاق: الرياض',desc:'مقيّد ببيانات الرياض ويعدّل ملفات المستأجرين وحجوزاتهم فقط.',perms:['عرض المالية','تصدير','تعديل عام','إدارة المستأجرين']},
    {name:'مدير شركة (مزوّد)',scope:'نطاق: الشركة',desc:'يدير شركته ومكاتبه وإعلاناته فقط؛ التعديل خاضع للاعتماد.',perms:['عرض المالية','تصدير','تعديل عام','إدارة المزوّدين','إدارة الإعلانات']},
    {name:'مدير المحتوى والتسويق',scope:'كل البيانات',desc:'يعتمد الإعلانات والبنرات ويدير خانات الظهور والحملات.',perms:['تصدير','تعديل عام','إدارة الإعلانات','اعتماد المحتوى','خانات الظهور']},
    {name:'مسؤول الدعم',scope:'كل البيانات',desc:'الدعم وتعديل ملفات المستأجرين لحل المشكلات دون وصول مالي.',perms:['إدارة المستأجرين']}
  ];
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function button(label,fn,kind=''){return `<button class="${kind}" onclick="${fn}">${label}</button>`}
  function bannerCard(b){return `<article class="cms-card"><div class="cms-visual ${b.style||''}"><b>${esc(b.title)}</b></div><div class="cms-body"><h3>${esc(b.slot)}</h3><div class="cms-meta">${esc(b.audience)} · الأولوية ${b.priority}<br>${b.from} — ${b.to}<br>ظهور ${b.impressions} · نقرات ${b.clicks}</div><div class="cms-actions">${button('تعديل',`WafraCMS.editBanner(${b.id})`,'primary')}${button(b.status==='منشور'?'إيقاف':'نشر',`WafraCMS.toggleBanner(${b.id})`)}${button('معاينة','WafraCMS.previewBanner('+b.id+')')}</div></div></article>`}
  function pageCard(p){return `<article class="cms-card"><div class="cms-body"><span class="perm-chip">${esc(p.type)}</span><h3 style="margin-top:10px">${esc(p.title)}</h3><div class="cms-meta">${esc(p.lang)} · ${esc(p.status)}<br>آخر تحديث: ${esc(p.updated)}</div><div class="cms-actions">${button('تحرير',`WafraCMS.editPage(${p.id})`,'primary')}${button('معاينة',`WafraCMS.previewPage(${p.id})`)}</div></div></article>`}
  window.WafraCMS={
    render(tab='overview'){
      const s=state(); const head=phead('مركز إدارة المحتوى (CMS)','إدارة خانات الواجهة، البانرات، والصفحات بالعربية والإنجليزية',['FR-ADX-03','FR-BAN-01','FR-BAN-02','FR-BAN-03'],`<button class="btn" onclick="WafraCMS.newBanner()">＋ بانر جديد</button>`);
      const nav=`<div class="cms-tabs">${[['overview','نظرة عامة'],['banners','البانرات'],['pages','الصفحات والنصوص'],['slots','خانات الظهور'],['audit','سجل النشر']].map(x=>`<button class="cms-tab ${tab===x[0]?'on':''}" onclick="WafraCMS.route('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
      let body='';
      if(tab==='overview') body=note('info','يُحفظ هذا النموذج داخل المتصفح','الربط الفعلي يتطلب API خادمي للتحقق من الأذونات، رفع الوسائط، ونشر المحتوى.')+`<div class="cms-grid">${s.slots.map((x,i)=>`<div class="role-card"><span class="perm-chip">${x.state}</span><h3>${x.title}</h3><p>${x.channel}</p><b>${x.content}</b><div class="cms-actions" style="margin-top:12px">${button('فتح المحتوى',`WafraCMS.route('${i===2?'pages':'banners'}')`,'primary')}</div></div>`).join('')}</div>`;
      if(tab==='banners') body=`<div class="cms-grid">${s.banners.map(bannerCard).join('')}</div>`;
      if(tab==='pages') body=`<div class="cms-grid">${s.pages.map(pageCard).join('')}</div>`;
      if(tab==='slots') body=card(cardH('خانات المحتوى المنشور','تحديد الموضع والجمهور والأولوية قبل النشر')+table(['الخانة','القناة','الحالة','المحتوى الحالي','الإجراء'],s.slots.map((x,i)=>[x.title,x.channel,bdg(x.state,x.state==='متاح'?'n':'g'),x.content,`<button class="iact" onclick="WafraCMS.route('${i===2?'pages':'banners'}')">فتح</button>`])));
      if(tab==='audit') body=card(cardH('سجل تغييرات المحتوى','للمراجعة في النموذج؛ في الإنتاج يكون سجلاً خادمياً غير قابل للتعديل')+table(['الوقت','الإجراء','التفاصيل'],(s.audit.length?s.audit:[{time:'—',action:'لا تغييرات محلية بعد',detail:'ابدأ بتعديل بانر أو صفحة'}]).map(x=>[x.time,x.action,x.detail])));
      return head+nav+body;
    },
    route(tab){location.hash='cms'; window.__cmsTab=tab; render()},
    newBanner(){this.bannerModal()},
    editBanner(id){this.bannerModal(state().banners.find(x=>x.id===id))},
    bannerModal(b){b=b||{id:0,title:'',slot:'الرئيسية — أعلى',audience:'كل العملاء',status:'مسودة',from:'',to:'',priority:1,style:''}; openM(modal(b.id?'تعديل بانر':'بانر جديد',`<input type="hidden" id="cms-id" value="${b.id}"><label class="field-label">عنوان البانر</label><input class="cms-field" id="cms-title" value="${esc(b.title)}" placeholder="مثال: عروض الشتاء"><div class="form-grid"><div><label class="field-label">خانة الظهور</label><select class="cms-field" id="cms-slot"><option ${b.slot.includes('أعلى')?'selected':''}>الرئيسية — أعلى</option><option ${b.slot.includes('وسط')?'selected':''}>الرئيسية — وسط</option><option ${b.slot.includes('البحث')?'selected':''}>صفحة البحث</option></select></div><div><label class="field-label">الجمهور</label><input class="cms-field" id="cms-audience" value="${esc(b.audience)}"></div><div><label class="field-label">بداية العرض</label><input class="cms-field" id="cms-from" type="date" value="${b.from}"></div><div><label class="field-label">نهاية العرض</label><input class="cms-field" id="cms-to" type="date" value="${b.to}"></div></div><label class="field-label">الأولوية</label><input class="cms-field" id="cms-priority" type="number" min="1" value="${b.priority}"><div class="audit-mini">قبل النشر الفعلي: تحقّق من الصورة والرابط وتعارض المواعيد على الخادم.</div>`,`<button class="btn" onclick="WafraCMS.saveBanner()">حفظ كمسودة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    saveBanner(){const s=state(),id=+document.getElementById('cms-id').value;const b={id:id||Date.now(),title:document.getElementById('cms-title').value.trim()||'بانر بلا عنوان',slot:document.getElementById('cms-slot').value,audience:document.getElementById('cms-audience').value.trim()||'كل العملاء',status:'مسودة',from:document.getElementById('cms-from').value,to:document.getElementById('cms-to').value,priority:+document.getElementById('cms-priority').value||1,style:'',clicks:'—',impressions:'—'};if(id){const i=s.banners.findIndex(x=>x.id===id);s.banners[i]={...s.banners[i],...b}}else s.banners.unshift(b);save(s);log(id?'تعديل بانر':'إنشاء بانر',b.title);closeM();this.route('banners')},
    toggleBanner(id){const s=state(),b=s.banners.find(x=>x.id===id);b.status=b.status==='منشور'?'موقوف':'منشور';save(s);log(b.status==='منشور'?'نشر بانر':'إيقاف بانر',b.title);this.route('banners')},
    previewBanner(id){const b=state().banners.find(x=>x.id===id);openM(modal('معاينة البانر',`<div class="cms-visual ${b.style||''}" style="min-height:240px;border-radius:12px"><b>${esc(b.title)}</b></div><p class="cms-meta">${esc(b.slot)} · ${esc(b.audience)}</p>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`))},
    editPage(id){const p=state().pages.find(x=>x.id===id);openM(modal('تحرير: '+esc(p.title),`<input type="hidden" id="page-id" value="${p.id}"><label class="field-label">العنوان</label><input class="cms-field" id="page-title" value="${esc(p.title)}"><label class="field-label">المحتوى</label><textarea class="cms-field" id="page-body">${esc(p.body)}</textarea><div class="audit-mini">يدعم الإنتاج مسودة ومراجعة ومعاينة ونشر منفصل لكل لغة.</div>`,`<button class="btn" onclick="WafraCMS.savePage()">حفظ المسودة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    savePage(){const s=state(),p=s.pages.find(x=>x.id===+document.getElementById('page-id').value);p.title=document.getElementById('page-title').value.trim()||p.title;p.body=document.getElementById('page-body').value.trim();p.status='مسودة';p.updated='الآن';save(s);log('تعديل صفحة أو نص',p.title);closeM();this.route('pages')},
    previewPage(id){const p=state().pages.find(x=>x.id===id);openM(modal('معاينة: '+esc(p.title),`<h2 style="font-size:20px;margin-bottom:14px">${esc(p.title)}</h2><p style="white-space:pre-wrap;line-height:2">${esc(p.body)}</p>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`))},
    renderAdmins(){const s=state();const columns=['مدير النظام','المدير المالي','مدير العمليات','مدير إقليمي','مدير شركة','المحتوى والتسويق','الدعم'];const matrix=[['عرض البيانات والتقارير','✓','✓','✓','✓','✓','✓','✓'],['عرض البيانات المالية','✓','✓','—','✓','✓','—','—'],['التصدير','✓','✓','✓','✓','✓','✓','—'],['تعديل عام','✓','—','✓','✓','✓','✓','—'],['إدارة المستخدمين والأدوار','✓','—','—','—','—','—','—'],['تعديل المزوّدين والمكاتب','✓','—','✓','—','✓','—','—'],['تعديل المستأجرين والحجوزات','✓','—','✓','✓','—','—','✓'],['إدارة محتوى الإعلانات','✓','—','—','—','✓','✓','—'],['اعتماد أو رفض المحتوى','✓','—','—','—','—','✓','—'],['ترقية خانات الظهور','✓','—','—','—','—','✓','—']];return phead('الإداريون والصلاحيات','نظام RBAC بنطاق بيانات وصلاحيات مفصّلة لكل دور',['FR-ADA-03','FR-ADA-04','FR-ADA-05','FR-ADA-07'],`<button class="btn" onclick="WafraCMS.newAdmin()">＋ إضافة إداري</button>`)+note('info','نطاق البيانات جزء من الصلاحية','كل دور لا يرى أو يعدّل إلا البيانات الواقعة ضمن نطاقه؛ يطبّق الخادم هذه القيود ويسجّل كل إجراء حساس.')+card(cardH('حسابات الإدارة','الحسابات الإدارية، نطاقها، وجلساتها النشطة')+table(['الاسم','البريد','الدور','نطاق البيانات','آخر دخول','الجلسات','2FA','الحالة','الإجراءات'],s.admins.map((a,i)=>[{v:esc(a.name),c:'strong'},esc(a.email),bdg(a.role,a.role.includes('Super Admin')?'r':'b'),a.scope,a.last,a.sessions,bdg(a.twofa?'مفعّل':'غير مفعّل',a.twofa?'g':'r'),bdg(a.active?'نشط':'معطّل',a.active?'g':'n'),`<button class="iact" title="${a.active?'تعطيل':'تفعيل'} الحساب" onclick="WafraCMS.toggleAdmin(${i})">${a.active?'⏸':'▶'}</button>`])))+`<div class="cms-grid" style="margin-top:18px">${roles.map(r=>`<article class="role-card"><span class="perm-chip">${r.scope}</span><h3 style="margin-top:9px">${r.name}</h3><p>${r.desc}</p><div class="perm-chips">${r.perms.map(x=>`<span class="perm-chip">${x}</span>`).join('')}</div></article>`).join('')}</div>`+card(cardH('مصفوفة الصلاحيات','✓ مسموح · — غير مسموح. النطاق يقيّد البيانات داخل كل صلاحية.')+`<div class="tw"><table class="matrix"><thead><tr><th>الإجراء</th>${columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${matrix.map(r=>`<tr>${r.map((x,i)=>`<td class="${i&&x==='✓'?'yes':i?'no':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)},
    newAdmin(){openM(modal('إضافة إداري',`<label class="field-label">الاسم</label><input id="admin-name" class="cms-field"><label class="field-label">البريد الإلكتروني</label><input id="admin-email" type="email" class="cms-field"><div class="form-grid"><div><label class="field-label">الدور</label><select id="admin-role" class="cms-field">${roles.map(r=>`<option>${r.name}</option>`).join('')}</select></div><div><label class="field-label">نطاق البيانات</label><select id="admin-scope" class="cms-field"><option>كل البيانات</option><option>نطاق: الرياض</option><option>نطاق: جدة</option><option>نطاق: الشركة</option></select></div></div>`,`<button class="btn" onclick="WafraCMS.saveAdmin()">إضافة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    saveAdmin(){const name=document.getElementById('admin-name').value.trim(),email=document.getElementById('admin-email').value.trim();if(!name||!email){alert('أدخل الاسم والبريد الإلكتروني');return}const s=state();s.admins.push({name,email,role:document.getElementById('admin-role').value,scope:document.getElementById('admin-scope').value,last:'لم يسجل الدخول',sessions:0,twofa:true,active:true});save(s);log('إضافة إداري',name);closeM();location.hash='admins';render()},
    toggleAdmin(i){const s=state(),a=s.admins[i];a.active=!a.active;save(s);log(a.active?'تفعيل حساب إداري':'تعطيل حساب إداري',a.name);location.hash='admins';render()}
  };
  S.cms=()=>WafraCMS.render(window.__cmsTab||'overview');
  S.content=()=>WafraCMS.render('pages');
  S.banners=()=>WafraCMS.render('banners');
  S.admins=()=>WafraCMS.renderAdmins();
  const system=NAV.find(x=>x.g==='النظام'); if(system&&!system.items.some(x=>x.k==='cms')) system.items.splice(3,0,{k:'cms',t:'CMS المحتوى والبنرات',i:'✦'});
  const oldRender=window.render; window.render=function(){oldRender(); if(cur==='cms'&&!window.__cmsTab)window.__cmsTab='overview'};
  render();
})();
</script>
