<script>

  const defaultHist=()=>({

      {when:'2026/09/02 11:25',id:'INV-2026-07',action:'إصدار مطالبة',by:'النظام',detail:'بعد اعتماد SET-2026-07'},

      {when:'2026/09/20 15:30',id:'RF-6988',action:'إنشاء استرداد',by:'إدارة · سارة العتيبي',detail:'BK-28010 · متبقي من الدفعة'}
    ]
  });
  const loadHist=()=>{
    try{const raw=JSON.parse(localStorage.getItem(HIST_KEY)||'null'); if(raw&&typeof raw==='object') return Object.assign(defaultHist(),raw);}catch(e){}
    return defaultHist();
  };
  const saveHist=h=>{try{localStorage.setItem(HIST_KEY,JSON.stringify(h));}catch(e){}};
  const pushHist=(bucket,row)=>{
    const h=loadHist();
    h[bucket]=h[bucket]||[];
    h[bucket].unshift(Object.assign({when:nowStr(),by:'الإدارة'},row));
    saveHist(h);
  };

  const defaultRefunds=()=>[
    {id:'RF-7000',booking:'BK-28076',customer:'سلطان القحطاني',amount:'3,000.00',paid:'4,200.00',daysUsed:2,daysBooked:7,cancelFee:'180.00',method:'نفس طريقة الدفع',reason:'عدم توفر السيارة',status:'بانتظار المراجعة',date:'2026-09-28'},
    {id:'RF-7001',booking:'BK-31864',customer:'شهد الشهري',amount:'1,500.00',paid:'2,000.00',daysUsed:1,daysBooked:4,cancelFee:'75.00',method:'المحفظة',reason:'خصم مضاعف',status:'بانتظار المراجعة',date:'2026-09-27'},
    {id:'RF-7002',booking:'BK-29110',customer:'فهد العتيبي',amount:'99.00',paid:'450.00',daysUsed:1,daysBooked:3,cancelFee:'52.65',method:'نفس طريقة الدفع',reason:'إلغاء الحجز',status:'بانتظار المراجعة',date:'2026-09-26'},
    {id:'RF-7003',booking:'BK-30542',customer:'نورة الدوسري',amount:'2,200.00',paid:'3,000.00',daysUsed:2,daysBooked:8,cancelFee:'120.00',method:'المحفظة',reason:'عطل السيارة',status:'بانتظار المراجعة',date:'2026-09-25'},
    {id:'RF-7004',booking:'BK-27481',customer:'ماجد السبيعي',amount:'450.00',paid:'900.00',daysUsed:2,daysBooked:4,cancelFee:'67.50',method:'نفس طريقة الدفع',reason:'عدم توفر السيارة',status:'معتمد',date:'2026-09-22'},
    {id:'RF-7005',booking:'BK-31209',customer:'ريم الزهراني',amount:'1,100.00',paid:'1,500.00',daysUsed:1,daysBooked:5,cancelFee:'60.00',method:'المحفظة',reason:'خصم مضاعف',status:'مرفوض',date:'2026-09-20'},
    {id:'RF-7006',booking:'BK-29833',customer:'خالد المطيري',amount:'780.00',paid:'1,200.00',daysUsed:2,daysBooked:6,cancelFee:'84.00',method:'نفس طريقة الدفع',reason:'إلغاء الحجز',status:'بانتظار المراجعة',date:'2026-09-18'},
    {id:'RF-7007',booking:'BK-32155',customer:'سارة العتيبي',amount:'1,800.00',paid:'2,400.00',daysUsed:1,daysBooked:5,cancelFee:'90.00',method:'المحفظة',reason:'عطل السيارة',status:'مكتمل',date:'2026-09-15'},
    {id:'RF-7008',booking:'BK-26740',customer:'وليد الحربي',amount:'320.00',paid:'800.00',daysUsed:2,daysBooked:4,cancelFee:'72.00',method:'نفس طريقة الدفع',reason:'إلغاء الحجز',status:'بانتظار المراجعة',date:'2026-09-12'}
  ];
  const refundBookings=()=>[
    {booking:'BK-33012',customer:'عبدالله الغامدي',provider:'شركة الصحراء',paid:2400,daysBooked:7,daysUsed:3,payMethod:'بطاقة مدى'},
    {booking:'BK-32988',customer:'منى القحطاني',provider:'كي رنت',paid:1800,daysBooked:5,daysUsed:2,payMethod:'بطاقة ائتمان'},
    {booking:'BK-32840',customer:'تركي العنزي',provider:'مسار',paid:3150,daysBooked:10,daysUsed:4,payMethod:'Apple Pay'},
    {booking:'BK-32755',customer:'هند الشهري',provider:'الوسام كار',paid:960,daysBooked:4,daysUsed:1,payMethod:'المحفظة'},
    {booking:'BK-28076',customer:'سلطان القحطاني',provider:'شركة الصحراء',paid:4200,daysBooked:7,daysUsed:2,payMethod:'بطاقة مدى'},
    {booking:'BK-31864',customer:'شهد الشهري',provider:'مسار',paid:2000,daysBooked:4,daysUsed:1,payMethod:'بطاقة ائتمان'}
  ];
  const moneyFmt=n=>{
    const v=Math.max(0,Number(n)||0);
    return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  };
  const parseMoney=s=>Number(String(s??'').replace(/,/g,''))||0;
  const calcRefund=({paid,daysBooked,daysUsed,cancelFeeOverride})=>{
    const p=Number(paid)||0;
    const booked=Math.max(1,Number(daysBooked)||1);
    const used=Math.min(Math.max(0,Number(daysUsed)||0),booked);
    const daily=p/booked;
    const usedAmt=daily*used;
    const remain=Math.max(0,p-usedAmt);
    const policyFee=Math.round(remain*CANCEL_FEE_RATE*100)/100;
    const fee=cancelFeeOverride!=null&&cancelFeeOverride!==''?Math.max(0,Number(cancelFeeOverride)):policyFee;
    const due=Math.max(0,Math.round((remain-fee)*100)/100);
    return {daily,usedAmt,remain,policyFee,fee,due,used,booked};
  };
  const findBooking=id=>(refundBookings().find(b=>b.booking===id)||null);
  const activeRefundForBooking=(store,booking,exceptId)=>{
    const block=new Set(['بانتظار المراجعة','معتمد','مكتمل']);
    return (store.items||[]).find(x=>x.booking===booking&&block.has(x.status)&&x.id!==exceptId);
  };
  const loadRefunds=()=>{
    try{const raw=JSON.parse(localStorage.getItem(REF_KEY)||'null'); if(raw&&Array.isArray(raw.items)) return raw;}catch(e){}
    return {items:defaultRefunds()};
  };
  const saveRefunds=s=>{try{localStorage.setItem(REF_KEY,JSON.stringify(s));}catch(e){}};

  /* CSS: إظهار المقارنة دائماً */
  if(!document.getElementById('wafra-finance-p48')){
    const st=document.createElement('style');
    st.id='wafra-finance-p48';
    st.textContent=`.fi-card{min-height:132px!important}.fi-card .trend{display:block!important;font:700 11.5px Cairo!important;color:var(--green)!important;margin-top:auto!important;line-height:1.35;white-space:normal}`;
    document.head.appendChild(st);
  }

  const fiCard=(lbl,val,unit,tone,icon,trend)=>`<div class="fi-card"><div class="top"><span class="lbl">${lbl}</span><span class="ic ${tone}">${icon}</span></div><div class="val">${val}${unit?`<small>${unit}</small>`:''}</div><div class="trend">${trend}</div></div>`;

  S.finance=()=>{
    const charts=`<div class="grid2">${card(cardH('نمو الإيرادات','أبريل إلى سبتمبر')+`<div class="card-b">${spark([40,61,60,58,63,84],32)}<div class="legend"><span>أبريل</span><span>مايو</span><span>يونيو</span><span>يوليو</span><span>أغسطس</span><span>سبتمبر</span></div></div>`)}${card(cardH('توزيع الإيرادات حسب المدينة')+`<div class="card-b">${donut([['الرياض',31,'var(--navy)','1.16M'],['جدة',24,'var(--coral)','895K'],['الخبر',18,'var(--blue)','671K'],['مكة',14,'var(--green)','522K'],['أخرى',13,'#8367C7','482K']],'3.73M','ر.س')}</div>`)}</div>`
      +card(cardH('ملخص المصروفات والتسويات')+`<div class="card-b">${table(['البند','القيمة','الحالة','آخر تحديث'],[['تكلفة التوصيل','184,200 ر.س',bdg('ضمن الميزانية','g'),'اليوم'],['تكاليف التسويق','112,600 ر.س',bdg('تحت المراجعة','a'),'اليوم'],['تسويات المزودين','486,300 ر.س',bdg('11 بانتظار الاعتماد','a'),'أمس'],['استردادات العملاء','62,940 ر.س',bdg('مكتملة','g'),'أمس']])}</div>`);
    return phead('النظرة المالية','حساب تلقائي للمؤشرات المالية مع اتجاهات النمو والتوزيع',[],
      `<button class="btn ghost" onclick="WafraOps.scheduleFinanceReport()">◷ جدولة تقرير</button>
       <button class="btn ghost" onclick="WafraOps.exportCurrent('النظرة-المالية','Excel')">⤒ تصدير</button>`)
      +`<div class="fi-wrap">
        <div class="fi-head"><div><h2>المؤشرات المالية</h2><p>حساب تلقائي للمؤشرات المالية مع اتجاهات النمو والتوزيع</p></div></div>
        <div class="fi-grid">
          ${fiCard('إجمالي الإيرادات','132.97','م ر.س','g','💵','▲ 8.3% مقارنة بالفترة السابقة')}
          ${fiCard('إجمالي العمولات','12.4','م ر.س','b','💳','▲ 7.1% مقارنة بالفترة السابقة')}
          ${fiCard('إجمالي الخصومات','4.54','م ر.س','n','🏷','▼ 2.4% مقارنة بالفترة السابقة')}
          ${fiCard('المبالغ المحصلة','110.22','م ر.س','g','💵','▲ 9.2% مقارنة بالفترة السابقة')}
          ${fiCard('المبالغ غير المحصلة','22.75','م ر.س','r','🚫','▼ 4.6% مقارنة بالفترة السابقة')}
          ${fiCard('متوسط قيمة العقد','8.9','ألف ر.س','b','📄','▲ 3.1% مقارنة بالفترة السابقة')}
          ${fiCard('الإيراد لكل سيارة','20.5','ألف ر.س','p','🚗','▲ 5.4% مقارنة بالفترة السابقة')}
          ${fiCard('الإيراد لكل شركة','4.75','م ر.س','t','🏢','▲ 6.0% مقارنة بالفترة السابقة')}
          ${fiCard('الإيراد لكل فرع','549.5','ألف ر.س','n','📍','▲ 2.8% مقارنة بالفترة السابقة')}
        </div>
        <div class="fi-grid row2">
          ${fiCard('صافي الربح','38.36','م ر.س','g','💵','▲ 6.7% مقارنة بالفترة السابقة')}
          ${fiCard('إجمالي المصروفات','77.67','م ر.س','r','💸','▲ 4.2% مقارنة بالفترة السابقة')}
          ${fiCard('هامش الربح','28.8','%','b','📊','▲ 1.1% مقارنة بالفترة السابقة')}
          ${fiCard('نمو الإيرادات','8.3','%','g','📈','▲ 1.4% مقارنة بالفترة السابقة')}
          ${fiCard('نمو الأرباح','6.7','%','t','📉','▲ 0.9% مقارنة بالفترة السابقة')}
        </div>
      </div>`+charts;
  };

  const histTable=rows=>rows&&rows.length
    ? table(['الوقت','المرجع','الإجراء','بواسطة','التفاصيل'],rows.map(r=>[{v:r.when,c:'num'},{v:r.id,c:'strong num'},r.action,r.by||'—',r.detail||'—']))
    : `<p class="note info" style="margin:12px 0">لا توجد سجلات بعد.</p>`;

  /* —— تعديل شريط التابات داخل مخرجات الشاشات الأصلية —— */
  const removeSettleInvTabs=html=>html
    .replace(/<button type="button" class="tab[^"]*" onclick="WafraOps\.setPayTab\('settlements'\)">[\s\S]*?<\/button>\s*/g,'')
    .replace(/<button type="button" class="tab[^"]*" onclick="WafraOps\.setPayTab\('invoices'\)">[\s\S]*?<\/button>\s*/g,'');

  const addTabAfterFines=(html,tabHtml)=>html.replace(
    /(onclick="WafraOps\.setPayTab\('fines'\)">[\s\S]*?<\/button>)/,
    `$1${tabHtml}`
  );

  const shellTabsOnly=(tabs,body,prefixHtml)=>{
    /* استبدال كتلة التابات+الجسم بالكامل */
    return prefixHtml.replace(
      /<div class="card">[\s\S]*$/,
      card(`<div class="tabs">${tabs}</div><div class="card-b">${body}</div>`)
    );
  };

  const splitShell=html=>{
    const m=html.match(/<div class="card\b[^"]*">/);
    const idx=m?html.indexOf(m[0]):-1;
    if(idx<0) return {head:html,rest:''};
    return {head:html.slice(0,idx),rest:html.slice(idx)};
  };

  const grabBody=html=>{
    const m=html.match(/<div class="card-b">([\s\S]*)<\/div>\s*<\/div>\s*$/);
    return m?m[1]:'';
  };

  /* حفظ الأصول مرة واحدة */
  if(!window.__finOrig){
    window.__finOrig={
      compDisputes:S.compDisputes,
      fines:S.fines,
      settlements:S.settlements,
      invoices:S.invoices
    };
  }
  const O=window.__finOrig;

  S.compDisputes=()=>{
    const sub=window.__compSubTab||'list';
    const raw=removeSettleInvTabs(O.compDisputes());
    const {head}=splitShell(raw);
    const body=grabBody(raw);
    const h=loadHist();
    if(sub==='history'){
      const bucket=window.__compHistBucket||'disputes';
      return head+card(`<div class="tabs">
        <button type="button" class="tab" onclick="window.__compSubTab='list';render()">المنازعات</button>
        <button type="button" class="tab" onclick="window.__compSubTab='list';location.hash='fines'">الغرامات</button>
        <button type="button" class="tab on" onclick="window.__compSubTab='history';render()">السجل</button>
      </div><div class="card-b">
        <div class="st-sec"><div><h3>سجل المنازعات والغرامات</h3><p>تاريخ الإجراءات على المنازعات والغرامات</p></div></div>
        <div class="tabs" style="margin-bottom:12px">
          <button type="button" class="tab ${bucket==='disputes'?'on':''}" onclick="window.__compHistBucket='disputes';render()">المنازعات</button>
          <button type="button" class="tab ${bucket==='fines'?'on':''}" onclick="window.__compHistBucket='fines';render()">الغرامات</button>
        </div>
        ${histTable(h[bucket]||[])}
      </div>`);
    }
    return head+card(`<div class="tabs">
      <button type="button" class="tab on" onclick="window.__compSubTab='list';render()">المنازعات</button>
      <button type="button" class="tab" onclick="window.__compSubTab='list';location.hash='fines'">الغرامات</button>
      <button type="button" class="tab" onclick="window.__compSubTab='history';render()">السجل</button>
    </div><div class="card-b">${body}</div>`);
  };

  S.fines=()=>{
    const sub=window.__compSubTab||'list';
    const raw=removeSettleInvTabs(O.fines());
    const {head}=splitShell(raw);
    const body=grabBody(raw);
    const h=loadHist();
    if(sub==='history'){
      const bucket=window.__compHistBucket||'fines';
      return head+card(`<div class="tabs">
        <button type="button" class="tab" onclick="window.__compSubTab='list';location.hash='compDisputes'">المنازعات</button>
        <button type="button" class="tab" onclick="window.__compSubTab='list';render()">الغرامات</button>
        <button type="button" class="tab on" onclick="window.__compSubTab='history';render()">السجل</button>
      </div><div class="card-b">
        <div class="st-sec"><div><h3>سجل المنازعات والغرامات</h3><p>تاريخ الإجراءات على المنازعات والغرامات</p></div></div>
        <div class="tabs" style="margin-bottom:12px">
          <button type="button" class="tab ${bucket==='disputes'?'on':''}" onclick="window.__compHistBucket='disputes';render()">المنازعات</button>
          <button type="button" class="tab ${bucket==='fines'?'on':''}" onclick="window.__compHistBucket='fines';render()">الغرامات</button>
        </div>
        ${histTable(h[bucket]||[])}
      </div>`);
    }
    return head+card(`<div class="tabs">
      <button type="button" class="tab" onclick="window.__compSubTab='list';location.hash='compDisputes'">المنازعات</button>
      <button type="button" class="tab on" onclick="window.__compSubTab='list';render()">الغرامات</button>
      <button type="button" class="tab" onclick="window.__compSubTab='history';render()">السجل</button>
    </div><div class="card-b">${body}</div>`);
  };

  S.settlements=()=>{
    const sub=window.__settleSubTab||'list';
    if(sub==='history'){
      const raw=typeof O.settlements==='function'?O.settlements():'';
      const {head}=splitShell(raw);
      return head+card(`<div class="tabs">
        <button type="button" class="tab" onclick="window.__settleSubTab='list';location.hash='compDisputes'">المنازعات</button>
        <button type="button" class="tab" onclick="window.__settleSubTab='list';render()">التسويات</button>
        <button type="button" class="tab" onclick="window.__settleSubTab='list';location.hash='invoices'">الفواتير</button>
        <button type="button" class="tab" onclick="window.__settleSubTab='list';location.hash='fines'">الغرامات</button>
        <button type="button" class="tab on" onclick="window.__settleSubTab='history';render()">السجل</button>
      </div><div class="card-b">
        <div class="st-sec"><div><h3>سجل التسويات</h3><p>تاريخ إنشاء واعتماد وتحويل دورات التسوية</p></div></div>
        ${histTable(loadHist().settlements||[])}
      </div>`);
    }
    /* الإبقاء على واجهة المدفوعات والتسوية (نموذج المزود) مع إضافة تبويب السجل */
    let html=typeof O.settlements==='function'?O.settlements():'';
    html=addTabAfterFines(html,`<button type="button" class="tab" onclick="window.__settleSubTab='history';render()">السجل</button>`);
    return html;
  };

  S.invoices=()=>{
    const sub=window.__invSubTab||'list';
    if(sub==='history'){
      const raw=typeof O.invoices==='function'?O.invoices():'';
      const {head}=splitShell(raw);
      return head+card(`<div class="tabs">
        <button type="button" class="tab" onclick="window.__invSubTab='list';location.hash='compDisputes'">المنازعات</button>

      const booking=(document.getElementById('rf-booking')?.value||'').trim();

      const paid=b?b.paid:parseMoney(document.getElementById('rf-paid')?.value);
      if(!paid){toast('لا توجد بيانات دفع مسجّلة لهذا الحجز.');return;}
      const daysBooked=b?b.daysBooked:Number(document.getElementById('rf-days-booked')?.value)||1;
      const daysUsed=Number(document.getElementById('rf-days-used')?.value)||0;
      if(daysUsed<0||daysUsed>daysBooked){toast('عدد الأيام المستخدمة غير صالح.');return;}
      const ov=document.getElementById('rf-fee-override')?.checked;
      const feeInput=Number(document.getElementById('rf-cancel-fee')?.value);
      const c=calcRefund({paid,daysBooked,daysUsed,cancelFeeOverride:ov?feeInput:null});

      const customer=b?.customer||document.getElementById('rf-customer')?.value||'—';
      const store=loadRefunds();
      const existing=activeRefundForBooking(store,booking);
      if(existing){
        const force=document.getElementById('rf-admin-force')?.checked;
        const adminNote=(document.getElementById('rf-admin-note')?.value||'').trim();
        if(!force){toast(`يوجد طلب ${existing.id} (${existing.status}) لنفس الحجز. فعّل التدخل الإداري للمتابعة.`);return;}
        if(!adminNote){toast('اكتب سبب التدخل الإداري أولاً.');return;}
      }
      const n=store.items.reduce((m,x)=>Math.max(m,Number(String(x.id).replace(/\D/g,''))||0),7008)+1;
      const row={
        id:`RF-${n}`,booking,customer,
        amount:moneyFmt(c.due),paid:moneyFmt(paid),
        daysUsed:c.used,daysBooked:c.booked,
        cancelFee:moneyFmt(c.fee),feeOverride:!!ov,

        date:new Date().toISOString().slice(0,10),
        adminForce:!!existing,adminNote:existing?(document.getElementById('rf-admin-note')?.value||'').trim():''
      };
      store.items=[row,...store.items];
      saveRefunds(store);
      pushHist('refunds',{id:row.id,action:existing?'إنشاء استرداد (تدخل إداري)':'إنشاء استرداد',detail:`${booking} · مستحق ${row.amount} ر.س · رسوم ${row.cancelFee}`});
      closeM(); toast(`تم إنشاء طلب الاسترداد ${row.id}.`); render();

    openEditRefundAmount:id=>{

        <div class="dl-grid" style="margin-bottom:12px">

        ${fld('سبب الاستثناء الإداري',`<textarea id="rf-edit-note" class="native-input" rows="2" placeholder="مثال: إعفاء من رسوم الإلغاء لشكوى موثّقة…">${row.adminEditNote||''}</textarea>`)}

  /* تسجيل أحداث المالية في السجل */
  const wrapPush=(fn,bucket,action)=>{
    const prev=WafraOps[fn];
    if(typeof prev!=='function'||prev._p48) return;
    const wrapped=function(...args){
      const id=args[0];
      const r=prev.apply(this,args);
      try{pushHist(bucket,{id:id||'—',action,detail:args[1]!=null?String(args[1]):'—'});}catch(e){}
      return r;
    };
    wrapped._p48=true;
    WafraOps[fn]=wrapped;
  };

  wrapPush('finalizeDispute','disputes','حسم النزاع');
  wrapPush('saveFine','fines','تسجيل غرامة');
  wrapPush('collectFine','fines','تحصيل غرامة');
  wrapPush('waiveFine','fines','إعفاء غرامة');

            {v:`<a class="st-link" href="#booking">${r.booking}</a>`,c:'num'},
            r.customer,
            {v:(r.paid||'—')+(r.paid?' ر.س':''),c:'num'},
            {v:(r.cancelFee||'—')+(r.cancelFee?' ر.س':''),c:'num'},
            {v:`<span style="color:#148A5A;font-weight:800">${r.amount} ر.س</span>${r.feeOverride?' <span class="sub">(استثناء)</span>':''}`,c:'num'},
            r.method||'—',
            r.reason,
            {v:r.date,c:'num'},
            statusPill(r.status),
            acts(r.id,r.booking,r.status)
          ])
        )}
        <div class="rf-foot"><span>${items.length} سجل</span></div>
        </div>`);
  };
})();
</script>
