  const home=NAV.find(x=>x.g===null), providers=NAV.find(x=>x.g==='المزوّدون'), fleet=NAV.find(x=>x.g==='إدارة الأسطول'), bookings=NAV.find(x=>x.g==='الحجوزات');
  if(home){home.items=home.items.filter(x=>!['inbox','messages'].includes(x.k)); if(!home.items.some(x=>x.k==='analytics'))home.items.push({k:'analytics',t:'التحليلات',i:'◫'});}
