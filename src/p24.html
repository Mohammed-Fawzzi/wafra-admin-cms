<script>
/* تكملة وظائف التحليلات والتقارير والتسويق مع تصدير للصفوف الظاهرة. */
(function(){
  const reportNames={supply:'خريطة العرض والطلب',readiness:'جاهزية الأسطول',utilization:'استغلال الأسطول RevPAC',forecast:'التنبؤ بالطلب',lifecycle:'دورة حياة الحجز',loyalty:'ولاء وتصنيف العملاء',commission:'شرائح العمولة',violations:'المخالفات والودائع'};
  const csvFromTable=(name)=>{const t=document.querySelector('#view table');if(!t){window.__toast('لا توجد بيانات لتصديرها.');return;}const rows=[...t.querySelectorAll('tr')].filter(r=>!r.classList.contains('hide')&&!r.classList.contains('pghide')).map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()));const text='\ufeff'+rows.map(r=>r.map(v=>`"${v.replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`${name}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);window.__toast(`تم تصدير ${Math.max(0,rows.length-1)} صفاً ظاهراً.`);};
  Object.assign(WafraOps,{
    exportCurrent:(name,type)=>type==='PDF'?window.print():csvFromTable(name),
    openReport:k=>{window.__reportKey=k;location.hash='#reportDetail';},
    analysisSearch:()=>{window.__analysisQuery=document.getElementById('analysis-q')?.value||'';render();},
    vendorAdTab:t=>{window.__vendorAdTab=t;render();}
  });
  const home=NAV.find(g=>g.g===null); if(home){home.items=home.items.filter(i=>i.k!=='analytics');if(!home.items.some(i=>i.k==='searchAnalysis'))home.items.splice(1,0,{k:'searchAnalysis',t:'محرك البحث والتحليل',i:'⌕'});}
  const reports=NAV.find(g=>g.g==='التقارير');if(reports&&!reports.items.some(i=>i.k==='analytics'))reports.items.push({k:'analytics',t:'التحليلات',i:'◫'});
  NAV.forEach(g=>g.items.forEach(i=>window.TITLES[i.k]=i.t));
  /* شاشة محرك البحث تُعرَّف في p35 بالتصميم الجديد — لا تُستبدل هنا. */
  const reportBase=S.reports;S.reports=()=>reportBase()+card(cardH('تقارير الذكاء والتحليلات','شاشات تشغيلية ومالية تفصيلية')+`<div class="card-b"><div class="grid3">${Object.entries(reportNames).map(([k,n])=>`<button class="card" style="padding:18px;text-align:right" onclick="WafraOps.openReport('${k}')"><b>${n}</b><span class="sub">عرض البيانات · فلاتر · Excel · PDF</span></button>`).join('')}</div></div>`);
  S.reportDetail=()=>{const k=window.__reportKey||'supply',title=reportNames[k]||reportNames.supply;const data={
    supply:{h:['المدينة','الطلب','المعروض','الطلب إلى العرض','الإشغال','الحالة'],r:[['الرياض','1,620','1,470','110%','78%',pill('عجز','r')],['جدة','1,105','1,180','94%','74%',pill('مكتفية','g')],['الخبر','734','670','110%','69%',pill('عجز','r')]]},
    readiness:{h:['المزود','إجمالي السيارات','جاهزة','تحتاج صيانة','غير متاحة','نسبة الجاهزية'],r:[['شركة الصحراء','214','196','8','10','92%'],['كي رنت','168','151','7','10','90%'],['مسار','96','73','12','11','76%']]},
    utilization:{h:['المزود','الفئة','الأيام المؤجرة','الأيام المتاحة','التشغيل','RevPAC'],r:[['شركة الصحراء','متوسطة','2,913','3,748','78%',money('126')],['كي رنت','اقتصادية','2,241','3,024','74%',money('98')],['مسار','فاخرة','1,234','1,824','68%',money('214')]]},
    forecast:{h:['المدينة','الطلب الحالي','التنبؤ للشهر القادم','التغير','التوصية'],r:[['الرياض','1,620','1,890','▲ 17%', 'تعزيز المعروض'],['جدة','1,105','1,160','▲ 5%','الحفاظ على المعروض'],['الخبر','734','810','▲ 10%','رفع التوصيل']]},
    lifecycle:{h:['مرحلة الحجز','العدد','النسبة','متوسط الزمن'],r:[['إنشاء الحجز','4,182','100%','2 د'],['تأكيد','3,946','94%','31 د'],['استلام','3,812','91%','22 د'],['إرجاع','3,540','85%','18 د']]},
    loyalty:{h:['الشريحة','العملاء','الحجوزات','متوسط الإنفاق','الإجراء'],r:[['مميز','1,204','8,432',money('4,820'),'برنامج ولاء'],['متكرر','4,218','11,986',money('2,170'),'كوبون خاص'],['جديد','8,914','10,241',money('740'),'حملة ترحيب']]},
    commission:{h:['شريحة المزود','المزودون','نسبة العمولة','الإيرادات','عمولة المنصة'],r:[['ذهبي','8','12%',money('1,640,000'),money('196,800')],['فضي','17','10%',money('1,190,000'),money('119,000')],['برونزي','21','8%',money('900,000'),money('72,000')]]},
    violations:{h:['رقم الحالة','المزود','المدينة','نوع المخالفة','الوديعة','الحالة'],r:[['VL-112','شركة الصحراء','الرياض','تأخر الإرجاع',money('450'),pill('مفتوح','r')],['VL-108','كي رنت','جدة','ضرر خارجي',money('1,200'),pill('قيد المعالجة','a')],['VL-099','مسار','الخبر','رسوم إضافية',money('280'),pill('مغلق','g')]]}
  }[k]||{};return phead(title,'تقرير تفصيلي ببيانات وفلاتر وتصدير',[],`<a class="btn ghost" href="#reports">‹ مركز التقارير</a><button class="btn ghost" onclick="WafraOps.exportCurrent('${title}','Excel')">Excel ⤓</button><button class="btn ghost" onclick="WafraOps.exportCurrent('${title}','PDF')">PDF ⤓</button>`)+card(`<div class="filters">${fld('الفترة',`<select class="native-input"><option>سبتمبر 2026</option><option>آخر 3 أشهر</option></select>`)}${fld('المدينة',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option></select>`)}${fld('المزود',`<select class="native-input"><option>كل المزودين</option><option>شركة الصحراء</option><option>كي رنت</option></select>`)}</div><div class="card-b">${kpi([{i:'◷',l:'السجلات',v:String(data.r.length),d:'بعد الفلاتر',t:'up'},{i:'▲',l:'أفضل مؤشر',v:'92%',d:'حسب الفترة',t:'up'},{i:'⚑',l:'يحتاج متابعة',v:'2',d:'سجلان تنبيهيان',t:'fl'}])}${table(data.h,data.r)}</div>`)+card(cardH('الاتجاه خلال الفترة')+`<div class="card-b">${spark([34,47,52,49,59,66,71,84],30)}</div>`);};
  const adsBase=S.vendorAds;S.vendorAds=()=>{const active=window.__vendorAdTab||'ads';if(active==='ads')return adsBase().replace('<div class="tabs">','<div class="tabs"><button class="tab on" onclick="WafraOps.vendorAdTab(\'ads\')">الإعلانات</button><button class="tab" onclick="WafraOps.vendorAdTab(\'coupons\')">كوبونات المزودين</button><button class="tab" onclick="WafraOps.vendorAdTab(\'notifications\')">إشعارات المزودين</button>'); const rows=active==='coupons'?[['SAHRA50','شركة الصحراء','50 ر.س','311',pill('نشط'),'<button class="btn ghost sm">إدارة</button>'],['KSA20','كي رنت','20%','142',pill('نشط'),'<button class="btn ghost sm">إدارة</button>']]:[['إشعار عروض الصيف','شركة الصحراء','Push','18,420',pill('مجدول'),'<button class="btn ghost sm">إدارة</button>'],['تنبيه حجز جديد','كي رنت','SMS','342',pill('نشط'),'<button class="btn ghost sm">إدارة</button>']];return phead('إعلانات المزودين','إدارة الإعلانات والكوبونات والإشعارات الخاصة بكل مزود',[],`<button class="btn coral" onclick="WafraOps.demoAction('إضافة إعلان لمزود')">＋ إضافة إعلان</button><button class="btn ghost" onclick="WafraOps.exportCurrent('إعلانات-المزودين','Excel')">Excel ⤓</button>`)+card(`<div class="tabs"><button class="tab" onclick="WafraOps.vendorAdTab('ads')">الإعلانات</button><button class="tab ${active==='coupons'?'on':''}" onclick="WafraOps.vendorAdTab('coupons')">كوبونات المزودين</button><button class="tab ${active==='notifications'?'on':''}" onclick="WafraOps.vendorAdTab('notifications')">إشعارات المزودين</button></div><div class="card-b">${table(active==='coupons'?['الكود','المزود','القيمة','الاستخدام','الحالة','الإجراء']:['الإشعار','المزود','القناة','المستلمون','الحالة','الإجراء'],rows)}</div>`);};
})();
</script>
