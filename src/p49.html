<script>
/* التسويق — العروض، الحملات، المحتوى، A/B، الرحلة، إعلانات المزودين، ROAS. */
(function(){
  const toast=msg=>{
    if(typeof window.__toast==='function') return window.__toast(msg);
    if(WafraOps.demoAction) return WafraOps.demoAction(msg);
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2400);
  };
  const nowStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
  const KEY='wafra-mkt-history-v1';
  const defaultHist=()=>({
    offers:[
      {when:'2026/09/28 11:20',id:'SUMMER25',action:'إنشاء عرض',by:'إدارة · سارة العتيبي',detail:'نسبة 25% · سقف 2000'},
      {when:'2026/09/22 09:05',id:'FREEDEL',action:'جدولة عرض',by:'إدارة · محمد الصغير',detail:'إعفاء رسوم توصيل'},
      {when:'2026/09/18 16:40',id:'BACK15',action:'إيقاف عرض',by:'إدارة · سارة العتيبي',detail:'انخفاض العائد'}
    ],
    welcome:[
      {when:'2026/09/28 14:22',id:'WELCOME10',action:'تعيين للعميل',by:'النظام',detail:'أحمد الشمري · BK-20418'},
      {when:'2026/09/27 11:05',id:'WELCOME10',action:'استخدام',by:'النظام',detail:'نورة القحطاني'},
      {when:'2026/09/24 08:12',id:'WELCOME10',action:'انتهاء صلاحية',by:'النظام',detail:'ماجد السبيعي'}
    ],
    gov:[
      {when:'2026/09/26 13:10',id:'VIP20',action:'فتح تحقيق',by:'إدارة · محمد الصغير',detail:'اشتباه سوء استخدام'},
      {when:'2026/09/20 10:00',id:'WELCOME15',action:'إيقاف',by:'إدارة · سارة العتيبي',detail:'تجاوز السقف'},
      {when:'2026/09/15 09:30',id:'SUMMER50',action:'مراجعة',by:'النظام',detail:'ضمن الحدود'}
    ],
    campaigns:[
      {when:'2026/09/25 12:00',id:'CMP-204',action:'إطلاق حملة',by:'إدارة · سارة العتيبي',detail:'عروض نهاية الصيف'},
      {when:'2026/09/10 08:40',id:'CMP-198',action:'إيقاف حملة',by:'إدارة · محمد الصغير',detail:'استنفاد الميزانية'},
      {when:'2026/08/28 15:20',id:'CMP-190',action:'إنشاء حملة',by:'إدارة · سارة العتيبي',detail:'خصم الفئة الاقتصادية'}
    ],
    content:[
      {when:'2026/09/27 10:15',id:'BN-118',action:'نشر بانر',by:'إدارة · محمد الصغير',detail:'الرئيسية — أعلى'},
      {when:'2026/09/20 14:00',id:'SLOT-2',action:'تعيين ظهور مميز',by:'إدارة · سارة العتيبي',detail:'شركة الوفرة · ذهبي'},
      {when:'2026/09/12 09:50',id:'SLOT-1',action:'إزالة من الظهور',by:'إدارة · محمد الصغير',detail:'انتهاء الشراكة'}
    ],
    ab:[
      {when:'2026/09/26 11:00',id:'AB-042',action:'إطلاق اختبار',by:'إدارة · سارة العتيبي',detail:'بانر الرئيسية'},
      {when:'2026/09/18 16:30',id:'AB-038',action:'اعتماد فائز B',by:'إدارة · محمد الصغير',detail:'باقة الشركات'}
    ],
    journey:[
      {when:'2026/09/28 09:40',id:'JR-Mass-01',action:'حملة استرجاع جماعية',by:'إدارة · سارة العتيبي',detail:'كل المعرّضين · كوبون نسبة 15%'},
      {when:'2026/09/22 14:10',id:'JR-Yousef',action:'حملة فردية',by:'إدارة · محمد الصغير',detail:'يوسف الحربي · إشعار'}
    ],
    vendorAds:[
      {when:'2026/09/27 12:30',id:'AD-551',action:'موافقة على إعلان',by:'إدارة · سارة العتيبي',detail:'ظهور مميز · شركة الصحراء'},
      {when:'2026/09/20 10:05',id:'AD-540',action:'إنشاء إعلان',by:'إدارة · محمد الصغير',detail:'بانر رئيسي · كي رنت'},
      {when:'2026/09/15 08:20',id:'AD-530',action:'رفض إعلان',by:'إدارة · سارة العتيبي',detail:'ليموزين المطار'}
    ],
    roasBudget:[
      {when:'2026/09/28 11:05',id:'عروض الصيف',action:'زيادة ميزانية +20%',by:'إدارة · محمد الصغير',detail:'16 ألف → 19.2 ألف ر.س'},
      {when:'2026/09/20 09:40',id:'باقة الشركات',action:'تحويل ميزانية',by:'إدارة · سارة العتيبي',detail:'+5,400 ر.س من عروض الصيف'},
      {when:'2026/09/12 15:00',id:'AIRPORT25',action:'زيادة ميزانية +10%',by:'إدارة · محمد الصغير',detail:'8.2 ألف → 9.02 ألف ر.س'}
    ]
  });
  const loadH=()=>{try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object')return Object.assign(defaultHist(),r);}catch(e){}return defaultHist();};
  const saveH=h=>{try{localStorage.setItem(KEY,JSON.stringify(h));}catch(e){}};
  const pushH=(b,row)=>{const h=loadH();h[b]=h[b]||[];h[b].unshift(Object.assign({when:nowStr(),by:'الإدارة'},row));saveH(h);};
  const histTable=rows=>rows&&rows.length
    ? table(['الوقت','المرجع','الإجراء','بواسطة','التفاصيل'],rows.map(r=>[{v:r.when,c:'num'},{v:r.id,c:'strong num'},r.action,r.by||'—',r.detail||'—']))
    : `<p class="note info">لا توجد سجلات بعد.</p>`;
  const filterHist=(rows,q)=>{
    const s=String(q||'').trim();
    if(!s) return rows||[];
    return (rows||[]).filter(r=>`${r.when||''} ${r.id||''} ${r.action||''} ${r.by||''} ${r.detail||''}`.includes(s));
  };
  const histSearch=(inputId,q,handler,ph)=>`<div class="filters" style="padding:0 0 12px"><label class="fsearch">⌕ <input id="${inputId}" value="${String(q||'').replace(/"/g,'&quot;')}" placeholder="${ph||'ابحث في السجل…'}" oninput="${handler}"></label></div>`;
  const mkpi=(items)=>`<div class="kpis" style="grid-template-columns:repeat(${Math.min(items.length,6)},minmax(0,1fr))">${items.map(k=>`<div class="kpi"><div class="lb"><span class="ic gh-ic ${k.tone||'blue'}">${k.i}</span>${k.l}</div><div class="vl">${k.v}</div></div>`).join('')}</div>`;

  /* —— تنقل القائمة —— */
  const mkt=NAV.find(g=>g.g==='التسويق');
  if(mkt){
    const c=mkt.items.find(x=>x.k==='coupons'); if(c) c.t='العروض';
    const b=mkt.items.find(x=>x.k==='banners'); if(b) b.t='إدارة المحتوى';
    if(!mkt.items.some(x=>x.k==='featuredSlots')){
      const bi=mkt.items.findIndex(x=>x.k==='banners');
      mkt.items.splice(bi>=0?bi+1:5,0,{k:'featuredSlots',t:'الظهور المميز',i:'★'});
    }
    if(!mkt.items.some(x=>x.k==='cohortLtv')){
      mkt.items.push({k:'cohortLtv',t:'تحليل الأفواج – LTV / CAC',i:'📊'});
    }
  }
  const system=NAV.find(x=>x.g==='النظام');
  if(system){
    const i=system.items.findIndex(x=>x.k==='cms');
    if(i>=0) system.items.splice(i,1);
  }
  if(window.TITLES){
    window.TITLES.coupons='العروض';
    window.TITLES.banners='إدارة المحتوى';
    window.TITLES.featuredSlots='الظهور المميز';
    window.TITLES.cohortLtv='تحليل الأفواج – LTV / CAC';
  }

  const cities=['كل العملاء','عملاء جدد','عملاء VIP','مدينة الرياض','مدينة جدة','مدينة مكة المكرمة','مدينة الدمام','مدينة الخبر','مدينة المدينة المنورة','مدينة الطائف','مدينة بريدة','مدينة تبوك','مدينة أبها','مدينة حائل','مدينة نجران'];
  const targetOpts=cities.map((x,i)=>`<option ${i===0?'selected':''}>${x}</option>`).join('');

  /* —— أنواع الخصومات (مطابقة لتطبيق المزود) —— */
  const OFFER_TYPES=[
    {k:'pct_coupon',t:'خصم بنسبة مئوية باستخدام كوبون',desc:'يُخصم نسبة ثابتة عند إدخال كود الكوبون',needsCode:1,valLabel:'نسبة الخصم %',valPh:'25',valDef:'25'},
    {k:'fixed_coupon',t:'خصم ثابت على إجمالي الحجز باستخدام كوبون',desc:'يُخصم مبلغ ثابت من إجمالي الحجز عند إدخال الكود',needsCode:1,valLabel:'مبلغ الخصم (ر.س)',valPh:'50',valDef:'50'},
    {k:'daily_coupon',t:'سعر يومي ثابت باستخدام كوبون',desc:'سعر يومي مخفّض يُطبَّق عند إدخال كود الكوبون',needsCode:1,valLabel:'السعر اليومي الثابت (ر.س)',valPh:'99',valDef:'99',needModel:1},
    {k:'pct_auto',t:'خصم بنسبة مئوية يُطبق تلقائيًا',desc:'نسبة خصم تُضاف تلقائياً بدون كود',needsCode:0,valLabel:'نسبة الخصم %',valPh:'15',valDef:'15'},
    {k:'daily_auto',t:'سعر يومي ثابت يُطبق تلقائيًا',desc:'سعر يومي مخفّض يُطبَّق تلقائياً حسب السيارة/الموديل',needsCode:0,valLabel:'السعر اليومي الثابت (ر.س)',valPh:'120',valDef:'120',needModel:1},
    {k:'delivery',t:'توصيل مجاني / إعفاء من رسوم التسليم',desc:'تخفيض أو إعفاء كامل من رسوم التسليم بين المدن',needsCode:0,valLabel:'نسبة الإعفاء %',valPh:'100',valDef:'100',delivery:1},
    {k:'welcome',t:'ترحيب تلقائي',desc:'كوبون يُعيَّن تلقائياً للعميل الجديد عند التسجيل',needsCode:1,valLabel:'نسبة الخصم %',valPh:'10',valDef:'10'}
  ];
  const offerTypeOpts=(sel)=>OFFER_TYPES.map(t=>`<option value="${t.k}" ${t.k===(sel||'pct_coupon')?'selected':''}>${t.t}</option>`).join('');
  const offerForm=(selK)=>{
    const t=OFFER_TYPES.find(x=>x.k===(selK||'pct_coupon'))||OFFER_TYPES[0];
    return `
    <div class="note info" id="of-type-desc" style="margin-bottom:12px">${t.desc}</div>
    ${fld('نوع الخصم',`<select id="of-type" class="native-input" onchange="WafraOps.onOfferTypeChange(this.value)">
      ${offerTypeOpts(t.k)}
    </select>`)}
    <div id="of-code-wrap" style="${t.needsCode?'':'display:none'}">${fld('كود الكوبون',`<input id="of-code" class="native-input" value="SUMMER25" placeholder="مثال SUMMER25"><div class="hint">أحرف إنجليزية كبيرة وأرقام فقط</div>`)}</div>
    <div id="of-delivery-wrap" style="${t.delivery?'':'display:none'}">
      <div class="frow">${fld('نوع الإعفاء',`<select id="of-ex-type" class="native-input"><option>إعفاء كامل</option><option>نسبة مئوية</option></select>`)}
        ${fld('نسبة الإعفاء %',`<input id="of-ex-pct" class="native-input" type="number" value="100">`)}</div>
      <div class="frow">${fld('من (مدينة الاستلام)',`<select id="of-from-city" class="native-input"><option>الرياض</option><option>جدة</option><option>الدمام</option><option>كل المدن</option></select>`)}
        ${fld('إلى (مدينة التسليم)',`<select id="of-to-city" class="native-input"><option>جدة</option><option>الرياض</option><option>الدمام</option><option>كل المدن</option></select>`)}</div>
    </div>
    <div id="of-val-wrap" style="${t.delivery?'display:none':''}">${fld(t.valLabel,`<input id="of-val" class="native-input" value="${t.valDef}" placeholder="${t.valPh}">`)}</div>
    <div class="frow">${fld('المتحمل للتكلفة',`<select id="of-bearer" class="native-input"><option>المنصة</option><option>المزود</option><option>مشترك</option></select>`)}
      ${fld('المزود (اختياري)',`<select id="of-prov" class="native-input"><option>كل المزودين / المنصة</option><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}</div>
    <div class="frow">${fld('المدينة (اختياري)',`<select id="of-city" class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option><option>الدمام</option><option>الخبر</option></select>`)}
      ${fld('الفرع (اختياري)',`<select id="of-branch" class="native-input"><option>كل الفروع</option><option>مطار الملك خالد</option><option>جدة الرقمية</option><option>الخبر التشغيلي</option></select>`)}</div>
    <div class="frow">${fld(t.needModel?'الموديل (إلزامي)':'الموديل (اختياري)',`<select id="of-model" class="native-input" multiple size="3" style="min-height:72px"><option selected>كامري</option><option>إلنترا</option><option>K5</option><option>صني</option><option>كل الموديلات</option></select><div class="hint">يمكن اختيار أكثر من موديل</div>`)}
      ${fld(t.needModel?'نوع السيارة (إلزامي)':'نوع السيارة (اختياري)',`<select id="of-car-type" class="native-input" multiple size="3" style="min-height:72px"><option selected>سيدان</option><option>اقتصادية</option><option>SUV</option><option>كل الأنواع</option></select><div class="hint">يمكن اختيار أكثر من نوع</div>`)}</div>
    <div class="frow">${fld('تاريخ البداية',`<input id="of-start" class="native-input" type="date" value="2026-09-01">`)}
      ${fld('تاريخ النهاية',`<input id="of-end" class="native-input" type="date" value="2026-09-30">`)}</div>
    <div class="frow">${fld('حد الاستخدام',`<input id="of-cap" class="native-input" value="2000" placeholder="100 أو غير محدود">`)}
      ${fld('سقف الاستخدام لكل عميل',`<input id="of-per" class="native-input" value="1">`)}</div>
    <div class="frow">${fld('الحد الأدنى لمبلغ الحجز (اختياري)',`<input id="of-min" class="native-input" value="200" placeholder="ر.س">`)}
      ${fld('حد أدنى للأيام (اختياري)',`<input id="of-min-days" class="native-input" type="number" value="1">`)}</div>
    ${fld('الشريحة المستهدفة',`<select id="of-seg" class="native-input">${targetOpts}</select>`)}
    ${fld('قواعد التطبيق',`<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
      <label style="display:flex;gap:8px;align-items:center;font:600 12.5px Cairo"><input type="checkbox" id="of-r1" checked> لا يُجمع مع عروض أخرى</label>
      <label style="display:flex;gap:8px;align-items:center;font:600 12.5px Cairo"><input type="checkbox" id="of-r2"> استثناء فئة السيارات الفاخرة</label>
      <label style="display:flex;gap:8px;align-items:center;font:600 12.5px Cairo"><input type="checkbox" id="of-r3"> لا يسري في أوقات الذروة</label>
    </div>`)}`;
  };

  M.newCoupon=()=>modal('كوبون جديد',offerForm(),
    `<button class="btn" onclick="WafraOps.saveOffer()">إنشاء العرض</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`);

  Object.assign(WafraOps,{
    onOfferTypeChange:k=>{
      const body=document.querySelector('#mc .modal-b');
      if(!body) return;
      body.innerHTML=offerForm(k);
    },
    openCreateOffer:()=>openM(modal('كوبون جديد',offerForm(),
      `<button class="btn" onclick="WafraOps.saveOffer()">إنشاء العرض</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)),
    saveOffer:()=>{
      const typeEl=document.getElementById('of-type');
      const typeKey=typeEl?.value||'pct_coupon';
      const typeMeta=OFFER_TYPES.find(x=>x.k===typeKey);
      const type=typeMeta?.t||typeKey;
      const code=typeMeta?.needsCode===0
        ? ('AUTO-'+typeKey.toUpperCase())
        : (document.getElementById('of-code')?.value?.trim()||'OFFER');
      pushH('offers',{id:code,action:'إنشاء عرض',detail:type});
      closeM(); toast(`تم إنشاء العرض «${type}»${typeMeta?.needsCode!==0?` · ${code}`:''}.`); render();
    },
    setOffersTab:t=>{window.__offersTab=t; if(t==='list'&&!window.__offersStatus) window.__offersStatus='نشطة'; render();},
    setOffersStatus:s=>{window.__offersTab='list'; window.__offersStatus=s; render();},
    setWelcomeTab:t=>{window.__welcomeTab=t;render();},
    setGovTab:t=>{window.__govTab=t;render();},
    setCampTab:t=>{window.__campTab=t;render();},
    campHistFilter:()=>{window.__campHistFilter={q:document.getElementById('camp-hist-q')?.value||''};render();},
    setContentTab:t=>{window.__contentTab=t;render();},
    setAbTab:t=>{window.__abTab=t;render();},
    setJourneyTab:t=>{window.__jrTab=t;render();},
    journeyHistFilter:()=>{window.__jrHistFilter={q:document.getElementById('jr-hist-q')?.value||''};render();},
    setVendorAdsTab:t=>{window.__vAdsTab=t;render();},
    vendorAdsHistFilter:()=>{window.__vAdsHistFilter={q:document.getElementById('vads-hist-q')?.value||''};render();},
    setRoasTab:t=>{window.__roasTab=t;render();},
    roasHistFilter:()=>{window.__roasHistFilter={q:document.getElementById('roas-hist-q')?.value||''};render();},
    setRoasPeriod:d=>{window.__roasPeriod=d;render();},
    removeFeaturedSlot:n=>{
      window.__featuredSlots=(window.__featuredSlots||defaultSlots()).map(s=>s.n===n?Object.assign({},s,{co:'— فارغة —',tier:'',since:'',empty:true}):s);
      pushH('content',{id:'SLOT-'+n,action:'إزالة من الظهور',detail:'خانة '+n});
      toast(`تمت إزالة الشريك من خانة ${n}.`); render();
    },
    openCreateAbTest:()=>{
      openM(modal('تصميم اختبار A/B جديد',`
        <div class="frow">
          ${fld('اسم الاختبار',`<input id="ab-name" class="native-input" placeholder="مثال: عنوان بانر الرئيسية">`)}
          ${fld('العنصر المختبر',`<select id="ab-el" class="native-input"><option>بانر الرئيسية</option><option>عنوان إعلان</option><option>زر الإجراء (CTA)</option><option>صفحة هبوط</option></select>`)}
        </div>
        <div class="frow">
          ${fld('هدف القياس',`<select id="ab-goal" class="native-input"><option>نسبة التحويل</option><option>نسبة النقر CTR</option></select>`)}
          ${fld('مدة الاختبار (أيام)',`<select id="ab-days" class="native-input"><option>7</option><option>14</option><option>21</option><option>30</option></select>`)}
        </div>
        <div class="frow">
          ${fld('توزيع الجمهور',`<select id="ab-split" class="native-input"><option>50/50</option><option>70/30</option><option>80/20</option></select>`)}
          ${fld('الجمهور المستهدف',`<select id="ab-aud" class="native-input">${targetOpts}</select>`)}
        </div>
        <div class="frow">
          ${fld('وصف النسخة A (الأساس)',`<input id="ab-a" class="native-input" placeholder="النسخة الحالية">`)}
          ${fld('وصف النسخة B (البديل)',`<input id="ab-b" class="native-input" placeholder="النسخة المقترحة">`)}
        </div>
        ${note('info','دلالة إحصائية','يبدأ الاختبار بجمع البيانات فور الإنشاء ويُعلَن الفائز فقط عند بلوغ دلالة إحصائية (ثقة ≥ 95%) خلال المدة المحددة.')}
      `,`<button class="btn" onclick="WafraOps.launchAbTest()">إطلاق الاختبار</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    launchAbTest:()=>{
      const name=document.getElementById('ab-name')?.value?.trim()||'اختبار جديد';
      pushH('ab',{id:'AB-NEW',action:'إطلاق اختبار',detail:name});
      closeM(); toast(`تم إطلاق اختبار «${name}».`); render();
    },
    openMassRetention:()=>{
      const massOpts=['كل المعرّضين','خمول شديد (> 240 يوم)','مدينة الرياض','مدينة جدة','مدينة مكة المكرمة','مدينة الدمام','مدينة الخبر','مدينة المدينة المنورة','مدينة الطائف','مدينة بريدة','مدينة تبوك','مدينة أبها','مدينة حائل','مدينة نجران']

      const st=window.__vad||{};
      return WafraOps.vadTypes().find(x=>x.k===st.type)||WafraOps.vadTypes()[0];
    },
    vadDays:()=>{
      const st=window.__vad||{};
      const a=new Date(st.from), b=new Date(st.to);
      if(isNaN(a)||isNaN(b)||b<a) return 1;
      return Math.max(1, Math.round((b-a)/86400000)+1);
    },
    vadCost:()=>{
      const days=WafraOps.vadDays();
      const base=WafraOps.vadTypeMeta().price*days;
      const vat=Math.round(base*0.15);
      return {days, base, vat, total:base+vat};
    },
    vadFmtDate:iso=>{
      if(!iso) return '—';
      try{
        return new Date(iso+'T00:00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'});
      }catch(e){ return iso; }
    },
    vadCollect:()=>{
      const st=window.__vad; if(!st) return;
      const g=id=>document.getElementById(id);
      if(g('vad-car')) st.car=g('vad-car').value;
      if(g('vad-city')) st.city=g('vad-city').value;
      if(g('vad-branch')) st.branch=g('vad-branch').value;
      if(g('vad-link')) st.bannerLink=g('vad-link').value;
      if(g('vad-headline')) st.headline=g('vad-headline').value;
      if(g('vad-body')) st.body=g('vad-body').value;
      if(g('vad-from')) st.from=g('vad-from').value;
      if(g('vad-to')) st.to=g('vad-to').value;
      if(g('vad-send-at')) st.sendAt=g('vad-send-at').value;
      const send=document.querySelector('input[name="vad-send"]:checked');
      if(send) st.sendMode=send.value;
      const pay=document.querySelector('input[name="vad-pay"]:checked');
      if(pay) st.pay=pay.value;

    vadStepper:(step,done)=>{
      const n=5;
      return `<div class="vad-steps">${Array.from({length:n},(_,i)=>{
        const s=i+1;
        const cls=done||s<step?'done':(s===step?'on':'');
        const mark=done||s<step?'✓':s;
        return `<div class="vad-step ${cls}"><span class="cr">${mark}</span></div>`;
      }).join('<i></i>')}</div>`;
    },

      WafraOps.vadCollect();

      WafraOps.renderVendorAdWizard();
    },

      WafraOps.vadCollect();
      window.__vad.sendMode=mode;
      WafraOps.renderVendorAdWizard();
    },
    vadNext:()=>{
      WafraOps.vadCollect();
      const st=window.__vad;
      if(st.step<5){ st.step++; WafraOps.renderVendorAdWizard(); }
      else WafraOps.vadOpenPay();

      WafraOps.vadCollect();

        if(String(s).includes('م ')) return n*1000;

      window.__roasRoas=87.07;

        const add=cur*(pct/100);

        if(!box) return;
        box.innerHTML=`
          <div class="roas-imp-row"><span>الميزانية الجديدة</span><b style="color:#2C68D8">${neu.toFixed(1)} ألف ر.س (+${add.toFixed(1)} ألف ر.س)</b></div>

    st.textContent=`
      .coh-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px 4px}
      .coh-pos{color:#148A5A;font-weight:800}
      .coh-chart{padding:8px 12px 4px}
      .coh-legend{display:flex;justify-content:center;gap:22px;margin:4px 0 14px;font:700 12.5px Cairo;color:var(--ink-2)}
      .coh-legend i{display:inline-block;width:10px;height:10px;border-radius:99px;margin-inline-end:6px;vertical-align:middle}
      .coh-legend .ltv{background:#E8A23A}.coh-legend .cac{background:#20A16E}
      .coh-plot{display:flex;gap:10px;align-items:stretch;min-height:260px}
      .coh-y{display:flex;flex-direction:column;justify-content:space-between;font:700 11px Cairo;color:var(--muted);padding:4px 0;min-width:52px;text-align:left;direction:ltr}
      .coh-area{flex:1;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0 6px 0 10px;position:relative;background:linear-gradient(to top,transparent 0,transparent calc(100% - 1px),#EEF1F6 calc(100% - 1px))}
      .coh-col{flex:1;max-width:72px;display:flex;flex-direction:column;align-items:center;gap:8px}
      .coh-bars{width:100%;height:220px;display:flex;align-items:flex-end;justify-content:center;gap:5px}
      .coh-bar{width:18px;border-radius:6px 6px 0 0;min-height:2px}
      .coh-bar.ltv{background:#E8A23A}.coh-bar.cac{background:#20A16E}
      .coh-lab{font:700 11.5px Cairo;color:var(--ink-2);white-space:nowrap}
    `;
    document.head.appendChild(st);
  }

  const cohortRows=()=>[
    {m:'أبريل 26',short:'أبر 26',newC:412,ltv:386200,cac:333},
    {m:'مايو 26',short:'ماي 26',newC:398,ltv:340500,cac:328},
    {m:'يونيو 26',short:'يون 26',newC:371,ltv:301800,cac:335},
    {m:'يوليو 26',short:'يول 26',newC:355,ltv:268400,cac:340},
    {m:'أغسطس 26',short:'أغس 26',newC:342,ltv:229700,cac:330},
    {m:'سبتمبر 26',short:'سبت 26',newC:318,ltv:188900,cac:336},
    {m:'أكتوبر 26',short:'أكت 26',newC:296,ltv:154600,cac:329}
  ];
  const fmtK=n=>{
    const v=n/1000;
    return (Math.round(v*10)/10).toLocaleString('en-US',{maximumFractionDigits:1})+' ألف ر.س';
  };
  const fmtSar=n=>Math.round(n).toLocaleString('en-US')+' ر.س';
  const fmtRatio=r=>'x'+(Math.round(r*10)/10).toLocaleString('en-US',{maximumFractionDigits:1});

  S.cohortLtv=()=>{
    const rows=cohortRows();
    const avgLtv=rows.reduce((s,r)=>s+r.ltv,0)/rows.length;
    const avgCac=rows.reduce((s,r)=>s+r.cac,0)/rows.length;
    const avgRatio=avgLtv/avgCac;
    const maxLtv=400000;
    const chart=rows.map(r=>{
      const ltvH=Math.max(2,Math.round((r.ltv/maxLtv)*100));
      const cacH=Math.max(2,Math.round((r.cac/maxLtv)*100));
      return `<div class="coh-col">
        <div class="coh-bars">
          <div class="coh-bar ltv" style="height:${ltvH}%" title="LTV ${fmtK(r.ltv)}"></div>
          <div class="coh-bar cac" style="height:${cacH}%" title="CAC ${fmtSar(r.cac)}"></div>
        </div>
        <div class="coh-lab">${r.short}</div>
      </div>`;
    }).join('');
    const yTicks=[400000,350000,300000,250000,200000,150000,100000,50000,0]
      .map(v=>`<span>${v.toLocaleString('en-US')}</span>`).join('');
    return phead('تحليل الأفواج – LTV / CAC','القيمة الدائمة للعميل مقابل تكلفة اكتسابه وبقاء كل فوج شهري',[],
      `<button class="btn ghost" onclick="WafraOps.exportCurrent&&WafraOps.exportCurrent('تحليل-الأفواج-LTV-CAC','Excel')">Excel ⤓</button>
       <button class="btn ghost" onclick="WafraOps.exportCurrent&&WafraOps.exportCurrent('تحليل-الأفواج-LTV-CAC','PDF')">PDF ⤓</button>`)
      +mkpi([
        {i:'💎',l:'متوسط LTV',v:fmtK(avgLtv).replace(' ر.س',''),tone:'amber'},
        {i:'🎯',l:'متوسط CAC',v:fmtSar(avgCac).replace(' ر.س',''),tone:'green'},
        {i:'📈',l:'LTV / CAC',v:fmtRatio(avgRatio),tone:'blue'},
        {i:'🔁',l:'متوسط الاحتفاظ',v:'100%',tone:'green'}
      ])
      +card(`<div class="coh-toolbar">
          <div style="font:800 15px Cairo;color:var(--ink)">أفواج العملاء الشهرية</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn ghost sm" onclick="WafraOps.exportCurrent&&WafraOps.exportCurrent('تحليل-الأفواج','PDF')">PDF</button>
            <button class="btn ghost sm" onclick="WafraOps.exportCurrent&&WafraOps.exportCurrent('تحليل-الأفواج','Excel')">Excel</button>
            <button class="btn sm" style="background:var(--navy);color:#fff;border:0" onclick="WafraOps.demoAction&&WafraOps.demoAction('تم حفظ العرض الحالي.')">حفظ العرض</button>
          </div>
        </div>`
        +table(['الفوج','عملاء جدد','LTV','CAC','الاحتفاظ','LTV / CAC'],
          rows.map(r=>{
            const ratio=r.ltv/r.cac;
            return [
              {v:r.m,c:'strong'},
              {v:r.newC.toLocaleString('en-US'),c:'num'},
              {v:fmtK(r.ltv),c:'num'},
              {v:fmtSar(r.cac),c:'num'},
              {v:`<span class="coh-pos">100%</span>`},
              {v:`<span class="coh-pos">${fmtRatio(ratio)}</span>`}
            ];
          }))
        +`<div class="rf-foot"><span>${rows.length} سجل</span></div>`)
      +card(cardH('LTV مقابل CAC لكل فوج')
        +`<div class="card-b coh-chart">
          <div class="coh-legend"><span><i class="cac"></i>CAC</span><span><i class="ltv"></i>LTV</span></div>
          <div class="coh-plot">
            <div class="coh-y">${yTicks}</div>
            <div class="coh-area">${chart}</div>
          </div>
        </div>`);
  };

  NAV.forEach(g=>g.items&&g.items.forEach(i=>{if(window.TITLES) window.TITLES[i.k]=i.t;}));
})();
</script>
