<script>
/* أمثلة بيانات محلية لشاشات كانت تعتمد سابقاً على API غير مهيأ. */
(function(){
  const state=window.WAFRA_DATA||{};const save=()=>localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));
  const oldMount=mountResource;mountResource=async(hostId,resource,renderData)=>{if(['resource-welcomeCoupon','resource-integrationStatus'].includes(hostId))return;return oldMount(hostId,resource,renderData);};
  const reports=NAV.find(x=>x.g==='التقارير');if(reports){const i=NAV.indexOf(reports);if(i>1){NAV.splice(i,1);NAV.splice(1,0,reports);}}
  const providers=NAV.find(x=>x.g==='المزوّدون');if(providers&&!providers.items.some(x=>x.k==='providerPerformance'))providers.items.splice(1,0,{k:'providerPerformance',t:'أداء المزودين',i:'◷'});
  state.welcomeCoupon=state.welcomeCoupon||{active:true,code:'WELCOME10',type:'نسبة مئوية',value:'10%',perCustomerLimit:'1',totalLimit:'5,000',start:'01/10/2026',end:'31/12/2026',uses:'1,204'};
  state.integrations=state.integrations||[{name:'بوابة الدفع (HyperPay)',status:'متصل',tone:'g',checked:'اليوم 12:41',configured:'مهيأة',note:'آخر تحصيل ناجح قبل دقيقتين'},{name:'رسائل SMS',status:'متصل',tone:'g',checked:'اليوم 12:39',configured:'مهيأة',note:'الرصيد 18,420 رسالة'},{name:'الخرائط والمواقع',status:'تنبيه',tone:'a',checked:'اليوم 12:35',configured:'مهيأة',note:'تحتاج مراجعة مفتاح منطقة تبوك'},{name:'البريد الإلكتروني',status:'متصل',tone:'g',checked:'اليوم 12:40',configured:'مهيأة',note:'معدل التسليم 99.4%'}];
  Object.assign(WafraOps,{saveWelcome:()=>{const c=state.welcomeCoupon;c.active=document.getElementById('wc-active').value==='مفعّل';c.code=document.getElementById('wc-code').value.trim();c.type=document.getElementById('wc-type').value;c.value=document.getElementById('wc-value').value;c.perCustomerLimit=document.getElementById('wc-limit').value;c.totalLimit=document.getElementById('wc-total').value;save();window.__toast('تم حفظ إعداد كوبون الترحيب محلياً.');render();},checkIntegration:n=>{const i=state.integrations.find(x=>x.name===n);if(i){i.status='متصل';i.tone='g';i.checked='الآن';i.note='تم الفحص بنجاح؛ الخدمة تستجيب بشكل طبيعي.';save();render();window.__toast('تم فحص التكامل وتحديث حالته.');}}});
  S.welcomeCoupon=()=>{const c=state.welcomeCoupon;return phead('كوبون الترحيب','تعيين كوبون تلقائيًا للعميل الجديد عند التسجيل',[],`<button class="btn ghost" onclick="WafraOps.exportCurrent('كوبون-الترحيب','Excel')">سجل التعيين</button>`)+card(cardH('إعداد قاعدة الترحيب','يُطبّق على التسجيلات الجديدة بعد التفعيل')+`<div class="card-b"><div class="grid3">${fld('الحالة',`<select id="wc-active" class="native-input"><option ${c.active?'selected':''}>مفعّل</option><option ${!c.active?'selected':''}>معطّل</option></select>`)}${fld('رمز الكوبون',`<input id="wc-code" class="native-input" value="${c.code}">`)}${fld('نوع الخصم',`<select id="wc-type" class="native-input"><option>${c.type}</option><option>مبلغ ثابت</option></select>`)}</div><div class="grid3">${fld('قيمة الخصم',`<input id="wc-value" class="native-input" value="${c.value}">`)}${fld('حد الاستخدام لكل عميل',`<input id="wc-limit" class="native-input" value="${c.perCustomerLimit}">`)}${fld('الحد الإجمالي للاستخدام',`<input id="wc-total" class="native-input" value="${c.totalLimit}">`)}</div><div class="grid3">${fld('بداية الصلاحية',`<input class="native-input" value="${c.start}">`)}${fld('نهاية الصلاحية',`<input class="native-input" value="${c.end}">`)}<div class="it"><div class="k">استخدامات حتى الآن</div><div class="v">${c.uses} استخدام</div></div></div><div class="note info">يُمنح الكوبون مرة واحدة فقط للعميل الجديد، ولا يجمع مع كوبونات المنصة الأخرى.</div><button class="btn coral" onclick="WafraOps.saveWelcome()">حفظ الإعداد</button></div>`);};
  S.integrationStatus=()=>phead('حالة التكاملات','متابعة اتصال الدفع والرسائل والخرائط مع بيانات اختبارية',[],`<button class="btn ghost" onclick="render()">↻ تحديث الحالة</button>`)+card(cardH('الخدمات المتصلة','آخر فحص للخدمات وإعداداتها')+`<div class="card-b">${kpi([{i:'✓',l:'خدمات متصلة',v:'3',d:'تعمل بشكل طبيعي',t:'up'},{i:'⚠',l:'تنبيهات',v:'1',d:'تحتاج مراجعة',t:'down'},{i:'◷',l:'آخر فحص',v:'الآن',d:'بيانات محلية',t:'up'}])}${table(['الخدمة','الحالة','آخر فحص','التهيئة','الملاحظة','الإجراء'],state.integrations.map(x=>[x.name,`<span class="badge ${x.tone==='g'?'g':'a'}">${x.status}</span>`,x.checked,x.configured,x.note,`<button class="btn ghost sm" onclick="WafraOps.checkIntegration('${x.name}')">إعادة الفحص</button>`]))}</div>`);
  render();
})();
</script>
