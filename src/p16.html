<script>

(function(){

  const pAction=p=>`<div class="acts-cell"><a class="btn ghost sm" href="#vendorFile" title="فتح ملف المزود">👁</a><button class="btn ghost sm" onclick="WafraOps.editEntity('${p.name}','مزود')" title="تعديل المزود">✎</button></div>`;

  const providerCards=()=>`<div class="grid3">${providers.map(p=>`<article class="card" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:start"><div><span class="sub">${p.id}</span><h3 style="margin:6px 0">${p.name}</h3></div>${pBadge(p.status)}</div><div style="font-size:12px;color:var(--ink-2);line-height:2;margin:12px 0">⌖ ${p.address}<br>◷ ${p.hours}<br>📍 ${p.city} · ${p.branches} فروع<br>🚗 المتاح <b style="color:var(--navy)">${p.available}</b> من ${p.total}<br>📋 حجوزات نشطة: ${p.bookings}</div><div style="border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center">${pAction(p)}<span class="sub">${p.services}</span></div></article>`).join('')}</div>`;

  render();
})();
</script>
