<script>
/* استكمال العناصر المحددة في صور Admin-3: الصلاحيات، الاعتماد، الأداء، والطلبات. */
(function(){
  const state=window.WAFRA_DATA;
  const dialog=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const persist=()=>localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));
  const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  Object.assign(WafraOps,{
    approvalDecision:(id,decision)=>{const a=state.approvals.find(x=>x.id===id);if(!a)return;const title=decision==='معتمد'?'اعتماد الطلب':'رفض الطلب';openM(dialog(title,`${decision==='مرفوض'?`${fld('سبب الرفض',`<textarea id="approval-decision-note" class="native-input" style="min-height:95px" placeholder="اكتب سبب الرفض بشكل واضح للمزود"></textarea>`)}`:`<div class="note ok"><span>✓</span><div><b>المستندات مكتملة</b>سيتم اعتماد المزود وإشعاره بالقرار.</div></div>${fld('ملاحظة الاعتماد',`<textarea id="approval-decision-note" class="native-input" style="min-height:75px" placeholder="ملاحظة اختيارية للمزود"></textarea>`)}`}`,`<button class="btn ${decision==='مرفوض'?'danger':'coral'}" onclick="WafraOps.saveApprovalDecision('${id}','${decision}')">تأكيد ${title}</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    saveApprovalDecision:(id,decision)=>{const a=state.approvals.find(x=>x.id===id);if(!a)return;const note=document.getElementById('approval-decision-note')?.value.trim();if(decision==='مرفوض'&&!note){window.__toast('اكتب سبب الرفض أولاً.');return;}a.status=decision;a.note=note||'تم اعتماد الطلب بعد اكتمال المستندات والمراجعة.';persist();closeM();render();window.__toast(`تم ${decision==='معتمد'?'اعتماد':'رفض'} الطلب وإشعار المزود.`);},
    providerBranchTab:t=>{window.__providerBranchTab=t;render();},
    togglePermission:(branch,key)=>{state.branchPermissions=state.branchPermissions||{};const k=`${branch}:${key}`;state.branchPermissions[k]=!state.branchPermissions[k];persist();render();},
    addUser:()=>openM(dialog('إضافة عميل أو مستخدم',`${fld('الاسم الكامل',`<input id="new-user-name" class="native-input" placeholder="الاسم الكامل">`)}${fld('رقم الهوية',`<input id="new-user-id" class="native-input" placeholder="10 أرقام">`)}${fld('الجوال',`<input id="new-user-phone" class="native-input" placeholder="05xxxxxxxx">`)}${fld('نوع الحساب',`<select id="new-user-type" class="native-input"><option>عميل مستأجر</option><option>إدارية</option><option>مستخدم لمزود</option></select>`)}${fld('المدينة',`<select id="new-user-city" class="native-input"><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}`,`<button class="btn coral" onclick="WafraOps.saveNewUser()">حفظ المستخدم</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)),
    saveNewUser:()=>{const name=document.getElementById('new-user-name')?.value.trim(),identity=document.getElementById('new-user-id')?.value.trim(),phone=document.getElementById('new-user-phone')?.value.trim();if(!name||!identity||!phone){window.__toast('أكمل الاسم والهوية والجوال أولاً.');return;}state.users.push({id:`CU-${String(state.users.length+1).padStart(3,'0')}`,name,identity,phone,type:document.getElementById('new-user-type').value,city:document.getElementById('new-user-city').value,status:'نشط',email:'لا يوجد بريد مضاف',bookings:0,total:'0 ر.س',created:'اليوم'});persist();closeM();render();window.__toast('تمت إضافة المستخدم بنجاح.');},
    requestResponse:t=>openM(dialog('طلب رد من المزود',`${fld('الموضوع',`<input class="native-input" value="${t}">`)}${fld('رسالة المزود',`<textarea id="stuck-response" class="native-input" style="min-height:100px" placeholder="اكتب المطلوب من المزود والمهلة الزمنية للرد…"></textarea>`)}`,`<button class="btn coral" onclick="WafraOps.sendResponseRequest()">إرسال الطلب</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)),
    sendResponseRequest:()=>{if(!document.getElementById('stuck-response')?.value.trim()){window.__toast('اكتب رسالة للمزود أولاً.');return;}closeM();window.__toast('تم إرسال طلب الرد للمزود وتسجيله في الحجز.');},
    confirmClose:t=>openM(dialog('تأكيد إغلاق البلاغ',`<p>هل تريد إغلاق البلاغ المرتبط بالحجز <b>${t}</b>؟ لن يمكن إعادة فتحه إلا بسجل جديد.</p>${fld('ملاحظة الإغلاق',`<textarea class="native-input" style="min-height:72px" placeholder="ملاحظة اختيارية"></textarea>`)}`,`<button class="btn danger" onclick="closeM();WafraOps.demoAction('تم إغلاق البلاغ ${t}')">تأكيد الإغلاق</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))
  });
  const kycBase=S.kyc;S.kyc=()=>{const view=kycBase();return view.replace(/<button class="btn ghost sm" onclick="WafraOps.requestDocs\('([^']+)'\)">طلب وثائق<\/button>/g,`<button class="btn ghost sm" onclick="WafraOps.requestDocs('$1')">طلب وثائق</button> <button class="btn coral sm" onclick="WafraOps.approvalDecision('$1','معتمد')">اعتماد</button> <button class="btn danger sm" onclick="WafraOps.approvalDecision('$1','مرفوض')">رفض</button>`);};
  const usersBase=S.users;S.users=()=>usersBase().replace("onclick=\"WafraOps.demoAction('إضافة عميل')\"","onclick=\"WafraOps.addUser()\"");
  S.providerPerformance=()=>phead('أداء المزودين','مقارنة تشغيلية ومالية بين المزودين مع مؤشرات قابلة للمراجعة',[],`<button class="btn ghost" onclick="WafraOps.exportCurrent('أداء-المزودين','Excel')">Excel ⤓</button><button class="btn ghost" onclick="WafraOps.exportCurrent('أداء-المزودين','PDF')">PDF ⤓</button>`)+card(`<div class="filters">${fld('المدينة',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}${fld('الفترة',`<select class="native-input"><option>سبتمبر 2026</option><option>آخر 3 أشهر</option></select>`)}<label class="fsearch">⌕ <input placeholder="ابحث باسم المزود"></label></div><div class="card-b">${kpi([{i:'▦',l:'المزودون النشطون',v:'46',d:'3 بحاجة متابعة',t:'up'},{i:'✦',l:'متوسط التشغيل',v:'74%',d:'▲ 3% عن الشهر السابق',t:'up'},{i:'★',l:'متوسط التقييم',v:'4.6/5',d:'1,248 مراجعة',t:'up'}])}${table(['المزود','المدينة','الفروع','الحجوزات','التشغيل','الإيرادات','صافي الربح','التقييم','الإجراء'],[['شركة الصحراء','الرياض','7','642','78%','286,400 ر.س','34,368 ر.س','4.8/5','<a class="btn ghost sm" href="#vendorFile">فتح الملف</a>'],['كي رنت','جدة','5','518','74%','241,900 ر.س','29,028 ر.س','4.7/5','<a class="btn ghost sm" href="#vendorFile">فتح الملف</a>'],['مسار','الخبر','4','403','69%','188,200 ر.س','22,584 ر.س','4.5/5','<a class="btn ghost sm" href="#vendorFile">فتح الملف</a>']])}</div>`);
  const vendorBase=S.vendorFile;S.vendorFile=()=>{const active=window.__providerTab||'overview';if(active!=='branches')return vendorBase();const mini=window.__providerBranchTab||'branches';const ps=window.__branchPermissions||{};const on=(b,k,def)=>ps[`${b}:${k}`]===undefined?def:ps[`${b}:${k}`];const sw=(b,k,def)=>`<button class="tg ${on(b,k,def)?'on':''}" aria-label="${k}" onclick="WafraOps.togglePermission('${b}','${k}')"></button>`;const tabs=`<div class="tabs"><button class="tab" onclick="WafraOps.providerTeamTab('overview')">نظرة عامة</button><button class="tab on">الفروع</button><button class="tab" onclick="WafraOps.providerTeamTab('fleet')">الأسطول</button><button class="tab" onclick="WafraOps.providerTeamTab('bookings')">الحجوزات</button><button class="tab" onclick="WafraOps.providerTeamTab('ratings')">التقييمات</button><button class="tab" onclick="WafraOps.providerTeamTab('pricing')">التسعير</button><button class="tab" onclick="WafraOps.providerTeamTab('services')">الخدمات</button><button class="tab" onclick="WafraOps.providerTeamTab('documents')">المستندات</button><button class="tab" onclick="WafraOps.providerTeamTab('team')">الصلاحيات</button></div>`;const body=mini==='branches'?`<div class="card-b">${table(['الفرع','المدينة','النوع','إجمالي السيارات','المتاح','العقود','التشغيل','العمولة','الإيرادات','الحالة','الإجراء'],[['مطار الملك خالد','الرياض','مطار','48','42','186','81%','12%','112,000 ر.س',pill('نشط'),'<button class="btn ghost sm" onclick="WafraOps.viewBranch(\'BR-014\')">استعراض</button>'],['طريق الملك عبدالعزيز','الرياض','داخلي','36','29','128','76%','12%','62,200 ر.س',pill('نشط'),'<button class="btn ghost sm" onclick="WafraOps.viewBranch(\'BR-014\')">استعراض</button>'],['جدة الشمالية','جدة','داخلي','31','24','96','69%','12%','45,600 ر.س',pill('نشط'),'<button class="btn ghost sm" onclick="WafraOps.viewBranch(\'BR-021\')">استعراض</button>']])}</div>`:`<div class="card-b"><h3 style="margin:0 0 12px">صلاحيات مكاتب التأجير والفروع</h3>${[['مطار الملك خالد','الرياض · 48 سيارة'],['طريق الملك عبدالعزيز','الرياض · 36 سيارة'],['جدة الشمالية','جدة · 31 سيارة']].map((x,i)=>`<div class="card" style="padding:16px;margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;gap:16px"><div><b>${x[0]}</b><span class="sub">${x[1]}</span></div><span class="badge g">نشط</span></div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px"><label>الحجوزات ${sw(x[0],'bookings',true)}</label><label>التوصيل ${sw(x[0],'delivery',true)}</label><label>الظهور بالبحث ${sw(x[0],'search',true)}</label><label>التأجير الذاتي ${sw(x[0],'self',i!==2)}</label></div></div>`).join('')}</div>`;return phead('ملف المزود','فروع المزود وصلاحيات كل مكتب',[],`<a class="btn ghost" href="#vendors">‹ رجوع لقائمة المزودين</a>`)+card(tabs+`<div class="tabs" style="padding-top:10px"><button class="tab ${mini==='branches'?'on':''}" onclick="WafraOps.providerBranchTab('branches')">بيانات الفروع</button><button class="tab ${mini==='permissions'?'on':''}" onclick="WafraOps.providerBranchTab('permissions')">صلاحيات الفروع</button></div>${body}`);};
})();
</script>
