  S.kyc=()=>phead('طابور الاعتماد','طلبات المزودين وإجراءاتها بحسب الحالة',[])+card(tabs([{t:'قيد المراجعة',n:4,on:1},{t:'بانتظار الوثائق',n:2},{t:'معتمد',n:46},{t:'مرفوض',n:3}])+table(['الطلب','المزود','الحالة','الإجراء المتاح'],[['VR-1042','أسطول الشمال',bdg('قيد المراجعة','a'),`<button class="btn sm" onclick="openM(M.reqDocs())">مراجعة وطلب وثائق</button>`],['VR-1041','ركن السيارات',bdg('بانتظار الوثائق','a'),`<button class="btn sm">تذكير بالوثائق</button>`],['VR-1038','الخليج رنت',bdg('معتمد','g'),`<button class="btn ghost sm">فتح الملف</button>`],['VR-1031','مركبات الساحل',bdg('مرفوض','r'),`<button class="btn ghost sm">عرض سبب الرفض</button>`]]));

  const providerNav=NAV.find(g=>g.g==='المزودون'||g.g==='المزودون والفروع');
  if(providerNav){providerNav.g='المزودون';providerNav.items=[{k:'vendors',t:'قائمة المزودين',i:'🏢'},{k:'kyc',t:'طابور الاعتماد',i:'📋',n:9},{k:'vendorFile',t:'ملف مزود',i:'📁',sub:'vendors'}];}
  const oldFleet=NAV.find(g=>g.g==='المركبات'||g.g==='السيارات والماركات والموديلات');
  if(oldFleet){oldFleet.g='الفروع';oldFleet.items=[{k:'branchAreas',t:'المناطق والمدن',i:'◉'},{k:'branches',t:'قائمة الفروع',i:'📍'},{k:'intercityFees',t:'رسوم بين المدن',i:'↔'}];}
  const branchIndex=NAV.indexOf(oldFleet); NAV.splice(branchIndex+1,0,{g:'إدارة الأسطول',items:[{k:'fleetCategories',t:'الفئات',i:'◈'},{k:'fleetMakesModels',t:'الماركات والموديلات',i:'🏷'},{k:'fleetAvailable',t:'السيارات المتاحة',i:'🚗'},{k:'fleetPricing',t:'التسعير',i:'◷'},{k:'fleetServices',t:'الخدمات',i:'✚'},{k:'fleetReview',t:'مراقبة الإتاحة',i:'⚠',n:8}]});
  S.fleet=S.fleetAvailable; S.models=S.fleetMakesModels; S.pricingServices=S.fleetPricing;
  render();
})();
