<script>
/* الدعم + الإعدادات التشغيلية + صلاحيات الحقول الحساسة. */
(function(){
  const toast=msg=>{
    if(typeof window.__toast==='function') return window.__toast(msg);
    if(WafraOps.demoAction) return WafraOps.demoAction(msg);
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2400);
  };

  /* —— التذاكر: حقل التاريخ —— */
  S.tickets=()=>phead('تذاكر الدعم','متابعة الطلبات الواردة من العملاء والمزوّدين',[],
    `<button class="btn ghost" onclick="WafraOps.exportLocal&&WafraOps.exportLocal('التذاكر','Excel')">⤒ تصدير</button>`)
    +note('dngr','ستّ تذاكر تجاوزت الـ SLA','أعلاها أولوية: مشكلة دفع لعميل منذ 9 ساعات. التذاكر المتأخّرة تُصعَّد تلقائياً.')
    +card(tabs([{t:'الكل',n:142,on:1},{t:'مفتوحة',n:38},{t:'قيد المعالجة',n:24},{t:'بانتظار الردّ',n:11},{t:'محلولة',n:63},{t:'مغلقة',n:6}])
    +`<div class="filters mkt-filters">
        <label class="fd mkt-date">من تاريخ<input type="date" value="2026-08-01"></label>
        <label class="fd mkt-date">إلى تاريخ<input type="date" value="2026-08-31"></label>
        <div class="fd">الحالة<span class="cv">▾</span></div>
        <div class="fd">الأولوية<span class="cv">▾</span></div>
        <div class="fd">المزود<span class="cv">▾</span></div>
        <div class="fd">الموضوع<span class="cv">▾</span></div>
        <div class="fd">المُسنَدة إلى<span class="cv">▾</span></div>
        <div class="fsearch">⌕<input placeholder="ابحث برقم التذكرة أو الاسم…"></div>
      </div>`
    +table(['رقم التذكرة','الموضوع','مقدّم الطلب','النوع','الأولوية','المُسنَدة إلى','تاريخ التذكرة','تاريخ المعالجة','SLA','الحالة','الإجراءات'],[
      [{v:'SUP-1042',c:'strong num'},{v:'تأخّر في صرف المستحقّات المالية<span class="sub">لم تصلني تسوية الأسبوع الماضي</span>',c:'strong'},'شركة الصحراء',bdg('مزوّد','flat n'),bdg('عالية','r'),'—',{v:'2026/08/27 14:22',c:'num'},'—',bdg('متأخّرة 9 ساعات','r'),bdg('مفتوحة','a'),`<a class="btn sm" href="#ticket">فتح</a>`],
      [{v:'SUP-1041',c:'strong num'},{v:'خطأ في ظهور سيارة بنتائج البحث<span class="sub">سيارة نشطة لا تظهر رغم توفّرها</span>',c:'strong'},'كي رنت',bdg('مزوّد','flat n'),bdg('متوسطة','a'),'محمد العنزي',{v:'2026/08/27 11:05',c:'num'},{v:'2026/08/27 12:40',c:'num'},bdg('متبقٍ 3 ساعات','a'),bdg('قيد المعالجة','b'),`<a class="btn sm" href="#ticket">فتح</a>`],
      [{v:'SUP-1038',c:'strong num'},{v:'خُصم المبلغ مرتين<span class="sub">ظهر خصمان لنفس الحجز</span>',c:'strong'},'أحمد الشمري',bdg('عميل','flat b'),bdg('عاجلة','r'),'ليلى الدوسري',{v:'2026/08/26 19:18',c:'num'},{v:'2026/08/26 20:02',c:'num'},bdg('متأخّرة 2 ساعة','r'),bdg('قيد المعالجة','b'),`<a class="btn sm" href="#ticket">فتح</a>`],
      [{v:'SUP-1035',c:'strong num'},{v:'استفسار عن سياسة الإلغاء',c:'strong'},'هند الشهري',bdg('عميل','flat b'),bdg('منخفضة','n'),'محمد العنزي',{v:'2026/08/25 09:40',c:'num'},{v:'2026/08/25 10:15',c:'num'},bdg('متبقٍ يومان','g'),bdg('بانتظار الردّ','n'),`<a class="btn sm" href="#ticket">فتح</a>`]
    ])
    +pager(142,15));

  /* —— تقارير الدعم: نماذج ملخص + أداء الفريق —— */
  Object.assign(WafraOps,{
    supportReportsTab:t=>{window.__srTab=t;render();}
  });
  S.supportReports=()=>{
    const tab=window.__srTab||'summary';
    const head=phead('تقارير الدعم','اتجاهات التذاكر وأوقات الاستجابة والالتزام بالاتفاقية',[],
      `<button class="btn ghost" onclick="WafraOps.exportCurrent('تقارير-الدعم','Excel')">⤒ تصدير</button>`);
    const tabsHtml=`<div class="tabs">
      <button type="button" class="tab ${tab==='summary'?'on':''}" onclick="WafraOps.supportReportsTab('summary')">ملخص الدعم</button>
      <button type="button" class="tab ${tab==='tickets'?'on':''}" onclick="WafraOps.supportReportsTab('tickets')">التذاكر</button>
      <button type="button" class="tab ${tab==='team'?'on':''}" onclick="WafraOps.supportReportsTab('team')">أداء الفريق</button>
    </div>
    <div class="filters mkt-filters">
      <label class="fd mkt-date">من تاريخ<input type="date" value="2026-08-01"></label>
      <label class="fd mkt-date">إلى تاريخ<input type="date" value="2026-08-31"></label>
      <div class="fd">الحالة<span class="cv">▾</span></div>
      <div class="fd">الفريق<span class="cv">▾</span></div>
      <div class="fsearch">⌕<input placeholder="ابحث…"></div>
    </div>`;

    if(tab==='team'){
      return head+card(tabsHtml
        +`<div class="card-b">
          <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px">
            <div class="kpi"><div class="lb"><span class="ic gh-ic blue">👤</span>أعضاء الفريق</div><div class="vl">6</div></div>
            <div class="kpi"><div class="lb"><span class="ic gh-ic green">✓</span>متوسط الالتزام بـ SLA</div><div class="vl">91%</div></div>
            <div class="kpi"><div class="lb"><span class="ic gh-ic amber">◷</span>متوسط أول رد</div><div class="vl">48 د</div></div>
            <div class="kpi"><div class="lb"><span class="ic gh-ic blue">🎫</span>تذاكر مغلقة / عضو</div><div class="vl">18.4</div></div>
          </div>
          ${table(['الموظف','الدور','مفتوحة','قيد المعالجة','مغلقة','متوسط أول رد','الالتزام بـ SLA','تقييم الرضا','الإجراء'],[
            ['ليلى الدوسري','مشرفة دعم','4','6','52','32 د','96%',bdg('4.8','g'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف ليلى')">ملف</button>`],
            ['محمد العنزي','أخصائي دعم','7','8','41','55 د','89%',bdg('4.5','g'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف محمد')">ملف</button>`],
            ['سارة العتيبي','أخصائي دعم','5','4','38','61 د','87%',bdg('4.4','g'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف سارة')">ملف</button>`],
            ['خالد المطيري','دعم مالي','3','5','29','44 د','93%',bdg('4.6','g'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف خالد')">ملف</button>`],
            ['نورة القحطاني','دعم مزودين','2','3','22','70 د','84%',bdg('4.2','a'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف نورة')">ملف</button>`],
            ['فهد الحربي','متدرب','6','2','11','95 د','78%',bdg('3.9','a'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('ملف فهد')">ملف</button>`]
          ])}
          ${card(cardH('توزيع عبء العمل','عدد التذاكر النشطة لكل عضو')+`<div class="card-b">${bars([
            ['ليلى الدوسري',72,'#20A16E'],['محمد العنزي',85,'#E8A23A'],['سارة العتيبي',64,'#2C68D8'],
            ['خالد المطيري',55,'#2C68D8'],['نورة القحطاني',42,'#6B5CE7'],['فهد الحربي',48,'#E8A23A']
          ])}</div>`)}
        </div>`);
    }

    if(tab==='tickets'){
      return head+card(tabsHtml
        +`<div class="card-b">${table(['الحالة','العدد','متوسط أول رد','متوسط الإغلاق','نسبة الالتزام'],[
          ['مفتوحة','38','—','—',bdg('—','n')],
          ['قيد المعالجة','24','1س 12د','—',bdg('88%','a')],
          ['بانتظار الردّ','11','2س 40د','—',bdg('82%','a')],
          ['محلولة','63','48د','1ي 4س',bdg('96%','g')],
          ['مغلقة','6','55د','2ي',bdg('94%','g')]
        ])}</div>`);
    }

    /* ملخص الدعم — نموذج محاكاة */
    return head+card(tabsHtml
      +`<div class="card-b">
        <div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px">
          <div class="kpi"><div class="lb"><span class="ic gh-ic blue">🎫</span>إجمالي التذاكر</div><div class="vl">142</div></div>
          <div class="kpi"><div class="lb"><span class="ic gh-ic amber">◷</span>مفتوحة الآن</div><div class="vl">38</div></div>
          <div class="kpi"><div class="lb"><span class="ic gh-ic red">⚠</span>تجاوزت SLA</div><div class="vl">6</div></div>
          <div class="kpi"><div class="lb"><span class="ic gh-ic green">✓</span>نسبة الحل من أول رد</div><div class="vl">64%</div></div>
          <div class="kpi"><div class="lb"><span class="ic gh-ic blue">★</span>رضا العملاء</div><div class="vl">4.5</div></div>
        </div>
        <div class="grid2">
          ${card(cardH('حجم التذاكر خلال الفترة')+`<div class="card-b">${spark([40,55,48,62,70,58,66],5)}<div class="legend"><span>أسبوع 1</span><span>أسبوع 2</span><span>أسبوع 3</span><span>أسبوع 4</span></div></div>`)}
          ${card(cardH('التصنيف الأعلى')+`<div class="card-b">${bars([
            ['مالي / تسويات',28,'#C62828'],['مشاكل دفع',22,'#E8A23A'],['الحجز والاستلام',18,'#2C68D8'],
            ['سياسة الإلغاء',14,'#6B5CE7'],['أخرى',18,'#5A657C']
          ])}</div>`)}
        </div>
        ${note('info','نموذج العمل','الملخص يحاكي دورة الدعم: فتح ← أول رد ← معالجة ← حل/إغلاق، مع قياس الالتزام بـ SLA ورضا العميل.')}
        ${table(['المؤشر','القيمة','الهدف','الحالة'],[
          ['متوسط وقت أول رد','48 دقيقة','≤ 60 دقيقة',bdg('ضمن الهدف','g')],
          ['متوسط وقت الإغلاق','1ي 6س','≤ 2 يوم',bdg('ضمن الهدف','g')],
          ['الالتزام بـ SLA','91%','≥ 90%',bdg('ضمن الهدف','g')],
          ['إعادة فتح التذكرة','7%','≤ 10%',bdg('ضمن الهدف','g')],
          ['تصعيد للمدير','4%','≤ 5%',bdg('ضمن الهدف','g')]
        ])}
      </div>`);
  };

  /* —— الإعدادات التشغيلية —— */
  const OPS_KEY='wafra-ops-settings-v1';
  const escAttr=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const defaultOps=()=>({
    cancel:[
      {tone:'free',badge:'مجاني',title:'الإلغاء قبل موعد الاستلام بـ 6 ساعات أو أكثر',hours:'6',fee:'0',note:'لا تُحتسب أي رسوم على العميل · استرداد كامل للدفعة'},
      {tone:'mid',badge:'25%',title:'الإلغاء خلال 6 ساعات من موعد الاستلام',hours:'6',fee:'25',note:'خصم 25% من قيمة اليوم الأول · يُسترد الباقي للعميل'},
      {tone:'full',badge:'يوم كامل',title:'عدم الحضور أو الإلغاء بعد الموعد',hours:'0',fee:'100',note:'خصم قيمة يوم كامل من الدفعة الأصلية'}
    ],
    booking:{providerReply:'30 دقيقة',noShowWindow:'60 دقيقة',minDays:'يوم واحد',maxDays:'90 يوماً',editHours:'24 ساعة',lateGrace:'59 دقيقة'},
    finance:{commission:'15%',lateFine:'100% من السعر اليومي',settleCycle:'أسبوعية',vat:'15%'},
    slaOps:[
      {name:'قبول / رفض الحجز',type:'تشغيلي',sla:'30 دقيقة',escalation:'تذكير للمزود ← إلغاء واسترداد كامل'},
      {name:'تسليم المركبة',type:'تشغيلي',sla:'ساعتان من الموعد',escalation:'تصعيد لمدير العمليات'},
      {name:'اعتماد التسوية',type:'مالي',sla:'48 ساعة',escalation:'تصعيد للمالية'},
      {name:'تنفيذ التحويل البنكي',type:'مالي',sla:'72 ساعة بعد الاعتماد',escalation:'تنبيه المدير المالي'},
      {name:'صرف الاسترداد المعتمد',type:'مالي',sla:'5 أيام عمل',escalation:'تصعيد للمالية + إشعار العميل'}
    ],
    slaSupport:{firstReply:'60 دقيقة',ticketNormal:'48 ساعة',ticketUrgent:'8 ساعات',disputeReply:'36 ساعة'},
    escalate:[
      {status:'تذكرة دعم',cond:'تجاوز مهلة الحل أو أولوية عاجلة بلا رد',to:'مشرف الدعم',action:'إعادة إسناد + تنبيه'},
      {status:'شكوى عميل',cond:'تكرار الشكوى مرتين أو تقييم ≤ 2',to:'مدير العمليات',action:'فتح تحقيق'},
      {status:'نزاع / تظلّم',cond:'انتهاء مهلة رد المزود دون رد',to:'اعتماد آلي للخصم',action:'إغلاق وإدراج في التسوية'},
      {status:'نزاع معترض عليه',cond:'المزود اعترض خلال المهلة',to:'لجنة الحسم',action:'قرار نهائي خلال 24 ساعة'}
    ],
    refunds:[
      {case:'إلغاء ≥ 6 ساعات قبل الاستلام',cond:'حسب شريحة الإلغاء',value:'100%',note:'مجاني'},
      {case:'إلغاء خلال 6 ساعات',cond:'حسب شريحة الإلغاء',value:'استرداد بعد خصم 25% من اليوم الأول',note:'—'},
      {case:'عدم حضور / إلغاء بعد الموعد',cond:'حسب شريحة الإلغاء',value:'استرداد بعد خصم يوم كامل',note:'—'},
      {case:'إرجاع مبكر بعد الاستلام',cond:'تم الاستلام ولم تُكمل المدة',value:'المتبقي من الدفعة غير المستخدم',note:'عبر إنشاء استرداد'},
      {case:'عطل سيارة / عدم توفر',cond:'مثبت من الدعم أو المزود',value:'100% أو بديل',note:'تعويض اختياري بكوبون'},
      {case:'خصم مزدوج / خطأ تحصيل',cond:'مثبت محاسبياً',value:'كامل الفرق',note:'أولوية عاجلة'}
    ],
    channels:{push:true,email:true,sms:true,wa:false},
    payments:{mada:true,visa:true,apple:true,stc:true,wallet:false},
    peak:{periods:'الخميس والجمعة · مواسم الإجازات',uplift:'حتى 40%'},
    access:{license:true,guests:false,hideExpired:true}
  });
  const loadOps=()=>{
    try{
      const raw=JSON.parse(localStorage.getItem(OPS_KEY)||'null');
      if(raw&&typeof raw==='object') return Object.assign(defaultOps(),raw,{
        cancel:raw.cancel||defaultOps().cancel,
        booking:Object.assign(defaultOps().booking,raw.booking||{}),
        finance:Object.assign(defaultOps().finance,raw.finance||{}),
        slaOps:raw.slaOps||defaultOps().slaOps,
        slaSupport:Object.assign(defaultOps().slaSupport,raw.slaSupport||{}),
        escalate:raw.escalate||defaultOps().escalate,
        refunds:raw.refunds||defaultOps().refunds,
        channels:Object.assign(defaultOps().channels,raw.channels||{}),
        payments:Object.assign(defaultOps().payments,raw.payments||{}),
        peak:Object.assign(defaultOps().peak,raw.peak||{}),
        access:Object.assign(defaultOps().access,raw.access||{})
      });
    }catch(e){}
    return defaultOps();
  };
  const saveOps=s=>{try{localStorage.setItem(OPS_KEY,JSON.stringify(s));}catch(e){}};
  const inpV=(id,val,type='text')=>`<input id="${id}" class="native-input" type="${type}" value="${escAttr(val)}">`;
  const selV=(id,val,opts)=>`<select id="${id}" class="native-input">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  const tgBtn=(id,on)=>`<button type="button" class="tg ${on?'on':''}" id="${id}" data-on="${on?1:0}" onclick="this.classList.toggle('on');this.dataset.on=this.classList.contains('on')?'1':'0'"></button>`;
  const swEdit=(id,title,sub,on)=>`<div class="sw-row"><div class="tx"><b>${title}</b><span>${sub}</span></div>${tgBtn(id,!!on)}</div>`;

  if(!document.getElementById('wafra-settings-p51')){
    const st=document.createElement('style');
    st.id='wafra-settings-p51';
    st.textContent=`
      .cancel-tiers{display:flex;flex-direction:column;gap:10px}
      .ct-row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid #E6EAF3;background:#FAFBFE}
      .ct-row.free{border-color:#C6EBD8;background:#F3FBF7}
      .ct-row.mid{border-color:#F3E2B3;background:#FFFBF0}
      .ct-row.full{border-color:#F5C6C6;background:#FFF5F5}
      .ct-badge{flex:0 0 auto;min-width:88px;text-align:center;font:800 12px Cairo;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid #E6EAF3}
      .ct-row.free .ct-badge{color:#148A5A;border-color:#C6EBD8}
      .ct-row.mid .ct-badge{color:#9A6B00;border-color:#F3E2B3}
      .ct-row.full .ct-badge{color:#C62828;border-color:#F5C6C6}
      .ct-row .ct-fields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
      .ct-row .ct-fields .native-input{width:100%}
      .set-sec{margin-bottom:16px}
      .pay-row,.ch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F6}
      .pay-row:last-child,.ch-row:last-child{border-bottom:0}
      .set-edit-table input.native-input,.set-edit-table select.native-input{min-width:110px;font-size:12.5px;padding:7px 10px}
    `;
    document.head.appendChild(st);
  }

  Object.assign(WafraOps,{
    saveOpsSettings:()=>{
      const s=loadOps();
      s.cancel=s.cancel.map((c,i)=>({
        ...c,
        badge:document.getElementById('cn-badge-'+i)?.value??c.badge,
        title:document.getElementById('cn-title-'+i)?.value??c.title,
        hours:document.getElementById('cn-hours-'+i)?.value??c.hours,
        fee:document.getElementById('cn-fee-'+i)?.value??c.fee,
        note:document.getElementById('cn-note-'+i)?.value??c.note
      }));
      s.booking={
        providerReply:document.getElementById('bk-providerReply')?.value||s.booking.providerReply,
        noShowWindow:document.getElementById('bk-noShowWindow')?.value||s.booking.noShowWindow,
        minDays:document.getElementById('bk-minDays')?.value||s.booking.minDays,
        maxDays:document.getElementById('bk-maxDays')?.value||s.booking.maxDays,
        editHours:document.getElementById('bk-editHours')?.value||s.booking.editHours,
        lateGrace:document.getElementById('bk-lateGrace')?.value||s.booking.lateGrace
      };
      s.finance={
        commission:document.getElementById('fn-commission')?.value||s.finance.commission,
        lateFine:document.getElementById('fn-lateFine')?.value||s.finance.lateFine,
        settleCycle:document.getElementById('fn-settleCycle')?.value||s.finance.settleCycle,
        vat:document.getElementById('fn-vat')?.value||s.finance.vat
      };
      s.slaOps=s.slaOps.map((r,i)=>({
        name:document.getElementById('sla-name-'+i)?.value??r.name,
        type:document.getElementById('sla-type-'+i)?.value??r.type,
        sla:document.getElementById('sla-sla-'+i)?.value??r.sla,
        escalation:document.getElementById('sla-esc-'+i)?.value??r.escalation
      }));
      s.slaSupport={
        firstReply:document.getElementById('ss-firstReply')?.value||s.slaSupport.firstReply,
        ticketNormal:document.getElementById('ss-ticketNormal')?.value||s.slaSupport.ticketNormal,
        ticketUrgent:document.getElementById('ss-ticketUrgent')?.value||s.slaSupport.ticketUrgent,
        disputeReply:document.getElementById('ss-disputeReply')?.value||s.slaSupport.disputeReply
      };
      s.escalate=s.escalate.map((r,i)=>({
        status:document.getElementById('es-status-'+i)?.value??r.status,
        cond:document.getElementById('es-cond-'+i)?.value??r.cond,
        to:document.getElementById('es-to-'+i)?.value??r.to,
        action:document.getElementById('es-action-'+i)?.value??r.action
      }));
      s.refunds=s.refunds.map((r,i)=>({
        case:document.getElementById('rf-case-'+i)?.value??r.case,
        cond:document.getElementById('rf-cond-'+i)?.value??r.cond,
        value:document.getElementById('rf-value-'+i)?.value??r.value,
        note:document.getElementById('rf-note-'+i)?.value??r.note
      }));
      s.channels={
        push:document.getElementById('ch-push')?.dataset.on==='1',
        email:document.getElementById('ch-email')?.dataset.on==='1',
        sms:document.getElementById('ch-sms')?.dataset.on==='1',
        wa:document.getElementById('ch-wa')?.dataset.on==='1'
      };
      s.payments={
        mada:document.getElementById('pay-mada')?.dataset.on==='1',
        visa:document.getElementById('pay-visa')?.dataset.on==='1',
        apple:document.getElementById('pay-apple')?.dataset.on==='1',
        stc:document.getElementById('pay-stc')?.dataset.on==='1',
        wallet:document.getElementById('pay-wallet')?.dataset.on==='1'
      };
      s.peak={
        periods:document.getElementById('pk-periods')?.value||s.peak.periods,
        uplift:document.getElementById('pk-uplift')?.value||s.peak.uplift
      };
      s.access={
        license:document.getElementById('ac-license')?.dataset.on==='1',
        guests:document.getElementById('ac-guests')?.dataset.on==='1',
        hideExpired:document.getElementById('ac-hideExpired')?.dataset.on==='1'
      };
      saveOps(s);
      toast('تم حفظ الإعدادات التشغيلية.');
      render();
    },
    resetOpsSettings:()=>{
      try{localStorage.removeItem(OPS_KEY);}catch(e){}
      toast('أُعيدت القيم الافتراضية.');
      render();
    },
    editPayMethod:id=>{
      openM(modal('تعديل وسيلة الدفع',`
        ${fld('الاسم',`<input id="pm-name" class="native-input" value="${escAttr(id)}">`)}
        ${fld('رسوم البوابة (%)',`<input id="pm-fee" class="native-input" type="number" value="1.5" step="0.1">`)}
        ${fld('الحالة',`<select id="pm-st" class="native-input"><option>مفعّلة</option><option>موقوفة</option></select>`)}
      `,`<button class="btn coral" onclick="closeM();WafraOps.demoAction('تم حفظ وسيلة الدفع')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    }
  });

  S.settings=()=>{
    const o=loadOps();
    const cancelUI=`<div class="cancel-tiers">${o.cancel.map((c,i)=>`
      <div class="ct-row ${c.tone}">
        <div class="ct-badge"><input id="cn-badge-${i}" class="native-input" value="${escAttr(c.badge)}" style="text-align:center;font-weight:800;border:0;background:transparent;padding:0"></div>
        <div class="ct-fields">
          ${fld('العنوان',inpV('cn-title-'+i,c.title))}
          <div class="frow">${fld('الحد (ساعات قبل الاستلام)',inpV('cn-hours-'+i,c.hours,'number'))}${fld('نسبة / قيمة الرسوم %',inpV('cn-fee-'+i,c.fee,'number'))}</div>
          ${fld('التفاصيل',inpV('cn-note-'+i,c.note))}
        </div>
      </div>`).join('')}</div>`;

    return phead('الإعدادات التشغيلية','جميع القيم قابلة للتعديل من الإدارة — يُحفظ التعديل في سجل التدقيق',[],
      `<button class="btn ghost" onclick="WafraOps.resetOpsSettings()">إعادة الافتراضي</button>
       <button class="btn ghost" onclick="render()">إلغاء</button>
       <button class="btn coral" onclick="WafraOps.saveOpsSettings()">حفظ التغييرات</button>`)
      +note('warn','هذه القيم تؤثّر على كل الحجوزات الجديدة','التعديل لا يسري على الحجوزات القائمة، ويُسجَّل في سجل التدقيق بالقيمة قبل وبعد.')

      +card(cardH('شرائح تطبيق الخصم عند الإلغاء','يمكن تعديل العتبات والنسب والتفاصيل من الإدارة')+`<div class="card-b">${cancelUI}</div>`)

      +`<div class="grid2 set-sec">`
      +card(cardH('الحجز والردّ')+`<div class="card-b">
        <div class="frow">${fld('مهلة ردّ المزوّد',inpV('bk-providerReply',o.booking.providerReply))}${fld('نافذة تسجيل عدم الحضور',inpV('bk-noShowWindow',o.booking.noShowWindow))}</div>
        <div class="frow">${fld('أقل مدة حجز',inpV('bk-minDays',o.booking.minDays))}${fld('أقصى مدة حجز',inpV('bk-maxDays',o.booking.maxDays))}</div>
        <div class="frow">${fld('عدد الساعات المسموحة للتعديل',inpV('bk-editHours',o.booking.editHours))}${fld('مدة السماح قبل احتساب التأخير',inpV('bk-lateGrace',o.booking.lateGrace))}</div>
      </div>`)
      +card(cardH('المالية')+`<div class="card-b">
        <div class="frow">${fld('نسبة العمولة العامة',inpV('fn-commission',o.finance.commission))}${fld('حد غرامة التأخير اليومية',inpV('fn-lateFine',o.finance.lateFine))}</div>
        <div class="frow">${fld('دورة التسوية الافتراضية',selV('fn-settleCycle',o.finance.settleCycle,['أسبوعية','شهرية','نصف شهرية']))}${fld('ضريبة القيمة المضافة',inpV('fn-vat',o.finance.vat))}</div>
      </div>`)
      +`</div>`

      +card(cardH('SLA — المعايير التشغيلية والمالية','مهل الرد والإنجاز قابلة للتعديل')+`<div class="card-b set-edit-table">${table(['المعيار','النوع','المهلة','التصعيد عند التجاوز'],
        o.slaOps.map((r,i)=>[
          inpV('sla-name-'+i,r.name),
          selV('sla-type-'+i,r.type,['تشغيلي','مالي','دعم']),
          inpV('sla-sla-'+i,r.sla),
          inpV('sla-esc-'+i,r.escalation)
        ]))}</div>`)

      +card(cardH('SLA — خدمة العملاء ومعالجة الشكاوى والمنازلات','مهل الرد وقواعد التصعيد قابلة للتعديل')+`<div class="card-b">
        <div class="frow">
          ${fld('مهلة أول رد للدعم',inpV('ss-firstReply',o.slaSupport.firstReply))}
          ${fld('مهلة حل التذكرة (عادية)',inpV('ss-ticketNormal',o.slaSupport.ticketNormal))}
        </div>
        <div class="frow">
          ${fld('مهلة حل التذكرة (عاجلة)',inpV('ss-ticketUrgent',o.slaSupport.ticketUrgent))}
          ${fld('مهلة رد المزود على النزاع / التظلّم',inpV('ss-disputeReply',o.slaSupport.disputeReply))}
        </div>
        <div class="set-edit-table">${table(['الحالة','شرط التصعيد','إلى','الإجراء'],
          o.escalate.map((r,i)=>[
            inpV('es-status-'+i,r.status),
            inpV('es-cond-'+i,r.cond),
            inpV('es-to-'+i,r.to),
            inpV('es-action-'+i,r.action)
          ]))}</div>
      </div>`)

      +card(cardH('معايير استرداد العملاء','حالات الاسترداد والنسب قابلة للتعديل')+`<div class="card-b set-edit-table">${table(['الحالة','الشرط','نسبة / قيمة الاسترداد','ملاحظة'],
        o.refunds.map((r,i)=>[
          inpV('rf-case-'+i,r.case),
          inpV('rf-cond-'+i,r.cond),
          inpV('rf-value-'+i,r.value),
          inpV('rf-note-'+i,r.note)
        ]))}</div>`)

      +`<div class="grid2">`
      +card(cardH('قنوات الإشعارات','تفعيل أو إيقاف كل قناة')+`<div class="card-b">
        <div class="ch-row"><div><b>إشعار داخل التطبيق (Push)</b><span class="sub">للحجوزات والتنبيهات الفورية</span></div>${tgBtn('ch-push',o.channels.push)}</div>
        <div class="ch-row"><div><b>البريد الإلكتروني</b><span class="sub">الملخصات والفواتير</span></div>${tgBtn('ch-email',o.channels.email)}</div>
        <div class="ch-row"><div><b>رسالة نصية SMS</b><span class="sub">OTP والتنبيهات الحرجة</span></div>${tgBtn('ch-sms',o.channels.sms)}</div>
        <div class="ch-row"><div><b>واتساب للأعمال</b><span class="sub">اختياري — حملات وتذكير</span></div>${tgBtn('ch-wa',o.channels.wa)}</div>
      </div>`)
      +card(cardH('وسائل الدفع المتاحة','التحكم والتعديل على البوابات')+`<div class="card-b">
        ${[['mada','مدى'],['visa','Visa / Mastercard'],['apple','Apple Pay'],['stc','STC Pay'],['wallet','محفظة وفرا']].map(([id,name])=>`
          <div class="pay-row">
            <div><b>${name}</b><span class="sub">بوابة نشطة</span></div>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn ghost sm" onclick="WafraOps.editPayMethod('${name}')">تعديل</button>
              ${tgBtn('pay-'+id,!!o.payments[id])}
            </div>
          </div>`).join('')}
      </div>`)
      +`</div>`

      +`<div class="grid2">`
      +card(cardH('أوقات الذروة')+`<div class="card-b">
        ${fld('فترات الذروة',inpV('pk-periods',o.peak.periods))}
        ${fld('نسبة الزيادة المسموحة في الذروة',inpV('pk-uplift',o.peak.uplift))}
      </div>`)
      +card(cardH('التوثيق والوصول')+`<div class="card-b">
        ${swEdit('ac-license','إلزام توثيق رخصة القيادة قبل الحجز','يمنع إتمام الحجز قبل قبول الوثيقة',o.access.license)}
        ${swEdit('ac-guests','السماح بالحجز للزوّار','بدون إنشاء حساب',o.access.guests)}
        ${swEdit('ac-hideExpired','الإخفاء التلقائي عند انتهاء الاستمارة','تُخفى السيارة فور انتهاء وثيقتها',o.access.hideExpired)}
      </div>`)
      +`</div>`;
  };

  /* —— صلاحيات الحقول: زر إضافة حقل —— */
  const FIELDS_KEY='wafra-field-perms-fields-v1';
  const defaultFieldDefs=[
    {id:'nationalId',label:'رقم الهوية'},
    {id:'iban',label:'الآيبان البنكي'},
    {id:'mobile',label:'الجوال'},
    {id:'email',label:'البريد الإلكتروني'}
  ];
  const loadFieldDefs=()=>{
    try{const r=JSON.parse(localStorage.getItem(FIELDS_KEY)||'null'); if(Array.isArray(r)&&r.length) return r;}catch(e){}
    return defaultFieldDefs.slice();
  };
  const saveFieldDefs=arr=>{try{localStorage.setItem(FIELDS_KEY,JSON.stringify(arr));}catch(e){}};

  Object.assign(WafraOps,{
    openAddSensitiveField:()=>{
      openM(modal('إضافة حقل حساس جديد',`
        ${fld('معرّف الحقل (إنجليزي)',`<input id="sf-id" class="native-input" placeholder="مثال: passportNo">`)}
        ${fld('اسم الحقل (عربي)',`<input id="sf-label" class="native-input" placeholder="مثال: رقم جواز السفر">`)}
        ${note('info','الصلاحيات','بعد الإضافة يظهر الحقل في المصفوفة ويمكن تفعيل إظهاره لكل دور.')}
      `,`<button class="btn" onclick="WafraOps.saveSensitiveField()">إضافة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    saveSensitiveField:()=>{
      const id=(document.getElementById('sf-id')?.value||'').trim().replace(/\s+/g,'_');
      const label=(document.getElementById('sf-label')?.value||'').trim();
      if(!id||!label){toast('أكمل معرّف واسم الحقل.');return;}
      const defs=loadFieldDefs();
      if(defs.some(f=>f.id===id)){toast('المعرّف موجود مسبقاً.');return;}
      defs.push({id,label});
      saveFieldDefs(defs);
      /* أضفه لمصفوفة الصلاحيات إن وُجدت */
      try{
        const KEY='wafra-field-perms-v1';
        const m=JSON.parse(localStorage.getItem(KEY)||'{}')||{};
        m[id]={finance:false,ops:false,regional:false,company:false,content:false,support:false};
        localStorage.setItem(KEY,JSON.stringify(m));
      }catch(e){}
      closeM(); toast(`تم إضافة الحقل «${label}».`); render();
    }
  });

  const prevFieldPerms=S.fieldPermissions;
  S.fieldPermissions=()=>{
    /* أعد بناء المصفوفة مع الحقول المخصصة */
    const roles=[
      {id:'finance',letter:'ما',color:'#3B6FE2',name:'المدير المالي'},
      {id:'ops',letter:'ع',color:'#5B6B8C',name:'مدير العمليات'},
      {id:'regional',letter:'ر',color:'#C45C26',name:'مدير إقليمي'},
      {id:'company',letter:'ش',color:'#2F7D57',name:'مدير شركة'},
      {id:'content',letter:'ت',color:'#8A651A',name:'مدير المحتوى والتسويق'},
      {id:'support',letter:'ه',color:'#6B5B95',name:'مسؤول الدعم'}
    ];
    const fields=loadFieldDefs();
    const KEY='wafra-field-perms-v1';
    let m={};
    try{m=Object.assign({},JSON.parse(localStorage.getItem(KEY)||'null')||{});}catch(e){m={};}
    const head=roles.map(r=>`<th><div class="sfp-role"><span class="badge-ltr" style="background:${r.color}">${r.letter}</span><span class="nm">${r.name}</span></div></th>`).join('');
    const rows=fields.map(f=>{
      const row=m[f.id]||{};
      const cells=roles.map(r=>{
        const on=!!row[r.id];
        return `<td><button type="button" class="sfp-tg ${on?'on':''}" aria-label="${f.label}" onclick="WafraFieldPerms&&WafraFieldPerms.toggle('${f.id}','${r.id}')"></button></td>`;
      }).join('');
      return `<tr><td>${f.label}</td>${cells}</tr>`;
    }).join('');
    return phead('صلاحيات الحقول الحساسة','تحكم دقيق بإظهار أو إخفاء الحقول الحساسة حسب الدور',[],
      `<button class="btn coral" onclick="WafraOps.openAddSensitiveField()">＋ إضافة حقل جديد</button>`)
      +`<div class="sfp-card">
          <div class="sfp-head">
            <h2>صلاحيات الحقول الحساسة</h2>
            <p>تحكم دقيق: إخفاء أعمدة بعينها عن أدوار محددة دون حجب الوحدة كاملة. «مدير النظام» يرى الكل دائماً.</p>
          </div>
          <div class="tw" style="padding:0 8px 8px">
            <table class="sfp-table">
              <thead><tr><th>الحقل</th>${head}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="sfp-foot">المفتاح الفعّال = الحقل ظاهر لهذا الدور. المطفأ = مقنّع، يُطبّق فوراً على ملفات المستأجرين والمزوّدين.</div>
        </div>`;
  };
  if(window.TITLES) window.TITLES.fieldPermissions='صلاحيات الحقول الحساسة';
})();
</script>
