<style id="wafra-operations">
/* المؤشرات التشغيلية — تخطيط محسّن */
.op-wrap{display:flex;flex-direction:column;gap:20px;padding:16px 18px 20px}
.op-group{display:flex;flex-direction:column;gap:10px}
.op-group-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.op-group-h h3{margin:0;font:800 13.5px Cairo;color:var(--ink);display:flex;align-items:center;gap:8px}
.op-group-h h3::before{content:'';width:4px;height:16px;border-radius:4px;background:var(--navy);display:inline-block}
.op-group-h .sub{font:600 12px Cairo;color:var(--muted)}
.op-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.op-kpi{background:#fff;border:1px solid #E6EAF3;border-radius:16px;padding:14px 14px 12px;box-shadow:0 6px 16px rgba(25,42,84,.045);display:flex;flex-direction:column;gap:8px;min-width:0;min-height:128px;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}
.op-kpi:hover{border-color:#C8D2E8;box-shadow:0 10px 22px rgba(25,42,84,.08);transform:translateY(-1px)}
.op-kpi::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--accent,#293B85);opacity:.85}
.op-kpi.t-fleet{--accent:#C62828}.op-kpi.t-ok{--accent:#2C68D8}.op-kpi.t-rent{--accent:#C9A227}
.op-kpi.t-warn{--accent:#D97706}.op-kpi.t-doc{--accent:#3B82C4}.op-kpi.t-open{--accent:#2563EB}
.op-kpi.t-done{--accent:#1F6B4A}.op-kpi.t-cancel{--accent:#64748B}.op-kpi.t-time{--accent:#0EA5E9}
.op-kpi.t-people{--accent:#7C3AED}.op-kpi.t-co{--accent:#0369A1}.op-kpi.t-pin{--accent:#DB2777}
.op-kpi.t-flag{--accent:#E23D3D}.op-kpi.t-ticket{--accent:#B45309}
.op-kpi .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.op-kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;background:#EEF2FA;color:var(--navy)}
.op-kpi .ic.fleet{background:#FDECEC;color:#C62828}
.op-kpi .ic.ok{background:#EAF0FF;color:#2C68D8}
.op-kpi .ic.rent{background:#FFF8E6;color:#B8860B}
.op-kpi .ic.warn{background:#FFF1E8;color:#D97706}
.op-kpi .ic.doc{background:#E8F2FF;color:#3B82C4}
.op-kpi .ic.open{background:#EAF0FF;color:#2563EB}
.op-kpi .ic.done{background:#E8F8F0;color:#148A5A}
.op-kpi .ic.cancel{background:#EEF1F6;color:#5A657C}
.op-kpi .ic.time{background:#E0F2FE;color:#0284C7}
.op-kpi .ic.people{background:#F3EEFF;color:#7C3AED}
.op-kpi .ic.co{background:#E0F2FE;color:#0369A1}
.op-kpi .ic.pin{background:#FCE7F3;color:#DB2777}
.op-kpi .ic.flag{background:#FDECEC;color:#E23D3D}
.op-kpi .ic.ticket{background:#FFF4DE;color:#B45309}
.op-kpi .l{font:700 12.5px Cairo;color:#5A657C;line-height:1.35;flex:1}
.op-kpi .v{font:800 22px Cairo;color:var(--ink);letter-spacing:-.02em;line-height:1.15;direction:ltr;text-align:right}
.op-kpi .v small{font-size:12px;font-weight:700;color:var(--muted);margin-inline-start:3px}
.op-kpi .chg{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font:700 11.5px Cairo;width:fit-content;padding:4px 9px;border-radius:99px;background:#F4F6FA;color:#5A657C}
.op-kpi .chg.up{background:#E8F8F0;color:#148A5A}
.op-kpi .chg.dn{background:#FDECEC;color:#C62828}
.op-kpi .chg.fl{background:#EEF1F6;color:#5A657C}
.op-kpi .chg .lbl{font-weight:600;color:inherit;opacity:.75;font-size:10.5px}
.op-grid{display:grid;grid-template-columns:1.05fr 1.2fr;gap:14px}
.op-panel{background:#fff;border:1px solid #E6EAF3;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(25,42,84,.04)}
.op-panel-h{padding:14px 16px;border-bottom:1px solid #EEF1F7;font:800 14px Cairo;color:var(--ink)}
.op-panel-b{padding:12px 14px 16px}
.op-panel-b svg{width:100%;height:auto;display:block}
.op-gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.op-gauge{text-align:center}
.op-gauge .nm{font:700 11.5px Cairo;color:var(--muted);margin-top:2px;line-height:1.4;min-height:32px;display:flex;align-items:flex-start;justify-content:center}
@media(max-width:1200px){
  .op-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .op-grid{grid-template-columns:1fr}
  .op-gauges{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
  .op-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .op-gauges{grid-template-columns:repeat(2,1fr)}
  .op-kpi{min-height:118px;padding:12px}
  .op-kpi .v{font-size:20px}
}
</style>
<script>
/* المؤشرات التشغيلية — واجهة محسّنة. */
(function(){
  const tabs=[['search','البحث والتحليل'],['compare','المقارنات'],['technical','التحليل الفني'],['operations','المؤشرات التشغيلية'],['financial','النظرة المالية'],['map','الخريطة التفاعلية'],['delivery','خدمة التوصيل'],['scheduled','التقارير المجدولة'],['sla','مراقبة مستوى الخدمة'],['transfer','النقل بين الفروع']];
  const tabbar=active=>`<div class="tabs">${tabs.map(([key,label])=>`<button class="tab ${active===key?'on':''}" onclick="WafraOps.switchAnalyticsTab('${key}')">${label}</button>`).join('')}</div>`;
  const C={navy:'#293B85',blue:'#2C68D8',green:'#20A16E',red:'#E23D3D',amber:'#EAA631',ink:'#1E2A44',muted:'#7A869E',line:'#E4E9F3'};

  const kpiCard=(ic,label,value,chg,tone,icCls)=>{
    const dir=chg&&chg.t==='dn'?'dn':chg&&chg.t==='fl'?'fl':'up';
    const arrow=dir==='dn'?'▼':dir==='fl'?'●':'▲';
    const chgHtml=chg?`<div class="chg ${dir}"><span>${arrow} ${chg.p}</span><span class="lbl">مقارنة بالفترة السابقة</span></div>`:'';
    return `<div class="op-kpi ${tone||''}">
      <div class="top"><div class="l">${label}</div><div class="ic ${icCls||''}">${ic}</div></div>
      <div class="v">${value}</div>
      ${chgHtml}
    </div>`;
  };

  const group=(title,hint,cards)=>`<div class="op-group">
    <div class="op-group-h"><h3>${title}</h3>${hint?`<span class="sub">${hint}</span>`:''}</div>
    <div class="op-kpis">${cards}</div>
  </div>`;

  const contractBars=()=>{
    const items=[['مفتوح',3705,C.blue],['مغلق',4120,C.green],['ملغي',1707,C.red],['منتهي',4200,C.navy],['متأخر',1300,C.amber]];
    const W=420,H=250,p={l:42,r:12,t:16,b:40},pw=W-p.l-p.r,ph=H-p.t-p.b,mx=4500;
    const y=v=>p.t+ph-(v/mx)*ph;
    const gap=pw/items.length,bw=gap*0.48;
    const grid=[0,1500,3000,4500].map(v=>`<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-family="Cairo" font-size="10" fill="${C.muted}">${v.toLocaleString('en')}</text>`).join('');
    const bars=items.map(([n,v,c],i)=>{
      const cx=p.l+i*gap+gap/2;
      return `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${p.t+ph-y(v)}" rx="6" fill="${c}"/><text x="${cx}" y="${H-12}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}">${n}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="حالة العقود">${grid}${bars}</svg>`;
  };

  const gauge=(pct,color,label)=>{
    const start=Math.PI, cx=70, cy=68, r=48;
    const ang=start-(Math.min(100,pct)/100)*Math.PI;
    const arc=(a0,a1,col,w=12)=>{
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      return `<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    const tipX=cx+r*Math.cos(ang), tipY=cy+r*Math.sin(ang);
    const txt=Number.isInteger(pct)?`${pct}%`:`${pct}%`;
    return `<div class="op-gauge"><svg viewBox="0 0 140 100" role="img" aria-label="${label}">
      ${arc(Math.PI,0,'#E8EDF7',12)}
      ${arc(Math.PI,ang,color,12)}
      <circle cx="${tipX}" cy="${tipY}" r="5" fill="${color}" stroke="#fff" stroke-width="2"/>
      <text x="70" y="78" text-anchor="middle" font-family="Cairo" font-size="18" font-weight="800" fill="${C.ink}">${txt}</text>
    </svg><div class="nm">${label}</div></div>`;
  };

  const baseAnalytics=S.analytics;
  S.analytics=()=>{
    const active=window.__analyticsTab||'search';
    if(active!=='operations') return baseAnalytics();

    const fleet=[
      kpiCard('🚗','أسطول المركبات','6,494',{p:'3.2%',t:'up'},'t-fleet','fleet'),
      kpiCard('✓','المتاحة','920',{p:'1.8%',t:'up'},'t-ok','ok'),
      kpiCard('🔑','المؤجرة','3,806',{p:'4.6%',t:'up'},'t-rent','rent'),
      kpiCard('⚠','المتعطلة','871',{p:'2.1%',t:'dn'},'t-warn','warn')
    ].join('');

    const contracts=[
      kpiCard('📄','إجمالي العقود','14,926',{p:'6.4%',t:'up'},'t-doc','doc'),
      kpiCard('◉','العقود المفتوحة','3,705',{p:'2.9%',t:'up'},'t-open','open'),
      kpiCard('▣','العقود المغلقة','8,230',{p:'5.1%',t:'up'},'t-done','done'),
      kpiCard('✕','العقود الملغاة','1,707',{p:'1.4%',t:'dn'},'t-cancel','cancel')
    ].join('');

    const times=[
      kpiCard('◷','متوسط مدة الإيجار','22.5 <small>يوم</small>',{p:'0.8%',t:'up'},'t-time','time'),
      kpiCard('🚚','متوسط وقت التسليم','31 <small>د</small>',{p:'3.5%',t:'dn'},'t-warn','warn'),
      kpiCard('⏱','متوسط وقت الاستجابة','61 <small>د</small>',{p:'2.2%',t:'dn'},'t-time','time')
    ].join('');

    const network=[
      kpiCard('👤','عدد العملاء','520',{p:'4.1%',t:'up'},'t-people','people'),
      kpiCard('👥','عدد المستخدمين','64',{p:'1.6%',t:'up'},'t-people','people'),
      kpiCard('🏢','عدد الشركات','28',{p:'7.4%',t:'up'},'t-co','co'),
      kpiCard('📍','عدد الفروع','242',{p:'2.5%',t:'up'},'t-pin','pin'),
      kpiCard('⚑','عدد الشكاوى','779',{p:'5.8%',t:'dn'},'t-flag','flag'),
      kpiCard('🎫','عدد التذاكر','310',{p:'3.3%',t:'dn'},'t-ticket','ticket')
    ].join('');

    const gauges=`<div class="op-gauges">
      ${gauge(73,C.green,'معدل الإشغال')}
      ${gauge(11.4,C.red,'معدل الإلغاء')}
      ${gauge(98,C.green,'معدل التحصيل')}
      ${gauge(99.6,C.green,'معدل الاحتفاظ بالعملاء')}
      ${gauge(96.5,C.green,'معدل تكرار الاستئجار')}
    </div>`;

    const body=`<div class="op-wrap">
      ${group('الأسطول','حالة المركبات',fleet)}
      ${group('العقود','حجم العقود وحالاتها',contracts)}
      ${group('الأوقات التشغيلية','مدة الإيجار والاستجابة',times)}
      ${group('الشبكة والدعم','العملاء · الفروع · التذاكر',network)}
      <div class="op-grid">
        <div class="op-panel"><div class="op-panel-h">حالة العقود</div><div class="op-panel-b">${contractBars()}</div></div>
        <div class="op-panel"><div class="op-panel-h">المعدلات التشغيلية</div><div class="op-panel-b">${gauges}</div></div>
      </div>
    </div>`;

    return phead('المؤشرات التشغيلية','مؤشرات الأداء التشغيلي (Operational KPIs) محسوبة تلقائياً من بيانات المنصة',[],`<button class="btn ghost" onclick="WafraOps.demoAction('تصدير المؤشرات التشغيلية')">⤒ تصدير</button>`)
      +card(tabbar(active)+body);
  };
})();
</script>
