<script>
/* فلاتر فعلية لمحرك البحث والسيارات، تحفظ آخر اختيار أثناء جلسة الإدارة. */
(function(){
  const searchData=[
    {name:'شركة الصحراء',type:'مزود',city:'الرياض',status:'نشط',bookings:'642',revenue:'286,400'},
    {name:'كي رنت',type:'مزود',city:'جدة',status:'نشط',bookings:'518',revenue:'241,900'},
    {name:'أحمد الشمري',type:'عميل',city:'الرياض',status:'نشط',bookings:'14',revenue:'12,840'},
    {name:'كامري 2026',type:'سيارة',city:'الرياض',status:'متاحة',bookings:'486',revenue:'92,340'},
    {name:'K5 2026',type:'سيارة',city:'الخبر',status:'موقفة',bookings:'288',revenue:'188,200'}
  ];
  const vehicles=[
    {name:'كامري 2026',provider:'شركة الصحراء',branch:'مطار الملك خالد',available:42,total:48,status:'متاحة'},
    {name:'إلنترا 2025',provider:'كي رنت',branch:'جدة الشمالية',available:27,total:36,status:'متاحة'},
    {name:'K5 2026',provider:'مسار',branch:'الخبر التشغيلي',available:0,total:12,status:'موقفة'}
  ];
  Object.assign(WafraOps,{
    analysisFilters:()=>{window.__analysisFilter={q:document.getElementById('analysis-q')?.value||'',type:document.getElementById('analysis-type')?.value||'',city:document.getElementById('analysis-city')?.value||'',status:document.getElementById('analysis-status')?.value||''};render();},
    vehicleFilters:()=>{window.__vehicleFilter={q:document.getElementById('vehicle-q')?.value||'',provider:document.getElementById('vehicle-provider')?.value||'',status:document.getElementById('vehicle-status')?.value||''};render();},
    addVehicles:()=>openM(`<div class="modal"><div class="modal-h"><h3>إضافة سيارات لمزود</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${fld('المزود',`<select class="native-input"><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}${fld('نوع الإضافة',`<select class="native-input"><option>سيارة واحدة</option><option>مجموعة سيارات</option></select>`)}${fld('الموديل',`<input class="native-input" placeholder="مثال: كامري 2026">`)}${fld('عدد السيارات',`<input class="native-input" type="number" min="1" value="1">`,'يضاف العدد من المركبات الفعلية، ولا يوجد حقل يدوي مستقل للإتاحة.')}</div><div class="modal-f"><button class="btn coral" onclick="closeM();WafraOps.demoAction('تم حفظ السيارات الجديدة للمزود')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div></div>`)
  });
  /* شاشة محرك البحث تُعرَّف في p35 بالتصميم الجديد — لا تُستبدل هنا. */
  S.fleet=()=>{const f=window.__vehicleFilter||{};const rows=vehicles.filter(x=>(!f.q||`${x.name} ${x.provider} ${x.branch}`.includes(f.q))&&(!f.provider||x.provider===f.provider)&&(!f.status||x.status===f.status));return phead('قائمة السيارات','بحث وفلترة السيارات حسب المزود والحالة مع العدد المتاح المحسوب',[],`<button class="btn coral" onclick="WafraOps.addVehicles()">＋ إضافة سيارة أو مجموعة</button><button class="btn ghost" onclick="WafraOps.exportCurrent('قائمة-السيارات','Excel')">Excel ⤓</button><button class="btn ghost" onclick="WafraOps.exportCurrent('قائمة-السيارات','PDF')">PDF ⤓</button>`)+card(`<div class="filters"><label class="fsearch">⌕ <input id="vehicle-q" value="${f.q||''}" placeholder="ابحث باسم السيارة أو المزود أو الفرع" oninput="WafraOps.vehicleFilters()"></label>${fld('المزود',`<select id="vehicle-provider" class="native-input" onchange="WafraOps.vehicleFilters()"><option value="">كل المزودين</option>${['شركة الصحراء','كي رنت','مسار'].map(x=>`<option ${f.provider===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('الحالة',`<select id="vehicle-status" class="native-input" onchange="WafraOps.vehicleFilters()"><option value="">كل الحالات</option>${['متاحة','موقفة'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}</div><div class="card-b">${table(['السيارة','المزود','الفرع','المتاح','إجمالي الأسطول','الحالة','الإجراءات'],rows.map(x=>[x.name,x.provider,x.branch,x.available,x.total,pill(x.status),`<button class="btn ghost sm" onclick="WafraOps.demoAction('استعراض تفاصيل ${x.name}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل ${x.name}')">تعديل</button>`]))}</div>`);};
})();
</script>
