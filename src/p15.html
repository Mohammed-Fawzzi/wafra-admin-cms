<script>
/* إدارة الفروع التفصيلية المستوحاة من شاشات المرجع المرفقة. */
(function(){
  const branchRows=[
    {id:'BR-001',name:'فرع وسط المدينة',city:'الرياض',address:'123 شارع الملك فهد، العليا',hours:'8:00 صباحاً - 8:00 مساءً',total:'18',available:'6',bookings:'2',status:'نشط'},
    {id:'BR-002',name:'فرع مطار الملك خالد',city:'الرياض',address:'صالة الوصول، مطار الملك خالد',hours:'24 ساعة',total:'24',available:'12',bookings:'5',status:'نشط'},
    {id:'BR-003',name:'فرع جدة الشمالية',city:'جدة',address:'شارع الأمير سلطان، الشاطئ',hours:'8:00 صباحاً - 10:00 مساءً',total:'16',available:'7',bookings:'3',status:'نشط'},
    {id:'BR-004',name:'فرع الخبر التشغيلي',city:'الخبر',address:'طريق الكورنيش، الخبر',hours:'9:00 صباحاً - 8:00 مساءً',total:'15',available:'0',bookings:'0',status:'غير نشط'}
  ];
  const bStatus=s=>bdg(s,s==='نشط'?'g':'r');
  const branchNote=text=>`<div style="padding:12px 14px;background:#F5F8FF;border-radius:10px;color:var(--navy);font-size:12px">${text}</div>`;
  const branchTabBar=(items,active)=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${items.map(x=>`<button class="btn ${active===x.k?'coral':'ghost'} sm" onclick="WafraOps.switchBranchTab('${x.k}')">${x.t}</button>`).join('')}</div>`;
  const branchAction=(b)=>`<div class="acts-cell"><a class="btn ghost sm" href="#branchDetail" onclick="WafraOps.selectBranch('${b.id}')" title="عرض تفاصيل الفرع">👁</a><button class="btn ghost sm" onclick="WafraOps.openBranchForm('${b.id}')" title="تعديل الفرع">✎</button></div>`;
  Object.assign(WafraOps,{
    selectBranch(id){window.__branchId=id;},
    setBranchLayout(v){window.__branchLayout=v;render();},
    openBranchForm(id){window.__branchEdit=id||'';location.hash='branchForm';},
    switchBranchTab(tab){window.__branchTab=tab;render();},
    staffModal(edit=false){openM(modal(edit?'تعديل موظف':'إضافة موظف',`<div style="padding:10px 12px;background:#EDF3FF;color:var(--navy);border-radius:9px;font-size:12px;margin-bottom:12px">فرع وسط المدينة</div><div class="frow">${fld('الاسم',`<input class="native-input" value="${edit?'علي خان':''}" placeholder="أدخل الاسم">`)}${fld('البريد الإلكتروني',`<input class="native-input" value="${edit?'ali.khan@wafra.sa':''}" placeholder="name@wafra.sa">`)}</div><div class="frow">${fld('رقم التواصل',`<input class="native-input" value="${edit?'0551234567':''}" placeholder="05xxxxxxxx">`)}${fld('الدور',`<select class="native-input"><option>مدير الفرع</option><option>موظف العمليات</option><option>موظف التسليم</option></select>`)}</div>${fld('الصلاحيات',`<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px"><label><input type="checkbox" checked> إدارة المركبات</label><label><input type="checkbox" checked> إدارة الحجوزات</label><label><input type="checkbox"> تعديل ساعات العمل</label><label><input type="checkbox"> تحديث حالة المركبة</label></div>`)}`,`<button class="btn coral" onclick="closeM();__toast('تم ${edit?'تحديث':'إضافة'} الموظف.')">${edit?'تحديث':'إضافة'}</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));}
  });

  const branchCards=()=>`<div class="grid3">${branchRows.map(b=>`<article class="card" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:start"><div><span class="sub">${b.id}</span><h3 style="margin:6px 0">${b.name}</h3></div>${bStatus(b.status)}</div><div style="font-size:12px;color:var(--ink-2);line-height:2;margin:12px 0">⌖ ${b.address}<br>◷ ${b.hours}<br>🚗 السيارات المتاحة <b style="color:var(--navy)">${b.available}</b> من ${b.total}</div><div style="border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center">${branchAction(b)}<span class="sub">حجوزات نشطة: ${b.bookings}</span></div></article>`).join('')}</div>`;
  S.branches=()=>{const grid=window.__branchLayout==='grid';return phead('إدارة الفروع','إدارة موقع الخدمة الخاص بك، بيانات الفروع، الإتاحة والموظفين',[],`<button class="btn ghost">↻ تحديث الفروع</button><button class="btn ghost">⤓ تصدير الفروع</button><button class="btn ghost">↥ استيراد فروع</button><button class="btn coral" onclick="WafraOps.openBranchForm()">＋ إضافة فرع</button>`)+card(`<div class="filters" style="display:grid;grid-template-columns:auto auto repeat(3,1fr);gap:10px;align-items:end"><button class="btn ${grid?'ghost':'coral'} sm" onclick="WafraOps.setBranchLayout('table')">▦ جدول</button><button class="btn ${grid?'coral':'ghost'} sm" onclick="WafraOps.setBranchLayout('grid')">☷ بطاقات</button>${fld('المدينة',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>نشط</option><option>غير نشط</option></select>`)}${fld('عدد المركبات',`<select class="native-input"><option>كل المركبات</option><option>بدون إتاحة</option><option>أكثر من 10</option></select>`)}</div>`+(grid?`<div class="card-b">${branchCards()}</div>`:table(['الرقم المرجعي','اسم الفرع','المدينة','العنوان','ساعات العمل','إجمالي المركبات','المركبات المتاحة','الحجوزات النشطة','الحالة','الإجراءات'],branchRows.map(b=>[b.id,b.name,b.city,b.address,b.hours,b.total,b.available,b.bookings,bStatus(b.status),branchAction(b)])))+pager(20,1));};

  const dayRow=(name,on=true)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:12px">${name}</b><span class="badge ${on?'g':'n'}">${on?'مفتوح':'مغلق'}</span></div><div class="frow" style="margin-top:8px"><input class="native-input" value="08:00 صباحاً"><input class="native-input" value="08:00 مساءً"></div></div>`;
  S.branchForm=()=>{const edit=window.__branchEdit;return phead(edit?'تعديل فرع':'إضافة فرع جديد',edit?'تعديل بيانات الفرع وموقعه وتشغيله':'أدخل المعلومات الأساسية لإنشاء موقع خدمة جديد',[],`<a class="btn ghost" href="#branches">إلغاء</a>`)+`<div class="form-page">${card(cardH('معلومات أساسية')+`<div class="card-b"><div class="frow">${fld('اسم الفرع',`<input class="native-input" value="${edit?'فرع وسط المدينة':''}" placeholder="أدخل اسم الفرع">`)}${fld('الرقم المرجعي',`<input class="native-input" value="${edit||'BR-005'}">`)}</div><div class="frow">${fld('المزود',`<select class="native-input"><option>شركة الصحراء لتأجير السيارات</option><option>كي رنت</option><option>مسار</option></select>`)}${fld('نوع الفرع',`<select class="native-input"><option>فرع داخلي</option><option>مطار</option><option>محطة قطار</option><option>فرع سحابي</option><option>توصيل</option></select>`)}</div><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px"><label><input type="checkbox" checked> موقع ثابت</label><label><input type="checkbox"> نقطة استلام فقط</label><label><input type="checkbox" checked> تسليم للعميل</label><label><input type="checkbox"> خدمات المطار</label></div></div>`)}${card(cardH('تفاصيل الموقع')+`<div class="card-b"><div class="frow">${fld('الدولة',`<select class="native-input"><option>المملكة العربية السعودية</option></select>`)}${fld('المنطقة',`<select class="native-input"><option>المنطقة الوسطى</option><option>المنطقة الغربية</option><option>المنطقة الشرقية</option></select>`)}</div><div class="frow">${fld('المدينة',`<select class="native-input"><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}${fld('الحي',`<input class="native-input" value="العليا">`)}</div>${fld('العنوان',`<input class="native-input" value="123 شارع الملك فهد">`)}<div class="branch-map">⌖<br><b>حدد موقع الفرع على الخريطة</b><br><span>الرياض، المملكة العربية السعودية</span></div></div>`)}${card(cardH('ساعات العمل')+`<div class="card-b">${['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map((d,i)=>dayRow(d,i!==6)).join('')}</div>`)}${card(cardH('الحالة والإتاحة')+`<div class="card-b"><div class="frow">${fld('حالة الفرع',`<select class="native-input"><option>نشط</option><option>غير نشط</option></select>`)}${fld('إتاحة السيارات',`<select class="native-input"><option>مرتبطة بإتاحة السيارات</option><option>إتاحة صفر</option></select>`)}</div>${branchNote('يظهر الفرع في مراقبة الإتاحة إذا كان نشطاً ولا توجد به سيارات متاحة.')}</div>`)}${card(cardH('ساعات التوصيل وإعداداته')+`<div class="card-b"><div class="frow">${fld('بداية التوصيل',`<input class="native-input" value="09:00 صباحاً">`)}${fld('نهاية التوصيل',`<input class="native-input" value="09:00 مساءً">`)}</div><div class="frow">${fld('نطاق التوصيل',`<select class="native-input"><option>نصف قطر 40 كم</option><option>حسب المدينة</option></select>`)}${fld('الحد الأدنى للحجز',`<select class="native-input"><option>5 ساعات</option><option>يوم واحد</option></select>`)}</div>${branchNote('يمكن ربط أسعار التوصيل لكل نطاق من شاشة رسوم التسليم بين المدن.')}</div>`)}${card(cardH('مواعيد الإجازة الرسمية والإغلاق')+`<div class="card-b"><div class="frow">${fld('من تاريخ',`<input class="native-input" type="date" value="2026-12-20">`)}${fld('إلى تاريخ',`<input class="native-input" type="date" value="2026-12-25">`)}</div>${fld('سبب الإغلاق',`<textarea class="native-input" rows="2">إجازة نهاية العام</textarea>`)}</div>`)}${card(cardH('سياسات الفرع')+`<div class="card-b">${fld('سياسة الاستلام',`<textarea class="native-input" rows="3">يلزم تقديم الهوية ورخصة القيادة الأصلية عند الاستلام.</textarea>`)}${fld('سياسة التسليم',`<textarea class="native-input" rows="3">يتم فحص المركبة وتسجيل حالة الوقود والعداد عند التسليم.</textarea>`)}</div>`)}<div style="display:flex;gap:10px;justify-content:flex-start;margin:20px 0"><button class="btn coral" onclick="location.hash='branches';__toast('تم حفظ بيانات الفرع.')">${edit?'حفظ التعديلات':'إضافة الفرع'}</button><a class="btn ghost" href="#branches">إلغاء</a></div></div>`;};

  S.branchDetail=()=>{const active=window.__branchTab||'cars';const tabs=[{k:'cars',t:'المركبات'},{k:'staff',t:'طاقم العمل'},{k:'workday',t:'أيام العمل'}];const content={cars:table(['السيارة','النوع','الفئة','السعر اليومي','السيارات المتاحة','الحالة'],[['نيسان باترول 2023','SUV','فاخرة',{v:'1,750 ر.س',c:'num'},'3',bdg('نشط','g')],['تويوتا كامري 2026','Sedan','اقتصادية',{v:'190 ر.س',c:'num'},'5',bdg('نشط','g')],['هيونداي إلنترا 2025','Sedan','اقتصادية',{v:'145 ر.س',c:'num'},'4',bdg('نشط','g')]]),staff:table(['الاسم','الدور','الصلاحيات','الحالة','الإجراءات'],[['علي خان','مدير الفرع','الوصول الكامل',bdg('نشط','g'),`<button class="btn ghost sm" onclick="WafraOps.staffModal(true)">تعديل</button>`],['عمر خان','موظف العمليات','إدارة الحجوزات',bdg('نشط','g'),`<button class="btn ghost sm" onclick="WafraOps.staffModal(true)">تعديل</button>`],['مريم خان','موظف التسليم','تحديث حالة المركبة',bdg('نشط','g'),`<button class="btn ghost sm" onclick="WafraOps.staffModal(true)">تعديل</button>`]]),workday:`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map((d,i)=>`<div style="border:1px solid ${i===6?'#FBB6B0':'#9EE6BE'};background:${i===6?'#FFF1F0':'#EFFBF4'};padding:12px;border-radius:9px;text-align:center;font-size:12px"><b>${d}</b><br><span>${i===6?'عطلة':'08:00 - 23:59'}</span></div>`).join('')}</div>`};return phead('فرع وسط المدينة','BR-001 · شركة الصحراء لتأجير السيارات',[],`<button class="btn coral" onclick="WafraOps.openBranchForm('BR-001')">تعديل الفرع</button>`)+`<div class="grid2">${card(cardH('بيانات الفرع')+`<div class="card-b">${dl([['الحالة',bdg('نشط','g')],['العنوان','123 شارع الملك فهد، العليا'],['البريد الإلكتروني','branch.riyadh@wafra.sa'],['رقم التواصل','0554 596 6945'],['ساعات العمل','08:00 صباحاً - 08:00 مساءً']])}</div>`)}${card(cardH('إحصائيات الفرع')+`<div class="card-b">${kpi([{i:'🚗',l:'إجمالي المركبات',v:'18'},{i:'✓',l:'المركبات المتاحة',v:'6'},{i:'📋',l:'الحجوزات النشطة',v:'2'},{i:'⏱',l:'الحجوزات المؤكدة',v:'5'}])}</div>`)}</div>`+card(branchTabBar(tabs,active)+`<div class="card-b">${active==='staff'?`<div style="margin-bottom:12px"><button class="btn coral sm" onclick="WafraOps.staffModal()">＋ إضافة موظف</button></div>`:''}${content[active]}</div>`);};
  const branchesNav=NAV.find(g=>g.g==='الفروع');if(branchesNav&&!branchesNav.items.some(x=>x.k==='branchDetail'))branchesNav.items.push({k:'branchDetail',t:'تفاصيل فرع',i:'📁',sub:'branches'});
  render();
})();
</script>
<style>
.form-page{max-width:1020px}.branch-map{margin-top:12px;min-height:150px;display:grid;place-items:center;text-align:center;border-radius:12px;background:linear-gradient(125deg,#E2E8E3,#E9EEF2);color:var(--navy);font-size:13px}.branch-map span{font-size:11px;color:var(--ink-2)}
@media(max-width:800px){.form-page .frow{grid-template-columns:1fr}}
</style>
