<script>
/* إكمال العناصر التفصيلية: تبويبات ذات محتوى، حالة مركبة موحّدة، وإجراءات تشغيلية. */
(function(){
  const tabBar=(items,active,handler)=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${items.map(x=>`<button class="btn ${active===x.k?'coral':'ghost'} sm" onclick="${handler}('${x.k}')">${x.t}</button>`).join('')}</div>`;
  const message=(text)=>`<div style="padding:12px 14px;background:#F5F8FF;border-radius:10px;color:var(--navy);font-size:12px">${text}</div>`;
  Object.assign(WafraOps,{
    switchMakeTab(tab){window.__makeTab=tab;render();},
    switchProviderTab(tab){window.__providerTab=tab;render();},
    switchAvailability(tab){window.__availabilityTab=tab;render();},
    editPrice(car){openM(modal('تعديل تسعير '+car,`<div class="frow">${fld('السعر اليومي',`<input class="native-input" value="190">`)}${fld('السعر الأسبوعي',`<input class="native-input" value="1,140">`)}</div>${fld('السعر الشهري',`<input class="native-input" value="4,200">`)}${message('يُسجَّل التعديل في سجل السيارة ويظهر فوراً في شاشة المزود.')}`,`<button class="btn coral" onclick="closeM();__toast('تم حفظ تسعير السيارة.')">حفظ التسعير</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    bulkAvailability(){openM(modal('تحديث إتاحة سيارات مزود',`${fld('المزود',`<select class="native-input"><option>شركة الصحراء لتأجير السيارات</option><option>كي رنت</option><option>مسار</option></select>`)}${fld('الإجراء',`<select class="native-input"><option>تفعيل جميع السيارات المطابقة</option><option>إيقاف جميع السيارات المطابقة</option><option>تحديث الإتاحة إلى صفر</option></select>`)}${message('يطبّق التحديث على السيارات المطابقة للفلاتر الحالية فقط.')}`,`<button class="btn coral" onclick="closeM();__toast('تم تحديث إتاحة سيارات المزود.')">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));},
    requestAction(status){const txt={review:'تم تحويل الطلب للمراجعة مع قائمة تحقق.',docs:'تم إرسال طلب الوثائق للمزود.',approved:'تم اعتماد المزود وتفعيل حسابه.',rejected:'تم رفض الطلب مع تسجيل السبب.'}[status]; openM(modal('إجراء الطلب',`${message(txt)}${fld('ملاحظة للإجراء',`<textarea class="native-input" rows="3">تمت مراجعة الطلب وتوثيق القرار.</textarea>`)}`,`<button class="btn coral" onclick="closeM();__toast('تم حفظ الإجراء.')">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));}
  });

  S.fleetMakesModels=()=>{const active=window.__makeTab||'makes';const tabs=[{k:'makes',t:'الماركات'},{k:'models',t:'الموديلات'},{k:'requests',t:'طلبات الإضافة'}];let content='';if(active==='makes')content=table(['الماركة','بلد المنشأ','الموديلات','السيارات','الإجراء'],[['تويوتا','اليابان','48','1,142','✎'],['هيونداي','كوريا الجنوبية','36','864','✎'],['كيا','كوريا الجنوبية','32','712','✎'],['إم جي','الصين','24','386','✎']]);if(active==='models')content=table(['الموديل','الماركة','الصورة','الفئة','المواصفات','الإجراء'],[['كامري','تويوتا','صورة مضافة','سيدان','5 ركاب · أوتوماتيك · بنزين','✎'],['إلنترا','هيونداي','صورة مضافة','اقتصادية','5 ركاب · أوتوماتيك · بنزين','✎'],['K5','كيا','صورة مضافة','سيدان','5 ركاب · أوتوماتيك · بنزين','✎']]);if(active==='requests')content=table(['الطلب','الماركة','الموديل','المزود','الحالة','الإجراءات'],[['MR-118','كيا','سيلتوس','كي رنت',bdg('قيد المراجعة','a'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('review')">مراجعة</button>`],['MR-116','إم جي','MG 5','مسار',bdg('بانتظار صورة','a'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('docs')">طلب صورة</button>`],['MR-114','تويوتا','كامري هايبرد','درب الخليج',bdg('مكرر','n'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('rejected')">دمج أو رفض</button>`]]);return phead('الماركات والموديلات','الماركة هي الشركة المصنّعة، والموديل هو المركبة التابعة لها',[],`<button class="btn coral" onclick="openM(M.newModel())">＋ إضافة موديل</button>`)+card(tabBar(tabs,active,'WafraOps.switchMakeTab')+content);};

  S.fleetAvailable=()=>{const s=JSON.parse(localStorage.getItem('wafra-ops-v1')||'{}'),states=s.vehicleStates||{sunny:'موقفة',k5:'موقفة'},cars=[['camry','كامري 2026','شركة الصحراء · مطار الملك خالد','سيدان','كامري'],['elantra','إلنترا 2025','كي رنت · جدة الرقمية','اقتصادية','إلنترا'],['k5','K5 2026','مسار · الخبر التشغيلي','سيدان','K5'],['sunny','صني 2024','الوسام كار · مكة المركزي','اقتصادية','صني']];return phead('السيارات المتاحة','تفعيل المركبة وإتاحتها يظهران كحالة واحدة واضحة',[],`<button class="btn ghost" onclick="WafraOps.bulkAvailability()">تحديث جماعي لمزود</button>`)+card(`<div class="filters" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${fld('المزودون',`<select class="native-input"><option>كل المزودين</option><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}${fld('النوع',`<select class="native-input"><option>كل الأنواع</option><option>سيدان</option><option>اقتصادية</option></select>`)}${fld('الموديل',`<select class="native-input"><option>كل الموديلات</option><option>كامري</option><option>إلنترا</option><option>K5</option></select>`)}${fld('حالة المركبة',`<select class="native-input"><option>كل الحالات</option><option>متاحة للحجز</option><option>موقفة</option><option>إتاحتها صفر</option></select>`)}</div>`+table(['السيارة','المزود / الفرع','النوع','الموديل','حالة المركبة','الإجراء'],cars.map(x=>{const stopped=states[x[0]]==='موقفة';const state=stopped?(x[0]==='k5'||x[0]==='sunny'?'إتاحتها صفر':'موقفة'):'متاحة للحجز';return [x[1],x[2],x[3],x[4],bdg(state,stopped?'r':'g'),`<button class="btn ghost sm" onclick="WafraOps.toggleVehicle('${x[0]}')">${stopped?'تفعيل':'إيقاف'}</button>`]})));};

  S.fleetPricing=()=>phead('التسعير','أسعار يومية وأسبوعية وشهرية، مع تعديل فردي أو جماعي',[],`<button class="btn coral" onclick="WafraOps.bulkAvailability()">تعديل جماعي لمزود</button>`)+card(table(['السيارة','المزود','يومي','أسبوعي','شهري','آخر تحديث','الإجراء'],[['كامري 2026','شركة الصحراء',{v:'190 ر.س',c:'num'},{v:'1,140 ر.س',c:'num'},{v:'4,200 ر.س',c:'num'},'اليوم',`<button class="btn ghost sm" onclick="WafraOps.editPrice('كامري 2026')">تعديل</button>`],['إلنترا 2025','كي رنت',{v:'145 ر.س',c:'num'},{v:'870 ر.س',c:'num'},{v:'3,220 ر.س',c:'num'},'أمس',`<button class="btn ghost sm" onclick="WafraOps.editPrice('إلنترا 2025')">تعديل</button>`],['K5 2026','مسار',{v:'170 ر.س',c:'num'},{v:'1,020 ر.س',c:'num'},{v:'3,780 ر.س',c:'num'},'أمس',`<button class="btn ghost sm" onclick="WafraOps.editPrice('K5 2026')">تعديل</button>`]]));

  S.vendorFile=()=>{const active=window.__providerTab||'overview';const tabs=[{k:'overview',t:'نظرة عامة'},{k:'branches',t:'الفروع'},{k:'fleet',t:'الأسطول'},{k:'bookings',t:'الحجوزات'},{k:'ratings',t:'التقييمات'},{k:'pricing',t:'التسعير'},{k:'services',t:'الخدمات'}];const content={overview:`${message('تظهر النظرة العامة مؤشرات المزود فقط؛ سجل الإجراءات لا يُكرر في هذه الصفحة.')}<div class="card-b">${dl([['الحالة',bdg('نشط','g')],['المدينة الرئيسية','الرياض'],['الفروع النشطة','7'],['السيارات المتاحة','214'],['الحجوزات النشطة','23'],['متوسط التقييم','4.8 / 5']])}</div>`,branches:table(['الفرع','المدينة','النوع','السيارات المتاحة','الحالة'],[['مطار الملك خالد','الرياض','مطار','48',bdg('نشط','g')],['طريق الملك عبدالعزيز','الرياض','داخلي','36',bdg('نشط','g')],['جدة الشمالية','جدة','داخلي','31',bdg('نشط','g')]]),fleet:table(['السيارة','الفئة','الموديل','الإتاحة','الحالة'],[['كامري 2026','سيدان','كامري','متاحة',bdg('مفعلة','g')],['إلنترا 2025','اقتصادية','إلنترا','متاحة',bdg('مفعلة','g')],['K5 2026','سيدان','K5','0',bdg('إتاحتها صفر','r')]]),bookings:table(['رقم الحجز','السيارة','العميل','الخدمة','الحالة'],[['BK-2048','كامري 2026','أحمد الشمري','استلام من الفرع',bdg('نشط','g')],['BK-2039','إلنترا 2025','نورة القحطاني','توصيل',bdg('نشط','g')],['BK-2011','كامري 2026','محمد العتيبي','توصيل',bdg('مكتمل','n')]]),ratings:table(['العميل','التقييم','الملاحظة','التاريخ'],[['أحمد الشمري','5 / 5','سهولة الاستلام وحسن الخدمة','اليوم'],['نورة القحطاني','4 / 5','السيارة نظيفة والتوصيل متأخر قليلاً','أمس'],['محمد العتيبي','5 / 5','تجربة ممتازة','12 سبتمبر']]),pricing:table(['الموديل','يومي','أسبوعي','شهري','الإتاحة'],[['كامري',{v:'190 ر.س',c:'num'},{v:'1,140 ر.س',c:'num'},{v:'4,200 ر.س',c:'num'},bdg('متاحة','g')],['إلنترا',{v:'145 ر.س',c:'num'},{v:'870 ر.س',c:'num'},{v:'3,220 ر.س',c:'num'},bdg('متاحة','g')]]),services:table(['الخدمة','الرسوم','الفروع المفعلة','الحالة'],[['استلام من الفرع',{v:'0 ر.س',c:'num'},'7',bdg('مفعلة','g')],['توصيل',{v:'45 ر.س',c:'num'},'6',bdg('مفعلة','g')],['تسليم بين المدن',{v:'180 ر.س',c:'num'},'3',bdg('مفعلة','g')]])};return phead('ملف المزود','تفاصيل الفروع والأسطول والحجوزات والتقييمات والتسعير',[],`<button class="btn ghost" onclick="WafraOps.editEntity('شركة الصحراء لتأجير السيارات','مزود')">تعديل بيانات المزود</button>`)+card(tabBar(tabs,active,'WafraOps.switchProviderTab')+`<div class="card-b">${content[active]}</div>`);};

  S.kyc=()=>phead('طابور الاعتماد','إجراء مناسب لكل حالة للطلب',[])+card(table(['الطلب','المزود','الحالة','الإجراء'],[['VR-1042','أسطول الشمال',bdg('قيد المراجعة','a'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('review')">مراجعة</button>`],['VR-1041','ركن السيارات',bdg('بانتظار الوثائق','a'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('docs')">طلب الوثائق</button>`],['VR-1038','الخليج رنت',bdg('معتمد','g'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('approved')">عرض الاعتماد</button>`],['VR-1031','مركبات الساحل',bdg('مرفوض','r'),`<button class="btn ghost sm" onclick="WafraOps.requestAction('rejected')">عرض الرفض</button>`]]));

  WafraOps.switchPerformanceTab=tab=>{window.__performanceTab=tab;render();};
  S.performanceSummary=()=>{const active=window.__performanceTab||'fleet';const tabs=[{k:'fleet',t:'الأسطول'},{k:'bookings',t:'الحجوزات'},{k:'ratings',t:'التقييمات'},{k:'revenue',t:'الإيرادات'}];const result={fleet:table(['السيارة','المزود','النوع','الموديل','الإتاحة','الحالة'],[['كامري 2026','شركة الصحراء','سيدان','كامري','94%',bdg('متاحة','g')],['إلنترا 2025','كي رنت','اقتصادية','إلنترا','91%',bdg('متاحة','g')],['K5 2026','مسار','سيدان','K5','0%',bdg('إتاحتها صفر','r')]]),bookings:table(['الفترة','الحجوزات','النشطة','الملغاة','نسبة الإلغاء'],[['أغسطس 2026','1,482','317','142','9.6%'],['يوليو 2026','1,364','286','118','8.7%'],['يونيو 2026','1,336','254','126','9.4%']]),ratings:table(['الموديل','عدد التقييمات','متوسط التقييم','أبرز ملاحظة'],[['كامري','186','4.8 / 5','سهولة الاستلام'],['إلنترا','154','4.7 / 5','نظافة السيارة'],['K5','98','4.3 / 5','تحتاج متابعة الإتاحة']]),revenue:table(['الموديل','إجمالي الإيراد','عمولة المنصة','صافي المزود'],[['كامري',{v:'286,400 ر.س',c:'num'},{v:'34,368 ر.س',c:'num'},{v:'252,032 ر.س',c:'num'}],['إلنترا',{v:'241,900 ر.س',c:'num'},{v:'29,028 ر.س',c:'num'},{v:'212,872 ر.س',c:'num'}],['K5',{v:'188,200 ر.س',c:'num'},{v:'22,584 ر.س',c:'num'},{v:'165,616 ر.س',c:'num'}]])};return phead('ملخص الأداء','نتائج الأداء حسب نوع وموديل السيارة',[])+card(`<div class="filters" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${fld('نوع السيارة',`<select class="native-input"><option>كل السيارات</option><option>سيدان</option><option>اقتصادية</option><option>دفع رباعي</option></select>`)}${fld('موديل السيارة',`<select class="native-input"><option>كل الموديلات</option><option>كامري</option><option>إلنترا</option><option>K5</option></select>`)}</div>`+tabBar(tabs,active,'WafraOps.switchPerformanceTab')+`<div class="card-b">${result[active]}</div>`);};
  const home=NAV.find(g=>g.g===null);if(home&&!home.items.some(x=>x.k==='performanceSummary'))home.items.splice(1,0,{k:'performanceSummary',t:'ملخص الأداء',i:'◷'});
  render();
})();
</script>
