/* ================= wiring ================= */
(function(){
  const baseEnhance = window.enhance;

  function panelize(root){
    Object.keys(PANELS).forEach(key=>{
      const scope = root.querySelector('#'+key) || (window.cur===key ? root : null);
      if(!scope) return;
      const card = scope.querySelector('.card .tabs')?.closest('.card');
      if(!card || card.__panels) return;
      card.__panels = true;
      const tabsEl = card.querySelector('.tabs');
      const original = [...card.children].filter(c=>c!==tabsEl).map(c=>c.outerHTML).join('');
      [...tabsEl.children].forEach((t,i)=>{
        t.addEventListener('click',()=>{
          [...tabsEl.children].forEach(x=>x.classList.remove('on'));
          t.classList.add('on');
          const p = PANELS[key][i];
          if(p===null || p===undefined) return;                 // هذا التبويب يفلتر ولا يبدّل المحتوى
          [...card.children].filter(c=>c!==tabsEl).forEach(c=>c.remove());
          card.insertAdjacentHTML('beforeend', i===0 ? original : (typeof p==='function' ? p() : p));
          card.__list = false;
          if(baseEnhance) baseEnhance(card);
        });
      });
    });
  }

  function backlinks(root){
    root.querySelectorAll('.phead').forEach(ph=>{
      if(ph.__back) return; ph.__back = true;
      const screen = ph.closest('.screen')?.id || window.cur || '';
      const parent = (window.SUBOF||{})[screen];
      if(!parent) return;
      if(ph.textContent.includes('رجوع')) return;
      const h1 = ph.querySelector('h1'); if(!h1) return;
      h1.insertAdjacentHTML('beforebegin',
        `<a class="back-lnk" href="#${parent}">‹ رجوع إلى ${(window.TITLES||{})[parent]||'القائمة'}</a>`);
    });
  }

  window.enhance = function(root){
    root = root || document;
    if(baseEnhance) baseEnhance(root);
    panelize(root);
    backlinks(root);
  };
  if(typeof window.S === 'undefined'){
    const run = ()=>window.enhance(document);
    if(document.readyState!=='loading') run(); else document.addEventListener('DOMContentLoaded',run);
  }
})();
