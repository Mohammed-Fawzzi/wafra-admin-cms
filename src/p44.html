<style id="wafra-ops-fleet-users-bookings">
.vu-vip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.vu-vip .card-x{background:#fff;border:1px solid #E4E9F3;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(25,42,84,.04)}
.vu-vip .k{font:700 11.5px Cairo;color:var(--muted)}
.vu-vip .v{font:800 20px Cairo;color:var(--ink);margin-top:4px}
.vu-vip .s{font:600 11.5px Cairo;color:#148A5A;margin-top:4px}
.bk-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:14px}
.bk-side{background:#FAFBFE;border:1px solid #E4E9F3;border-radius:14px;padding:14px}
.bk-side h4{margin:0 0 10px;font:800 14px Cairo}
@media(max-width:980px){.vu-vip{grid-template-columns:1fr 1fr}.bk-grid{grid-template-columns:1fr}}
@media(max-width:620px){.vu-vip{grid-template-columns:1fr}}
</style>
<script>
/* الأسطول · العملاء · الحجوزات — استكمال المتطلبات مع الإبقاء على التصاميم الحالية. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    if(WafraOps.demoAction){WafraOps.demoAction(msg);return;}
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const providers=['شركة الصحراء','كي رنت','مسار'];
  const branchesByProvider={
    'شركة الصحراء':['مطار الملك خالد','طريق الملك عبدالعزيز'],
    'كي رنت':['جدة الشمالية','جدة الرقمية'],
    'مسار':['الخبر التشغيلي']
  };
  const allBranches=[...new Set(Object.values(branchesByProvider).flat())];
  state.fleetServices=state.fleetServices||[
    {name:'استلام من الفرع',desc:'استلام المركبة من موقع الفرع',fee:'0',branches:184,status:'مفعلة'},
    {name:'توصيل',desc:'تسليم المركبة لموقع العميل',fee:'45',branches:112,status:'مفعلة'},
    {name:'تسليم بين المدن',desc:'استلام وتسليم في مدينتين مختلفتين',fee:'180',branches:42,status:'مفعلة'}
  ];
  state.fleetAddons=state.fleetAddons||[
    {name:'كرسي أطفال',desc:'مقعد أطفال مناسب للعمر والوزن',fee:'35',unit:'يوم',branches:156,status:'مفعلة'},
    {name:'سائق إضافي',desc:'إضافة سائق مرخّص على العقد',fee:'50',unit:'يوم',branches:142,status:'مفعلة'},
    {name:'جهاز GPS',desc:'تتبع وملاحة أثناء التأجير',fee:'25',unit:'يوم',branches:98,status:'مفعلة'},
    {name:'تأمين شامل إضافي',desc:'تغطية موسّعة فوق التأمين الأساسي',fee:'80',unit:'يوم',branches:120,status:'مفعلة'}
  ];
  state.fleetCategories=state.fleetCategories||[
    {name:'اقتصادية',desc:'استهلاك منخفض وحجم صغير',models:96,cars:1204,status:'مفعلة'},
    {name:'صغيرة',desc:'مدينة وحجم مدمج',models:72,cars:864,status:'مفعلة'},
    {name:'فاخرة',desc:'تجهيزات راقية',models:42,cars:188,status:'مفعلة'},
    {name:'عائلية',desc:'مساحة أكبر للعائلات',models:34,cars:214,status:'مفعلة'}
  ];

  const detailTabs=active=>`<div class="tabs">${['الملخص','تفاصيل الحجز','الخط الزمني','الاستلام','الإرجاع','المحادثة','الفاتورة','سجل الإجراءات'].map(t=>`<button class="tab ${active===t?'on':''}" onclick="WafraOps.bookingTab('${t}')">${t}</button>`).join('')}</div>`;

  Object.assign(WafraOps,{
    /* —— تحديث جماعي للإتاحة: الكل أو مزود واحد —— */
    bulkAvailability:()=>{
      openM(dlg('تحديث جماعي للإتاحة',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('الإجراء',`<select id="bulk-action" class="native-input"><option>تفعيل السيارات المطابقة</option><option>إيقاف السيارات المطابقة</option><option>تحديث الإتاحة إلى صفر</option></select>`)}
         <p class="note info">اختر «كل المزودين» أو مزوداً واحداً، ثم طبّق الإجراء على السيارات المطابقة.</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkAvail()">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    /* —— تحديث جماعي للأسعار: الكل أو مزود واحد —— */
    bulkPriceUpdate:()=>{
      openM(dlg('تحديث جماعي للأسعار',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('نسبة التعديل %',`<input id="bulk-percent" class="native-input" type="number" value="5">`)}
         ${fld('نوع التعديل',`<select id="bulk-type" class="native-input"><option>زيادة الأسعار</option><option>تخفيض الأسعار</option></select>`)}
         <p class="note info">سيُطبَّق على النطاق المحدد فقط (الكل أو مزود واحد).</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkPrice()">تطبيق التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    bulkScopeChange:()=>{
      const wrap=document.getElementById('bulk-provider-wrap');
      if(wrap) wrap.style.display=(val('bulk-scope')==='one')?'block':'none';
    },
    applyBulkAvail:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const a=val('bulk-action')||'التحديث';
      closeM(); toast(`تم ${a} لنطاق: ${p}.`);
    },
    applyBulkPrice:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const n=val('bulk-percent')||'0';
      const t=val('bulk-type')||'تعديل';
      closeM(); toast(`تم تجهيز ${t} بنسبة ${n}% لنطاق: ${p}.`);
    },
    addFleetCategory:()=>{
      openM(dlg('إضافة فئة',
        `${fld('اسم الفئة',`<input id="cat-name" class="native-input" placeholder="مثال: دفع رباعي">`)}
         ${fld('الوصف',`<input id="cat-desc" class="native-input" placeholder="وصف مختصر">`)}`,
        `<button class="btn coral" onclick="WafraOps.saveFleetCategory()">حفظ الفئة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    saveFleetCategory:()=>{
      const name=val('cat-name'); if(!name){toast('أدخل اسم الفئة.');return;}
      state.fleetCategories.push({name,desc:val('cat-desc')||'—',models:0,cars:0,status:'مفعلة'});
      closeM(); render(); toast('تمت إضافة الفئة.');
    },
    addFleetService:()=>{
      openM(dlg('إضافة خدمة وتفعيلها على الفروع',
        `${fld('اسم الخدمة',`<input id="svc-name" class="native-input" placeholder="مثال: كرسي أطفال">`)}
         ${fld('الوصف',`<input id="svc-desc" class="native-input" placeholder="وصف الخدمة">`)}
         ${fld('الرسوم الافتراضية (ر.س)',`<input id="svc-fee" class="native-input" type="number" value="30">`)}
         ${fld('نطاق التفعيل',`<select id="svc-scope" class="native-input" onchange="WafraOps.svcScopeChange()"><option value="all">فروع كل المزودين</option><option value="providers">مزودون محددون</option><option value="branches">فروع محددة</option></select>`)}
         <div id="svc-providers-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر المزودين</div>
           ${providers.map(p=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-prov" value="${p}"> ${p}</label>`).join('')}
         </div>
         <div id="svc-branches-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر الفروع</div>
           ${allBranches.map(b=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-br" value="${b}"> ${b}</label>`).join('')}
         </div>`,
        `<button class="btn coral" onclick="WafraOps.saveFleetService()">حفظ وتفعيل الخدمة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    svcScopeChange:()=>{
      const s=val('svc-scope');
      const pw=document.getElementById('svc-providers-wrap');
      const bw=document.getElementById('svc-branches-wrap');
      if(pw) pw.style.display=s==='providers'?'block':'none';
      if(bw) bw.style.display=s==='branches'?'block':'none';
    },
    saveFleetService:()=>{
      const name=val('svc-name'); if(!name){toast('أدخل اسم الخدمة.');return;}
      const scope=val('svc-scope');
      let count=0, label='';
      if(scope==='all'){count=allBranches.length;label='فروع كل المزودين';}
      else if(scope==='providers'){
        const sel=[...document.querySelectorAll('.svc-prov:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر مزوداً واحداً على الأقل.');return;}
        count=sel.reduce((n,p)=>n+(branchesByProvider[p]||[]).length,0);
        label=sel.join(' · ');
      }else{
        const sel=[...document.querySelectorAll('.svc-br:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر فرعاً واحداً على الأقل.');return;}
        count=sel.length; label=sel.join(' · ');
      }
      state.fleetServices.unshift({name,desc:val('svc-desc')||'—',fee:val('svc-fee')||'0',branches:count,status:'مفعلة'});
      closeM(); render(); toast(`تم تفعيل «${name}» على ${count} فرع (${label}).`);
    },

    /* —— الإضافات الاختيارية أثناء الحجز —— */
    addFleetAddon:()=>{
      openM(dlg('تعريف إضافة جديدة وتفعيلها',
        `${fld('اسم الإضافة',`<input id="addon-name" class="native-input" placeholder="مثال: كرسي أطفال">`)}
         ${fld('الوصف',`<input id="addon-desc" class="native-input" placeholder="وصف مختصر يظهر للعميل">`)}
         <div class="frow">${fld('الرسوم الافتراضية (ر.س)',`<input id="addon-fee" class="native-input" type="number" value="35">`)}
         ${fld('وحدة التسعير',`<select id="addon-unit" class="native-input"><option>يوم</option><option>حجز</option></select>`)}</div>
         ${fld('نطاق التفعيل',`<select id="addon-scope" class="native-input" onchange="WafraOps.addonScopeChange()"><option value="all">كل المزودين / كل الفروع</option><option value="providers">مزودين محددين</option><option value="branches">فروع محددة</option></select>`)}
         <div id="addon-providers-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر المزودين</div>
           ${providers.map(p=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="addon-prov" value="${p}"> ${p}</label>`).join('')}
         </div>
         <div id="addon-branches-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر الفروع</div>
           ${allBranches.map(b=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="addon-br" value="${b}"> ${b}</label>`).join('')}
         </div>`,
        `<button class="btn coral" onclick="WafraOps.saveFleetAddon()">حفظ وتفعيل الإضافة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    addonScopeChange:()=>{
      const s=val('addon-scope');
      const pw=document.getElementById('addon-providers-wrap');
      const bw=document.getElementById('addon-branches-wrap');
      if(pw) pw.style.display=s==='providers'?'block':'none';
      if(bw) bw.style.display=s==='branches'?'block':'none';
    },
    saveFleetAddon:()=>{
      const name=val('addon-name'); if(!name){toast('أدخل اسم الإضافة.');return;}
      const scope=val('addon-scope');
      let count=0, label='';
      if(scope==='all'){count=allBranches.length;label='فروع كل المزودين';}
      else if(scope==='providers'){
        const sel=[...document.querySelectorAll('.addon-prov:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر مزوداً واحداً على الأقل.');return;}
        count=sel.reduce((n,p)=>n+(branchesByProvider[p]||[]).length,0);
        label=sel.join(' · ');
      }else{
        const sel=[...document.querySelectorAll('.addon-br:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر فرعاً واحداً على الأقل.');return;}
        count=sel.length; label=sel.join(' · ');
      }
      state.fleetAddons=state.fleetAddons||[];
      state.fleetAddons.unshift({name,desc:val('addon-desc')||'—',fee:val('addon-fee')||'0',unit:val('addon-unit')||'يوم',branches:count,status:'مفعلة'});
      closeM(); render(); toast(`تم تفعيل «${name}» على ${count} فرع (${label}).`);
    },

    /* —— إضافة عميل حسب النوع —— */
    addUser:()=>{
      openM(dlg('إضافة عميل / مستخدم',
        `${fld('نوع الحساب',`<select id="nu-type" class="native-input" onchange="WafraOps.userTypeForm()"><option value="renter">عميل مستأجر</option><option value="admin">إداري</option><option value="provider">مستخدم لمزود</option></select>`)}
         <div id="nu-fields"></div>`,
        `<button class="btn coral" onclick="WafraOps.saveTypedUser()">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
      setTimeout(()=>WafraOps.userTypeForm(),0);
    },
    userTypeForm:()=>{
      const t=val('nu-type')||'renter';
      const box=document.getElementById('nu-fields'); if(!box) return;
      if(t==='renter'){
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('رقم الهوية',`<input id="nu-id" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('البريد',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('المدينة',`<select id="nu-city" class="native-input"><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}${fld('رخصة القيادة',`<input id="nu-license" class="native-input" placeholder="رقم الرخصة">`)}</div>`;
      }else if(t==='admin'){
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('البريد الوظيفي',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('الدور',`<select id="nu-role" class="native-input"><option>مشرف تشغيل</option><option>مالية</option><option>دعم فني</option><option>مدير نظام</option></select>`)}</div>
          ${fld('الصلاحيات',`<div style="display:flex;gap:12px;flex-wrap:wrap;font:600 12px Cairo"><label><input type="checkbox" checked> الحجوزات</label><label><input type="checkbox" checked> المزودون</label><label><input type="checkbox"> المالية</label><label><input type="checkbox"> التقارير</label></div>`)}`;
      }else{
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('رقم الهوية',`<input id="nu-id" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('البريد',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('المزود',`<select id="nu-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}${fld('الدور لدى المزود',`<select id="nu-role" class="native-input"><option>مدير مزود</option><option>مدير فرع</option><option>موظف تشغيل</option></select>`)}</div>
          ${fld('الفرع',`<select id="nu-branch" class="native-input"><option>كل الفروع</option>${allBranches.map(b=>`<option>${b}</option>`).join('')}</select>`)}`;
      }
    },
    saveTypedUser:()=>{
      const t=val('nu-type');
      const name=val('nu-name'), phone=val('nu-phone');
      if(!name||!phone){toast('أكمل الاسم والجوال.');return;}
      const typeMap={renter:'عميل مستأجر',admin:'إدارية',provider:'مستخدم لمزود'};
      state.users=state.users||[];
      state.users.unshift({
        id:`CU-${String(100+state.users.length)}`,
        name, phone,
        identity:val('nu-id')||'—',
        email:val('nu-email')||'—',
        type:typeMap[t]||'عميل مستأجر',
        city:val('nu-city')||'الرياض',
        status:'نشط', bookings:0, total:'0 ر.س', created:'اليوم'
      });
      try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}
      closeM(); render(); toast('تم حفظ الحساب حسب النوع المحدد.');
    },
    reactivateAccount:name=>{toast(`تم تفعيل حساب ${name} مرة أخرى وإلغاء طلب الحذف.`);},
    extendDeletionGrace:name=>{toast(`تم تمديد مهلة حذف حساب ${name} لمدة 7 أيام.`);},
    followActiveBooking:name=>{location.hash='#bookings';toast(`متابعة الحجز الجاري لـ ${name}.`);},
    followOutstandingDues:name=>{toast(`فتح متابعة المستحقات لـ ${name}.`);},
    reactivateAfterPayment:name=>{toast(`يُفعَّل حساب ${name} بعد تأكيد سداد المستحقات.`);},
    startFraudReview:name=>{toast(`بدأ مراجعة الحساب المشبوه: ${name}.`);},
    confirmFraud:name=>{toast(`تم تأكيد الاشتباه على ${name} وتحويله للمتابعة.`);},
    dismissFraud:name=>{toast(`تم تجاهل إشارة الاشتباه لـ ${name}.`);},
    freezeFraudAccount:name=>{toast(`تم تجميد حساب ${name} مؤقتاً.`);},
    reopenFraud:name=>{toast(`أُعيد فتح ملف الاشتباه لـ ${name}.`);},
    openCustomerFile:name=>{location.hash='#customer';toast(`تم فتح ملف العميل: ${name}`);},
    extensionLog:id=>{
      openM(dlg(`سجل التمديد ${id}`,
        table(['التاريخ','المدة','القيمة','الحالة','بواسطة'],[
          ['20 سبتمبر','يوم واحد',money('190'),pill('معتمد'),'النظام'],
          ['22 سبتمبر','يومان',money('380'),pill('قيد المراجعة'),'أحمد الشمري']
        ]),
        `<button class="btn ghost" onclick="closeM()">إغلاق</button>`));
    },
    sendPayLink:id=>{toast(`تم إرسال رابط السداد للحجز ${id} (حالة العقد: معلق).`);},
    transferBooking:id=>{
      openM(dlg(`تحويل الحجز ${id}`,
        `${fld('المزود الجديد',`<select id="xfer-provider" class="native-input"><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}
         ${fld('الفرع المستلم',`<select id="xfer-branch" class="native-input"><option>مطار الملك خالد</option><option>جدة الشمالية</option><option>الخبر التشغيلي</option></select>`)}
         ${fld('سبب التحويل',`<textarea id="xfer-note" class="native-input" rows="2" placeholder="سبب تحويل الحجز لمزود/فرع آخر"></textarea>`)}
         <div class="note info">يُشعر العميل والمزودان بالتغيير بعد التأكيد.</div>`,

      ));
    },
    confirmTransferBooking:id=>{
      const p=val('xfer-provider')||'مزود', b=val('xfer-branch')||'فرع';
      closeM(); toast(`تم تحويل الحجز ${id} إلى ${p} · ${b}.`);
    },
    decideCancellation:(id,decision)=>{
      const title=decision==='معتمد'?'اعتماد إلغاء الحجز':'رفض طلب الإلغاء';
      openM(dlg(`${title} — ${id}`,
        decision==='مرفوض'
          ?`${fld('سبب الرفض',`<textarea id="cancel-note" class="native-input" rows="3" placeholder="اكتب سبب رفض طلب الإلغاء للعميل"></textarea>`)}`
          :`<div class="note ok">سيتم إلغاء الحجز ${id} وإشعار العميل والمزود، مع احتساب سياسة الاسترداد حسب التوقيت.</div>
            ${fld('ملاحظة (اختياري)',`<textarea id="cancel-note" class="native-input" rows="2" placeholder="ملاحظة داخلية أو للعميل"></textarea>`)}`,
        `<button class="btn ${decision==='مرفوض'?'danger':'coral'}" onclick="WafraOps.saveCancellationDecision('${id}','${decision}')">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveCancellationDecision:(id,decision)=>{
      const note=val('cancel-note');
      if(decision==='مرفوض'&&!note){toast('اكتب سبب الرفض أولاً.');return;}
      state.cancelRequests=state.cancelRequests||[];
      const row=state.cancelRequests.find(x=>x.id===id);
      if(row){row.status=decision;row.note=note||'';}
      try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}
      closeM(); render();
      toast(decision==='معتمد'?`تم اعتماد إلغاء ${id}.`:`تم رفض طلب إلغاء ${id}.`);
    },
    approveRequest:(t,id)=>{
      if(id&&(t==='اعتماد'||t==='رفض')){WafraOps.decideCancellation(id,t==='اعتماد'?'معتمد':'مرفوض');return;}
      toast(`تم ${t} الطلب وتحديث حالته.`);
    },
    openBooking:id=>{
      window.__bookingId=id||'BK-20418';
      window.__bookingTab='الملخص';
      if(location.hash==='#booking') render();
      else location.hash='#booking';

      +table(['الحساب','نوع الإشارة','التفاصيل','الخطورة','الحالة','تاريخ الكشف','الإجراءات'],
        rows.map(r=>[{v:`${r.name}<span class="sub">${r.phone}</span>`,c:'strong'},r.signal,r.detail,sev(r.severity),pill(r.status),r.date,fraudActs(r)]))
      +pager(17,2));
  };

  /* —— تفاصيل الحجز: النموذج المتفق عليه (تبويبات p22) —— */
  S.booking=()=>{
    const id=window.__bookingId||'BK-20418';
    const active=window.__bookingTab||'الملخص';
    const pending=id==='BK-20390'||id==='BK-20396'||id==='BK-20417';
    const content={
      'الملخص':`<div class="bk-grid"><div>${dl([
        ['رقم الحجز',id],['الحالة',pill(pending&&id!=='BK-20417'?'متأخر':'جاري')],
        ['العميل','أحمد الشمري'],['رقم الهوية','1023456789'],['الجوال','0501234567'],
        ['المزود','شركة الصحراء'],['الفرع','مطار الملك خالد — الرياض'],
        ['السيارة','تويوتا كامري 2026 · ر هـ ب 2749'],['إجمالي المدفوع',money('570')],
        ['حالة العقد',pending?bdg('معلق','a'):bdg('ساري','g')]
      ])}</div>
      <div class="bk-side"><h4>ملخص سريع</h4>
        <div class="sub">الاستلام: 25 سبتمبر 10:00 ص<br>التسليم: 28 سبتمبر 10:00 ص<br>المدة: 3 أيام<br>الخدمة: استلام من الفرع<br>التأمين: أساسي</div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          <button class="btn coral sm" onclick="WafraOps.bookingAction('تمديد الحجز')">تمديد</button>
          <button class="btn ghost sm" onclick="WafraOps.transferBooking('${id}')">تحويل</button>
          <button class="btn ghost sm" onclick="WafraOps.sendPayLink('${id}')">رابط سداد</button>
        </div>
      </div></div>`,
      'تفاصيل الحجز':table(['بند','القيمة'],[
        ['تاريخ الاستلام','25 سبتمبر 2026، 10:00 ص'],['تاريخ التسليم','28 سبتمبر 2026، 10:00 ص'],
        ['نوع الخدمة','استلام من الفرع'],['الإضافات','كرسي أطفال · سائق إضافي'],['التأمين','تأمين أساسي'],
        ['حالة العقد',pending?bdg('معلق','a'):bdg('ساري','g')]
      ]),
      'الخط الزمني':`<div class="timeline"><div><b>10:00 ص</b> تم تأكيد الحجز</div><div><b>10:13 ص</b> تم تسليم السيارة</div><div><b>اليوم</b> الحجز جارٍ</div></div>`,
      'الاستلام':dl([['الموظف','خالد المطيري'],['عداد الكيلومتر','18,420 كم'],['الوقود','¾'],['حالة الفحص','مكتمل'],['الصور','8 صور']]),
      'الإرجاع':`<p class="sub">لم يتم إرجاع المركبة بعد. تُعرض بيانات الفحص والوقود والعداد هنا بعد التسليم.</p>`,
      'المحادثة':`<div class="note info">أحمد: أحتاج إضافة سائق إضافي.<br>الموظف: تم إرسال الطلب للمزود.</div>`,
      'الفاتورة':table(['البند','القيمة'],[['إيجار 3 أيام',money('450')],['إضافة سائق',money('70')],['ضريبة',money('50')],['الإجمالي',money('570')]]),
      'سجل الإجراءات':table(['التاريخ','الإجراء','بواسطة'],[['25 سبتمبر','تأكيد الحجز','النظام'],['25 سبتمبر','تسليم المركبة','خالد المطيري'],['اليوم','عرض التفاصيل','الإدارة']])
    }[active];
    return phead(`الحجز ${id}`,'كل بيانات الحجز وسجل إجراءاته وفق النموذج المعتمد',[],
      `<a class="btn ghost" href="#bookings">‹ رجوع للقائمة</a>
       <button class="btn ghost" onclick="WafraOps.bookingAction('تحديث الحالة')">تحديث الحالة</button>
       <button class="btn ghost" onclick="WafraOps.bookingAction('تعديل الحجز')">تعديل</button>
       <button class="btn ghost" onclick="WafraOps.bookingAction('تمديد الحجز')">تمديد</button>
       <button class="btn ghost" onclick="WafraOps.transferBooking('${id}')">تحويل</button>`)
      +card(detailTabs(active)+`<div class="card-b">${content||''}</div>`);
  };

  /* —— قائمة الحجوزات: نفس التصميم + فتح التفاصيل بالنموذج المعتمد —— */
  S.bookings=()=>phead('قائمة الحجوزات','البحث برقم الحجز أو المزود أو المدينة أو الفرع أو العميل',[],
    `<button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات','Excel')">Excel ⤓</button>
     <button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات','PDF')">PDF ⤓</button>`)
    +card(`<div class="filters">
      ${fld('المزود',`<select class="native-input"><option>كل المزودين</option><option>شركة الصحراء</option><option>كي رنت</option></select>`)}
      ${fld('المدينة',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option></select>`)}
      ${fld('الفرع',`<select class="native-input"><option>كل الفروع</option><option>مطار الملك خالد</option><option>جدة الشمالية</option></select>`)}
      ${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>جاري</option><option>مكتمل</option><option>ملغي</option><option>متأخر</option></select>`)}
      <label class="fsearch">⌕ <input placeholder="اكتب للبحث…" oninput="WafraOps.searchHint(this.value)"></label>
    </div><div class="card-b">${table(['رقم الحجز','العميل','المزود','المدينة','الفرع','السيارة','الاستلام','التسليم','المبلغ','الحالة','الإجراءات'],[
      ['BK-20418','أحمد الشمري','شركة الصحراء','الرياض','مطار الملك خالد','كامري 2026','25 سبتمبر','28 سبتمبر',money('570'),pill('جاري'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20418')">إطلاع</button>`],
      ['BK-20396','وليد الحربي','مسار','الخبر','الخبر التشغيلي','K5 2026','19 سبتمبر','26 سبتمبر',money('1,090'),pill('متأخر'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع</button>`],
      ['BK-20381','نورة القحطاني','كي رنت','جدة','جدة الشمالية','إلنترا 2025','17 سبتمبر','20 سبتمبر',money('380'),pill('مكتمل'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20381')">إطلاع</button>`]
    ])}</div>`);

  /* —— التمديد: إطلاع على الحجز + سجل التمديد —— */
  S.extensions=()=>phead('طلبات التمديد','الاطلاع على تفاصيل الحجز قبل اعتماد أو رفض أي تمديد',[],
    `<button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات التمديد','Excel')">Excel ⤓</button>
     <button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات التمديد','PDF')">PDF ⤓</button>`)
    +card(`<div class="filters">${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>قيد المراجعة</option><option>معتمد</option><option>مرفوض</option></select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
      <div class="card-b">${table(['رقم الطلب','رقم الحجز','العميل','المدة المطلوبة','القيمة الإضافية','الحالة','الإجراءات'],[
        ['EX-118','BK-20418','أحمد الشمري','يومان',money('380'),pill('قيد المراجعة'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20418')">إطلاع على الحجز</button>
           <button class="btn ghost sm" onclick="WafraOps.extensionLog('EX-118')">سجل التمديد</button>
           <button class="btn coral sm" onclick="WafraOps.approveRequest('اعتماد')">اعتماد</button>
           <button class="btn danger sm" onclick="WafraOps.approveRequest('رفض')">رفض</button>`],
        ['EX-112','BK-20396','وليد الحربي','يوم واحد',money('190'),pill('معتمد'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع على الحجز</button>
           <button class="btn ghost sm" onclick="WafraOps.extensionLog('EX-112')">سجل التمديد</button>`]
      ])}</div>`);

  /* —— المتأخرة/المتعثرة: رابط سداد + حالة العقد المعلق —— */
  S.stuck=()=>phead('الحجوزات المتأخرة / المتعثرة','المفتوحة والمعلقة والمغلقة مع إجراءات التحصيل والمتابعة',[],
    `<button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات المتعثرة','Excel')">Excel ⤓</button>
     <button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات المتعثرة','PDF')">PDF ⤓</button>`)
    +card(`<div class="filters">${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>مفتوح</option><option>معلق</option><option>مغلق</option></select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
      <div class="card-b">${table(['رقم الحجز','العميل','المزود','المبلغ المستحق','السبب','حالة العقد','الحالة','الإجراءات'],[
        ['BK-20390','نايف المالكي','شركة الصحراء',money('450'),'فشل التحصيل',bdg('معلق','a'),pill('مفتوح'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20390')">إطلاع على الحجز</button>
           <button class="btn coral sm" onclick="WafraOps.sendPayLink('BK-20390')">رابط السداد</button>
           <button class="btn ghost sm" onclick="WafraOps.requestResponse('طلب رد')">طلب رد</button>
           <button class="btn danger sm" onclick="WafraOps.confirmClose('BK-20390')">إغلاق</button>`],
        ['BK-20396','وليد الحربي','مسار',money('240'),'تأخر الإرجاع',bdg('معلق','a'),pill('معلق'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع على الحجز</button>
           <button class="btn coral sm" onclick="WafraOps.sendPayLink('BK-20396')">رابط السداد</button>
           <button class="btn ghost sm" onclick="WafraOps.requestResponse('طلب رد')">طلب رد</button>
           <button class="btn danger sm" onclick="WafraOps.confirmClose('BK-20396')">إغلاق</button>`],
        ['BK-20371','سلمان العنزي','كي رنت',money('0'),'تمت التسوية',bdg('ساري','g'),pill('مغلق'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20371')">إطلاع على الحجز</button>`]
      ])}</div>`);

  /* —— الإلغاء: إجراءات فعّالة حسب الحالة —— */
  state.cancelRequests=state.cancelRequests||[
    {id:'BK-20417',customer:'سارة العتيبي',provider:'كي رنت',reason:'تغيير خطة السفر',amount:'290',status:'قيد المراجعة'},
    {id:'BK-20405',customer:'ريم الزهراني',provider:'شركة الصحراء',reason:'السعر',amount:'570',status:'قيد المراجعة'}
  ];
  const cancelActs=r=>{
    const id=r.id;
    const view=`<button class="btn ghost sm" onclick="WafraOps.openBooking('${id}')">إطلاع على الحجز</button>`;
    if(r.status==='معتمد'||r.status==='مرفوض') return `${view}<button class="btn ghost sm" onclick="WafraOps.demoAction('عرض قرار ${id}')">عرض القرار</button>`;
    return `${view}
      <button class="btn ghost sm" onclick="WafraOps.transferBooking('${id}')">تحويل</button>
      <button class="btn coral sm" onclick="WafraOps.decideCancellation('${id}','معتمد')">اعتماد</button>
      <button class="btn danger sm" onclick="WafraOps.decideCancellation('${id}','مرفوض')">رفض</button>`;
  };
  S.cancellationRequests=()=>{
    const f=window.__cancelFilter||{};
    const rows=state.cancelRequests.filter(r=>!f.status||r.status===f.status);
    return phead('طلبات الإلغاء','كل طلب يعرض تفاصيل الحجز كاملة قبل القرار',[],
      `<button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات الإلغاء','Excel')">Excel ⤓</button>
       <button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات الإلغاء','PDF')">PDF ⤓</button>`)
      +card(`<div class="filters">${fld('الحالة',`<select id="cancel-status-filter" class="native-input" onchange="window.__cancelFilter={status:this.value||''};render()"><option value="">كل الحالات</option>${['قيد المراجعة','معتمد','مرفوض'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
        <div class="card-b">${table(['رقم الحجز','العميل','المزود','سبب الإلغاء','القيمة','الحالة','الإجراءات'],
          rows.map(r=>[r.id,r.customer,r.provider,r.reason,money(r.amount),
            pill(r.status,r.status==='معتمد'?'g':r.status==='مرفوض'?'r':'a'),cancelActs(r)]))}</div>`);
  };

  /* تسمية NAV */
  const bookNav=NAV.find(g=>g.g==='الحجوزات');
  if(bookNav){
    const stuck=bookNav.items.find(i=>i.k==='stuck');
    if(stuck) stuck.t='الحجوزات المتأخرة / المتعثرة';
  }
  if(window.TITLES){
    window.TITLES.stuck='الحجوزات المتأخرة / المتعثرة';
    window.TITLES.fleetAddons='الإضافات';
  }
  const fleetNavAddons=NAV.find(g=>g.g==='إدارة الأسطول');
  if(fleetNavAddons&&!fleetNavAddons.items.some(x=>x.k==='fleetAddons')){
    const svcIdx=fleetNavAddons.items.findIndex(x=>x.k==='fleetServices');
    const addon={k:'fleetAddons',t:'الإضافات',i:'＋'};
    if(svcIdx>=0) fleetNavAddons.items.splice(svcIdx+1,0,addon); else fleetNavAddons.items.push(addon);
  }

  /* ضمان exportLocal إن لم يُعرَّف */
  if(!WafraOps.exportLocal) WafraOps.exportLocal=(n,f)=>toast(`تم تجهيز تصدير ${n} بصيغة ${f}.`);
  if(!WafraOps.searchHint) WafraOps.searchHint=v=>v&&toast(`البحث التجريبي: ${v}`);
})();
</script>
