<style id="wafra-ops-fleet-users-bookings">
.vu-vip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.vu-vip .card-x{background:#fff;border:1px solid #E4E9F3;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(25,42,84,.04)}
.vu-vip .k{font:700 11.5px Cairo;color:var(--muted)}
.vu-vip .v{font:800 20px Cairo;color:var(--ink);margin-top:4px}
.vu-vip .s{font:600 11.5px Cairo;color:#148A5A;margin-top:4px}
.bk-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:14px}
.bk-side{background:#FAFBFE;border:1px solid #E4E9F3;border-radius:14px;padding:14px}
.bk-side h4{margin:0 0 10px;font:800 14px Cairo}
@media(max-width:980px){.vu-vip{grid-template-columns:1fr 1fr}.bk-grid{grid-template-columns:1fr}}
@media(max-width:620px){.vu-vip{grid-template-columns:1fr}}
</style>
<script>
/* الأسطول · العملاء · الحجوزات — استكمال المتطلبات مع الإبقاء على التصاميم الحالية. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    if(WafraOps.demoAction){WafraOps.demoAction(msg);return;}
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const providers=['شركة الصحراء','كي رنت','مسار'];
  const branchesByProvider={
    'شركة الصحراء':['مطار الملك خالد','طريق الملك عبدالعزيز'],
    'كي رنت':['جدة الشمالية','جدة الرقمية'],
    'مسار':['الخبر التشغيلي']
  };
  const allBranches=[...new Set(Object.values(branchesByProvider).flat())];
  state.fleetServices=state.fleetServices||[
    {name:'استلام من الفرع',desc:'استلام المركبة من موقع الفرع',fee:'0',branches:184,status:'مفعلة'},
    {name:'توصيل',desc:'تسليم المركبة لموقع العميل',fee:'45',branches:112,status:'مفعلة'},
    {name:'تسليم بين المدن',desc:'استلام وتسليم في مدينتين مختلفتين',fee:'180',branches:42,status:'مفعلة'}
  ];
  state.fleetCategories=state.fleetCategories||[
    {name:'اقتصادية',desc:'استهلاك منخفض وحجم صغير',models:96,cars:1204,status:'مفعلة'},
    {name:'صغيرة',desc:'مدينة وحجم مدمج',models:72,cars:864,status:'مفعلة'},
    {name:'فاخرة',desc:'تجهيزات راقية',models:42,cars:188,status:'مفعلة'},
    {name:'عائلية',desc:'مساحة أكبر للعائلات',models:34,cars:214,status:'مفعلة'}
  ];

  const detailTabs=active=>`<div class="tabs">${['الملخص','تفاصيل الحجز','الخط الزمني','الاستلام','الإرجاع','المحادثة','الفاتورة','سجل الإجراءات'].map(t=>`<button class="tab ${active===t?'on':''}" onclick="WafraOps.bookingTab('${t}')">${t}</button>`).join('')}</div>`;

  Object.assign(WafraOps,{
    /* —— تحديث جماعي للإتاحة: الكل أو مزود واحد —— */
    bulkAvailability:()=>{
      openM(dlg('تحديث جماعي للإتاحة',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('الإجراء',`<select id="bulk-action" class="native-input"><option>تفعيل السيارات المطابقة</option><option>إيقاف السيارات المطابقة</option><option>تحديث الإتاحة إلى صفر</option></select>`)}
         <p class="note info">اختر «كل المزودين» أو مزوداً واحداً، ثم طبّق الإجراء على السيارات المطابقة.</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkAvail()">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    /* —— تحديث جماعي للأسعار: الكل أو مزود واحد —— */
    bulkPriceUpdate:()=>{
      openM(dlg('تحديث جماعي للأسعار',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('نسبة التعديل %',`<input id="bulk-percent" class="native-input" type="number" value="5">`)}
         ${fld('نوع التعديل',`<select id="bulk-type" class="native-input"><option>زيادة الأسعار</option><option>تخفيض الأسعار</option></select>`)}
         <p class="note info">سيُطبَّق على النطاق المحدد فقط (الكل أو مزود واحد).</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkPrice()">تطبيق التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    bulkScopeChange:()=>{
      const wrap=document.getElementById('bulk-provider-wrap');
      if(wrap) wrap.style.display=(val('bulk-scope')==='one')?'block':'none';
    },
    applyBulkAvail:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const a=val('bulk-action')||'التحديث';
      closeM(); toast(`تم ${a} لنطاق: ${p}.`);
    },
    applyBulkPrice:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const n=val('bulk-percent')||'0';
      const t=val('bulk-type')||'تعديل';
      closeM(); toast(`تم تجهيز ${t} بنسبة ${n}% لنطاق: ${p}.`);
    },
    addFleetCategory:()=>{
      openM(dlg('إضافة فئة',
        `${fld('اسم الفئة',`<input id="cat-name" class="native-input" placeholder="مثال: دفع رباعي">`)}
         ${fld('الوصف',`<input id="cat-desc" class="native-input" placeholder="وصف مختصر">`)}`,
        `<button class="btn coral" onclick="WafraOps.saveFleetCategory()">حفظ الفئة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    saveFleetCategory:()=>{
      const name=val('cat-name'); if(!name){toast('أدخل اسم الفئة.');return;}
      state.fleetCategories.push({name,desc:val('cat-desc')||'—',models:0,cars:0,status:'مفعلة'});
      closeM(); render(); toast('تمت إضافة الفئة.');
    },
    addFleetService:()=>{
      openM(dlg('إضافة خدمة وتفعيلها على الفروع',
        `${fld('اسم الخدمة',`<input id="svc-name" class="native-input" placeholder="مثال: كرسي أطفال">`)}
         ${fld('الوصف',`<input id="svc-desc" class="native-input" placeholder="وصف الخدمة">`)}
         ${fld('الرسوم الافتراضية (ر.س)',`<input id="svc-fee" class="native-input" type="number" value="30">`)}
         ${fld('نطاق التفعيل',`<select id="svc-scope" class="native-input" onchange="WafraOps.svcScopeChange()"><option value="all">فروع كل المزودين</option><option value="providers">مزودون محددون</option><option value="branches">فروع محددة</option></select>`)}
         <div id="svc-providers-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر المزودين</div>
           ${providers.map(p=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-prov" value="${p}"> ${p}</label>`).join('')}
         </div>
         <div id="svc-branches-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر الفروع</div>
           ${allBranches.map(b=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-br" value="${b}"> ${b}</label>`).join('')}
         </div>`,
        `<button class="btn coral" onclick="WafraOps.saveFleetService()">حفظ وتفعيل الخدمة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    svcScopeChange:()=>{
      const s=val('svc-scope');
      const pw=document.getElementById('svc-providers-wrap');
      const bw=document.getElementById('svc-branches-wrap');
      if(pw) pw.style.display=s==='providers'?'block':'none';
      if(bw) bw.style.display=s==='branches'?'block':'none';
    },
    saveFleetService:()=>{
      const name=val('svc-name'); if(!name){toast('أدخل اسم الخدمة.');return;}
      const scope=val('svc-scope');
      let count=0, label='';
      if(scope==='all'){count=allBranches.length;label='فروع كل المزودين';}
      else if(scope==='providers'){
        const sel=[...document.querySelectorAll('.svc-prov:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر مزوداً واحداً على الأقل.');return;}
        count=sel.reduce((n,p)=>n+(branchesByProvider[p]||[]).length,0);
        label=sel.join(' · ');
      }else{
        const sel=[...document.querySelectorAll('.svc-br:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر فرعاً واحداً على الأقل.');return;}
        count=sel.length; label=sel.join(' · ');
      }
      state.fleetServices.unshift({name,desc:val('svc-desc')||'—',fee:val('svc-fee')||'0',branches:count,status:'مفعلة'});
      closeM(); render(); toast(`تم تفعيل «${name}» على ${count} فرع (${label}).`);
    },

    /* —— إضافة عميل حسب النوع —— */
    addUser:()=>{
      openM(dlg('إضافة عميل / مستخدم',
        `${fld('نوع الحساب',`<select id="nu-type" class="native-input" onchange="WafraOps.userTypeForm()"><option value="renter">عميل مستأجر</option><option value="admin">إداري</option><option value="provider">مستخدم لمزود</option></select>`)}
         <div id="nu-fields"></div>`,
        `<button class="btn coral" onclick="WafraOps.saveTypedUser()">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
      setTimeout(()=>WafraOps.userTypeForm(),0);
    },
    userTypeForm:()=>{
      const t=val('nu-type')||'renter';
      const box=document.getElementById('nu-fields'); if(!box) return;
      if(t==='renter'){
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('رقم الهوية',`<input id="nu-id" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('البريد',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('المدينة',`<select id="nu-city" class="native-input"><option>الرياض</option><option>جدة</option><option>الخبر</option></select>`)}${fld('رخصة القيادة',`<input id="nu-license" class="native-input" placeholder="رقم الرخصة">`)}</div>`;
      }else if(t==='admin'){
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('البريد الوظيفي',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('الدور',`<select id="nu-role" class="native-input"><option>مشرف تشغيل</option><option>مالية</option><option>دعم فني</option><option>مدير نظام</option></select>`)}</div>
          ${fld('الصلاحيات',`<div style="display:flex;gap:12px;flex-wrap:wrap;font:600 12px Cairo"><label><input type="checkbox" checked> الحجوزات</label><label><input type="checkbox" checked> المزودون</label><label><input type="checkbox"> المالية</label><label><input type="checkbox"> التقارير</label></div>`)}`;
      }else{
        box.innerHTML=`<div class="frow">${fld('الاسم الكامل',`<input id="nu-name" class="native-input">`)}${fld('رقم الهوية',`<input id="nu-id" class="native-input">`)}</div>
          <div class="frow">${fld('الجوال',`<input id="nu-phone" class="native-input">`)}${fld('البريد',`<input id="nu-email" class="native-input">`)}</div>
          <div class="frow">${fld('المزود',`<select id="nu-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}${fld('الدور لدى المزود',`<select id="nu-role" class="native-input"><option>مدير مزود</option><option>مدير فرع</option><option>موظف تشغيل</option></select>`)}</div>
          ${fld('الفرع',`<select id="nu-branch" class="native-input"><option>كل الفروع</option>${allBranches.map(b=>`<option>${b}</option>`).join('')}</select>`)}`;
      }
    },
    saveTypedUser:()=>{
      const t=val('nu-type');
      const name=val('nu-name'), phone=val('nu-phone');
      if(!name||!phone){toast('أكمل الاسم والجوال.');return;}
      const typeMap={renter:'عميل مستأجر',admin:'إدارية',provider:'مستخدم لمزود'};
      state.users=state.users||[];
      state.users.unshift({
        id:`CU-${String(100+state.users.length)}`,
        name, phone,
        identity:val('nu-id')||'—',
        email:val('nu-email')||'—',
        type:typeMap[t]||'عميل مستأجر',
        city:val('nu-city')||'الرياض',
        status:'نشط', bookings:0, total:'0 ر.س', created:'اليوم'
      });
      try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}
      closeM(); render(); toast('تم حفظ الحساب حسب النوع المحدد.');
    },
    reactivateAccount:name=>{toast(`تم تفعيل حساب ${name} مرة أخرى وإلغاء طلب الحذف.`);},
    openCustomerFile:name=>{location.hash='#customer';toast(`تم فتح ملف العميل: ${name}`);},
    extensionLog:id=>{
      openM(dlg(`سجل التمديد ${id}`,
        table(['التاريخ','المدة','القيمة','الحالة','بواسطة'],[
          ['20 سبتمبر','يوم واحد',money('190'),pill('معتمد'),'النظام'],
          ['22 سبتمبر','يومان',money('380'),pill('قيد المراجعة'),'أحمد الشمري']
        ]),
        `<button class="btn ghost" onclick="closeM()">إغلاق</button>`));
    },
    sendPayLink:id=>{toast(`تم إرسال رابط السداد للحجز ${id} (حالة العقد: معلق).`);},
    transferBooking:id=>{toast(`تم فتح تحويل الحجز ${id}.`);},
    openBooking:id=>{
      window.__bookingId=id||'BK-20418';
      window.__bookingTab='الملخص';
      if(location.hash==='#booking') render();
      else location.hash='#booking';
    },
    bookingTab:t=>{window.__bookingTab=t;render();}
  });

  /* —— الفئات: نفس التصميم + ربط زر الإضافة —— */
  S.fleetCategories=()=>phead('فئات السيارات','الفئات التي يختار منها المزود عند إضافة سيارة',[],
    `<button class="btn coral" onclick="WafraOps.addFleetCategory()">＋ إضافة فئة</button>`)
    +card(table(['الفئة','الوصف','الموديلات','السيارات','الحالة','الإجراءات'],
      state.fleetCategories.map(c=>[c.name,c.desc,String(c.models),String(c.cars).replace(/\B(?=(\d{3})+(?!\d))/g,','),bdg(c.status,'g'),
        `<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل فئة ${c.name}')">✎</button>`])));

  /* —— قائمة السيارات (fleet): نفس تصميم p26 + زر التحديث الجماعي —— */
  S.fleet=()=>{
    const f=window.__vehicleFilter||{};
    const vehicles=[
      {name:'كامري 2026',provider:'شركة الصحراء',branch:'مطار الملك خالد',available:42,total:48,status:'متاحة'},
      {name:'إلنترا 2025',provider:'كي رنت',branch:'جدة الشمالية',available:27,total:36,status:'متاحة'},
      {name:'K5 2026',provider:'مسار',branch:'الخبر التشغيلي',available:0,total:12,status:'موقفة'}
    ];
    const rows=vehicles.filter(x=>(!f.q||`${x.name} ${x.provider} ${x.branch}`.includes(f.q))&&(!f.provider||x.provider===f.provider)&&(!f.status||x.status===f.status));
    return phead('قائمة السيارات','بحث وفلترة السيارات حسب المزود والحالة مع العدد المتاح المحسوب',[],
      `<button class="btn coral" onclick="WafraOps.addVehicles()">＋ إضافة سيارة أو مجموعة</button>
       <button class="btn ghost" onclick="WafraOps.bulkAvailability()">تحديث جماعي للإتاحة</button>
       <button class="btn ghost" onclick="WafraOps.exportCurrent('قائمة-السيارات','Excel')">Excel ⤓</button>
       <button class="btn ghost" onclick="WafraOps.exportCurrent('قائمة-السيارات','PDF')">PDF ⤓</button>`)
      +card(`<div class="filters">
        <label class="fsearch">⌕ <input id="vehicle-q" value="${f.q||''}" placeholder="ابحث باسم السيارة أو المزود أو الفرع" oninput="WafraOps.vehicleFilters()"></label>
        ${fld('المزود',`<select id="vehicle-provider" class="native-input" onchange="WafraOps.vehicleFilters()"><option value="">كل المزودين</option>${providers.map(x=>`<option ${f.provider===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('الحالة',`<select id="vehicle-status" class="native-input" onchange="WafraOps.vehicleFilters()"><option value="">كل الحالات</option>${['متاحة','موقفة'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}
      </div><div class="card-b">${table(['السيارة','المزود','الفرع','المتاح','إجمالي الأسطول','الحالة','الإجراءات'],
        rows.map(x=>[x.name,x.provider,x.branch,String(x.available),String(x.total),pill(x.status),
          `<button class="btn ghost sm" onclick="WafraOps.demoAction('استعراض تفاصيل ${x.name}')">استعراض</button>
           <button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل ${x.name}')">تعديل</button>`]))}</div>`);
  };

  /* —— السيارات المتاحة: نفس التصميم + عمود أعداد المتاح —— */
  S.fleetAvailable=()=>{
    const s=JSON.parse(localStorage.getItem('wafra-ops-v1')||'{}');
    const states=s.vehicleStates||{sunny:'موقفة',k5:'موقفة'};
    const cars=[
      ['camry','كامري 2026','شركة الصحراء · مطار الملك خالد','سيدان','كامري',42,48],
      ['elantra','إلنترا 2025','كي رنت · جدة الرقمية','اقتصادية','إلنترا',27,36],
      ['k5','K5 2026','مسار · الخبر التشغيلي','سيدان','K5',0,12],
      ['sunny','صني 2024','الوسام كار · مكة المركزي','اقتصادية','صني',8,18]
    ];
    return phead('السيارات المتاحة','تفعيل المركبة وإتاحتها يظهران كحالة واحدة واضحة',[],
      `<button class="btn ghost" onclick="WafraOps.bulkAvailability()">تحديث جماعي للإتاحة</button>`)
      +card(`<div class="filters" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        ${fld('المزودون',`<select class="native-input"><option>كل المزودين</option>${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}
        ${fld('النوع',`<select class="native-input"><option>كل الأنواع</option><option>سيدان</option><option>اقتصادية</option></select>`)}
        ${fld('الموديل',`<select class="native-input"><option>كل الموديلات</option><option>كامري</option><option>إلنترا</option><option>K5</option></select>`)}
        ${fld('حالة المركبة',`<select class="native-input"><option>كل الحالات</option><option>متاحة للحجز</option><option>موقفة</option><option>إتاحتها صفر</option></select>`)}
      </div>`+table(['السيارة','المزود / الفرع','النوع','الموديل','المتاح','إجمالي الأسطول','حالة المركبة','الإجراء'],
        cars.map(x=>{
          const stopped=states[x[0]]==='موقفة'||x[5]===0;

    const stuck=bookNav.items.find(i=>i.k==='stuck');
    if(stuck) stuck.t='الحجوزات المتأخرة / المتعثرة';
  }
  if(window.TITLES) window.TITLES.stuck='الحجوزات المتأخرة / المتعثرة';

  /* ضمان exportLocal إن لم يُعرَّف */
  if(!WafraOps.exportLocal) WafraOps.exportLocal=(n,f)=>toast(`تم تجهيز تصدير ${n} بصيغة ${f}.`);
  if(!WafraOps.searchHint) WafraOps.searchHint=v=>v&&toast(`البحث التجريبي: ${v}`);
})();
</script>
