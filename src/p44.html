<script>
/* الأسطول · العملاء · الحجوزات — استكمال المتطلبات مع الإبقاء على التصاميم الحالية. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    if(WafraOps.demoAction){WafraOps.demoAction(msg);return;}
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escAttr=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const prev=(k,v)=>`<div class="prev-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const persist=()=>{try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}};
  const providers=['شركة الصحراء','كي رنت','مسار'];
  const branchesByProvider={
    'شركة الصحراء':['مطار الملك خالد','طريق الملك عبدالعزيز'],
    'كي رنت':['جدة الشمالية','جدة الرقمية'],
    'مسار':['الخبر التشغيلي']
  };
  const allBranches=[...new Set(Object.values(branchesByProvider).flat())];
  state.fleetServices=state.fleetServices||[
    {name:'استلام من الفرع',desc:'استلام المركبة من موقع الفرع',fee:'0',branches:184,status:'مفعلة'},
    {name:'توصيل',desc:'تسليم المركبة لموقع العميل',fee:'45',branches:112,status:'مفعلة'},
    {name:'تسليم بين المدن',desc:'استلام وتسليم في مدينتين مختلفتين',fee:'180',branches:42,status:'مفعلة'}
  ];
  state.fleetAddons=state.fleetAddons||[
    {name:'كرسي أطفال',desc:'مقعد أطفال مناسب للعمر والوزن',fee:'35',unit:'يوم',rental:'',branches:156,status:'مفعلة'},
    {name:'سائق إضافي',desc:'إضافة سائق مرخّص على العقد',fee:'50',unit:'يوم',rental:'',branches:142,status:'مفعلة'},
    {name:'جهاز GPS',desc:'تتبع وملاحة أثناء التأجير',fee:'25',unit:'يوم',rental:'يومي',branches:98,status:'مفعلة'},
    {name:'تأمين شامل إضافي',desc:'تغطية موسّعة فوق التأمين الأساسي',fee:'80',unit:'يوم',rental:'',branches:120,status:'مفعلة'}
  ];
  (state.fleetAddons||[]).forEach(a=>{ if(a.rental===undefined) a.rental=''; });
  state.fleetCategories=state.fleetCategories||[
    {name:'اقتصادية',desc:'استهلاك منخفض وحجم صغير',models:96,cars:1204,status:'مفعلة'},
    {name:'صغيرة',desc:'مدينة وحجم مدمج',models:72,cars:864,status:'مفعلة'},
    {name:'فاخرة',desc:'تجهيزات راقية',models:42,cars:188,status:'مفعلة'},
    {name:'عائلية',desc:'مساحة أكبر للعائلات',models:34,cars:214,status:'مفعلة'}
  ];
  state.fleetMakes=state.fleetMakes||[
    {name:'تويوتا',country:'اليابان',models:48,cars:'1,142'},
    {name:'هيونداي',country:'كوريا الجنوبية',models:36,cars:'864'},
    {name:'كيا',country:'كوريا الجنوبية',models:32,cars:'712'},
    {name:'إم جي',country:'الصين',models:24,cars:'386'}
  ];
  state.fleetModels=state.fleetModels||[
    {name:'كامري',make:'تويوتا',image:'صورة مضافة',cat:'سيدان',year:'2026',seats:'5',trans:'أوتوماتيك',fuel:'بنزين',specs:'5 ركاب · أوتوماتيك · بنزين'},
    {name:'إلنترا',make:'هيونداي',image:'صورة مضافة',cat:'اقتصادية',year:'2025',seats:'5',trans:'أوتوماتيك',fuel:'بنزين',specs:'5 ركاب · أوتوماتيك · بنزين'},
    {name:'K5',make:'كيا',image:'صورة مضافة',cat:'سيدان',year:'2026',seats:'5',trans:'أوتوماتيك',fuel:'بنزين',specs:'5 ركاب · أوتوماتيك · بنزين'},
    {name:'أكسنت',make:'هيونداي',image:'صورة مضافة',cat:'اقتصادية',year:'2025',seats:'5',trans:'أوتوماتيك',fuel:'بنزين',specs:'5 ركاب · أوتوماتيك · بنزين'}
  ];
  state.fleetModels.forEach(m=>{
    if(!m.year||!m.seats){
      const parts=String(m.specs||'').split(/\s*·\s*/);
      m.seats=m.seats||(parts[0]||'5').replace(/[^\d]/g,'')||'5';
      m.trans=m.trans||parts[1]||'أوتوماتيك';
      m.fuel=m.fuel||parts[2]||'بنزين';
      m.year=m.year||'2026';
      m.specs=`${m.seats} ركاب · ${m.trans} · ${m.fuel}`;
    }
  });
  state.modelRequests=state.modelRequests||[
    {id:'MR-118',make:'كيا',model:'سيلتوس',provider:'كي رنت',status:'قيد المراجعة'},
    {id:'MR-116',make:'إم جي',model:'MG 5',provider:'مسار',status:'بانتظار صورة'},
    {id:'MR-114',make:'تويوتا',model:'كامري هايبرد',provider:'درب الخليج',status:'مكرر'}
  ];
  state.dynamicRules=state.dynamicRules||[
    {car:'هيونداي أكسنت 2025',when:'>=',util:80,adj:'زيادة',pct:5,status:'مفعلة'},
    {car:'هيونداي أكسنت 2025',when:'<=',util:55,adj:'تخفيض',pct:10,status:'مفعلة'},
    {car:'تويوتا كامري 2026',when:'>=',util:85,adj:'زيادة',pct:8,status:'مفعلة'}
  ];
  state.qualityReports=state.qualityReports||[
    {id:'Q-91',car:'كامري 2026',provider:'شركة الصحراء',branch:'مطار الملك خالد',plate:'ر هـ ب 2749',note:'صورة المركبة غير محدثة',level:'عالي',date:'28 سبتمبر',status:'مفتوح'},
    {id:'Q-88',car:'K5 2026',provider:'مسار',branch:'الخبر التشغيلي',plate:'د ط ل 8812',note:'تأخر تحديث الإتاحة',level:'متوسط',date:'27 سبتمبر',status:'قيد المعالجة'},
    {id:'Q-81',car:'إلنترا 2025',provider:'كي رنت',branch:'جدة الشمالية',plate:'ب ن ج 4410',note:'عدم اكتمال صور الفحص',level:'منخفض',date:'25 سبتمبر',status:'مفتوح'}
  ];
  const rentalLabel=r=>{
    if(!r||!String(r).trim()) return 'كل أنواع التأجير';
    const parts=String(r).split(/[،,|]/).map(x=>x.trim()).filter(Boolean);
    return parts.length?parts.join(' · '):'كل أنواع التأجير';
  };
  const rentalChecks=(selected)=>{
    const set=new Set(String(selected||'').split(/[،,|]/).map(x=>x.trim()).filter(Boolean));
    return ['يومي','أسبوعي','شهري'].map(t=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0 0 0 14px;font:700 13px Cairo;cursor:pointer"><input type="checkbox" class="addon-rental" value="${t}" ${set.has(t)?'checked':''}> ${t}</label>`).join('');
  };
  const utilRuleText=r=>r.when==='>='?`عند وصول التشغيل إلى ${r.util}% أو أكثر`:`عند وصول التشغيل إلى ${r.util}% أو أقل`;
  const adjRuleText=r=>`${r.adj} ${r.pct}%`;

  const detailTabs=active=>`<div class="tabs">${['الملخص','تفاصيل الحجز','الخط الزمني','الاستلام','الإرجاع','المحادثة','الفاتورة','سجل الإجراءات'].map(t=>`<button class="tab ${active===t?'on':''}" onclick="WafraOps.bookingTab('${t}')">${t}</button>`).join('')}</div>`;

  Object.assign(WafraOps,{
    /* —— تحديث جماعي للإتاحة: فلاتر + رفع إكسل —— */
    bulkAvailability:()=>{
      window.__bulkExcelName='';
      const makes=(state.fleetMakes||[]).map(x=>x.name);
      const models=(state.fleetModels||[]).map(x=>x.name);
      const cats=[...(state.fleetCategories||[]).map(x=>x.name),'سيدان','اقتصادية','دفع رباعي','فاخرة'];
      const cities=['الرياض','جدة','الدمام','الخبر','مكة','المدينة','الأحساء','تبوك'];
      const branches=['مطار الملك خالد','جدة الشمالية','الخبر التشغيلي','مكة المركزي','طريق الملك عبدالعزيز','جدة الرقمية'];
      const years=['2026','2025','2024','2023','2022','2021'];
      const opt=(list,all='الكل')=>`<option value="">${all}</option>`+[...new Set(list)].map(x=>`<option value="${x}">${x}</option>`).join('');
      openM(dlg('تحديث جماعي للإتاحة',
        `${fld('رفع نموذج التحديث (Excel)',`<div class="mdl-upload"><input id="bulk-excel" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="WafraOps.pickBulkExcel()"><div class="drop" onclick="document.getElementById('bulk-excel').click()"><span class="ic">📄</span><b id="bulk-excel-lab">اسحب ملف الإكسل أو اضغط للاختيار</b><span class="sub">XLSX أو CSV · أعمدة: المزود، الفئة، الماركة، الموديل، سنة الصنع، المدينة، الفرع، المتاح</span></div></div>`)}
         <div style="margin:0 0 12px"><button type="button" class="btn ghost sm" onclick="WafraOps.downloadBulkTemplate()">⤓ تنزيل نموذج فارغ</button></div>
         <div class="frow">
           ${fld('المزود',`<select id="bulk-provider" class="native-input">${opt(providers,'كل المزودين')}</select>`)}
           ${fld('الفئة',`<select id="bulk-cat" class="native-input">${opt(cats,'كل الفئات')}</select>`)}
         </div>
         <div class="frow">
           ${fld('الماركة',`<select id="bulk-make" class="native-input">${opt(makes,'كل الماركات')}</select>`)}
           ${fld('الموديل',`<select id="bulk-model" class="native-input">${opt(models,'كل الموديلات')}</select>`)}
         </div>
         <div class="frow">
           ${fld('سنة الصنع',`<select id="bulk-year" class="native-input">${opt(years,'كل السنوات')}</select>`)}
           ${fld('المدينة',`<select id="bulk-city" class="native-input">${opt(cities,'كل المدن')}</select>`)}
         </div>
         <div class="frow">
           ${fld('الفرع',`<select id="bulk-branch" class="native-input">${opt(branches,'كل الفروع')}</select>`)}
           ${fld('المتاح',`<input id="bulk-available" class="native-input" type="number" min="0" placeholder="عدد السيارات المتاحة" value="0">`)}
         </div>
         <p class="note info">حدّد الفلاتر يدوياً أو ارفع ملف إكسل بنفس الأعمدة، ثم طبّق قيمة «المتاح» على السيارات المطابقة.</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkAvail()">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    pickBulkExcel:()=>{
      const inp=document.getElementById('bulk-excel');
      if(!inp||!inp.files||!inp.files[0]) return;
      const file=inp.files[0];
      window.__bulkExcelName=file.name;
      const lab=document.getElementById('bulk-excel-lab');
      if(lab) lab.textContent=file.name+' — جاهز للتطبيق';
      toast('تم اختيار ملف التحديث: '+file.name);
    },
    downloadBulkTemplate:()=>{
      const headers=['المزود','الفئة','الماركة','الموديل','سنة الصنع','المدينة','الفرع','المتاح'];
      const sample=[['شركة الصحراء','سيدان','تويوتا','كامري','2026','الرياض','مطار الملك خالد','12']];
      const enc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
      const csv='\ufeff'+[headers,...sample].map(r=>r.map(enc).join(',')).join('\n');
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download='نموذج-تحديث-الإتاحة.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast('تم تنزيل نموذج التحديث.');
    },
    /* —— تحديث جماعي للأسعار: فلاتر + أسعار + نسبة/نوع + إكسل —— */
    bulkPriceUpdate:()=>{
      window.__bulkPriceExcelName='';
      const makes=(state.fleetMakes||[]).map(x=>x.name);
      const models=(state.fleetModels||[]).map(x=>x.name);
      const cats=[...(state.fleetCategories||[]).map(x=>x.name),'سيدان','اقتصادية','دفع رباعي','فاخرة'];
      const cities=['الرياض','جدة','الدمام','الخبر','مكة','المدينة','الأحساء','تبوك'];
      const branches=['مطار الملك خالد','جدة الشمالية','الخبر التشغيلي','مكة المركزي','طريق الملك عبدالعزيز','جدة الرقمية'];
      const years=['2026','2025','2024','2023','2022','2021'];
      const opt=(list,all='— بدون اختيار')=>`<option value="">${all}</option>`+[...new Set(list)].map(x=>`<option value="${x}">${x}</option>`).join('');
      openM(dlg('تحديث جماعي للأسعار',
        `${fld('رفع نموذج التحديث (Excel)',`<div class="mdl-upload"><input id="bulk-price-excel" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" onchange="WafraOps.pickBulkPriceExcel()"><div class="drop" onclick="document.getElementById('bulk-price-excel').click()"><span class="ic">📄</span><b id="bulk-price-excel-lab">اسحب ملف الإكسل أو اضغط للاختيار</b><span class="sub">XLSX أو CSV · يمكن ترك الحقول فارغة والاعتماد على الملف فقط</span></div></div>`)}
         <div style="margin:0 0 12px"><button type="button" class="btn ghost sm" onclick="WafraOps.downloadBulkPriceTemplate()">⤓ تنزيل نموذج فارغ</button></div>
         <div class="frow">
           ${fld('المزود',`<select id="bp-provider" class="native-input">${opt(providers,'— بدون اختيار')}</select>`)}
           ${fld('الفئة',`<select id="bp-cat" class="native-input">${opt(cats,'— بدون اختيار')}</select>`)}
         </div>
         <div class="frow">
           ${fld('الماركة',`<select id="bp-make" class="native-input">${opt(makes,'— بدون اختيار')}</select>`)}
           ${fld('الموديل',`<select id="bp-model" class="native-input">${opt(models,'— بدون اختيار')}</select>`)}
         </div>
         <div class="frow">
           ${fld('سنة الصنع',`<select id="bp-year" class="native-input">${opt(years,'— بدون اختيار')}</select>`)}
           ${fld('المدينة',`<select id="bp-city" class="native-input">${opt(cities,'— بدون اختيار')}</select>`)}
         </div>
         <div class="frow">
           ${fld('الفرع',`<select id="bp-branch" class="native-input">${opt(branches,'— بدون اختيار')}</select>`)}
           <div></div>
         </div>
         <div class="frow">
           ${fld('يومي',`<input id="bp-daily" class="native-input" type="number" min="0" step="1" placeholder="اختياري">`)}
           ${fld('أسبوعي',`<input id="bp-weekly" class="native-input" type="number" min="0" step="1" placeholder="اختياري">`)}
           ${fld('شهري',`<input id="bp-monthly" class="native-input" type="number" min="0" step="1" placeholder="اختياري">`)}
         </div>
         <div class="frow">
           ${fld('نسبة التعديل %',`<input id="bulk-percent" class="native-input" type="number" min="0" step="0.1" placeholder="اختياري">`)}
           ${fld('نوع التعديل',`<select id="bulk-type" class="native-input"><option value="">— بدون اختيار</option><option>زيادة الأسعار</option><option>تخفيض الأسعار</option></select>`)}
         </div>
         <p class="note info">يمكن ترك كل الحقول فارغة والاعتماد على ملف الإكسل فقط، أو تعبئة الفلاتر/الأسعار/نسبة التعديل يدوياً.</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkPrice()">تطبيق التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    pickBulkPriceExcel:()=>{
      const inp=document.getElementById('bulk-price-excel');
      if(!inp||!inp.files||!inp.files[0]) return;
      const file=inp.files[0];
      window.__bulkPriceExcelName=file.name;
      const lab=document.getElementById('bulk-price-excel-lab');
      if(lab) lab.textContent=file.name+' — جاهز للتطبيق';
      toast('تم اختيار ملف التسعير: '+file.name);
    },
    downloadBulkPriceTemplate:()=>{
      const headers=['المزود','الفئة','الماركة','الموديل','سنة الصنع','المدينة','الفرع','يومي','أسبوعي','شهري','نسبة التعديل %','نوع التعديل'];
      const sample=[['شركة الصحراء','سيدان','تويوتا','كامري','2026','الرياض','مطار الملك خالد','190','1140','4200','5','زيادة الأسعار']];
      const enc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
      const csv='\ufeff'+[headers,...sample].map(r=>r.map(enc).join(',')).join('\n');
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      a.download='نموذج-تحديث-الأسعار.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast('تم تنزيل نموذج تحديث الأسعار.');
    },
    bulkScopeChange:()=>{
      const wrap=document.getElementById('bulk-provider-wrap');
      if(wrap) wrap.style.display=(val('bulk-scope')==='one')?'block':'none';
    },
    applyBulkAvail:()=>{
      const filters=[
        ['المزود',val('bulk-provider')],
        ['الفئة',val('bulk-cat')],
        ['الماركة',val('bulk-make')],
        ['الموديل',val('bulk-model')],
        ['سنة الصنع',val('bulk-year')],
        ['المدينة',val('bulk-city')],
        ['الفرع',val('bulk-branch')]
      ].filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`);
      const avail=val('bulk-available');
      const hasFile=!!window.__bulkExcelName;
      if(!hasFile&&(avail===''||avail==null)){toast('أدخل عدد المتاح أو ارفع ملف إكسل.');return;}
      const filePart=hasFile?` عبر الملف «${window.__bulkExcelName}»`:'';
      const scope=filters.length?filters.join(' · '):'كل السيارات';
      closeM();
      toast(hasFile&&!avail?`تم تطبيق تحديث الإتاحة من الملف لنطاق (${scope}).`:`تم تحديث المتاح إلى ${avail} لنطاق (${scope})${filePart}.`);
      window.__bulkExcelName='';
    },
    applyBulkPrice:()=>{
      const filters=[
        ['المزود',val('bp-provider')],
        ['الفئة',val('bp-cat')],
        ['الماركة',val('bp-make')],
        ['الموديل',val('bp-model')],
        ['سنة الصنع',val('bp-year')],
        ['المدينة',val('bp-city')],
        ['الفرع',val('bp-branch')]
      ].filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`);
      const daily=val('bp-daily'), weekly=val('bp-weekly'), monthly=val('bp-monthly');
      const pct=val('bulk-percent'), typ=val('bulk-type');
      const hasFile=!!window.__bulkPriceExcelName;
      const hasManual=filters.length||daily||weekly||monthly||pct||typ;

        `<button class="btn coral" onclick="WafraOps.saveBookingRefund('${escAttr(id)}')">إنشاء استرداد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    saveBookingRefund:id=>{
      const amt=val('bk-ref-amt'), reason=val('bk-ref-reason');
      if(!reason){toast('اكتب سبب الاسترداد.');return;}
      closeM(); toast(`تم إنشاء استرداد ${amt?amt+' ر.س':'كامل القيمة'} للحجز ${id}.`);
    },
    openBookingCancel:id=>{
      openM(dlg('<span style="color:var(--red-ink,#C62828)">إلغاء إداري</span>',
        `${fld('سبب الإلغاء',`<input id="bk-cancel-reason" class="native-input" placeholder="سبب الإلغاء">`)}
         <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font:600 13px Cairo"><input type="checkbox" id="bk-cancel-refund" checked> استرداد كامل القيمة للعميل تلقائياً</label>
         <div class="note warn">الحجز ${safe(id)} — الإلغاء الإداري يُسجَّل في التدقيق ويُشعر العميل والمزود فوراً.</div>`,
        `<button class="btn danger" onclick="WafraOps.saveBookingCancel('${escAttr(id)}')">إلغاء الحجز إدارياً</button><button class="btn ghost" onclick="closeM()">تراجع</button>`));
    },
    saveBookingCancel:id=>{
      const reason=val('bk-cancel-reason');
      if(!reason){toast('اكتب سبب الإلغاء.');return;}
      const refund=document.getElementById('bk-cancel-refund')?.checked;
      closeM(); toast(`تم إلغاء الحجز ${id} إدارياً${refund?' مع استرداد كامل القيمة':''}.`);
    },
    decideCancellation:(id,decision)=>{
      const title=decision==='معتمد'?'اعتماد إلغاء الحجز':'رفض طلب الإلغاء';
      openM(dlg(`${title} — ${id}`,
        decision==='مرفوض'
          ?`${fld('سبب الرفض',`<textarea id="cancel-note" class="native-input" rows="3" placeholder="اكتب سبب رفض طلب الإلغاء للعميل"></textarea>`)}`
          :`<div class="note ok">سيتم إلغاء الحجز ${id} وإشعار العميل والمزود، مع احتساب سياسة الاسترداد حسب التوقيت.</div>
            ${fld('ملاحظة (اختياري)',`<textarea id="cancel-note" class="native-input" rows="2" placeholder="ملاحظة داخلية أو للعميل"></textarea>`)}`,
        `<button class="btn ${decision==='مرفوض'?'danger':'coral'}" onclick="WafraOps.saveCancellationDecision('${id}','${decision}')">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveCancellationDecision:(id,decision)=>{
      const note=val('cancel-note');
      if(decision==='مرفوض'&&!note){toast('اكتب سبب الرفض أولاً.');return;}
      state.cancelRequests=state.cancelRequests||[];
      const row=state.cancelRequests.find(x=>x.id===id);
      if(row){row.status=decision;row.note=note||'';}
      try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}
      closeM(); render();
      toast(decision==='معتمد'?`تم اعتماد إلغاء ${id}.`:`تم رفض طلب إلغاء ${id}.`);
    },
    approveRequest:(t,id)=>{
      if(id&&(t==='اعتماد'||t==='رفض')){WafraOps.decideCancellation(id,t==='اعتماد'?'معتمد':'مرفوض');return;}
      toast(`تم ${t} الطلب وتحديث حالته.`);
    },
    openBooking:id=>{
      window.__bookingId=id||'BK-20418';
      window.__bookingTab='الملخص';
      if(location.hash==='#booking') render();
      else location.hash='#booking';
    },
    bookingTab:t=>{window.__bookingTab=t;render();}

      ${fld('المزود',`<select class="native-input"><option>كل المزودين</option><option>شركة الصحراء</option><option>كي رنت</option></select>`)}
      ${fld('المدينة',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option></select>`)}
      ${fld('الفرع',`<select class="native-input"><option>كل الفروع</option><option>مطار الملك خالد</option><option>جدة الشمالية</option></select>`)}
      ${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>جاري</option><option>مكتمل</option><option>ملغي</option><option>متأخر</option></select>`)}
      <label class="fsearch">⌕ <input placeholder="اكتب للبحث…" oninput="WafraOps.searchHint(this.value)"></label>
    </div><div class="card-b">${table(['رقم الحجز','العميل','المزود','المدينة','الفرع','السيارة','الاستلام','التسليم','المبلغ','الحالة','الإجراءات'],[
      ['BK-20418','أحمد الشمري','شركة الصحراء','الرياض','مطار الملك خالد','كامري 2026','25 سبتمبر','28 سبتمبر',money('570'),pill('جاري'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20418')">إطلاع</button>`],
      ['BK-20396','وليد الحربي','مسار','الخبر','الخبر التشغيلي','K5 2026','19 سبتمبر','26 سبتمبر',money('1,090'),pill('متأخر'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع</button>`],
      ['BK-20381','نورة القحطاني','كي رنت','جدة','جدة الشمالية','إلنترا 2025','17 سبتمبر','20 سبتمبر',money('380'),pill('مكتمل'),
        `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20381')">إطلاع</button>`]
    ])}</div>`);

  /* —— التمديد: إطلاع على الحجز + سجل التمديد —— */
  S.extensions=()=>phead('طلبات التمديد','الاطلاع على تفاصيل الحجز قبل اعتماد أو رفض أي تمديد',[],
    `<button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات التمديد','Excel')">Excel ⤓</button>
     <button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات التمديد','PDF')">PDF ⤓</button>`)
    +card(`<div class="filters">${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>قيد المراجعة</option><option>معتمد</option><option>مرفوض</option></select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
      <div class="card-b">${table(['رقم الطلب','رقم الحجز','العميل','المدة المطلوبة','القيمة الإضافية','الحالة','الإجراءات'],[
        ['EX-118','BK-20418','أحمد الشمري','يومان',money('380'),pill('قيد المراجعة'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20418')">إطلاع على الحجز</button>
           <button class="btn ghost sm" onclick="WafraOps.extensionLog('EX-118')">سجل التمديد</button>
           <button class="btn coral sm" onclick="WafraOps.approveRequest('اعتماد')">اعتماد</button>
           <button class="btn danger sm" onclick="WafraOps.approveRequest('رفض')">رفض</button>`],
        ['EX-112','BK-20396','وليد الحربي','يوم واحد',money('190'),pill('معتمد'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع على الحجز</button>
           <button class="btn ghost sm" onclick="WafraOps.extensionLog('EX-112')">سجل التمديد</button>`]
      ])}</div>`);

  /* —— المتأخرة/المتعثرة: رابط سداد + حالة العقد المعلق —— */
  S.stuck=()=>phead('الحجوزات المتأخرة / المتعثرة','المفتوحة والمعلقة والمغلقة مع إجراءات التحصيل والمتابعة',[],
    `<button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات المتعثرة','Excel')">Excel ⤓</button>
     <button class="btn ghost sm" onclick="WafraOps.exportLocal('الحجوزات المتعثرة','PDF')">PDF ⤓</button>`)
    +card(`<div class="filters">${fld('الحالة',`<select class="native-input"><option>كل الحالات</option><option>مفتوح</option><option>معلق</option><option>مغلق</option></select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
      <div class="card-b">${table(['رقم الحجز','العميل','المزود','المبلغ المستحق','السبب','حالة العقد','الحالة','الإجراءات'],[
        ['BK-20390','نايف المالكي','شركة الصحراء',money('450'),'فشل التحصيل',bdg('معلق','a'),pill('مفتوح'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20390')">إطلاع على الحجز</button>
           <button class="btn coral sm" onclick="WafraOps.sendPayLink('BK-20390')">رابط السداد</button>
           <button class="btn ghost sm" onclick="WafraOps.requestResponse('طلب رد')">طلب رد</button>
           <button class="btn danger sm" onclick="WafraOps.confirmClose('BK-20390')">إغلاق</button>`],
        ['BK-20396','وليد الحربي','مسار',money('240'),'تأخر الإرجاع',bdg('معلق','a'),pill('معلق'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20396')">إطلاع على الحجز</button>
           <button class="btn coral sm" onclick="WafraOps.sendPayLink('BK-20396')">رابط السداد</button>
           <button class="btn ghost sm" onclick="WafraOps.requestResponse('طلب رد')">طلب رد</button>
           <button class="btn danger sm" onclick="WafraOps.confirmClose('BK-20396')">إغلاق</button>`],
        ['BK-20371','سلمان العنزي','كي رنت',money('0'),'تمت التسوية',bdg('ساري','g'),pill('مغلق'),
          `<button class="btn ghost sm" onclick="WafraOps.openBooking('BK-20371')">إطلاع على الحجز</button>`]
      ])}</div>`);

  /* —— الإلغاء: إجراءات فعّالة حسب الحالة —— */
  state.cancelRequests=state.cancelRequests||[
    {id:'BK-20417',customer:'سارة العتيبي',provider:'كي رنت',reason:'تغيير خطة السفر',amount:'290',status:'قيد المراجعة'},
    {id:'BK-20405',customer:'ريم الزهراني',provider:'شركة الصحراء',reason:'السعر',amount:'570',status:'قيد المراجعة'}
  ];
  const cancelActs=r=>{
    const id=r.id;
    const view=`<button class="btn ghost sm" onclick="WafraOps.openBooking('${id}')">إطلاع على الحجز</button>`;
    if(r.status==='معتمد'||r.status==='مرفوض') return `${view}<button class="btn ghost sm" onclick="WafraOps.demoAction('عرض قرار ${id}')">عرض القرار</button>`;
    return `${view}
      <button class="btn ghost sm" onclick="WafraOps.transferBooking('${id}')">تحويل</button>
      <button class="btn coral sm" onclick="WafraOps.decideCancellation('${id}','معتمد')">اعتماد</button>
      <button class="btn danger sm" onclick="WafraOps.decideCancellation('${id}','مرفوض')">رفض</button>`;
  };
  S.cancellationRequests=()=>{
    const f=window.__cancelFilter||{};
    const rows=state.cancelRequests.filter(r=>!f.status||r.status===f.status);
    return phead('طلبات الإلغاء','كل طلب يعرض تفاصيل الحجز كاملة قبل القرار',[],
      `<button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات الإلغاء','Excel')">Excel ⤓</button>
       <button class="btn ghost sm" onclick="WafraOps.exportLocal('طلبات الإلغاء','PDF')">PDF ⤓</button>`)
      +card(`<div class="filters">${fld('الحالة',`<select id="cancel-status-filter" class="native-input" onchange="window.__cancelFilter={status:this.value||''};render()"><option value="">كل الحالات</option>${['قيد المراجعة','معتمد','مرفوض'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
        <div class="card-b">${table(['رقم الحجز','العميل','المزود','سبب الإلغاء','القيمة','الحالة','الإجراءات'],
          rows.map(r=>[r.id,r.customer,r.provider,r.reason,money(r.amount),
            pill(r.status,r.status==='معتمد'?'g':r.status==='مرفوض'?'r':'a'),cancelActs(r)]))}</div>`);
  };

  /* تسمية NAV */
  const bookNav=NAV.find(g=>g.g==='الحجوزات');
  if(bookNav){
    const stuck=bookNav.items.find(i=>i.k==='stuck');
    if(stuck) stuck.t='الحجوزات المتأخرة / المتعثرة';
  }
  if(window.TITLES){
    window.TITLES.stuck='الحجوزات المتأخرة / المتعثرة';
    window.TITLES.fleetAddons='الإضافات';
    window.TITLES.fleetMakesModels='الماركات والموديلات';
    window.TITLES.fleetAvailable='السيارات المتاحة';
    window.TITLES.fleetPricing='التسعير';
    window.TITLES.fleetDynamic='التسعير الديناميكي';
    window.TITLES.fleetQuality='مراقبة جودة الأسطول';
    window.TITLES.fleetReview='مراقبة جودة الأسطول';
    window.TITLES.deletions='طلبات الحذف';
    window.TITLES.customerLoyalty='ولاء وتصنيف العملاء';
    window.TITLES.bookingMap='خريطة الحجوزات';
  }
  const fleetNavAddons=NAV.find(g=>g.g==='إدارة الأسطول');
  if(fleetNavAddons&&!fleetNavAddons.items.some(x=>x.k==='fleetAddons')){
    const svcIdx=fleetNavAddons.items.findIndex(x=>x.k==='fleetServices');
    const addon={k:'fleetAddons',t:'الإضافات',i:'＋'};
    if(svcIdx>=0) fleetNavAddons.items.splice(svcIdx+1,0,addon); else fleetNavAddons.items.push(addon);
  }
  /* ولاء وتصنيف العملاء تحت قائمة العملاء (وليس التقارير فقط) */
  const customerNavLoyalty=NAV.find(g=>g.g==='العملاء');
  if(customerNavLoyalty){
    if(!customerNavLoyalty.items.some(x=>x.k==='customerLoyalty')){
      const after=customerNavLoyalty.items.findIndex(x=>x.k==='deletions'||x.k==='fraud'||x.k==='ratingManage');
      const item={k:'customerLoyalty',t:'ولاء وتصنيف العملاء',i:'★'};
      if(after>=0) customerNavLoyalty.items.splice(after,0,item);
      else customerNavLoyalty.items.push(item);
    }else{
      const ly=customerNavLoyalty.items.find(x=>x.k==='customerLoyalty');
      if(ly) ly.t='ولاء وتصنيف العملاء';
    }
    if(typeof renderNav==='function') renderNav();
  }

  /* ضمان exportLocal إن لم يُعرَّف */
  if(!WafraOps.exportLocal) WafraOps.exportLocal=(n,f)=>toast(`تم تجهيز تصدير ${n} بصيغة ${f}.`);
  if(!WafraOps.searchHint) WafraOps.searchHint=v=>v&&toast(`البحث التجريبي: ${v}`);
})();
</script>
