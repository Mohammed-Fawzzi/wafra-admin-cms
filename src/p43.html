<script>
/* الفروع: مناطق/مدن (منطقة تابعة للمدينة) · نموذج إضافة فرع · رسوم بين المدن + تاريخ الإضافة */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const save=()=>{try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}};
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escAttr=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const fmt=n=>Number(n||0).toLocaleString('en-US');
  const today=()=>{
    const d=new Date();
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  };
  const prev=(k,v)=>`<div class="prev-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  const DEFAULT_REGIONS=['المنطقة الوسطى','المنطقة الغربية','المنطقة الشرقية','المنطقة الشمالية','المنطقة الجنوبية','منطقة مكة المكرمة','منطقة المدينة المنورة','منطقة القصيم','منطقة عسير'];
  state.areas=state.areas||{regions:[],cities:[]};
  /* ترحيل المدن القديمة من نص إلى كائن {name,region} */
  if(Array.isArray(state.areas.cities)){
    state.areas.cities=state.areas.cities.map(c=>{
      if(typeof c==='string') return {name:c,region:'المنطقة الوسطى',status:'نشط'};
      return c;
    });
  }
  state.areas.regions=state.areas.regions||[];
  const FEE_CITIES=['الرياض','جدة','مكة','المدينة','الدمام','الخبر','الأحساء','الجبيل','تبوك','أبها'];
  state.fees=state.fees||[
    {from:'الدمام',to:'الأحساء',amount:'400',validFrom:'2026/01/01',validTo:'2026/12/31',status:'نشط'},
    {from:'الأحساء',to:'الجبيل',amount:'400',validFrom:'2026/01/01',validTo:'2026/12/31',status:'نشط'},
    {from:'الدمام',to:'الجبيل',amount:'400',validFrom:'2026/01/01',validTo:'2026/12/31',status:'نشط'},
    {from:'مكة',to:'جدة',amount:'80',validFrom:'2026/01/01',validTo:'2026/08/08',status:'نشط'},
    {from:'الرياض',to:'جدة',amount:'180',validFrom:'2026/03/01',validTo:'2026/12/31',status:'غير نشط'}
  ];
  /* ترحيل السجلات القديمة إلى شكل نموذج المزود */
  state.fees=state.fees.map(f=>({
    from:f.from||'الرياض',
    to:f.to||'جدة',
    amount:String(f.amount??'0'),
    validFrom:f.validFrom||'2026/01/01',
    validTo:f.validTo||'2026/12/31',
    status:(f.status==='نشطة'||f.status==='نشط')?'نشط':'غير نشط'
  }));
  state.branches=state.branches||[
    {id:'BR-014',name:'مطار الملك خالد',provider:'شركة الصحراء',city:'الرياض',contracts:186,utilization:81,commission:12,status:'نشط',type:'مطار',address:'صالة الوصول'},
    {id:'BR-021',name:'جدة الشمالية',provider:'كي رنت',city:'جدة',contracts:139,utilization:75,commission:10,status:'نشط',type:'داخلي',address:'شارع الأمير سلطان'},
    {id:'BR-031',name:'الخبر التشغيلي',provider:'مسار',city:'الخبر',contracts:18,utilization:0,commission:10,status:'غير نشط',type:'توصيل',address:'طريق الكورنيش'}
  ];

  const regionOptions=()=>{
    const extra=state.areas.regions.map(r=>typeof r==='string'?r:r.name);
    return [...DEFAULT_REGIONS,...extra.filter(x=>!DEFAULT_REGIONS.includes(x))];
  };
  const parseCities=raw=>(raw||'').split(/[،,\n]+/).map(s=>s.trim()).filter(Boolean);
  const branchCountByCity=city=>(state.branches||[]).filter(b=>b.city===city).length;
  const citiesOfRegion=regionName=>{
    const fromCities=(state.areas.cities||[]).filter(c=>{
      const r=typeof c==='string'?'':(c.region||'');
      return r===regionName;
    }).map(c=>typeof c==='string'?c:c.name);
    const reg=(state.areas.regions||[]).find(r=>(typeof r==='string'?r:r.name)===regionName);
    const seeded=reg&&Array.isArray(reg.cities)?reg.cities:[];
    return [...new Set([...seeded,...fromCities])];
  };

  /* إحصاءات جغرافية للعرض (مزودون / فروع / سيارات / حجوزات) */
  const CITY_STATS={
    'الرياض':{providers:21,branches:58,cars:2140,bookings:1842},
    'الخرج':{providers:3,branches:6,cars:180,bookings:96},
    'جدة':{providers:14,branches:41,cars:1680,bookings:1204},
    'مكة':{providers:8,branches:18,cars:640,bookings:520},
    'مكة المكرمة':{providers:8,branches:18,cars:640,bookings:520},
    'الدمام':{providers:7,branches:16,cars:520,bookings:412},
    'الخبر':{providers:9,branches:19,cars:820,bookings:480},
    'تبوك':{providers:4,branches:8,cars:210,bookings:142},
    'حائل':{providers:2,branches:4,cars:96,bookings:58},
    'أبها':{providers:3,branches:7,cars:188,bookings:124},
    'جازان':{providers:2,branches:5,cars:120,bookings:86},
    'المدينة':{providers:5,branches:12,cars:360,bookings:268},
    'القصيم':{providers:3,branches:6,cars:150,bookings:98}
  };
  const cityStats=name=>{
    const seed=CITY_STATS[name];
    const liveBranches=branchCountByCity(name);
    if(seed){
      return {
        providers:seed.providers,
        branches:Math.max(seed.branches,liveBranches),
        cars:seed.cars,
        bookings:seed.bookings
      };
    }
    const branches=Math.max(liveBranches,0);
    return {
      providers:branches?Math.max(1,Math.round(branches/3)):0,
      branches,
      cars:branches*28,
      bookings:branches*22
    };
  };
  const sumStats=list=>list.reduce((a,c)=>{
    const s=cityStats(c);
    a.providers+=s.providers; a.branches+=s.branches; a.cars+=s.cars; a.bookings+=s.bookings;
    return a;
  },{providers:0,branches:0,cars:0,bookings:0});

  const regionsBase=[
    {name:'المنطقة الوسطى',cities:['الرياض','الخرج'],status:'نشط'},
    {name:'المنطقة الغربية',cities:['جدة'],status:'نشط'},
    {name:'المنطقة الشرقية',cities:['الدمام','الخبر'],status:'نشط'},
    {name:'المنطقة الشمالية',cities:['تبوك','حائل'],status:'نشط'},
    {name:'المنطقة الجنوبية',cities:['جازان'],status:'نشط'},
    {name:'منطقة مكة المكرمة',cities:['مكة'],status:'نشط'},
    {name:'منطقة المدينة المنورة',cities:['المدينة'],status:'نشط'},
    {name:'منطقة القصيم',cities:['القصيم'],status:'نشط'},
    {name:'منطقة عسير',cities:['أبها'],status:'نشط'}
  ];
  const citiesBase=[
    {name:'الرياض',region:'المنطقة الوسطى',status:'نشط'},
    {name:'الخرج',region:'المنطقة الوسطى',status:'نشط'},
    {name:'جدة',region:'المنطقة الغربية',status:'نشط'},
    {name:'مكة',region:'منطقة مكة المكرمة',status:'نشط'},
    {name:'الدمام',region:'المنطقة الشرقية',status:'نشط'},
    {name:'الخبر',region:'المنطقة الشرقية',status:'نشط'},
    {name:'تبوك',region:'المنطقة الشمالية',status:'نشط'},
    {name:'حائل',region:'المنطقة الشمالية',status:'نشط'},
    {name:'أبها',region:'منطقة عسير',status:'نشط'},
    {name:'جازان',region:'المنطقة الجنوبية',status:'نشط'},
    {name:'المدينة',region:'منطقة المدينة المنورة',status:'نشط'},
    {name:'القصيم',region:'منطقة القصيم',status:'نشط'}
  ];

  const buildRegions=()=>{
    const customRegions=(state.areas.regions||[]).map(r=>({
      name:typeof r==='string'?r:r.name,
      cities:typeof r==='string'?citiesOfRegion(typeof r==='string'?r:r.name):(r.cities||citiesOfRegion(r.name)),
      status:(typeof r==='object'&&r.status)||'نشط'
    }));
    const byName=new Map(regionsBase.map(r=>[r.name,{...r,cities:[...r.cities]}]));
    customRegions.forEach(r=>{
      if(byName.has(r.name)){
        const cur=byName.get(r.name);
        cur.cities=[...new Set([...(r.cities||[]),...cur.cities])];
        cur.status=r.status||cur.status;
      }else byName.set(r.name,r);
    });
    return [...byName.values()];
  };
  const buildCities=()=>{
    const known=new Set();
    const list=[];
    citiesBase.forEach(c=>{known.add(c.name); list.push({...c});});
    (state.areas.cities||[]).forEach(c=>{
      const row={
        name:typeof c==='string'?c:c.name,
        region:typeof c==='string'?'—':(c.region||'—'),
        status:(typeof c==='object'&&c.status)||'نشط'
      };
      if(known.has(row.name)){
        const i=list.findIndex(x=>x.name===row.name);
        if(i>=0){ list[i].region=row.region||list[i].region; list[i].status=row.status||list[i].status; }
      }else{ known.add(row.name); list.push(row); }
    });
    return list;
  };
  const upsertRegion=(name,cities,status)=>{
    state.areas=state.areas||{regions:[],cities:[]};
    const i=(state.areas.regions||[]).findIndex(r=>(typeof r==='string'?r:r.name)===name);
    const row={name,cities,status:status||'نشط'};
    if(i>=0) state.areas.regions[i]=row; else state.areas.regions.push(row);
    cities.forEach(city=>{
      const exists=state.areas.cities.some(c=>(typeof c==='string'?c:c.name)===city);
      if(!exists) state.areas.cities.push({name:city,region:name,status:'نشط'});
      else{
        const c=state.areas.cities.find(x=>(typeof x==='string'?x:x.name)===city);
        if(c&&typeof c==='object') c.region=name;
      }
    });
  };
  const upsertCity=(name,region,status)=>{
    state.areas=state.areas||{regions:[],cities:[]};
    const i=(state.areas.cities||[]).findIndex(c=>(typeof c==='string'?c:c.name)===name);
    const row={name,region:region||'المنطقة الوسطى',status:status||'نشط'};
    if(i>=0) state.areas.cities[i]=row; else state.areas.cities.push(row);
  };

  Object.assign(WafraOps,{
    areasTab:t=>{window.__areasTab=t;render();},
    addArea:t=>{
      if(t==='regions'){
        openM(dlg('تعريف منطقة جديدة',
          `${fld('اسم المنطقة',`<input id="area-name" class="native-input" placeholder="مثال: المنطقة الوسطى">`)}
           ${fld('المدن التابعة',`<textarea id="area-cities" class="native-input" rows="3" placeholder="الرياض، الخرج، القصيم"></textarea>`,'اكتب أسماء المدن مفصولة بفاصلة. تظهر في عمود المدن بالجدول.')}
           ${fld('الحالة',`<select id="area-status" class="native-input"><option>نشط</option><option>غير نشط</option></select>`)}
           <div class="note info">عدد الفروع والسيارات والحجوزات يُحسب من بيانات المدن التابعة.</div>`,
          `<button class="btn coral" onclick="WafraOps.saveArea('regions')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
        ));
        return;
      }
      openM(dlg('تعريف مدينة جديدة',
        `${fld('اسم المدينة',`<input id="area-name" class="native-input" placeholder="مثال: القصيم">`)}
         ${fld('المنطقة التابعة لها',`<select id="area-region" class="native-input">${regionOptions().map(r=>`<option>${r}</option>`).join('')}</select>`,'حدد المنطقة الإدارية التي تتبعها هذه المدينة.')}
         ${fld('الحالة',`<select id="area-status" class="native-input"><option>نشط</option><option>غير نشط</option></select>`)}
         <div class="note info">عدد الفروع يُحسب تلقائياً عند إضافة فروع لهذه المدينة من شاشة الفروع.</div>`,
        `<button class="btn coral" onclick="WafraOps.saveArea('cities')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveArea:t=>{
      const n=val('area-name');
      if(!n){toast('اكتب الاسم أولاً.');return;}
      if(t==='regions') upsertRegion(n,parseCities(val('area-cities')),val('area-status')||'نشط');
      else upsertCity(n,val('area-region')||'المنطقة الوسطى',val('area-status')||'نشط');
      save(); closeM(); render(); toast('تم الحفظ بنجاح.');
    },
    viewArea:(t,name)=>{
      if(t==='regions'){
        const regions=buildRegions();
        const r=regions.find(x=>x.name===name);
        if(!r)return;
        const citiesList=(r.cities&&r.cities.length)?r.cities:citiesOfRegion(r.name);
        const s=sumStats(citiesList);
        openM(dlg(`استعراض ${safe(r.name)}`,
          `${prev('المنطقة',safe(r.name))}
           ${prev('المدن التابعة',citiesList.length?citiesList.map(safe).join(' · '):'—')}
           ${prev('المزودون',fmt(s.providers))}
           ${prev('الفروع',fmt(s.branches))}
           ${prev('السيارات',fmt(s.cars))}
           ${prev('الحجوزات',fmt(s.bookings))}
           ${prev('الحالة',r.status||'نشط')}`,
          `<button class="btn coral" onclick="closeM();WafraOps.editArea('regions','${escAttr(r.name)}')">تعديل</button><button class="btn ghost" onclick="closeM()">إغلاق</button>`
        ));
        return;
      }
      const cities=buildCities();
      const c=cities.find(x=>x.name===name);
      if(!c)return;
      const s=cityStats(c.name);
      openM(dlg(`استعراض ${safe(c.name)}`,
        `${prev('المدينة',safe(c.name))}
         ${prev('المنطقة',safe(c.region))}
         ${prev('المزودون',fmt(s.providers))}
         ${prev('الفروع',fmt(s.branches))}
         ${prev('السيارات',fmt(s.cars))}
         ${prev('الحجوزات',fmt(s.bookings))}
         ${prev('الحالة',c.status||'نشط')}`,
        `<button class="btn coral" onclick="closeM();WafraOps.editArea('cities','${escAttr(c.name)}')">تعديل</button><button class="btn ghost" onclick="closeM()">إغلاق</button>`
      ));
    },
    editArea:(t,name)=>{
      if(t==='regions'){
        const regions=buildRegions();
        const r=regions.find(x=>x.name===name);
        if(!r)return;
        const citiesList=(r.cities&&r.cities.length)?r.cities:citiesOfRegion(r.name);
        openM(dlg(`تعديل منطقة: ${safe(r.name)}`,
          `${fld('اسم المنطقة',`<input id="area-name" class="native-input" value="${safe(r.name)}">`)}
           ${fld('المدن التابعة',`<textarea id="area-cities" class="native-input" rows="3">${safe(citiesList.join('، '))}</textarea>`)}
           ${fld('الحالة',`<select id="area-status" class="native-input"><option ${(!r.status||r.status==='نشط')?'selected':''}>نشط</option><option ${r.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}`,
          `<button class="btn coral" onclick="WafraOps.updateArea('regions','${escAttr(r.name)}')">حفظ التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
        ));
        return;
      }
      const cities=buildCities();
      const c=cities.find(x=>x.name===name);
      if(!c)return;
      openM(dlg(`تعديل مدينة: ${safe(c.name)}`,
        `${fld('اسم المدينة',`<input id="area-name" class="native-input" value="${safe(c.name)}">`)}
         ${fld('المنطقة التابعة لها',`<select id="area-region" class="native-input">${regionOptions().map(r=>`<option ${r===c.region?'selected':''}>${r}</option>`).join('')}</select>`)}
         ${fld('الحالة',`<select id="area-status" class="native-input"><option ${(!c.status||c.status==='نشط')?'selected':''}>نشط</option><option ${c.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}`,
        `<button class="btn coral" onclick="WafraOps.updateArea('cities','${escAttr(c.name)}')">حفظ التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    updateArea:(t,oldName)=>{
      const n=val('area-name');
      if(!n){toast('اكتب الاسم أولاً.');return;}
      if(t==='regions'){
        const cities=parseCities(val('area-cities'));
        const i=(state.areas.regions||[]).findIndex(r=>(typeof r==='string'?r:r.name)===oldName);
        if(i>=0) state.areas.regions.splice(i,1);
        upsertRegion(n,cities,val('area-status')||'نشط');
      }else{
        const i=(state.areas.cities||[]).findIndex(c=>(typeof c==='string'?c:c.name)===oldName);
        if(i>=0) state.areas.cities.splice(i,1);
        upsertCity(n,val('area-region')||'المنطقة الوسطى',val('area-status')||'نشط');
      }
      save(); closeM(); render(); toast('تم حفظ التعديل.');
    },
    openBranchForm:id=>{
      window.__branchEdit=id||'';
      location.hash='branchForm';
    },
    saveBranchForm:()=>{
      const edit=window.__branchEdit;
      const name=val('bf-name');
      if(!name){toast('أدخل اسم الفرع.');return;}
      const payload={
        id:val('bf-id')||('BR-'+String(100+state.branches.length)),
        name,
        provider:val('bf-provider')||'شركة الصحراء',
        city:val('bf-city')||'الرياض',
        type:val('bf-type')||'داخلي',
        address:val('bf-address')||'—',
        status:val('bf-status')||'نشط',
        contracts:0,utilization:0,commission:12
      };
      if(edit){
        const b=state.branches.find(x=>x.id===edit);
        if(b) Object.assign(b,payload,{id:edit});
        else state.branches.unshift(payload);
      }else{
        if(state.branches.some(x=>x.id===payload.id)) payload.id='BR-'+String(Date.now()).slice(-4);
        state.branches.unshift(payload);
      }
      save();
      window.__branchEdit='';
      location.hash='branches';
      render();
      toast(edit?'تم حفظ تعديلات الفرع.':'تم إضافة الفرع بنجاح.');
    },
    feeFilter:()=>{
      window.__feeFilter={
        q:document.getElementById('fee-q')?.value||'',
        city:document.getElementById('fee-city')?.value||'',
        status:document.getElementById('fee-status-f')?.value||''
      };
      render();
    },
    toggleFeeStatus:i=>{
      const f=(state.fees||[])[i];
      if(!f)return;
      f.status=f.status==='نشط'?'غير نشط':'نشط';
      save(); render(); toast(f.status==='نشط'?'تم تفعيل الرسوم.':'تم إيقاف الرسوم.');
    },
    addFee:()=>{
      window.__feeEdit=null;
      WafraOps.openFeeModal();
    },
    editFee:i=>{
      const f=(state.fees||[])[i];
      if(!f)return;
      window.__feeEdit=i;
      WafraOps.openFeeModal(f);
    },
    openFeeModal:f=>{
      const isEdit=!!f;
      const title=isEdit?'تعديل رسوم تسليم بين مدينتين':'إضافة رسوم تسليم بين مدينتين';
      const sub='حدد المدينتين ورسوم التسليم بينهما وفترة السريان';
      const cityOpts=(sel)=>`<option value="">اختر المدينة</option>`+FEE_CITIES.map(c=>`<option value="${c}" ${sel===c?'selected':''}>${c}</option>`).join('');
      const toInputDate=s=>{
        if(!s) return '';
        const p=String(s).replace(/-/g,'/').split('/');
        if(p.length!==3) return '';
        const [y,m,d]=p[0].length===4?p:[p[2],p[1],p[0]];
        return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      };
      openM(`<div class="modal"><div class="modal-h"><div><h3>${title}</h3><p class="vio-msub">${sub}</p></div><span class="x" onclick="closeM()">✕</span></div>
        <div class="modal-b">
          <div class="frow">
            ${fld('من (مدينة الانطلاق)',`<select id="fee-from" class="native-input">${cityOpts(f?.from||'')}</select>`)}
            ${fld('إلى (مدينة الوجهة)',`<select id="fee-to" class="native-input">${cityOpts(f?.to||'')}</select>`)}
          </div>
          ${fld('الرسوم',`<input id="op-fee" class="native-input" type="number" min="0" placeholder="أدخل مبلغ الرسوم" value="${safe(f?.amount||'')}">`)}
          <div class="frow">
            ${fld('من',`<input id="fee-valid-from" class="native-input" type="date" value="${toInputDate(f?.validFrom||'')}" placeholder="اختر التاريخ">`)}
            ${fld('إلى',`<input id="fee-valid-to" class="native-input" type="date" value="${toInputDate(f?.validTo||'')}" placeholder="اختر التاريخ">`)}
          </div>
        </div>
        <div class="modal-f">
          <button type="button" class="btn coral" onclick="WafraOps.saveFee()">${isEdit?'تعديل':'إضافة'}</button>
          <button type="button" class="btn ghost" onclick="closeM()">إلغاء</button>
        </div></div>`);
    },
    saveFee:()=>{
      const from=val('fee-from'), to=val('fee-to'), amount=val('op-fee');
      if(!from||!to){toast('اختر مدينتي الانطلاق والوجهة.');return;}
      if(from===to){toast('مدينة الانطلاق والوجهة يجب أن تختلف.');return;}
      if(!amount){toast('أدخل مبلغ الرسوم.');return;}
      const fmtDate=v=>{
        if(!v) return '';
        const p=v.includes('-')?v.split('-'):v.split('/');
        if(p.length===3&&p[0].length===4) return `${p[0]}/${Number(p[1])}/${Number(p[2])}`;
        return v.replace(/-/g,'/');
      };
      state.fees=state.fees||[];
      const payload={
        from,to,amount,
        validFrom:fmtDate(val('fee-valid-from'))||'2026/01/01',
        validTo:fmtDate(val('fee-valid-to'))||'2026/12/31',
        status:'نشط'
      };
      const edit=window.__feeEdit;
      if(edit!=null&&state.fees[edit]){
        payload.status=state.fees[edit].status||'نشط';
        state.fees[edit]=payload;
        window.__feeEdit=null;
        save(); closeM(); render(); toast('تم حفظ تعديل الرسوم.');
        return;
      }
      state.fees.unshift(payload);
      save(); closeM(); render(); toast('تم إضافة الرسوم.');
    }
  });

  /* —— المناطق والمدن —— */
  S.branchAreas=()=>{
    const active=window.__areasTab||'regions';
    state.areas=state.areas||{regions:[],cities:[]};
    const regions=buildRegions();
    const cities=buildCities();
    const allCityNames=[...new Set(cities.map(c=>c.name))];
    const totals=sumStats(allCityNames);
    const summary=kpi([
      {i:'🗺',l:'المناطق',v:String(regions.length)},
      {i:'▦',l:'المدن المغطاة',v:String(cities.length)},
      {i:'⌖',l:'إجمالي الفروع',v:fmt(totals.branches)},
      {i:'🚗',l:'إجمالي الأسطول',v:fmt(totals.cars)}
    ]);
    const areaActs=(t,name)=>`<button class="btn ghost sm" onclick="WafraOps.viewArea('${t}','${escAttr(name)}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.editArea('${t}','${escAttr(name)}')">تعديل</button>`;
    return phead('المناطق والمدن','التغطية الجغرافية للمنصة: المزودون والفروع والأسطول والطلب لكل مدينة.',[],
      `<button class="btn ghost" onclick="WafraOps.exportCurrent('المناطق-والمدن','Excel')">Excel ⤓</button><button class="btn coral" onclick="WafraOps.addArea('${active}')">＋ تعريف ${active==='regions'?'منطقة':'مدينة'}</button>`)
      +summary
      +card(`<div class="tabs">
        <button class="tab ${active==='regions'?'on':''}" onclick="WafraOps.areasTab('regions')">المناطق</button>
        <button class="tab ${active==='cities'?'on':''}" onclick="WafraOps.areasTab('cities')">المدن</button>
      </div><div class="card-b">${
        active==='regions'
          ?table(['المنطقة','المدن','المزودون','السيارات','الحجوزات','الحالة','الإجراءات'],regions.map(r=>{
              const citiesList=(r.cities&&r.cities.length)?r.cities:citiesOfRegion(r.name);
              const s=sumStats(citiesList);
              return [
                r.name,
                citiesList.length?`${citiesList.length} — ${citiesList.join(' · ')}`:'—',
                fmt(s.providers),
                fmt(s.cars),
                fmt(s.bookings),
                pill(r.status||'نشط'),
                areaActs('regions',r.name)
              ];
            }))
          :table(['المدينة','المنطقة','المزودون','الفروع','السيارات','الحجوزات','الحالة','الإجراءات'],cities.map(c=>{
              const s=cityStats(c.name);
              return [
                c.name,
                c.region,
                fmt(s.providers),
                fmt(s.branches),
                fmt(s.cars),
                fmt(s.bookings),
                pill(c.status||'نشط'),
                areaActs('cities',c.name)
              ];
            }))
      }</div>`);
  };

  /* —— قائمة الفروع (نفس تصميم p23) + ربط نموذج الإضافة —— */
  S.branches=()=>{
    const f=window.__branchFilter||{};
    const rows=state.branches.filter(b=>(!f.q||`${b.name} ${b.provider}`.includes(f.q))&&(!f.city||b.city===f.city)&&(!f.provider||b.provider===f.provider)&&(!f.status||b.status===f.status));
    const badge=s=>bdg(s,s==='نشط'?'g':'r');
    return phead('إدارة الفروع','بحث وفلترة وتفعيل وصلاحيات لكل فرع',[],
      `<button class="btn coral" onclick="WafraOps.openBranchForm()">＋ إضافة فرع</button>`)
      +card(`<div class="filters">
        <label class="fsearch">⌕ <input id="branch-q" value="${(f.q||'').replace(/"/g,'&quot;')}" placeholder="ابحث باسم الفرع" oninput="WafraOps.branchFilter()"></label>
        ${fld('المدينة',`<select id="branch-city" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المدن</option>${['الرياض','جدة','الخبر'].map(x=>`<option ${f.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('المزود',`<select id="branch-provider" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المزودين</option>${['شركة الصحراء','كي رنت','مسار'].map(x=>`<option ${f.provider===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('الحالة',`<select id="branch-status" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل الحالات</option><option ${f.status==='نشط'?'selected':''}>نشط</option><option ${f.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}
      </div><div class="card-b">${table(
        ['المرجع','الفرع','المزود','المدينة','إجمالي العقود','التشغيل','العمولة','الحالة','الإجراءات'],
        rows.map(b=>[b.id,b.name,b.provider,b.city,b.contracts,`${b.utilization}%`,`${b.commission}%`,badge(b.status),
          `<button class="btn ghost sm" onclick="WafraOps.viewBranch('${b.id}')">استعراض</button>
           <button class="btn ghost sm" onclick="WafraOps.openBranchForm('${b.id}')">تعديل</button>
           <button class="btn ${b.status==='نشط'?'danger':'coral'} sm" onclick="WafraOps.toggleBranch('${b.id}')">${b.status==='نشط'?'إلغاء التنشيط':'تنشيط'}</button>`])
      )}</div>`);
  };

  /* —— نموذج إضافة/تعديل فرع مطابق لشاشة المزود (p15) مع حفظ فعلي —— */
  const dayRow=(name,on=true)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:12px">${name}</b><span class="badge ${on?'g':'n'}">${on?'مفتوح':'مغلق'}</span></div><div class="frow" style="margin-top:8px"><input class="native-input" value="08:00 صباحاً"><input class="native-input" value="08:00 مساءً"></div></div>`;
  const branchNote=text=>`<div style="padding:12px 14px;background:#F5F8FF;border-radius:10px;color:var(--navy);font-size:12px">${text}</div>`;
  S.branchForm=()=>{
    const editId=window.__branchEdit;
    const b=editId?state.branches.find(x=>x.id===editId):null;
    const isEdit=!!b;
    return phead(isEdit?'تعديل فرع':'إضافة فرع جديد',isEdit?'تعديل بيانات الفرع وموقعه وتشغيله':'أدخل المعلومات الأساسية لإنشاء موقع خدمة جديد — بنفس نموذج إضافة الفرع في شاشة المزود',[],
      `<a class="btn ghost" href="#branches">إلغاء</a>`)
      +`<div class="form-page">
        ${card(cardH('معلومات أساسية')+`<div class="card-b">
          <div class="frow">${fld('اسم الفرع',`<input id="bf-name" class="native-input" value="${b?b.name:''}" placeholder="أدخل اسم الفرع">`)}${fld('الرقم المرجعي',`<input id="bf-id" class="native-input" value="${b?b.id:('BR-'+String(100+state.branches.length))}">`)}</div>
          <div class="frow">${fld('المزود',`<select id="bf-provider" class="native-input">${['شركة الصحراء لتأجير السيارات','كي رنت','مسار'].map(x=>{const short=x.includes('الصحراء')?'شركة الصحراء':x;return `<option ${(b?b.provider:'شركة الصحراء')===short||(b&&x.includes(b.provider))?'selected':''}>${x}</option>`;}).join('')}</select>`)}
          ${fld('نوع الفرع',`<select id="bf-type" class="native-input">${['فرع داخلي','مطار','محطة قطار','فرع سحابي','توصيل'].map(x=>`<option ${(b?.type||'فرع داخلي')===x||(b?.type==='داخلي'&&x==='فرع داخلي')?'selected':''}>${x}</option>`).join('')}</select>`)}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px"><label><input type="checkbox" checked> موقع ثابت</label><label><input type="checkbox"> نقطة استلام فقط</label><label><input type="checkbox" checked> تسليم للعميل</label><label><input type="checkbox"> خدمات المطار</label></div>
        </div>`)}
        ${card(cardH('تفاصيل الموقع')+`<div class="card-b">
          <div class="frow">${fld('الدولة',`<select class="native-input"><option>المملكة العربية السعودية</option></select>`)}${fld('المنطقة',`<select class="native-input">${regionOptions().map(r=>`<option>${r}</option>`).join('')}</select>`)}</div>
          <div class="frow">${fld('المدينة',`<select id="bf-city" class="native-input">${['الرياض','جدة','الخبر','الدمام','مكة','المدينة'].map(x=>`<option ${(b?.city||'الرياض')===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('الحي',`<input class="native-input" value="العليا">`)}</div>
          ${fld('العنوان',`<input id="bf-address" class="native-input" value="${b?.address||'123 شارع الملك فهد'}">`)}
          <div class="branch-map">⌖<br><b>حدد موقع الفرع على الخريطة</b><br><span>المملكة العربية السعودية</span></div>
        </div>`)}
        ${card(cardH('ساعات العمل')+`<div class="card-b">${['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map((d,i)=>dayRow(d,i!==6)).join('')}</div>`)}
        ${card(cardH('الحالة والإتاحة')+`<div class="card-b">
          <div class="frow">${fld('حالة الفرع',`<select id="bf-status" class="native-input"><option ${!b||b.status==='نشط'?'selected':''}>نشط</option><option ${b&&b.status!=='نشط'?'selected':''}>غير نشط</option></select>`)}
          ${fld('إتاحة السيارات',`<select class="native-input"><option>مرتبطة بإتاحة السيارات</option><option>إتاحة صفر</option></select>`)}</div>
          ${branchNote('يظهر الفرع في مراقبة الإتاحة إذا كان نشطاً ولا توجد به سيارات متاحة.')}
        </div>`)}
        ${card(cardH('ساعات التوصيل وإعداداته')+`<div class="card-b">
          <div class="frow">${fld('بداية التوصيل',`<input class="native-input" value="09:00 صباحاً">`)}${fld('نهاية التوصيل',`<input class="native-input" value="09:00 مساءً">`)}</div>
          <div class="frow">${fld('نطاق التوصيل',`<select class="native-input"><option>نصف قطر 40 كم</option><option>حسب المدينة</option></select>`)}${fld('الحد الأدنى للحجز',`<select class="native-input"><option>5 ساعات</option><option>يوم واحد</option></select>`)}</div>
          ${branchNote('يمكن ربط أسعار التوصيل لكل نطاق من شاشة رسوم التسليم بين المدن.')}
        </div>`)}
        ${card(cardH('مواعيد الإجازة الرسمية والإغلاق')+`<div class="card-b">
          <div class="frow">${fld('من تاريخ',`<input class="native-input" type="date" value="2026-12-20">`)}${fld('إلى تاريخ',`<input class="native-input" type="date" value="2026-12-25">`)}</div>
          ${fld('سبب الإغلاق',`<textarea class="native-input" rows="2">إجازة نهاية العام</textarea>`)}
        </div>`)}
        ${card(cardH('سياسات الفرع')+`<div class="card-b">
          ${fld('سياسة الاستلام',`<textarea class="native-input" rows="3">يلزم تقديم الهوية ورخصة القيادة الأصلية عند الاستلام.</textarea>`)}
          ${fld('سياسة التسليم',`<textarea class="native-input" rows="3">يتم فحص المركبة وتسجيل حالة الوقود والعداد عند التسليم.</textarea>`)}
        </div>`)}
        <div style="display:flex;gap:10px;justify-content:flex-start;margin:20px 0">
          <button class="btn coral" onclick="WafraOps.saveBranchForm()">${isEdit?'حفظ التعديلات':'إضافة الفرع'}</button>
          <a class="btn ghost" href="#branches">إلغاء</a>
        </div>
      </div>`;
  };

  /* —— رسوم التسليم بين المدن (نموذج المزود) —— */
  S.intercityFees=()=>{
    const f=window.__feeFilter||{};
    const all=state.fees||[];
    const rows=all.map((x,i)=>({...x,_i:i})).filter(x=>{
      const q=(f.q||'').trim();
      if(q&&!`${x.from} ${x.to}`.includes(q)) return false;
      if(f.city&&x.from!==f.city&&x.to!==f.city) return false;
      if(f.status&&x.status!==f.status) return false;
      return true;
    });
    const statusCell=(x,i)=>{
      const on=x.status==='نشط';
      return `<div class="fee-status"><button type="button" class="tg ${on?'on':''}" onclick="WafraOps.toggleFeeStatus(${i})" aria-label="تبديل الحالة"></button><span>${on?'نشط':'غير نشط'}</span></div>`;
    };
    return phead('رسوم التسليم بين المدن','إدارة موقع الخدمة الخاص بك',[],
      `<button class="btn coral" onclick="WafraOps.addFee()">＋ إضافة رسوم</button>`)
      +card(`<div class="filters">
        <label class="fsearch">⌕ <input id="fee-q" value="${safe(f.q||'').replace(/"/g,'&quot;')}" placeholder="ابحث عن مدينة (من/إلى)" oninput="WafraOps.feeFilter()"></label>
        ${fld('المدينة',`<select id="fee-city" class="native-input" onchange="WafraOps.feeFilter()"><option value="">كل المدن</option>${FEE_CITIES.map(c=>`<option value="${c}" ${f.city===c?'selected':''}>${c}</option>`).join('')}</select>`)}
        ${fld('الحالة',`<select id="fee-status-f" class="native-input" onchange="WafraOps.feeFilter()"><option value="">كل الحالات</option><option value="نشط" ${f.status==='نشط'?'selected':''}>نشط</option><option value="غير نشط" ${f.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}
      </div><div class="card-b">${table(
        ['من (مدينة الانطلاق)','إلى (المدينة الوجهة)','الرسوم','صالح من','صالح إلى','الحالة','الإجراءات'],
        rows.map(x=>[
          x.from,x.to,
          {v:`${x.amount} ر.س`,c:'num'},
          x.validFrom||'—',
          x.validTo||'—',
          statusCell(x,x._i),
          `<button type="button" class="btn ghost sm" onclick="WafraOps.editFee(${x._i})" title="تعديل">✎</button>`
        ])
      )}${pager(rows.length,Math.max(1,Math.ceil(rows.length/5)))}</div>`);
  };

  if(window.TITLES){
    window.TITLES.branchAreas='المناطق والمدن';
    window.TITLES.branches='قائمة الفروع';
    window.TITLES.intercityFees='رسوم التسليم بين المدن';
    window.TITLES.branchForm='إضافة فرع';
  }
})();
</script>
<style>
.form-page{max-width:1020px}
.branch-map{margin-top:12px;min-height:150px;display:grid;place-items:center;text-align:center;border-radius:12px;background:linear-gradient(125deg,#E2E8E3,#E9EEF2);color:var(--navy);font-size:13px}
.branch-map span{font-size:11px;color:var(--ink-2)}
.fee-status{display:inline-flex;align-items:center;gap:10px;font:700 13px Cairo;color:var(--ink,#1E2A44);white-space:nowrap}
.fee-status .tg{cursor:pointer;flex:0 0 auto}
@media(max-width:800px){.form-page .frow{grid-template-columns:1fr}}
</style>
