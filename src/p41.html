<style id="wafra-intel">
/* تقارير الذكاء — مطابقة لنماذج التصميم (أصفر / بطاقات علوية / جداول) */
.ix-wrap{display:flex;flex-direction:column;gap:14px}
.ix-kpis{display:grid;gap:12px}
.ix-kpis.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ix-kpis.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ix-kpis.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.vio-grace{display:inline-flex;align-items:center;gap:6px;border:1px solid #E2E8F4;background:#F5F7FC;border-radius:10px;padding:8px 12px;font:700 12.5px Cairo;color:#3A4663;white-space:nowrap}
.vio-auto{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;background:#293B85;color:#fff;padding:10px 14px;font:800 12.5px Cairo;cursor:pointer}
.vio-auto.off{background:#fff;color:#293B85;border:1px solid #D7DEEE}
.vio-auto .vio-dot{width:8px;height:8px;border-radius:99px;background:#7CFFB2;flex:0 0 8px}
.vio-auto.off .vio-dot{background:#C5CCD9}
.vio-board .tw{overflow-x:auto}
.vio-board table{min-width:1240px;width:100%}
.vio-board thead th{position:sticky;top:0;z-index:1;background:#F8FAFD;white-space:nowrap;padding:12px 12px;font:800 12px Cairo}
.vio-board tbody td{padding:14px 12px;vertical-align:middle;border-bottom:1px solid #EEF1F7;font:600 12.8px Cairo;color:#1E2A44}
.vio-board tbody tr:hover{background:#FBFCFE}
.vio-board td.vio-id{font-weight:800;color:#293B85;direction:ltr;text-align:right}
.vio-board td.vio-amt{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vio-board td.vio-acts-cell{min-width:300px;white-space:normal}
.vio-acts{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center}
.vio-btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;border-radius:8px;border:1px solid #D7DEEE;background:#fff;color:#3A4663;font:800 11.5px Cairo;cursor:pointer;white-space:nowrap}
.vio-btn:hover{background:#F5F7FC}
.vio-collect{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 12px;border:0;border-radius:8px;background:#20A16E;color:#fff;font:800 11.5px Cairo;cursor:pointer;white-space:nowrap}
.vio-collect:hover{filter:brightness(.96)}
.vio-deadline{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;background:#FFF1E0;color:#B86A00;font:800 12px Cairo;white-space:nowrap}
.vio-deadline.expired{background:#FDECEC;color:#C62828}
.vio-deadline.muted{background:transparent;color:#9AA3B5;padding:0}
.vio-detail{color:#148A5A;font:700 12px Cairo;white-space:nowrap}
.vio-detail.empty{color:#9AA3B5;font-weight:600}
.vio-chk{width:15px;height:15px;accent-color:#293B85;cursor:pointer}
.modal.vio-modal{width:min(520px,100%)}
.modal.vio-modal.wide{width:min(560px,100%)}
.modal-h .vio-msub{margin:4px 0 0;font:600 12.5px Cairo;color:#7A869E;line-height:1.4}
.vio-info{margin-top:14px;padding:12px 14px;border-radius:10px;background:#F3F6FB;color:#44506A;font:600 12.5px Cairo;line-height:1.7;text-align:center}
.vio-notify-ta{min-height:140px;resize:vertical;line-height:1.85}
.vio-log-list{display:flex;flex-direction:column;gap:0}
.vio-log-item{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #EEF1F7}
.vio-log-item:last-child{border-bottom:0}
.vio-log-item .side-r{text-align:right}
.vio-log-item .side-l{text-align:left;flex:0 0 auto;direction:ltr}
.vio-log-item .kind{font:800 14px Cairo;color:#1E2A44}
.vio-log-item .why{margin-top:4px;font:600 12.5px Cairo;color:#7A869E;line-height:1.5}
.vio-log-item .amt{font:800 14px Cairo;color:#1E2A44;white-space:nowrap}
.vio-log-item .when{margin-top:4px;font:600 12px Cairo;color:#9AA3B5;white-space:nowrap}
.vio-log-empty{padding:22px 8px;text-align:center;color:#9AA3B5;font:600 13px Cairo}
.ix-kpi{background:#fff;border:1px solid #E8ECF3;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(25,42,84,.05);display:flex;flex-direction:column}
.ix-kpi .top{background:#F5C518;padding:10px 14px;display:flex;align-items:center;gap:8px;font:800 13px Cairo;color:#1E2A44}
.ix-kpi .top .ic{width:22px;height:22px;display:grid;place-items:center;font-size:14px}
.ix-kpi .bot{padding:14px 16px 16px}
.ix-kpi .bot .v{font:800 28px Cairo;color:#1E2A44;line-height:1.1}
.ix-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ix-tools .grow{flex:1;min-width:200px}
.ix-tools .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ix-search{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:8px;background:#F5C518;padding:11px 14px;box-shadow:0 2px 8px rgba(245,197,24,.25)}
.ix-search input{border:0;outline:0;font:700 13px Cairo;width:100%;background:transparent;color:#1E2A44}
.ix-search input::placeholder{color:#6B5A14;opacity:.85}
.ix-ybtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;background:#F5C518;color:#1E2A44;padding:9px 14px;font:800 12.5px Cairo;cursor:pointer;box-shadow:0 2px 8px rgba(245,197,24,.2)}
.ix-ybtn:hover{filter:brightness(.97)}
.ix-wbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #D7DEEE;border-radius:8px;background:#fff;color:#3A4663;padding:9px 14px;font:800 12.5px Cairo;cursor:pointer}
.ix-ysel{border:0;border-radius:8px;background:#F5C518;color:#1E2A44;padding:10px 14px;font:800 12.5px Cairo;cursor:pointer;min-width:140px}
.ix-panel{background:#fff;border:1px solid #E8ECF3;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(25,42,84,.05)}
.ix-panel-h{background:#F5C518;padding:12px 16px;font:800 14px Cairo;color:#1E2A44}
.ix-panel-b{padding:0}
.ix-panel-b .tw{margin:0;border:0}
.ix-panel-b table{width:100%}
.ix-panel-b thead th{background:#F8FAFD;color:#44506A;font:800 12px Cairo;border-bottom:1px solid #EEF1F7}
.ix-panel .pad{padding:14px 16px}
.ix-events{display:flex;flex-wrap:wrap;gap:10px;background:#F5C518;padding:10px 14px;font:700 12px Cairo;color:#1E2A44}
.ix-events span{opacity:.95}
.ix-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#7A869E;font:700 12px Cairo;padding:12px 16px;border-top:1px solid #EEF1F7}
.ix-pages{display:flex;gap:6px}
.ix-pages button{min-width:34px;height:34px;border-radius:99px;border:1px solid #D7DEEE;background:#fff;font:800 12px Cairo;cursor:pointer;color:#293B85}
.ix-pages button.on{background:#293B85;color:#fff;border-color:#293B85}
.ix-dot{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:99px;font:800 12px Cairo;padding:0 8px}
.ix-dot.g{background:#E8F8F0;color:#148A5A}
.ix-dot.r{background:#FDECEC;color:#C62828}
.ix-dot.a{background:#FFF1E0;color:#B86A00}
.ix-pct-r{color:#C62828;font-weight:800}
.ix-pct-g{color:#148A5A;font-weight:800}
.ix-chart-box{min-height:220px;padding:16px;position:relative}
.ix-chart-box .axis{position:absolute;top:16px;inset-inline-start:16px;font:700 12px Cairo;color:#7A869E}
.ix-chart-box .leg{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:700 12px Cairo;color:#44506A;display:flex;align-items:center;gap:6px}
.ix-chart-box .leg i{width:10px;height:10px;border:2px solid #293B85;border-radius:99px;display:inline-block}
.ix-barfoot{background:#F5C518;border-radius:10px;padding:12px 16px;font:800 14px Cairo;color:#1E2A44;text-align:center}
.ix-gbtn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:#20A16E;color:#fff;padding:8px 12px;font:800 12px Cairo;cursor:pointer;white-space:nowrap}
.ix-gbtn:hover{filter:brightness(.96)}
@media(max-width:980px){
  .ix-kpis.c3,.ix-kpis.c4,.ix-kpis.c5{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .ix-kpis.c3,.ix-kpis.c4,.ix-kpis.c5{grid-template-columns:1fr}
}
</style>
<script>
/* تقارير الذكاء — نفس النصوص والألوان من نماذج التصميم. */
(function(){
  const money=v=>({v:String(v)+' ر.س',c:'num'});
  const toast=msg=>{
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const kpi=(ic,l,v)=>`<div class="ix-kpi"><div class="top"><span class="ic">${ic}</span><span>${l}</span></div><div class="bot"><div class="v">${v}</div></div></div>`;
  const yExport=()=>`<button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent(document.querySelector('.phead h1')?.textContent||'تقرير','Excel')">⤓ Excel</button><button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent('تقرير','PDF')">📄 PDF</button>`;
  const saveBtn=(t='حفظ العرض')=>`<button type="button" class="ix-wbtn" onclick="WafraOps.demoAction('${t}')">💾 ${t}</button>`;
  const search=(ph)=>`<label class="ix-search">⌕ <input value="${(window.__ixQ||'').replace(/"/g,'&quot;')}" placeholder="${ph}" oninput="WafraOps.ixFilter(this.value)"></label>`;
  const tools=(ph,extra='')=>`<div class="ix-tools"><div class="grow">${search(ph)}</div><div class="acts">${extra}${yExport()}${saveBtn()}</div></div>`;
  const toolsNoSearch=(extra='')=>`<div class="ix-tools"><div class="acts">${yExport()}${extra||saveBtn()}</div></div>`;
  const foot=(n,pages=1)=>`<div class="ix-foot"><span>صفحة 1 من ${pages}</span><span>${n} سجل</span><div class="ix-pages">${Array.from({length:Math.min(pages,5)},(_,i)=>`<button type="button" class="${i===0?'on':''}">${i+1}</button>`).join('')}</div></div>`;
  const sel=(id,opts,all)=>{
    const cur=(window.__ixSel&&window.__ixSel[id])||'';
    return `<select class="ix-ysel" id="${id}" onchange="WafraOps.ixSelect('${id}',this.value)"><option value="" ${!cur?'selected':''}>${all}</option>${opts.map(o=>`<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('')}</select>`;
  };

  const LC_FLOW=[
    {stage:'بانتظار التسليم',tone:'r',next:'تم التسليم',btn:'تأكيد تم التسليم'},
    {stage:'تم التسليم',tone:'g',next:'قيد الاستخدام',btn:'تأكيد قيد الاستخدام'},
    {stage:'قيد الاستخدام',tone:'g',next:'بانتظار الفحص',btn:'تأكيد بانتظار الفحص'},
    {stage:'بانتظار الفحص',tone:'a',next:'مكتمل',btn:'تأكيد مكتمل'},
    {stage:'مكتمل',tone:'g',next:null,btn:null}
  ];
  const lcMeta=s=>LC_FLOW.find(x=>x.stage===s)||LC_FLOW[0];
  const ensureLc=()=>{
    if(!window.__ixLifecycle) window.__ixLifecycle=[
      {id:'BK-20010',customer:'أحمد العتيبي',car:'نيسان التيما 2021',stage:'بانتظار التسليم',photos:'2',docs:'✓',damage:'—'},
      {id:'BK-20014',customer:'عبدالله الزهراني',car:'هيونداي أكسنت 2020',stage:'تم التسليم',photos:'4',docs:'✓',damage:'—'},
      {id:'BK-20018',customer:'سارة القحطاني',car:'تويوتا لاندكروزر 2025',stage:'قيد الاستخدام',photos:'6',docs:'✓',damage:'—'},
      {id:'BK-20022',customer:'فهد الشمري',car:'كامري 2026',stage:'بانتظار الفحص',photos:'8',docs:'✓',damage:'—'},
      {id:'BK-20026',customer:'نورة الدوسري',car:'K5 2026',stage:'بانتظار التسليم',photos:'0',docs:'○',damage:'—'},
      {id:'BK-20030',customer:'خالد الحربي',car:'كورولا 2025',stage:'قيد الاستخدام',photos:'5',docs:'✓',damage:'—'}
    ];
    return window.__ixLifecycle;
  };
  const SEG_OPTS=['موثوق','عادي','مراقب','عالي المخاطر'];
  const segTone=s=>({موثوق:'g',عادي:'n',مراقب:'a','عالي المخاطر':'r'}[s]||'n');
  const segDeposit=s=>({موثوق:['0%','أساسي'],عادي:['0%','أساسي'],مراقب:['25%','شامل'],'عالي المخاطر':['50%','شامل']}[s]||['0%','أساسي']);
  const ensureLy=()=>{
    if(!window.__ixLoyalty) window.__ixLoyalty=[
      {name:'بدر الشمري',city:'تبوك',bookings:'42',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'يوسف الحربي',city:'الخبر',bookings:'28',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'أحمد العتيبي',city:'نجران',bookings:'68',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'نورة القحطاني',city:'مكة المكرمة',bookings:'35',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'},
      {name:'سارة الدوسري',city:'أبها',bookings:'19',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'خالد المطيري',city:'الرياض',bookings:'54',score:'100',segment:'عالي المخاطر',deposit:'50%',insurance:'شامل'},
      {name:'ريم الشمري',city:'جدة',bookings:'14',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'وليد العنزي',city:'الدمام',bookings:'22',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'}
    ];
    return window.__ixLoyalty;
  };

  Object.assign(WafraOps,{
    ixFilter:v=>{window.__ixQ=(v||'').trim();render();},
    ixSelect:(id,v)=>{window.__ixSel=window.__ixSel||{};window.__ixSel[id]=v;render();},
    ixAction:t=>toast(t),
    advanceLifecycle:id=>{
      const row=ensureLc().find(x=>x.id===id); if(!row) return;
      const meta=lcMeta(row.stage);
      if(!meta.next){toast('الحجز مكتمل مسبقاً');return;}
      row.stage=meta.next;
      if(row.stage!=='بانتظار التسليم') row.docs='✓';
      if(row.photos==='0') row.photos='2';
      toast('تم تحديث '+id+' إلى: '+row.stage);
      render();
    },
    openLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const opts=SEG_OPTS.map(o=>`<option value="${o}" ${o===row.segment?'selected':''}>${o}</option>`).join('');
      openM(modal('تعديل شريحة العميل',
        `<div style="margin-bottom:10px;font:800 14px Cairo;color:var(--ink)">${row.name}</div>
         ${note('info','تنبيه','الشريحة المحسوبة حالياً: '+row.segment+'. التعديل اليدوي يتجاوز الحساب الآلي.')}
         ${fld('الشريحة الجديدة',`<select id="ly-seg-new" class="native-input">${opts}</select>`)}`,
        `<button type="button" class="btn coral" onclick='WafraOps.saveLoyaltySegment(${JSON.stringify(row.name)})'>حفظ</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button>`,
        true));
    },
    saveLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const next=document.getElementById('ly-seg-new')?.value||row.segment;
      row.segment=next;
      const d=segDeposit(next); row.deposit=d[0]; row.insurance=d[1];
      closeM(); toast('تم تحديث شريحة '+name+' إلى '+next); render();
    },
    openReport:k=>{
      const map={supply:'supplyDemand',readiness:'fleetReadiness',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
      location.hash='#'+(map[k]||'supplyDemand');
    },
    vioEnsure:()=>{
      if(!window.__vioRowsV2) window.__vioRowsV2=[
        {id:'VIO-1',customer:'أحمد القحطاني',plate:'ر ط ق 7320',type:'عدم ربط الحزام',amount:'150 ر.س',daysLeft:6,deposit:'1.5 ألف ر.س',depositOk:true,status:'ضمن المهلة',detail:''},
        {id:'VIO-2',customer:'ناصر الدوسري',plate:'د ع م 5521',type:'وقوف خاطئ',amount:'300 ر.س',daysLeft:4,deposit:'2.1 ألف ر.س',depositOk:true,status:'ضمن المهلة',detail:''},
        {id:'VIO-3',customer:'سارة الحربي',plate:'ج د ة 7788',type:'تجاوز سرعة',amount:'500 ر.س',daysLeft:0,deposit:'900 ر.س',depositOk:false,status:'انتهت المهلة',detail:''},
        {id:'VIO-4',customer:'فهد الرشيدي',plate:'ر ي ض 4410',type:'قطع إشارة',amount:'900 ر.س',daysLeft:7,deposit:'1.8 ألف ر.س',depositOk:true,status:'ضمن المهلة',detail:''},
        {id:'VIO-5',customer:'نورة العتيبي',plate:'خ ب ر 3344',type:'وقوف خاطئ',amount:'150 ر.س',daysLeft:null,deposit:'1.0 ألف ر.س',depositOk:true,status:'محصلة',detail:'خصمت من الوديعة — 10 أكتوبر 2026'},
        {id:'VIO-6',customer:'خالد المطيري',plate:'م د ن 9901',type:'تجاوز سرعة',amount:'500 ر.س',daysLeft:2,deposit:'650 ر.س',depositOk:false,status:'ضمن المهلة',detail:''},
        {id:'VIO-7',customer:'ريم الشمري',plate:'ر ط ق 6273',type:'عدم ربط الحزام',amount:'150 ر.س',daysLeft:null,deposit:'2.4 ألف ر.س',depositOk:true,status:'محصلة',detail:'خصمت من الوديعة — 8 أكتوبر 2026'},
        {id:'VIO-8',customer:'وليد العنزي',plate:'أ ب ج 1204',type:'قطع إشارة',amount:'900 ر.س',daysLeft:0,deposit:'400 ر.س',depositOk:false,status:'انتهت المهلة',detail:''},
        {id:'VIO-9',customer:'مشعل العتيبي',plate:'س ع و 4412',type:'تجاوز سرعة',amount:'500 ر.س',daysLeft:5,deposit:'3.2 ألف ر.س',depositOk:true,status:'ضمن المهلة',detail:''},
        {id:'VIO-10',customer:'هند القحطاني',plate:'ق ح ط 8811',type:'وقوف خاطئ',amount:'150 ر.س',daysLeft:null,deposit:'1.2 ألف ر.س',depositOk:true,status:'محصلة',detail:'خصمت من الوديعة — 5 أكتوبر 2026'}
      ];
      if(window.__vioAuto==null) window.__vioAuto=true;
      if(window.__vioGrace==null) window.__vioGrace=7;
      return window.__vioRowsV2;
    },
    toggleVioAuto:()=>{window.__vioAuto=!window.__vioAuto;render();toast(window.__vioAuto?'تم تشغيل الخصم التلقائي بعد المهلة':'تم إيقاف الخصم التلقائي');},
    openVioObjection:id=>{
      const row=WafraOps.vioEnsure().find(x=>x.id===id); if(!row) return;
      const reasons=['العميل لم يكن قائد المركبة','خطأ في نسبة/قيمة المخالفة','المخالفة مكررة','المركبة كانت مُسلّمة للمزود','سبب آخر'];
      openM(`<div class="modal vio-modal"><div class="modal-h"><div><h3>اعتراض على مخالفة – ${row.id}</h3><p class="vio-msub">${row.customer} · ${row.type} · ${row.amount}</p></div><span class="x" onclick="closeM()">✕</span></div>
        <div class="modal-b">
          ${fld('سبب الاعتراض',`<select id="vio-obj-reason" class="native-input">${reasons.map((r,i)=>`<option ${i===0?'selected':''}>${r}</option>`).join('')}</select>`)}
          ${fld('تفاصيل إضافية',`<textarea id="vio-obj-details" class="native-input" rows="4" placeholder="اكتب تفاصيل الاعتراض..."></textarea>`)}
          <div class="vio-info">يُسجَّل الاعتراض مع سببه في سجل التدقيق، ويُعلَّق التحصيل حتى البتّ فيه.</div>
        </div>
        <div class="modal-f"><button type="button" class="btn" onclick="WafraOps.submitVioObjection('${row.id}')">تسجيل الاعتراض</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button></div></div>`);
    },
    submitVioObjection:id=>{
      const row=WafraOps.vioEnsure().find(x=>x.id===id); if(!row) return;
      const reason=document.getElementById('vio-obj-reason')?.value||'';
      const details=(document.getElementById('vio-obj-details')?.value||'').trim();
      row.status='معترض عليها';
      row.detail='اعتراض: '+reason+(details?' — '+details:'');
      row.daysLeft=null;
      closeM(); toast('تم تسجيل الاعتراض على '+id+' وتعليق التحصيل'); render();
    },
    openVioExtend:id=>{
      const row=WafraOps.vioEnsure().find(x=>x.id===id); if(!row) return;

    else if(st==='محصلة') list=list.filter(r=>r.status==='محصلة');
    else if(st==='انتهت المهلة') list=list.filter(r=>r.status==='انتهت المهلة');
    else if(st==='ضمن المهلة') list=list.filter(r=>r.status==='ضمن المهلة');
    else if(st==='معترض عليها') list=list.filter(r=>r.status==='معترض عليها');
    const open=rows.filter(r=>r.status!=='محصلة'&&r.status!=='معترض عليها');
    const expired=rows.filter(r=>r.status==='انتهت المهلة').length;
    const within=rows.filter(r=>r.status==='ضمن المهلة').length;
    const collected=rows.filter(r=>r.status==='محصلة').length;
    const autoOn=!!window.__vioAuto;
    const grace=window.__vioGrace||7;
    const deadlineCell=r=>{
      if(r.status==='محصلة'||r.status==='معترض عليها'||r.daysLeft==null) return `<span class="vio-deadline muted">—</span>`;
      if(r.status==='انتهت المهلة'||r.daysLeft===0) return `<span class="vio-deadline expired">انتهت المهلة</span>`;
      return `<span class="vio-deadline">متبقي ${r.daysLeft} يوم</span>`;
    };
    const statusCell=r=>{
      if(r.status==='محصلة') return bdg('محصلة','g');
      if(r.status==='معترض عليها') return bdg('معترض عليها','a');
      return bdg('متأخر','a');
    };
    const detailCell=r=>{
      if(!r.detail) return `<span class="vio-detail empty">—</span>`;
      return `<span class="vio-detail">${r.detail}</span>`;
    };
    const actsCell=r=>{
      if(r.status==='محصلة'){
        return `<div class="vio-acts">
          <button type="button" class="vio-btn" onclick="WafraOps.openVioDepositLog('${r.id}')">سجل الوديعة</button>
          <button type="button" class="vio-btn" onclick="WafraOps.openVioNotify('${r.id}')">إشعار العميل</button>
        </div>`;
      }
      if(r.status==='معترض عليها'){
        return `<div class="vio-acts">
          <button type="button" class="vio-btn" onclick="WafraOps.openVioDepositLog('${r.id}')">سجل الوديعة</button>
          <button type="button" class="vio-btn" onclick="WafraOps.openVioObjection('${r.id}')">عرض الاعتراض</button>
        </div>`;
      }
      return `<div class="vio-acts">
        <button type="button" class="vio-collect" onclick="WafraOps.collectVio('${r.id}')">تحصيل من الوديعة</button>
        <button type="button" class="vio-btn" onclick="WafraOps.openVioNotify('${r.id}')">إشعار العميل</button>
        <button type="button" class="vio-btn" onclick="WafraOps.openVioDepositLog('${r.id}')">سجل الوديعة</button>
        <button type="button" class="vio-btn" onclick="WafraOps.openVioExtend('${r.id}')">تمديد المهلة</button>
        <button type="button" class="vio-btn" onclick="WafraOps.openVioObjection('${r.id}')">اعتراض</button>
      </div>`;
    };
    const headActs=`<span class="vio-grace">مهلة السداد: ${grace} يوم</span>
      <button type="button" class="vio-auto ${autoOn?'':'off'}" onclick="WafraOps.toggleVioAuto()"><span class="vio-dot"></span>${autoOn?'تشغيل':'إيقاف'} الخصم التلقائي (بعد المهلة)</button>`;
    const bodyRows=list.map(r=>`<tr>
      <td><input type="checkbox" class="vio-chk" aria-label="${r.id}"></td>
      <td class="vio-id">${r.id}</td>
      <td>${r.customer}</td>
      <td style="white-space:nowrap">${r.plate}</td>
      <td>${r.type}</td>
      <td class="vio-amt">${r.amount}</td>
      <td>${deadlineCell(r)}</td>
      <td><span class="${r.depositOk?'ix-pct-g':'ix-pct-r'}">${r.deposit}</span></td>
      <td>${statusCell(r)}</td>
      <td>${detailCell(r)}</td>
      <td class="vio-acts-cell">${actsCell(r)}</td>
    </tr>`).join('');
    return phead('المخالفات المرورية والودائع','مخالفات ساهر المرتبطة بالعقود وتحصيلها من ودائع العملاء',[],headActs)
      +`<div class="ix-wrap">
        <div class="ix-kpis c5">
          ${kpi('⚠','غير محصلة',String(open.length))}
          ${kpi('⏱','انتهت مهلتها — قابلة للخصم',String(expired))}
          ${kpi('◷','ضمن المهلة',String(within))}
          ${kpi('💵','قيمة غير محصلة','1.3 ألف ر.س')}
          ${kpi('✓','محصلة',String(collected))}
        </div>
        ${tools('بحث بالعميل أو اللوحة...',sel('vioSt',['غير محصلة','انتهت المهلة','ضمن المهلة','محصلة','معترض عليها'],'كل الحالات'))}
        <div class="ix-panel vio-board"><div class="ix-panel-b">
          <div class="tw"><table>
            <thead><tr>
              <th>☐</th><th>المخالفة</th><th>العميل</th><th>اللوحة</th><th>النوع</th><th>المبلغ</th><th>المهلة</th><th>الوديعة</th><th>الحالة</th><th>تفاصيل</th><th>إجراءات</th>
            </tr></thead>
            <tbody>${bodyRows}</tbody>
          </table></div>
          ${foot(list.length,2)}
        </div></div>
      </div>`;
  };

  const items=[
    {k:'supplyDemand',t:'خريطة العرض والطلب',i:'▣'},
    {k:'fleetReadiness',t:'جاهزية الأسطول',i:'◎'},
    {k:'fleetUtil',t:'استغلال الأسطول',i:'◔'},
    {k:'demandForecast',t:'التنبؤ بالطلب',i:'↗'},
    {k:'bookingLifecycle',t:'دورة حياة الحجز',i:'⟳'},
    {k:'customerLoyalty',t:'ولاء وتصنيف العملاء',i:'★'},
    {k:'commissionTiers',t:'شرائح العمولة',i:'%'},
    {k:'violationsDeposits',t:'المخالفات والودائع',i:'⚑'}
  ];
  let reports=NAV.find(g=>g.g==='التقارير');
  if(!reports){reports={g:'التقارير',items:[]};NAV.push(reports);}
  items.forEach(it=>{if(!reports.items.some(x=>x.k===it.k))reports.items.push(it);});
  if(window.TITLES) items.forEach(it=>window.TITLES[it.k]=it.t);

  S.reportDetail=()=>{
    const map={supply:'supplyDemand',readiness:'fleetReadiness',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
    const k=map[window.__reportKey||'supply']||'supplyDemand';
    return (S[k]||S.supplyDemand)();
  };
})();
</script>
