<style id="wafra-intel">
/* تقارير الذكاء — مطابقة لنماذج التصميم (أصفر / بطاقات علوية / جداول) */
.ix-wrap{display:flex;flex-direction:column;gap:14px}
.ix-kpis{display:grid;gap:12px}
.ix-kpis.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ix-kpis.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ix-kpi{background:#fff;border:1px solid #E8ECF3;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(25,42,84,.05);display:flex;flex-direction:column}
.ix-kpi .top{background:#F5C518;padding:10px 14px;display:flex;align-items:center;gap:8px;font:800 13px Cairo;color:#1E2A44}
.ix-kpi .top .ic{width:22px;height:22px;display:grid;place-items:center;font-size:14px}
.ix-kpi .bot{padding:14px 16px 16px}
.ix-kpi .bot .v{font:800 28px Cairo;color:#1E2A44;line-height:1.1}
.ix-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ix-tools .grow{flex:1;min-width:200px}
.ix-tools .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ix-search{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:8px;background:#F5C518;padding:11px 14px;box-shadow:0 2px 8px rgba(245,197,24,.25)}
.ix-search input{border:0;outline:0;font:700 13px Cairo;width:100%;background:transparent;color:#1E2A44}
.ix-search input::placeholder{color:#6B5A14;opacity:.85}
.ix-ybtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;background:#F5C518;color:#1E2A44;padding:9px 14px;font:800 12.5px Cairo;cursor:pointer;box-shadow:0 2px 8px rgba(245,197,24,.2)}
.ix-ybtn:hover{filter:brightness(.97)}
.ix-wbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #D7DEEE;border-radius:8px;background:#fff;color:#3A4663;padding:9px 14px;font:800 12.5px Cairo;cursor:pointer}
.ix-ysel{border:0;border-radius:8px;background:#F5C518;color:#1E2A44;padding:10px 14px;font:800 12.5px Cairo;cursor:pointer;min-width:140px}
.ix-panel{background:#fff;border:1px solid #E8ECF3;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(25,42,84,.05)}
.ix-panel-h{background:#F5C518;padding:12px 16px;font:800 14px Cairo;color:#1E2A44}
.ix-panel-b{padding:0}
.ix-panel-b .tw{margin:0;border:0}
.ix-panel-b table{width:100%}
.ix-panel-b thead th{background:#F8FAFD;color:#44506A;font:800 12px Cairo;border-bottom:1px solid #EEF1F7}
.ix-panel .pad{padding:14px 16px}
.ix-events{display:flex;flex-wrap:wrap;gap:10px;background:#F5C518;padding:10px 14px;font:700 12px Cairo;color:#1E2A44}
.ix-events span{opacity:.95}
.ix-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#7A869E;font:700 12px Cairo;padding:12px 16px;border-top:1px solid #EEF1F7}
.ix-pages{display:flex;gap:6px}
.ix-pages button{min-width:34px;height:34px;border-radius:99px;border:1px solid #D7DEEE;background:#fff;font:800 12px Cairo;cursor:pointer;color:#293B85}
.ix-pages button.on{background:#293B85;color:#fff;border-color:#293B85}
.ix-dot{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:99px;font:800 12px Cairo;padding:0 8px}
.ix-dot.g{background:#E8F8F0;color:#148A5A}
.ix-dot.r{background:#FDECEC;color:#C62828}
.ix-dot.a{background:#FFF1E0;color:#B86A00}
.ix-pct-r{color:#C62828;font-weight:800}
.ix-pct-g{color:#148A5A;font-weight:800}
.ix-chart-box{min-height:220px;padding:16px;position:relative}
.ix-chart-box .axis{position:absolute;top:16px;inset-inline-start:16px;font:700 12px Cairo;color:#7A869E}
.ix-chart-box .leg{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:700 12px Cairo;color:#44506A;display:flex;align-items:center;gap:6px}
.ix-chart-box .leg i{width:10px;height:10px;border:2px solid #293B85;border-radius:99px;display:inline-block}
.ix-barfoot{background:#F5C518;border-radius:10px;padding:12px 16px;font:800 14px Cairo;color:#1E2A44;text-align:center}
.ix-gbtn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:#20A16E;color:#fff;padding:8px 12px;font:800 12px Cairo;cursor:pointer;white-space:nowrap}
.ix-gbtn:hover{filter:brightness(.96)}
@media(max-width:980px){
  .ix-kpis.c3,.ix-kpis.c4{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .ix-kpis.c3,.ix-kpis.c4{grid-template-columns:1fr}
}
</style>
<script>
/* تقارير الذكاء — نفس النصوص والألوان من نماذج التصميم. */
(function(){
  const money=v=>({v:String(v)+' ر.س',c:'num'});
  const toast=msg=>{
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const kpi=(ic,l,v)=>`<div class="ix-kpi"><div class="top"><span class="ic">${ic}</span><span>${l}</span></div><div class="bot"><div class="v">${v}</div></div></div>`;
  const yExport=()=>`<button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent(document.querySelector('.phead h1')?.textContent||'تقرير','Excel')">⤓ Excel</button><button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent('تقرير','PDF')">📄 PDF</button>`;
  const saveBtn=(t='حفظ العرض')=>`<button type="button" class="ix-wbtn" onclick="WafraOps.demoAction('${t}')">💾 ${t}</button>`;
  const search=(ph)=>`<label class="ix-search">⌕ <input value="${(window.__ixQ||'').replace(/"/g,'&quot;')}" placeholder="${ph}" oninput="WafraOps.ixFilter(this.value)"></label>`;
  const tools=(ph,extra='')=>`<div class="ix-tools"><div class="grow">${search(ph)}</div><div class="acts">${extra}${yExport()}${saveBtn()}</div></div>`;
  const toolsNoSearch=(extra='')=>`<div class="ix-tools"><div class="acts">${yExport()}${extra||saveBtn()}</div></div>`;
  const foot=(n,pages=1)=>`<div class="ix-foot"><span>صفحة 1 من ${pages}</span><span>${n} سجل</span><div class="ix-pages">${Array.from({length:Math.min(pages,5)},(_,i)=>`<button type="button" class="${i===0?'on':''}">${i+1}</button>`).join('')}</div></div>`;
  const sel=(id,opts,all)=>{
    const cur=(window.__ixSel&&window.__ixSel[id])||'';
    return `<select class="ix-ysel" id="${id}" onchange="WafraOps.ixSelect('${id}',this.value)"><option value="" ${!cur?'selected':''}>${all}</option>${opts.map(o=>`<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('')}</select>`;
  };

  const LC_FLOW=[
    {stage:'بانتظار التسليم',tone:'r',next:'تم التسليم',btn:'تأكيد تم التسليم'},
    {stage:'تم التسليم',tone:'g',next:'قيد الاستخدام',btn:'تأكيد قيد الاستخدام'},
    {stage:'قيد الاستخدام',tone:'g',next:'بانتظار الفحص',btn:'تأكيد بانتظار الفحص'},
    {stage:'بانتظار الفحص',tone:'a',next:'مكتمل',btn:'تأكيد مكتمل'},
    {stage:'مكتمل',tone:'g',next:null,btn:null}
  ];
  const lcMeta=s=>LC_FLOW.find(x=>x.stage===s)||LC_FLOW[0];
  const ensureLc=()=>{
    if(!window.__ixLifecycle) window.__ixLifecycle=[
      {id:'BK-20010',customer:'أحمد العتيبي',car:'نيسان التيما 2021',stage:'بانتظار التسليم',photos:'2',docs:'✓',damage:'—'},
      {id:'BK-20014',customer:'عبدالله الزهراني',car:'هيونداي أكسنت 2020',stage:'تم التسليم',photos:'4',docs:'✓',damage:'—'},
      {id:'BK-20018',customer:'سارة القحطاني',car:'تويوتا لاندكروزر 2025',stage:'قيد الاستخدام',photos:'6',docs:'✓',damage:'—'},
      {id:'BK-20022',customer:'فهد الشمري',car:'كامري 2026',stage:'بانتظار الفحص',photos:'8',docs:'✓',damage:'—'},
      {id:'BK-20026',customer:'نورة الدوسري',car:'K5 2026',stage:'بانتظار التسليم',photos:'0',docs:'○',damage:'—'},
      {id:'BK-20030',customer:'خالد الحربي',car:'كورولا 2025',stage:'قيد الاستخدام',photos:'5',docs:'✓',damage:'—'}
    ];
    return window.__ixLifecycle;
  };
  const SEG_OPTS=['موثوق','عادي','مراقب','عالي المخاطر'];
  const segTone=s=>({موثوق:'g',عادي:'n',مراقب:'a','عالي المخاطر':'r'}[s]||'n');
  const segDeposit=s=>({موثوق:['0%','أساسي'],عادي:['0%','أساسي'],مراقب:['25%','شامل'],'عالي المخاطر':['50%','شامل']}[s]||['0%','أساسي']);
  const ensureLy=()=>{
    if(!window.__ixLoyalty) window.__ixLoyalty=[
      {name:'بدر الشمري',city:'تبوك',bookings:'42',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'يوسف الحربي',city:'الخبر',bookings:'28',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'أحمد العتيبي',city:'نجران',bookings:'68',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'نورة القحطاني',city:'مكة المكرمة',bookings:'35',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'},
      {name:'سارة الدوسري',city:'أبها',bookings:'19',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'خالد المطيري',city:'الرياض',bookings:'54',score:'100',segment:'عالي المخاطر',deposit:'50%',insurance:'شامل'},
      {name:'ريم الشمري',city:'جدة',bookings:'14',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'وليد العنزي',city:'الدمام',bookings:'22',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'}
    ];
    return window.__ixLoyalty;
  };

  Object.assign(WafraOps,{
    ixFilter:v=>{window.__ixQ=(v||'').trim();render();},
    ixSelect:(id,v)=>{window.__ixSel=window.__ixSel||{};window.__ixSel[id]=v;render();},
    ixAction:t=>toast(t),
    advanceLifecycle:id=>{
      const row=ensureLc().find(x=>x.id===id); if(!row) return;
      const meta=lcMeta(row.stage);
      if(!meta.next){toast('الحجز مكتمل مسبقاً');return;}
      row.stage=meta.next;
      if(row.stage!=='بانتظار التسليم') row.docs='✓';
      if(row.photos==='0') row.photos='2';
      toast('تم تحديث '+id+' إلى: '+row.stage);
      render();
    },
    openLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const opts=SEG_OPTS.map(o=>`<option value="${o}" ${o===row.segment?'selected':''}>${o}</option>`).join('');
      openM(modal('تعديل شريحة العميل',
        `<div style="margin-bottom:10px;font:800 14px Cairo;color:var(--ink)">${row.name}</div>
         ${note('info','تنبيه','الشريحة المحسوبة حالياً: '+row.segment+'. التعديل اليدوي يتجاوز الحساب الآلي.')}
         ${fld('الشريحة الجديدة',`<select id="ly-seg-new" class="native-input">${opts}</select>`)}`,
        `<button type="button" class="btn coral" onclick='WafraOps.saveLoyaltySegment(${JSON.stringify(row.name)})'>حفظ</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button>`,
        true));
    },
    saveLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const next=document.getElementById('ly-seg-new')?.value||row.segment;
      row.segment=next;
      const d=segDeposit(next); row.deposit=d[0]; row.insurance=d[1];
      closeM(); toast('تم تحديث شريحة '+name+' إلى '+next); render();
    },
    openReport:k=>{
      const map={supply:'supplyDemand',readiness:'fleetReadiness',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
      location.hash='#'+(map[k]||'supplyDemand');
    }
  });

  const q=()=>(window.__ixQ||'').toLowerCase();
  const sf=(rows,cols)=>!q()?rows:rows.filter(r=>cols.some(i=>String(r[i]&&r[i].v!==undefined?r[i].v:r[i]).toLowerCase().includes(q())));

  /* 1 — خريطة العرض والطلب */
  S.supplyDemand=()=>{
    const rows=[
      ['تبوك','629','19','33.11','86%',bdg('عجز حاد','r')],
      ['بريدة','712','28','25.43','84%',bdg('عجز حاد','r')],
      ['الطائف','840','42','20.00','88%',bdg('عجز حاد','r')],
      ['جدة','3,658','210','17.42','83%',bdg('عجز حاد','r')],
      ['المدينة المنورة','1,240','78','15.90','82%',bdg('عجز حاد','r')],
      ['نجران','468','30','15.60','79%',bdg('عجز حاد','r')],
      ['الرياض','3,332','207','16.05','81%',bdg('عجز حاد','r')],
      ['أبها','520','36','14.44','77%',bdg('عجز حاد','r')],
      ['مكة المكرمة','1,860','128','14.53','80%',bdg('عجز حاد','r')],
      ['الدمام','884','62','14.26','80%',bdg('عجز حاد','r')],
      ['الخبر','734','54','13.59','78%',bdg('عجز حاد','r')],
      ['حائل','502','38','13.21','73%',bdg('عجز حاد','r')]
    ];
    const data=sf(rows,[0]);
    return phead('خريطة العرض والطلب','مطابقة الطلب بالمعروض جغرافياً لتوجيه الأسطول ورفع الإشغال',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c3">${kpi('⚠','مدن بها عجز','12')}${kpi('📍','أعلى عجز','تبوك')}${kpi('☺','المدن المغطاة','12')}</div>
        ${toolsNoSearch()}
        <div class="ix-panel"><div class="ix-panel-b">${table(['المدينة','الطلب (عقود)','المعروض (متاح)','نسبة الطلب/العرض','الإشغال','الجودة','إجراءات'],data.map(r=>[...r,'']))}<div class="ix-foot" style="justify-content:center"><span>12 سجل</span></div></div></div>
        <div class="ix-barfoot">الطلب مقابل المعروض (أعلى 10 مدن)</div>
      </div>`;
  };

  /* 2 — جاهزية الأسطول */
  S.fleetReadiness=()=>{
    const rows=[
      ['شركة البركة لتأجير السيارات','16',`<span class="ix-dot g">0</span>`,'5',`<span class="ix-dot r">2</span`,`<span class="ix-pct-r">0%</span>`],
      ['شركة السرعة لتأجير السيارات','62',`<span class="ix-dot g">4</span>`,'9',`<span class="ix-dot r">10</span`,`<span class="ix-pct-r">6%</span>`],
      ['شركة الينبوع لتأجير السيارات','129',`<span class="ix-dot g">8</span>`,'11',`<span class="ix-dot r">20</span`,`<span class="ix-pct-r">6%</span>`],
      ['شركة المستقبل لتأجير السيارات','86',`<span class="ix-dot g">8</span>`,'11',`<span class="ix-dot r">6</span`,`<span class="ix-pct-r">9%</span>`],
      ['شركة الوفرة لتأجير السيارات','575',`<span class="ix-dot g">46</span>`,'57',`<span class="ix-dot r">13</span`,`<span class="ix-pct-r">8%</span>`],
      ['شركة التميّز لتأجير السيارات','214',`<span class="ix-dot g">28</span>`,'22',`<span class="ix-dot r">11</span`,`<span class="ix-pct-r">13%</span>`],
      ['شركة الصحراء لتأجير السيارات','320',`<span class="ix-dot g">48</span>`,'30',`<span class="ix-dot r">14</span`,`<span class="ix-pct-r">15%</span>`],
      ['شركة الوطنية لتأجير السيارات','100',`<span class="ix-dot g">11</span>`,'12',`<span class="ix-dot r">10</span`,`<span class="ix-pct-r">11%</span>`]
    ];
    const data=sf(rows,[0]);
    return phead('جاهزية الأسطول','نسبة السيارات الجاهزة للتأجير مقابل المعطّلة والوثائق المنتهية لكل مزود',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('🚗','إجمالي السيارات','6,494')}${kpi('✓','جاهزة','797')}${kpi('⚠','وثائق منتهية','766')}${kpi('⚙','الجاهزية الكلية','12%')}</div>
        ${tools('بحث باسم المزود...')}
        <div class="ix-panel"><div class="ix-panel-b">${table(['المزود','السيارات','جاهزة','بالصيانة','وثائق منتهية','الجاهزية','إجراءات'],data.map(r=>[...r,'']))}${foot(25,3)}</div></div>
      </div>`;
  };

  /* 3 — استغلال الأسطول */
  S.fleetUtil=()=>{
    const rows=[
      ['شركة الرواد لتأجير السيارات','38','19',`<span class="ix-dot a">5</span`,`<span class="ix-pct-g">50%</span>`,'42 ر.س'],
      ['شركة المستقبل لتأجير السيارات','14','7',`<span class="ix-dot a">7</span`,`<span class="ix-pct-g">50%</span>`,'338 ر.س'],
      ['شركة الينبوع لتأجير السيارات','128','88',`<span class="ix-dot a">30</span`,`<span class="ix-pct-g">68%</span>`,'338 ر.س'],
      ['شركة التميّز لتأجير السيارات','214','142',`<span class="ix-dot a">48</span`,`<span class="ix-pct-g">66%</span>`,'286 ر.س'],
      ['شركة الصحراء لتأجير السيارات','320','248',`<span class="ix-dot a">52</span`,`<span class="ix-pct-g">78%</span>`,'310 ر.س'],
      ['كي رنت لتأجير السيارات','168','124',`<span class="ix-dot a">28</span`,`<span class="ix-pct-g">74%</span>`,'248 ر.س'],
      ['شركة الوفرة لتأجير السيارات','575','340',`<span class="ix-dot a">96</span`,`<span class="ix-pct-g">59%</span>`,'198 ر.س'],
      ['شركة مسار لتأجير السيارات','96','65',`<span class="ix-dot a">18</span`,`<span class="ix-pct-g">68%</span>`,'214 ر.س']
    ];
    const data=sf(rows,[0]);
    const top=[['الينبوع',92],['المستقبل',88],['الصحراء',84],['التميّز',78],['كي رنت',72],['مسار',68],['الوفرة',54],['الرواد',40],['الوطنية',36],['السرعة',30]];
    return phead('استغلال الأسطول (RevPAC)','إيراد لكل سيارة متاحة يومياً، ونسبة الاستغلال، والسيارات الخاملة — أهم مؤشر ربحية',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('◎','استغلال الأسطول','59%')}${kpi('🚗','سيارات خاملة','920')}${kpi('💵','متوسط RevPAC /يوم','228 ر.س')}${kpi('🚚','إجمالي الأسطول','6,494')}</div>
        ${tools('بحث بالمزود...')}
        <div class="ix-panel"><div class="ix-panel-b">${table(['المزود','السيارات','مؤجرة','خاملة','الاستغلال','RevPAC /يوم'],data)}${foot(28,3)}</div></div>
        <div class="ix-panel"><div class="ix-panel-h">RevPAC لكل مزود (أعلى 10)</div><div class="pad">${top.map(([n,v])=>`<div style="display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font:700 12px Cairo"><span>${n}</span><i style="height:12px;border-radius:6px;background:#293B85;width:${v}%;display:block"></i><b>${v}%</b></div>`).join('')}</div></div>
      </div>`;
  };

  /* 4 — التنبؤ بالطلب */
  S.demandForecast=()=>{
    const months=['نوف','ديس','ينا','فبر','مار','أبر','ماي','يون'];
    const vals=[820,1092,980,860,1120,1180,1240,1300];
    const W=720,H=260,p={l:48,r:20,t:36,b:40},pw=W-p.l-p.r,ph=H-p.t-p.b,mx=1450;
    const x=i=>p.l+(i/(months.length-1))*pw, y=v=>p.t+ph-(v/mx)*ph;
    const path=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
    const chart=`<div class="ix-chart-box">
      <div class="axis">1,450</div>
      <div class="leg"><i></i> الطلب المتوقع</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="إجمالي الطلب المتوقع">
        ${[0,500,1000,1450].map(v=>`<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="#EEF1F7"/>`).join('')}
        ${months.map((_,i)=>`<line x1="${x(i)}" y1="${p.t}" x2="${x(i)}" y2="${p.t+ph}" stroke="#EEF1F7"/>`).join('')}
        <path d="${path}" fill="none" stroke="#293B85" stroke-width="3" stroke-linejoin="round"/>
        ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff" stroke="#293B85" stroke-width="2.5"/>`).join('')}
        ${months.map((m,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-family="Cairo" font-size="12" font-weight="700" fill="#7A869E">${m}</text>`).join('')}
      </svg>
    </div>`;
    return phead('التنبؤ بالطلب','توقعات الطلب لكل مدينة عبر الأشهر القادمة مع ذكر المواسم والمناسبات — لتوجيه الأسطول مسبقاً',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('📊','الطلب المتوقع (للشهر القادم)','1,092')}${kpi('🛞','المعروض الحالي','776')}${kpi('⚠','مدن ستواجه عجزاً','8')}${kpi('⚡','ذروة متوقعة','ديس 26')}</div>
        <div class="ix-panel">
          <div class="ix-panel-h">إجمالي الطلب المتوقع</div>
          <div class="ix-events">
            <span>• نوف 22: إجازة الصيف</span>
            <span>• ديس 23: ذروة الصيف</span>
            <span>• ينا 27: العودة للمدارس</span>
            <span>• فبر 27: اليوم الوطني</span>
            <span>• مار 27: موسم العمرة</span>
          </div>
          ${chart}
        </div>
      </div>`;
  };

  /* 5 — دورة حياة الحجز */
  S.bookingLifecycle=()=>{
    const stage=window.__ixSel?.lcStage||'';
    const list=ensureLc();
    const all=list.map(r=>{
      const meta=lcMeta(r.stage);
      const act=meta.btn
        ? `<button type="button" class="ix-gbtn" onclick="WafraOps.advanceLifecycle('${r.id}')">${meta.btn}</button>`
        : bdg('مكتمل','g');
      return [r.id,r.customer,r.car,bdg(r.stage,meta.tone),r.photos,r.docs,r.damage,act];
    });
    let rows=sf(all,[0,1,2]);
    if(stage) rows=rows.filter(r=>String(r[3]).includes(stage));
    const cnt=s=>list.filter(x=>x.stage===s).length;
    return phead('دورة حياة الحجز','نتتبع التسليم والاستلام والفحص والإصلاح بالتصوير والتوثيق لتقليل نزاعات الأضرار',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('◷','بانتظار التسليم',String(cnt('بانتظار التسليم')))}${kpi('🛞','قيد الاستخدام',String(cnt('قيد الاستخدام')))}${kpi('⚠','بانتظار الفحص',String(cnt('بانتظار الفحص')))}${kpi('✓','مكتملة',String(cnt('مكتمل')))}</div>
        ${tools('بحث بالعميل...',sel('lcStage',['بانتظار التسليم','تم التسليم','قيد الاستخدام','بانتظار الفحص','مكتمل'],'كل المراحل'))}
        <div class="ix-panel"><div class="ix-panel-b">${table(['الحجز','العميل','السيارة','المرحلة','الصور','التوثيق','الأضرار',''],rows)}${foot(46,4)}</div></div>
      </div>`;
  };

  /* 6 — ولاء وتصنيف العملاء */
  S.customerLoyalty=()=>{
    const seg=window.__ixSel?.lySeg||'';
    const list=ensureLy();
    const all=list.map(r=>[r.name,r.city,r.bookings,r.score,bdg(r.segment,segTone(r.segment)),r.deposit,r.insurance]);
    let rows=sf(all,[0,1]);
    if(seg) rows=rows.filter(r=>String(r[4]).includes(seg));
    const cnt=s=>list.filter(x=>x.segment===s).length;
    return phead('ولاء وتصنيف العملاء','تصنيف المستأجرين حسب الولاء والمخاطر — يؤثر على الوديعة والتأمين المطلوبين',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('🛡','موثوق',String(cnt('موثوق')))}${kpi('👤','عادي',String(cnt('عادي')))}${kpi('⚠','مراقب',String(cnt('مراقب')))}${kpi('🛡','عالي المخاطر',String(cnt('عالي المخاطر')))}</div>
        ${tools('بحث بالاسم...',sel('lySeg',SEG_OPTS,'كل الشرائح'))}
        <div class="ix-panel"><div class="ix-panel-b">${table(['العميل','المدينة','الحجوزات','درجة الولاء','الشريحة','الرصيد المطلوب','التأمين',''],rows.map(r=>[...r,`<button type="button" class="ix-wbtn" onclick='WafraOps.openLoyaltySegment(${JSON.stringify(r[0])})'>تعديل الشريحة</button>`]))}${foot(520,44)}</div></div>
      </div>`;
  };

  /* 7 — شرائح العمولة */
  S.commissionTiers=()=>{
    const seg=window.__ixSel?.cmSeg||'';
    const all=[
      ['شركة التميّز لتأجير السيارات','NaN',bdg('large','r'),'11.6%','15%','4.38 م ر.س'],
      ['شركة السريعة لتأجير السيارات','NaN',bdg('medium','a'),'8.7%','15%','11.6 م ر.س'],
      ['شركة الوطنية لتأجير السيارات','NaN',bdg('large','r'),'10.5%','15%','7.7 م ر.س'],
      ['شركة الأركان لتأجير السيارات','NaN',bdg('small','r'),'8%','15%','10.26 ألف ر.س'],
      ['شركة الخليج لتأجير السيارات','NaN',bdg('large','r'),'11.4%','15%','9.13 م ر.س'],
      ['شركة المستقبل لتأجير السيارات','NaN',bdg('medium','a'),'10.6%','15%','2.4 م ر.س'],
      ['شركة النخبة لتأجير السيارات','NaN',bdg('small','r'),'8.1%','15%','860 ألف ر.س'],
      ['شركة الوفاء لتأجير السيارات','NaN',bdg('large','r'),'11.8%','15%','5.2 م ر.س'],
      ['شركة اليسر لتأجير السيارات','NaN',bdg('medium','a'),'10.7%','15%','1.9 م ر.س']
    ];
    let rows=sf(all,[0]);
    if(seg){/* filter by segment name not available in NaN rows — keep all */}
    return phead('شرائح العمولة حسب الأداء','ربط نسبة العمولة بأداء المورد (جودة + مخاطر + تقييم + إشغال) كحافز تعاقدي',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('★','ممتاز','0')}${kpi('✓','جيد','0')}${kpi('📊','متوسط','0')}${kpi('⚠','ضعيف','0')}</div>
        ${tools('بحث بالمورد...',sel('cmSeg',['ممتاز','جيد','متوسط','ضعيف'],'كل الشرائح'))}
        <div class="ix-panel"><div class="ix-panel-b">${table(['المورد','مرتبة الأداء','الحجم','العمولة الحالية','الموصى بها','الإيراد',''],rows.map(r=>[...r,`<button class="ix-gbtn" onclick="WafraOps.ixAction('تطبيق 15% على ${r[0]}')">تطبيق 15%</button>`]))}${foot(23,2)}</div></div>
      </div>`;
  };

  /* 8 — المخالفات والودائع */
  S.violationsDeposits=()=>{
    const st=window.__ixSel?.vioSt||'';
    const all=[
      ['VIO-1','BK-20099','عمر الرشيدي','ر ط ق 6273','تجاوز سرعة','-300 ر.س','6 أغسطس 2021',`<span class="ix-pct-g">1.7 ألف ر.س</span>`,bdg('متأخر','a')],
      ['VIO-2','BK-20088','شهد الرشيدي','د ع م 5521','قطع إشارة','-900 ر.س','5 أغسطس 2021',`<span class="ix-pct-r">833 ر.س</span>`,bdg('متأخر','a')],
      ['VIO-3','BK-20076','فهد العتيبي','ر ي ض 4410','وقوف خاطئ','-150 ر.س','4 أغسطس 2021',`<span class="ix-pct-g">500 ر.س</span>`,bdg('متأخر','a')],
      ['VIO-4','BK-20065','سارة الحربي','ج د ة 7788','تجاوز سرعة','-500 ر.س','3 أغسطس 2021',`<span class="ix-pct-g">2.0 ألف ر.س</span>`,bdg('متأخر','a')],
      ['VIO-5','BK-20054','خالد الدوسري','م د ن 9901','قطع إشارة','-900 ر.س','2 أغسطس 2021',`<span class="ix-pct-r">700 ر.س</span>`,bdg('متأخر','a')],
      ['VIO-6','BK-20043','ريم المطيري','خ ب ر 3344','وقوف خاطئ','-200 ر.س','1 أغسطس 2021',`<span class="ix-pct-g">1.0 ألف ر.س</span>`,bdg('متأخر','a')]
    ];
    let rows=sf(all,[0,2,3]);
    if(st==='غير محصلة') rows=rows.filter(r=>String(r[8]).includes('متأخر'));
    if(st==='محصلة'||st==='معترض عليها') rows=[];
    return phead('المخالفات المرورية والودائع','مخالفات ساهر المرتبطة بالعقود وتحصيلها من ودائع العملاء',[])
      +`<div class="ix-wrap">
        <div class="ix-kpis c4">${kpi('⚠','غير محصلة','34')}${kpi('💵','قيمة غير محصلة','23.5 ألف ر.س')}${kpi('✓','محصلة','0')}${kpi('⚖','معترض عليها','0')}</div>
        ${tools('بحث بالعميل أو اللوحة',sel('vioSt',['غير محصلة','محصلة','معترض عليها'],'كل الحالات'))}
        <div class="ix-panel"><div class="ix-panel-b">${table(['☐','المخالفة','السجل','العميل','اللوحة','النوع','المبلغ','التاريخ','الوديعة','الحالة',''],rows.map(r=>['☐',...r,`<button class="ix-gbtn" onclick="WafraOps.ixAction('تحصيل ${r[0]} من الوديعة')">تحصيل من الوديعة</button> <button class="ix-wbtn" onclick="WafraOps.ixAction('اعتراض على ${r[0]}')">اعتراض</button>`]))}${foot(34,3)}</div></div>
      </div>`;
  };

  const items=[
    {k:'supplyDemand',t:'خريطة العرض والطلب',i:'▣'},
    {k:'fleetReadiness',t:'جاهزية الأسطول',i:'◎'},
    {k:'fleetUtil',t:'استغلال الأسطول',i:'◔'},
    {k:'demandForecast',t:'التنبؤ بالطلب',i:'↗'},
    {k:'bookingLifecycle',t:'دورة حياة الحجز',i:'⟳'},
    {k:'customerLoyalty',t:'ولاء وتصنيف العملاء',i:'★'},
    {k:'commissionTiers',t:'شرائح العمولة',i:'%'},
    {k:'violationsDeposits',t:'المخالفات والودائع',i:'⚑'}
  ];
  let reports=NAV.find(g=>g.g==='التقارير');
  if(!reports){reports={g:'التقارير',items:[]};NAV.push(reports);}
  items.forEach(it=>{if(!reports.items.some(x=>x.k===it.k))reports.items.push(it);});
  if(window.TITLES) items.forEach(it=>window.TITLES[it.k]=it.t);

  S.reportDetail=()=>{
    const map={supply:'supplyDemand',readiness:'fleetReadiness',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
    const k=map[window.__reportKey||'supply']||'supplyDemand';
    return (S[k]||S.supplyDemand)();
  };
})();
</script>
