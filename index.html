<script>
/* قائمة المزودين: الإبقاء على التصميم + نموذج إضافة مكتمل. أداء المزودين: بطاقة مقارنة Claude. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  state.providers=state.providers||[
    {id:'PV-001',name:'شركة الصحراء لتأجير السيارات',city:'الرياض',address:'طريق الملك فهد، العليا',branches:7,total:214,available:214,bookings:23,services:'استلام · توصيل · بين المدن',status:'نشط',cr:'1010893442',region:'الوسطى',phone:'920000111',email:'info@sahra.example'},
    {id:'PV-002',name:'كي رنت',city:'جدة',address:'شارع الأمير سلطان، الشاطئ',branches:5,total:168,available:168,bookings:19,services:'استلام · توصيل',status:'نشط',cr:'1012499983',region:'الغربية',phone:'920000222',email:'ops@krent.example'},
    {id:'PV-003',name:'مسار لتأجير المركبات',city:'الخبر',address:'طريق الكورنيش، الخبر',branches:4,total:96,available:0,bookings:4,services:'توصيل',status:'موقف',cr:'1014003244',region:'الشرقية',phone:'920000333',email:'hello@masar.example'}
  ];
  const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dialog=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const persist=()=>{try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}};
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const level=n=>{
    const t=n>=80?'g':n>=50?'a':'r';
    return `<span class="pp-pill ${t}">${n}%</span>`;
  };

  const perfData=[
    {n:'شركة المستقبل لتأجير السيارات',r:56,o:86,k:86,c:82,p:96,s:81},
    {n:'شركة الينبوع لتأجير السيارات',r:72,o:84,k:78,c:80,p:88,s:80},
    {n:'شركة الصحراء لتأجير السيارات',r:90,o:78,k:84,c:88,p:82,s:84},
    {n:'شركة الوفرة لتأجير السيارات',r:64,o:70,k:66,c:58,p:74,s:66},
    {n:'كي رنت لتأجير السيارات',r:78,o:74,k:72,c:76,p:70,s:74},
    {n:'شركة التميّز لتأجير السيارات',r:42,o:48,k:38,c:44,p:52,s:45},
    {n:'شركة الوطنية لتأجير السيارات',r:68,o:72,k:70,c:64,p:76,s:70},
    {n:'شركة السريعة لتأجير السيارات',r:54,o:60,k:58,c:50,p:62,s:57},
    {n:'شركة النخبة لتأجير السيارات',r:82,o:80,k:76,c:84,p:78,s:80},
    {n:'شركة الخليج لتأجير السيارات',r:60,o:66,k:62,c:58,p:68,s:63},
    {n:'شركة اليسر لتأجير السيارات',r:48,o:52,k:46,c:40,p:55,s:48},
    {n:'شركة الأركان لتأجير السيارات',r:36,o:42,k:34,c:30,p:44,s:37}
  ].sort((a,b)=>b.s-a.s);

  Object.assign(WafraOps,{
    providerFilters:()=>{
      window.__providerFilters={
        q:document.getElementById('provider-q')?.value||'',
        city:document.getElementById('provider-city')?.value||'',
        status:document.getElementById('provider-status')?.value||''
      };
      render();
    },
    editProvider:id=>{
      const p=state.providers.find(x=>x.id===id); if(!p) return;
      openM(dialog(`تعديل بيانات ${safe(p.name)}`,
        `<div class="ap-grid">
          ${fld('اسم المزود',`<input id="provider-name" class="native-input" value="${safe(p.name)}">`)}
          ${fld('السجل التجاري',`<input id="provider-cr" class="native-input" value="${safe(p.cr||'')}">`)}
          ${fld('المدينة',`<select id="provider-city-edit" class="native-input">${['الرياض','جدة','الخبر','الدمام','مكة','المدينة'].map(x=>`<option ${p.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}
          ${fld('منطقة التجهيز',`<select id="provider-region" class="native-input">${['الوسطى','الشرقية','الغربية','الشمالية','الجنوبية'].map(x=>`<option ${(p.region||'الوسطى')===x?'selected':''}>${x}</option>`).join('')}</select>`)}
          ${fld('العنوان',`<input id="provider-address" class="native-input" value="${safe(p.address)}">`)}
          ${fld('الجوال / التواصل',`<input id="provider-phone" class="native-input" value="${safe(p.phone||'')}">`)}
          ${fld('البريد الإلكتروني',`<input id="provider-email" class="native-input" value="${safe(p.email||'')}">`)}
          ${fld('الحالة',`<select id="provider-status-edit" class="native-input">${['نشط','موقف','طلب اعتماد'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        </div>
        ${fld('الخدمات',`<div style="display:flex;gap:10px;flex-wrap:wrap;padding:8px 0">${[['pickup','استلام من الفرع'],['delivery','توصيل'],['intercity','بين المدن']].map(([k,l])=>{const on=(p.services||'').includes(l.split(' ')[0])||(p.services||'').includes(l);return `<label style="display:flex;gap:6px;align-items:center;font:700 12px Cairo"><input type="checkbox" id="psvc-${k}" ${on?'checked':''}> ${l}</label>`;}).join('')}</div>`)}`,
        `<button class="btn coral" onclick="WafraOps.saveProvider('${id}')">حفظ التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveProvider:id=>{
      if(!id){ WafraOps.createProvider(); return; }
      const p=state.providers.find(x=>x.id===id); if(!p) return;
      p.name=val('provider-name')||p.name;
      p.cr=val('provider-cr')||p.cr;
      p.city=val('provider-city-edit')||p.city;
      p.region=val('provider-region')||p.region;
      p.address=val('provider-address')||p.address;
      p.phone=val('provider-phone')||p.phone;
      p.email=val('provider-email')||p.email;
      p.status=val('provider-status-edit')||p.status;
      const sv=[];
      if(document.getElementById('psvc-pickup')?.checked) sv.push('استلام');
      if(document.getElementById('psvc-delivery')?.checked) sv.push('توصيل');
      if(document.getElementById('psvc-intercity')?.checked) sv.push('بين المدن');
      if(sv.length) p.services=sv.join(' · ');
      persist(); closeM(); render(); toast('تم حفظ بيانات المزود.');
    },
    addProvider:()=>{
      openM(dialog('إضافة مزود',
        `<div style="padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#EEF3FF,#FFF8F7);margin-bottom:14px">
          <b style="color:var(--navy)">بيانات الاعتماد والتشغيل</b>
          <div class="ap-hint">أدخل بيانات الشركة للاعتماد. الحالة الافتراضية: طلب اعتماد.</div>
        </div>
        <div class="ap-grid">
          ${fld('اسم الشركة',`<input id="ap-name" class="native-input" placeholder="مثال: شركة التميّز لتأجير السيارات">`)}
          ${fld('السجل التجاري',`<input id="ap-cr" class="native-input" placeholder="1010xxxxxx">`)}
          ${fld('المدينة الرئيسية',`<select id="ap-city" class="native-input"><option>الرياض</option><option>جدة</option><option>الخبر</option><option>الدمام</option><option>مكة</option><option>المدينة</option></select>`)}
          ${fld('منطقة التجهيز',`<select id="ap-region" class="native-input"><option>الوسطى</option><option>الشرقية</option><option>الغربية</option><option>الشمالية</option><option>الجنوبية</option></select>`,'تحدد منطقة تجهيز المزود، ويمكن إضافة مناطق أخرى من ملفه.')}
          ${fld('العنوان',`<input id="ap-address" class="native-input" placeholder="الحي · الشارع">`)}
          ${fld('رقم التواصل',`<input id="ap-phone" class="native-input" placeholder="920xxxxxx">`)}
          ${fld('البريد الإلكتروني',`<input id="ap-email" class="native-input" placeholder="ops@example.com">`)}
          ${fld('الحالة',`<select id="ap-status" class="native-input"><option>طلب اعتماد</option><option>نشط</option><option>موقف</option></select>`)}
        </div>
        ${fld('الخدمات المفعّلة',`<div style="display:flex;gap:10px;flex-wrap:wrap;padding:8px 0">
          <label style="display:flex;gap:6px;align-items:center;font:700 12px Cairo"><input type="checkbox" id="ap-pickup" checked> استلام من الفرع</label>
          <label style="display:flex;gap:6px;align-items:center;font:700 12px Cairo"><input type="checkbox" id="ap-delivery" checked> توصيل</label>
          <label style="display:flex;gap:6px;align-items:center;font:700 12px Cairo"><input type="checkbox" id="ap-intercity"> تسليم بين المدن</label>
        </div>`)}`,
        `<button class="btn coral" onclick="WafraOps.createProvider()">حفظ المزود</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    createProvider:()=>{
      const name=val('ap-name'); if(!name){toast('أدخل اسم الشركة.');return;}
      const sv=[];
      if(document.getElementById('ap-pickup')?.checked) sv.push('استلام');
      if(document.getElementById('ap-delivery')?.checked) sv.push('توصيل');
      if(document.getElementById('ap-intercity')?.checked) sv.push('بين المدن');
      const id='PV-'+String(100+state.providers.length+1).padStart(3,'0');
      state.providers.unshift({
        id,name,
        cr:val('ap-cr')||'—',
        city:val('ap-city')||'الرياض',
        region:val('ap-region')||'الوسطى',
        address:val('ap-address')||'—',
        phone:val('ap-phone')||'—',
        email:val('ap-email')||'—',
        status:val('ap-status')||'طلب اعتماد',
        services:sv.length?sv.join(' · '):'—',
        branches:0,total:0,available:0,bookings:0
      });
      persist(); closeM();
      location.hash='vendors';
      render();
      toast('تم إضافة المزود بنجاح.');
    },
    perfFilter:()=>{window.__perfQ=document.getElementById('perf-q')?.value||'';render();}
  });

  /* قائمة المزودين — نفس تصميم p27 مع دعم طلب اعتماد في الفلتر */
  S.vendors=()=>{
    const f=window.__providerFilters||{};
    const rows=state.providers.filter(p=>(!f.q||`${p.name} ${p.address} ${p.cr||''}`.includes(f.q))&&(!f.city||p.city===f.city)&&(!f.status||p.status===f.status));
    return phead('إدارة المزودين','بيانات الاعتماد والفروع والسيارات والخدمات لكل مزود',[],`<button class="btn coral" onclick="WafraOps.addProvider()">＋ إضافة مزود</button>`)
      +card(`<div class="filters">
        <label class="fsearch">⌕ <input id="provider-q" value="${safe(f.q||'')}" placeholder="ابحث باسم المزود أو عنوانه أو السجل" oninput="WafraOps.providerFilters()"></label>
        ${fld('المدينة',`<select id="provider-city" class="native-input" onchange="WafraOps.providerFilters()"><option value="">كل المدن</option>${['الرياض','جدة','الخبر','الدمام','مكة','المدينة'].map(x=>`<option ${f.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('حالة المزود',`<select id="provider-status" class="native-input" onchange="WafraOps.providerFilters()"><option value="">كل الحالات</option>${['نشط','موقف','طلب اعتماد'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}
      </div><div class="card-b">${table(
        ['المرجع','المزود','المدينة','العنوان','الفروع','إجمالي السيارات','المتاح','الحجوزات النشطة','الخدمات','الحالة','الإجراءات'],
        rows.map(p=>[p.id,p.name,p.city,p.address,p.branches,p.total,p.available,p.bookings,p.services,pill(p.status),`<a class="btn ghost sm" href="#vendorFile">إطلاع</a> <button class="btn ghost sm" onclick="WafraOps.editProvider('${p.id}')">تعديل</button>`])
      )}</div>`);
  };

  /* أداء المزودين — بطاقة أداء المزود المقارنة */
  S.providerPerformance=()=>{
    const q=(window.__perfQ||'').trim();
    const rows=perfData.filter(x=>!q||x.n.includes(q));
    const best=perfData[0], worst=perfData[perfData.length-1];
    return phead('بطاقة أداء المزود المقارنة','ترتيب كل مزود مئوياً مقابل أقرانه في الجودة والإشغال والمخاطر والشكاوى والتسعير',[])
      +`<div class="pp-wrap">
        <div class="pp-kpis">
          <div class="pp-kpi"><div class="l">الأعلى أداءً</div><div class="v">${best.n}</div><div class="ic hi">★</div></div>
          <div class="pp-kpi"><div class="l">الأقل أداءً</div><div class="v">${worst.n}</div><div class="ic lo">⚠</div></div>
          <div class="pp-kpi"><div class="l">مزودون متابعون</div><div class="v big">28</div><div class="ic n">☰</div></div>
        </div>
        <div class="pp-tools">
          <div class="grow"><label class="pp-search">⌕ <input id="perf-q" value="${safe(q)}" placeholder="بحث بالمزود..." oninput="WafraOps.perfFilter()"></label></div>
          <div class="pp-acts">
            <button class="btn ghost sm" onclick="WafraOps.demoAction('حفظ العرض')">💾 حفظ العرض</button>
            <button class="btn ghost sm" onclick="WafraOps.exportCurrent('أداء-المزودين','PDF')">PDF ⤓</button>
            <button class="btn ghost sm" onclick="WafraOps.exportCurrent('أداء-المزودين','Excel')">Excel ⤓</button>
          </div>
        </div>
        <div class="pp-panel"><div class="pp-panel-b">
          ${table(
            ['#','المزود','التقييم','الإشغال','المخاطر','الشكاوى','التسعير','المؤشر العام'],
            rows.map((x,i)=>[String(i+1),x.n,level(x.r),level(x.o),level(x.k),level(x.c),level(x.p),`<span class="pp-score">${x.s}%</span>`])
          )}
          <div class="pp-foot">
            <span>صفحة 1 من 3</span>
            <span>28 سجل</span>
            <div class="pp-pages"><button class="on">1</button><button>2</button><button>3</button></div>
          </div>
        </div></div>
      </div>`;
  };

  const nav=NAV.find(g=>typeof g.g==='string'&&g.g.includes('المزود'));
  if(nav&&!nav.items.some(i=>i.k==='providerPerformance')){
    const idx=nav.items.findIndex(i=>i.k==='vendors');
    nav.items.splice(idx>=0?idx+1:1,0,{k:'providerPerformance',t:'أداء المزودين',i:'◷'});
  }
  if(window.TITLES){
    window.TITLES.vendors='قائمة المزودين';
    window.TITLES.providerPerformance='أداء المزودين';
  }
})();
</script>

<script>
/* الفروع: مناطق/مدن (منطقة تابعة للمدينة) · نموذج إضافة فرع · رسوم بين المدن + تاريخ الإضافة */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const save=()=>{try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}};
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const today=()=>{
    const d=new Date();
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  };

  const DEFAULT_REGIONS=['المنطقة الوسطى','المنطقة الغربية','المنطقة الشرقية','المنطقة الشمالية','المنطقة الجنوبية'];
  state.areas=state.areas||{regions:[],cities:[]};
  /* ترحيل المدن القديمة من نص إلى كائن {name,region} */
  if(Array.isArray(state.areas.cities)){
    state.areas.cities=state.areas.cities.map(c=>{
      if(typeof c==='string') return {name:c,region:'المنطقة الوسطى',status:'نشط'};
      return c;
    });
  }
  state.areas.regions=state.areas.regions||[];
  state.fees=state.fees||[
    {provider:'شركة الصحراء',from:'الرياض',to:'جدة',amount:'180',status:'نشطة',added:'12 أغسطس 2026'},
    {provider:'كي رنت',from:'جدة',to:'مكة المكرمة',amount:'85',status:'نشطة',added:'3 سبتمبر 2026'},
    {provider:'مسار',from:'الخبر',to:'الرياض',amount:'140',status:'غير نشطة',added:'21 يوليو 2026'}
  ];
  state.branches=state.branches||[
    {id:'BR-014',name:'مطار الملك خالد',provider:'شركة الصحراء',city:'الرياض',contracts:186,utilization:81,commission:12,status:'نشط',type:'مطار',address:'صالة الوصول'},
    {id:'BR-021',name:'جدة الشمالية',provider:'كي رنت',city:'جدة',contracts:139,utilization:75,commission:10,status:'نشط',type:'داخلي',address:'شارع الأمير سلطان'},
    {id:'BR-031',name:'الخبر التشغيلي',provider:'مسار',city:'الخبر',contracts:18,utilization:0,commission:10,status:'غير نشط',type:'توصيل',address:'طريق الكورنيش'}
  ];

  const regionOptions=()=>{
    const extra=state.areas.regions.map(r=>typeof r==='string'?r:r.name);
    return [...DEFAULT_REGIONS,...extra.filter(x=>!DEFAULT_REGIONS.includes(x))];
  };

  const parseCities=raw=>(raw||'').split(/[،,\n]+/).map(s=>s.trim()).filter(Boolean);
  const branchCountByCity=city=>(state.branches||[]).filter(b=>b.city===city).length;
  const citiesOfRegion=regionName=>{
    const fromCities=(state.areas.cities||[]).filter(c=>{
      const r=typeof c==='string'?'':(c.region||'');
      return r===regionName;
    }).map(c=>typeof c==='string'?c:c.name);
    const reg=(state.areas.regions||[]).find(r=>(typeof r==='string'?r:r.name)===regionName);
    const seeded=reg&&Array.isArray(reg.cities)?reg.cities:[];
    return [...new Set([...seeded,...fromCities])];
  };
  const branchCountByRegion=regionName=>citiesOfRegion(regionName).reduce((n,c)=>n+branchCountByCity(c),0);

  Object.assign(WafraOps,{
    areasTab:t=>{window.__areasTab=t;render();},
    addArea:t=>{
      if(t==='regions'){
        openM(dlg('تعريف منطقة جديدة',
          `${fld('اسم المنطقة',`<input id="area-name" class="native-input" placeholder="مثال: المنطقة الوسطى">`)}
           ${fld('المدن التابعة',`<textarea id="area-cities" class="native-input" rows="3" placeholder="الرياض، الخرج، القصيم"></textarea>`,'اكتب أسماء المدن مفصولة بفاصلة. تظهر في عمود المدن بالجدول.')}
           ${fld('الحالة',`<select id="area-status" class="native-input"><option>نشط</option><option>غير نشط</option></select>`)}
           <div class="note info">عدد الفروع لا يُدخل يدوياً — يُحسب تلقائياً من الفروع المسجّلة في مدن هذه المنطقة.</div>`,
          `<button class="btn coral" onclick="WafraOps.saveArea('regions')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
        ));
        return;
      }
      openM(dlg('تعريف مدينة جديدة',
        `${fld('اسم المدينة',`<input id="area-name" class="native-input" placeholder="مثال: القصيم">`)}
         ${fld('المنطقة التابعة لها',`<select id="area-region" class="native-input">${regionOptions().map(r=>`<option>${r}</option>`).join('')}</select>`,'حدد المنطقة الإدارية التي تتبعها هذه المدينة.')}
         ${fld('الحالة',`<select id="area-status" class="native-input"><option>نشط</option><option>غير نشط</option></select>`)}
         <div class="note info">عدد الفروع لا يُدخل يدوياً — يُحسب تلقائياً عند إضافة فروع لهذه المدينة من شاشة الفروع.</div>`,
        `<button class="btn coral" onclick="WafraOps.saveArea('cities')">حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveArea:t=>{
      const n=val('area-name');
      if(!n){toast('اكتب الاسم أولاً.');return;}
      state.areas=state.areas||{regions:[],cities:[]};
      if(t==='regions'){
        const cities=parseCities(val('area-cities'));
        state.areas.regions.push({name:n,cities,status:val('area-status')||'نشط'});
        cities.forEach(city=>{
          const exists=state.areas.cities.some(c=>(typeof c==='string'?c:c.name)===city);
          if(!exists) state.areas.cities.push({name:city,region:n,status:'نشط'});
          else{
            const row=state.areas.cities.find(c=>(typeof c==='string'?c:c.name)===city);
            if(row&&typeof row==='object') row.region=n;
          }
        });
      }else{
        state.areas.cities.push({name:n,region:val('area-region')||'المنطقة الوسطى',status:val('area-status')||'نشط'});
      }
      save(); closeM(); render(); toast('تم الحفظ بنجاح.');
    },
    openBranchForm:id=>{
      window.__branchEdit=id||'';
      location.hash='branchForm';
    },
    saveBranchForm:()=>{
      const edit=window.__branchEdit;
      const name=val('bf-name');
      if(!name){toast('أدخل اسم الفرع.');return;}
      const payload={
        id:val('bf-id')||('BR-'+String(100+state.branches.length)),
        name,
        provider:val('bf-provider')||'شركة الصحراء',
        city:val('bf-city')||'الرياض',
        type:val('bf-type')||'داخلي',
        address:val('bf-address')||'—',
        status:val('bf-status')||'نشط',
        contracts:0,utilization:0,commission:12
      };
      if(edit){
        const b=state.branches.find(x=>x.id===edit);
        if(b) Object.assign(b,payload,{id:edit});
        else state.branches.unshift(payload);
      }else{
        if(state.branches.some(x=>x.id===payload.id)) payload.id='BR-'+String(Date.now()).slice(-4);
        state.branches.unshift(payload);
      }
      save();
      window.__branchEdit='';
      location.hash='branches';
      render();
      toast(edit?'تم حفظ تعديلات الفرع.':'تم إضافة الفرع بنجاح.');
    },
    addFee:()=>{
      openM(dlg('إضافة رسوم تسليم بين المدن',
        `<div class="frow">${fld('المزود',`<select id="fee-provider" class="native-input"><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}
         ${fld('الرسوم (ر.س)',`<input id="op-fee" class="native-input" value="150" type="number">`,'تظهر للعميل قبل الدفع وتضاف إلى إجمالي الحجز.')}</div>
         <div class="frow">${fld('مدينة الاستلام',`<select id="fee-from" class="native-input"><option>الرياض</option><option>جدة</option><option>الدمام</option><option>الخبر</option><option>مكة المكرمة</option><option>المدينة</option></select>`)}
         ${fld('مدينة التسليم',`<select id="fee-to" class="native-input"><option>الدمام</option><option>الرياض</option><option>جدة</option><option>الخبر</option><option>مكة المكرمة</option><option>المدينة</option></select>`)}</div>
         ${fld('الحالة',`<select id="fee-status" class="native-input"><option>نشطة</option><option>غير نشطة</option></select>`)}`,
        `<button class="btn coral" onclick="WafraOps.saveFee()">إضافة الرسوم</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    saveFee:()=>{
      const amount=val('op-fee')||'0';
      state.fees=state.fees||[];
      state.fees.unshift({
        provider:val('fee-provider')||'شركة الصحراء',
        from:val('fee-from')||'الرياض',
        to:val('fee-to')||'الدمام',
        amount,
        status:val('fee-status')||'نشطة',
        added:today()
      });
      save(); closeM(); render(); toast('تم إضافة الرسوم.');
    }
  });

  /* —— المناطق والمدن —— */
  S.branchAreas=()=>{
    const active=window.__areasTab||'regions';
    state.areas=state.areas||{regions:[],cities:[]};
    const regionsBase=[
      {name:'المنطقة الوسطى',cities:['الرياض','الخرج'],status:'نشط'},
      {name:'المنطقة الغربية',cities:['جدة','مكة'],status:'نشط'},
      {name:'المنطقة الشرقية',cities:['الدمام','الخبر'],status:'نشط'},
      {name:'المنطقة الشمالية',cities:['تبوك','حائل'],status:'نشط'},
      {name:'المنطقة الجنوبية',cities:['أبها','جازان'],status:'نشط'}
    ];
    const customRegions=(state.areas.regions||[]).map(r=>({
      name:typeof r==='string'?r:r.name,
      cities:typeof r==='string'?citiesOfRegion(typeof r==='string'?r:r.name):(r.cities||citiesOfRegion(r.name)),
      status:(typeof r==='object'&&r.status)||'نشط'
    }));
    const regions=[...regionsBase,...customRegions.filter(r=>!regionsBase.some(b=>b.name===r.name))];
    const knownCityNames=new Set();
    const citiesBase=[
      {name:'الرياض',region:'المنطقة الوسطى',status:'نشط'},
      {name:'جدة',region:'المنطقة الغربية',status:'نشط'},
      {name:'الخبر',region:'المنطقة الشرقية',status:'نشط'}
    ];
    citiesBase.forEach(c=>knownCityNames.add(c.name));
    const customCities=(state.areas.cities||[]).map(c=>({
      name:typeof c==='string'?c:c.name,
      region:typeof c==='string'?'—':(c.region||'—'),
      status:(typeof c==='object'&&c.status)||'نشط'
    })).filter(c=>!knownCityNames.has(c.name));
    const cities=[...citiesBase,...customCities];
    return phead('المناطق والمدن','تعريف المناطق والمدن — عدد الفروع يُحسب تلقائياً من الفروع المسجّلة',[],
      `<button class="btn coral" onclick="WafraOps.addArea('${active}')">＋ تعريف ${active==='regions'?'منطقة':'مدينة'}</button>`)
      +card(`<div class="tabs">
        <button class="tab ${active==='regions'?'on':''}" onclick="WafraOps.areasTab('regions')">المناطق</button>
        <button class="tab ${active==='cities'?'on':''}" onclick="WafraOps.areasTab('cities')">المدن</button>
      </div><div class="card-b">${
        active==='regions'
          ?table(['المنطقة','المدن','الفروع','الحالة','الإجراءات'],regions.map(r=>{
              const citiesList=(r.cities&&r.cities.length)?r.cities:citiesOfRegion(r.name);
              const count=citiesList.reduce((n,c)=>n+branchCountByCity(c),0);
              return [r.name,citiesList.length?citiesList.join(' · '):'—',String(count),pill(r.status||'نشط'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('استعراض ${r.name}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل ${r.name}')">تعديل</button>`];
            }))
          :table(['المدينة','المنطقة','الفروع','الحالة','الإجراءات'],cities.map(c=>[c.name,c.region,String(branchCountByCity(c.name)),pill(c.status||'نشط'),`<button class="btn ghost sm" onclick="WafraOps.demoAction('استعراض ${c.name}')">استعراض</button> <button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل ${c.name}')">تعديل</button>`]))
      }</div>`);
  };

  /* —— قائمة الفروع (نفس تصميم p23) + ربط نموذج الإضافة —— */
  S.branches=()=>{
    const f=window.__branchFilter||{};
    const rows=state.branches.filter(b=>(!f.q||`${b.name} ${b.provider}`.includes(f.q))&&(!f.city||b.city===f.city)&&(!f.provider||b.provider===f.provider)&&(!f.status||b.status===f.status));
    const badge=s=>bdg(s,s==='نشط'?'g':'r');
    return phead('إدارة الفروع','بحث وفلترة وتفعيل وصلاحيات لكل فرع',[],
      `<button class="btn coral" onclick="WafraOps.openBranchForm()">＋ إضافة فرع</button>`)
      +card(`<div class="filters">
        <label class="fsearch">⌕ <input id="branch-q" value="${(f.q||'').replace(/"/g,'&quot;')}" placeholder="ابحث باسم الفرع" oninput="WafraOps.branchFilter()"></label>
        ${fld('المدينة',`<select id="branch-city" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المدن</option>${['الرياض','جدة','الخبر'].map(x=>`<option ${f.city===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('المزود',`<select id="branch-provider" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل المزودين</option>${['شركة الصحراء','كي رنت','مسار'].map(x=>`<option ${f.provider===x?'selected':''}>${x}</option>`).join('')}</select>`)}
        ${fld('الحالة',`<select id="branch-status" class="native-input" onchange="WafraOps.branchFilter()"><option value="">كل الحالات</option><option ${f.status==='نشط'?'selected':''}>نشط</option><option ${f.status==='غير نشط'?'selected':''}>غير نشط</option></select>`)}
      </div><div class="card-b">${table(
        ['المرجع','الفرع','المزود','المدينة','إجمالي العقود','التشغيل','العمولة','الحالة','الإجراءات'],
        rows.map(b=>[b.id,b.name,b.provider,b.city,b.contracts,`${b.utilization}%`,`${b.commission}%`,badge(b.status),
          `<button class="btn ghost sm" onclick="WafraOps.viewBranch('${b.id}')">استعراض</button>
           <button class="btn ghost sm" onclick="WafraOps.openBranchForm('${b.id}')">تعديل</button>
           <button class="btn ${b.status==='نشط'?'danger':'coral'} sm" onclick="WafraOps.toggleBranch('${b.id}')">${b.status==='نشط'?'إلغاء التنشيط':'تنشيط'}</button>`])
      )}</div>`);
  };

  /* —— نموذج إضافة/تعديل فرع مطابق لشاشة المزود (p15) مع حفظ فعلي —— */
  const dayRow=(name,on=true)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:12px">${name}</b><span class="badge ${on?'g':'n'}">${on?'مفتوح':'مغلق'}</span></div><div class="frow" style="margin-top:8px"><input class="native-input" value="08:00 صباحاً"><input class="native-input" value="08:00 مساءً"></div></div>`;
  const branchNote=text=>`<div style="padding:12px 14px;background:#F5F8FF;border-radius:10px;color:var(--navy);font-size:12px">${text}</div>`;
  S.branchForm=()=>{
    const editId=window.__branchEdit;
    const b=editId?state.branches.find(x=>x.id===editId):null;
    const isEdit=!!b;
    return phead(isEdit?'تعديل فرع':'إضافة فرع جديد',isEdit?'تعديل بيانات الفرع وموقعه وتشغيله':'أدخل المعلومات الأساسية لإنشاء موقع خدمة جديد — بنفس نموذج إضافة الفرع في شاشة المزود',[],
      `<a class="btn ghost" href="#branches">إلغاء</a>`)
      +`<div class="form-page">
        ${card(cardH('معلومات أساسية')+`<div class="card-b">
          <div class="frow">${fld('اسم الفرع',`<input id="bf-name" class="native-input" value="${b?b.name:''}" placeholder="أدخل اسم الفرع">`)}${fld('الرقم المرجعي',`<input id="bf-id" class="native-input" value="${b?b.id:('BR-'+String(100+state.branches.length))}">`)}</div>
          <div class="frow">${fld('المزود',`<select id="bf-provider" class="native-input">${['شركة الصحراء لتأجير السيارات','كي رنت','مسار'].map(x=>{const short=x.includes('الصحراء')?'شركة الصحراء':x;return `<option ${(b?b.provider:'شركة الصحراء')===short||(b&&x.includes(b.provider))?'selected':''}>${x}</option>`;}).join('')}</select>`)}
          ${fld('نوع الفرع',`<select id="bf-type" class="native-input">${['فرع داخلي','مطار','محطة قطار','فرع سحابي','توصيل'].map(x=>`<option ${(b?.type||'فرع داخلي')===x||(b?.type==='داخلي'&&x==='فرع داخلي')?'selected':''}>${x}</option>`).join('')}</select>`)}</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px"><label><input type="checkbox" checked> موقع ثابت</label><label><input type="checkbox"> نقطة استلام فقط</label><label><input type="checkbox" checked> تسليم للعميل</label><label><input type="checkbox"> خدمات المطار</label></div>
        </div>`)}
        ${card(cardH('تفاصيل الموقع')+`<div class="card-b">
          <div class="frow">${fld('الدولة',`<select class="native-input"><option>المملكة العربية السعودية</option></select>`)}${fld('المنطقة',`<select class="native-input">${regionOptions().map(r=>`<option>${r}</option>`).join('')}</select>`)}</div>
          <div class="frow">${fld('المدينة',`<select id="bf-city" class="native-input">${['الرياض','جدة','الخبر','الدمام','مكة','المدينة'].map(x=>`<option ${(b?.city||'الرياض')===x?'selected':''}>${x}</option>`).join('')}</select>`)}${fld('الحي',`<input class="native-input" value="العليا">`)}</div>
          ${fld('العنوان',`<input id="bf-address" class="native-input" value="${b?.address||'123 شارع الملك فهد'}">`)}
          <div class="branch-map">⌖<br><b>حدد موقع الفرع على الخريطة</b><br><span>المملكة العربية السعودية</span></div>
        </div>`)}
        ${card(cardH('ساعات العمل')+`<div class="card-b">${['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'].map((d,i)=>dayRow(d,i!==6)).join('')}</div>`)}
        ${card(cardH('الحالة والإتاحة')+`<div class="card-b">
          <div class="frow">${fld('حالة الفرع',`<select id="bf-status" class="native-input"><option ${!b||b.status==='نشط'?'selected':''}>نشط</option><option ${b&&b.status!=='نشط'?'selected':''}>غير نشط</option></select>`)}
          ${fld('إتاحة السيارات',`<select class="native-input"><option>مرتبطة بإتاحة السيارات</option><option>إتاحة صفر</option></select>`)}</div>
          ${branchNote('يظهر الفرع في مراقبة الإتاحة إذا كان نشطاً ولا توجد به سيارات متاحة.')}
        </div>`)}
        ${card(cardH('ساعات التوصيل وإعداداته')+`<div class="card-b">
          <div class="frow">${fld('بداية التوصيل',`<input class="native-input" value="09:00 صباحاً">`)}${fld('نهاية التوصيل',`<input class="native-input" value="09:00 مساءً">`)}</div>
          <div class="frow">${fld('نطاق التوصيل',`<select class="native-input"><option>نصف قطر 40 كم</option><option>حسب المدينة</option></select>`)}${fld('الحد الأدنى للحجز',`<select class="native-input"><option>5 ساعات</option><option>يوم واحد</option></select>`)}</div>
          ${branchNote('يمكن ربط أسعار التوصيل لكل نطاق من شاشة رسوم التسليم بين المدن.')}
        </div>`)}
        ${card(cardH('مواعيد الإجازة الرسمية والإغلاق')+`<div class="card-b">
          <div class="frow">${fld('من تاريخ',`<input class="native-input" type="date" value="2026-12-20">`)}${fld('إلى تاريخ',`<input class="native-input" type="date" value="2026-12-25">`)}</div>
          ${fld('سبب الإغلاق',`<textarea class="native-input" rows="2">إجازة نهاية العام</textarea>`)}
        </div>`)}
        ${card(cardH('سياسات الفرع')+`<div class="card-b">
          ${fld('سياسة الاستلام',`<textarea class="native-input" rows="3">يلزم تقديم الهوية ورخصة القيادة الأصلية عند الاستلام.</textarea>`)}
          ${fld('سياسة التسليم',`<textarea class="native-input" rows="3">يتم فحص المركبة وتسجيل حالة الوقود والعداد عند التسليم.</textarea>`)}
        </div>`)}
        <div style="display:flex;gap:10px;justify-content:flex-start;margin:20px 0">
          <button class="btn coral" onclick="WafraOps.saveBranchForm()">${isEdit?'حفظ التعديلات':'إضافة الفرع'}</button>
          <a class="btn ghost" href="#branches">إلغاء</a>
        </div>
      </div>`;
  };

  /* —— رسوم بين المدن + تاريخ الإضافة —— */
  S.intercityFees=()=>{
    const fees=state.fees||[];
    return phead('رسوم التسليم بين المدن','إدارة الرسوم لكل مزود مع حالة الرسوم',[],
      `<button class="btn coral" onclick="WafraOps.addFee()">＋ إضافة رسوم</button>`)
      +card(`<div class="filters" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        ${fld('المزودون',`<select class="native-input"><option>كل المزودين</option><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option></select>`)}
        ${fld('المدن',`<select class="native-input"><option>كل المدن</option><option>الرياض</option><option>جدة</option><option>الدمام</option></select>`)}
        ${fld('حالة الرسوم',`<select class="native-input"><option>كل الحالات</option><option>نشطة</option><option>غير نشطة</option></select>`)}
      </div><div class="card-b">${table(
        ['المزود','الاستلام','التسليم','الرسوم','تاريخ الإضافة','الحالة','الإجراءات'],
        fees.map(x=>[
          x.provider,x.from,x.to,
          {v:`${x.amount} ر.س`,c:'num'},
          x.added||'—',
          bdg(x.status,x.status==='نشطة'?'g':'n'),
          `<button class="btn ghost sm" onclick="WafraOps.demoAction('تعديل رسوم ${x.from} → ${x.to}')">✎</button>`
        ])
      )}</div>`);
  };

  if(window.TITLES){
    window.TITLES.branchAreas='المناطق والمدن';
    window.TITLES.branches='قائمة الفروع';
    window.TITLES.intercityFees='رسوم بين المدن';
    window.TITLES.branchForm='إضافة فرع';
  }
})();
</script>
<style>

.branch-map{margin-top:12px;min-height:150px;display:grid;place-items:center;text-align:center;border-radius:12px;background:linear-gradient(125deg,#E2E8E3,#E9EEF2);color:var(--navy);font-size:13px}
.branch-map span{font-size:11px;color:var(--ink-2)}
@media(max-width:800px){.form-page .frow{grid-template-columns:1fr}}
</style>

<style id="wafra-ops-fleet-users-bookings">
.vu-vip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.vu-vip .card-x{background:#fff;border:1px solid #E4E9F3;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(25,42,84,.04)}
.vu-vip .k{font:700 11.5px Cairo;color:var(--muted)}
.vu-vip .v{font:800 20px Cairo;color:var(--ink);margin-top:4px}
.vu-vip .s{font:600 11.5px Cairo;color:#148A5A;margin-top:4px}

@media(max-width:980px){.vu-vip{grid-template-columns:1fr 1fr}.bk-grid{grid-template-columns:1fr}}
@media(max-width:620px){.vu-vip{grid-template-columns:1fr}}
</style>
<script>
/* الأسطول · العملاء · الحجوزات — استكمال المتطلبات مع الإبقاء على التصاميم الحالية. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const toast=msg=>{
    if(typeof window.__toast==='function'){window.__toast(msg);return;}
    if(WafraOps.demoAction){WafraOps.demoAction(msg);return;}
    const el=document.createElement('div'); el.className='toast on'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';
  const providers=['شركة الصحراء','كي رنت','مسار'];
  const branchesByProvider={
    'شركة الصحراء':['مطار الملك خالد','طريق الملك عبدالعزيز'],
    'كي رنت':['جدة الشمالية','جدة الرقمية'],
    'مسار':['الخبر التشغيلي']
  };
  const allBranches=[...new Set(Object.values(branchesByProvider).flat())];
  state.fleetServices=state.fleetServices||[
    {name:'استلام من الفرع',desc:'استلام المركبة من موقع الفرع',fee:'0',branches:184,status:'مفعلة'},
    {name:'توصيل',desc:'تسليم المركبة لموقع العميل',fee:'45',branches:112,status:'مفعلة'},
    {name:'تسليم بين المدن',desc:'استلام وتسليم في مدينتين مختلفتين',fee:'180',branches:42,status:'مفعلة'}
  ];
  state.fleetAddons=state.fleetAddons||[
    {name:'كرسي أطفال',desc:'مقعد أطفال مناسب للعمر والوزن',fee:'35',unit:'يوم',branches:156,status:'مفعلة'},
    {name:'سائق إضافي',desc:'إضافة سائق مرخّص على العقد',fee:'50',unit:'يوم',branches:142,status:'مفعلة'},
    {name:'جهاز GPS',desc:'تتبع وملاحة أثناء التأجير',fee:'25',unit:'يوم',branches:98,status:'مفعلة'},
    {name:'تأمين شامل إضافي',desc:'تغطية موسّعة فوق التأمين الأساسي',fee:'80',unit:'يوم',branches:120,status:'مفعلة'}
  ];
  state.fleetCategories=state.fleetCategories||[
    {name:'اقتصادية',desc:'استهلاك منخفض وحجم صغير',models:96,cars:1204,status:'مفعلة'},
    {name:'صغيرة',desc:'مدينة وحجم مدمج',models:72,cars:864,status:'مفعلة'},
    {name:'فاخرة',desc:'تجهيزات راقية',models:42,cars:188,status:'مفعلة'},
    {name:'عائلية',desc:'مساحة أكبر للعائلات',models:34,cars:214,status:'مفعلة'}
  ];

  const detailTabs=active=>`<div class="tabs">${['الملخص','تفاصيل الحجز','الخط الزمني','الاستلام','الإرجاع','المحادثة','الفاتورة','سجل الإجراءات'].map(t=>`<button class="tab ${active===t?'on':''}" onclick="WafraOps.bookingTab('${t}')">${t}</button>`).join('')}</div>`;

  Object.assign(WafraOps,{
    /* —— تحديث جماعي للإتاحة: الكل أو مزود واحد —— */
    bulkAvailability:()=>{
      openM(dlg('تحديث جماعي للإتاحة',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('الإجراء',`<select id="bulk-action" class="native-input"><option>تفعيل السيارات المطابقة</option><option>إيقاف السيارات المطابقة</option><option>تحديث الإتاحة إلى صفر</option></select>`)}
         <p class="note info">اختر «كل المزودين» أو مزوداً واحداً، ثم طبّق الإجراء على السيارات المطابقة.</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkAvail()">تطبيق التحديث</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    /* —— تحديث جماعي للأسعار: الكل أو مزود واحد —— */
    bulkPriceUpdate:()=>{
      openM(dlg('تحديث جماعي للأسعار',
        `${fld('النطاق',`<select id="bulk-scope" class="native-input" onchange="WafraOps.bulkScopeChange()"><option value="all">كل المزودين</option><option value="one">مزود واحد</option></select>`)}
         <div id="bulk-provider-wrap" style="display:none">${fld('المزود',`<select id="bulk-provider" class="native-input">${providers.map(p=>`<option>${p}</option>`).join('')}</select>`)}</div>
         ${fld('نسبة التعديل %',`<input id="bulk-percent" class="native-input" type="number" value="5">`)}
         ${fld('نوع التعديل',`<select id="bulk-type" class="native-input"><option>زيادة الأسعار</option><option>تخفيض الأسعار</option></select>`)}
         <p class="note info">سيُطبَّق على النطاق المحدد فقط (الكل أو مزود واحد).</p>`,
        `<button class="btn coral" onclick="WafraOps.applyBulkPrice()">تطبيق التعديل</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    bulkScopeChange:()=>{
      const wrap=document.getElementById('bulk-provider-wrap');
      if(wrap) wrap.style.display=(val('bulk-scope')==='one')?'block':'none';
    },
    applyBulkAvail:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const a=val('bulk-action')||'التحديث';
      closeM(); toast(`تم ${a} لنطاق: ${p}.`);
    },
    applyBulkPrice:()=>{
      const scope=val('bulk-scope')||'all';
      const p=scope==='all'?'كل المزودين':(val('bulk-provider')||'مزود');
      const n=val('bulk-percent')||'0';
      const t=val('bulk-type')||'تعديل';
      closeM(); toast(`تم تجهيز ${t} بنسبة ${n}% لنطاق: ${p}.`);
    },
    addFleetCategory:()=>{
      openM(dlg('إضافة فئة',
        `${fld('اسم الفئة',`<input id="cat-name" class="native-input" placeholder="مثال: دفع رباعي">`)}
         ${fld('الوصف',`<input id="cat-desc" class="native-input" placeholder="وصف مختصر">`)}`,
        `<button class="btn coral" onclick="WafraOps.saveFleetCategory()">حفظ الفئة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    saveFleetCategory:()=>{
      const name=val('cat-name'); if(!name){toast('أدخل اسم الفئة.');return;}
      state.fleetCategories.push({name,desc:val('cat-desc')||'—',models:0,cars:0,status:'مفعلة'});
      closeM(); render(); toast('تمت إضافة الفئة.');
    },
    addFleetService:()=>{
      openM(dlg('إضافة خدمة وتفعيلها على الفروع',
        `${fld('اسم الخدمة',`<input id="svc-name" class="native-input" placeholder="مثال: كرسي أطفال">`)}
         ${fld('الوصف',`<input id="svc-desc" class="native-input" placeholder="وصف الخدمة">`)}
         ${fld('الرسوم الافتراضية (ر.س)',`<input id="svc-fee" class="native-input" type="number" value="30">`)}
         ${fld('نطاق التفعيل',`<select id="svc-scope" class="native-input" onchange="WafraOps.svcScopeChange()"><option value="all">فروع كل المزودين</option><option value="providers">مزودون محددون</option><option value="branches">فروع محددة</option></select>`)}
         <div id="svc-providers-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر المزودين</div>
           ${providers.map(p=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-prov" value="${p}"> ${p}</label>`).join('')}
         </div>
         <div id="svc-branches-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر الفروع</div>
           ${allBranches.map(b=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="svc-br" value="${b}"> ${b}</label>`).join('')}
         </div>`,
        `<button class="btn coral" onclick="WafraOps.saveFleetService()">حفظ وتفعيل الخدمة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    svcScopeChange:()=>{
      const s=val('svc-scope');
      const pw=document.getElementById('svc-providers-wrap');
      const bw=document.getElementById('svc-branches-wrap');
      if(pw) pw.style.display=s==='providers'?'block':'none';
      if(bw) bw.style.display=s==='branches'?'block':'none';
    },
    saveFleetService:()=>{
      const name=val('svc-name'); if(!name){toast('أدخل اسم الخدمة.');return;}
      const scope=val('svc-scope');
      let count=0, label='';
      if(scope==='all'){count=allBranches.length;label='فروع كل المزودين';}
      else if(scope==='providers'){
        const sel=[...document.querySelectorAll('.svc-prov:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر مزوداً واحداً على الأقل.');return;}
        count=sel.reduce((n,p)=>n+(branchesByProvider[p]||[]).length,0);
        label=sel.join(' · ');
      }else{
        const sel=[...document.querySelectorAll('.svc-br:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر فرعاً واحداً على الأقل.');return;}
        count=sel.length; label=sel.join(' · ');
      }
      state.fleetServices.unshift({name,desc:val('svc-desc')||'—',fee:val('svc-fee')||'0',branches:count,status:'مفعلة'});
      closeM(); render(); toast(`تم تفعيل «${name}» على ${count} فرع (${label}).`);
    },

    /* —— الإضافات الاختيارية أثناء الحجز —— */
    addFleetAddon:()=>{
      openM(dlg('تعريف إضافة جديدة وتفعيلها',
        `${fld('اسم الإضافة',`<input id="addon-name" class="native-input" placeholder="مثال: كرسي أطفال">`)}
         ${fld('الوصف',`<input id="addon-desc" class="native-input" placeholder="وصف مختصر يظهر للعميل">`)}
         <div class="frow">${fld('الرسوم الافتراضية (ر.س)',`<input id="addon-fee" class="native-input" type="number" value="35">`)}
         ${fld('وحدة التسعير',`<select id="addon-unit" class="native-input"><option>يوم</option><option>حجز</option></select>`)}</div>
         ${fld('نطاق التفعيل',`<select id="addon-scope" class="native-input" onchange="WafraOps.addonScopeChange()"><option value="all">كل المزودين / كل الفروع</option><option value="providers">مزودين محددين</option><option value="branches">فروع محددة</option></select>`)}
         <div id="addon-providers-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر المزودين</div>
           ${providers.map(p=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="addon-prov" value="${p}"> ${p}</label>`).join('')}
         </div>
         <div id="addon-branches-wrap" style="display:none;margin-top:8px">
           <div style="font:700 12px Cairo;margin-bottom:6px">اختر الفروع</div>
           ${allBranches.map(b=>`<label style="display:block;margin:6px 0;font:600 12px Cairo"><input type="checkbox" class="addon-br" value="${b}"> ${b}</label>`).join('')}
         </div>`,
        `<button class="btn coral" onclick="WafraOps.saveFleetAddon()">حفظ وتفعيل الإضافة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },

      let count=0, label='';
      if(scope==='all'){count=allBranches.length;label='فروع كل المزودين';}
      else if(scope==='providers'){
        const sel=[...document.querySelectorAll('.addon-prov:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر مزوداً واحداً على الأقل.');return;}
        count=sel.reduce((n,p)=>n+(branchesByProvider[p]||[]).length,0);
        label=sel.join(' · ');
      }else{
        const sel=[...document.querySelectorAll('.addon-br:checked')].map(x=>x.value);
        if(!sel.length){toast('اختر فرعاً واحداً على الأقل.');return;}
        count=sel.length; label=sel.join(' · ');
      }
      state.fleetAddons=state.fleetAddons||[];
      state.fleetAddons.unshift({name,desc:val('addon-desc')||'—',fee:val('addon-fee')||'0',unit:val('addon-unit')||'يوم',branches:count,status:'مفعلة'});

        decision==='مرفوض'

      ));

      const note=val('cancel-note');

      state.cancelRequests=state.cancelRequests||[];
      const row=state.cancelRequests.find(x=>x.id===id);
      if(row){row.status=decision;row.note=note||'';}
      try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}
      closeM(); render();
      toast(decision==='معتمد'?`تم اعتماد إلغاء ${id}.`:`تم رفض طلب إلغاء ${id}.`);

      +card(`<div class="filters">${fld('الحالة',`<select id="cancel-status-filter" class="native-input" onchange="window.__cancelFilter={status:this.value||''};render()"><option value="">كل الحالات</option>${['قيد المراجعة','معتمد','مرفوض'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
        <div class="card-b">${table(['رقم الحجز','العميل','المزود','سبب الإلغاء','القيمة','الحالة','الإجراءات'],
          rows.map(r=>[r.id,r.customer,r.provider,r.reason,money(r.amount),
            pill(r.status,r.status==='معتمد'?'g':r.status==='مرفوض'?'r':'a'),cancelActs(r)]))}</div>`);
  };

  /* تسمية NAV */
  const bookNav=NAV.find(g=>g.g==='الحجوزات');
  if(bookNav){
    const stuck=bookNav.items.find(i=>i.k==='stuck');
    if(stuck) stuck.t='الحجوزات المتأخرة / المتعثرة';
  }
  if(window.TITLES){
    window.TITLES.stuck='الحجوزات المتأخرة / المتعثرة';
    window.TITLES.fleetAddons='الإضافات';
  }
  const fleetNavAddons=NAV.find(g=>g.g==='إدارة الأسطول');
  if(fleetNavAddons&&!fleetNavAddons.items.some(x=>x.k==='fleetAddons')){
    const svcIdx=fleetNavAddons.items.findIndex(x=>x.k==='fleetServices');
    const addon={k:'fleetAddons',t:'الإضافات',i:'＋'};
    if(svcIdx>=0) fleetNavAddons.items.splice(svcIdx+1,0,addon); else fleetNavAddons.items.push(addon);
  }

  /* ضمان exportLocal إن لم يُعرَّف */
  if(!WafraOps.exportLocal) WafraOps.exportLocal=(n,f)=>toast(`تم تجهيز تصدير ${n} بصيغة ${f}.`);
  if(!WafraOps.searchHint) WafraOps.searchHint=v=>v&&toast(`البحث التجريبي: ${v}`);
})();
</script>

<script>
/* التظلمات واعتراضات الرسوم — أزرار فعّالة + طلب معلومات بشاشة مستقلة. */
(function(){
  const state=window.WAFRA_DATA||(window.WAFRA_DATA={});
  const save=()=>{try{localStorage.setItem('wafra-admin-state-v2',JSON.stringify(state));}catch(e){}};
  const toast=msg=>{if(typeof window.__toast==='function')window.__toast(msg);else if(WafraOps.demoAction)WafraOps.demoAction(msg);};
  const dlg=(t,b,f)=>`<div class="modal"><div class="modal-h"><h3>${t}</h3><span class="x" onclick="closeM()">✕</span></div><div class="modal-b">${b}</div><div class="modal-f">${f||'<button class="btn ghost" onclick="closeM()">إغلاق</button>'}</div></div>`;
  const val=id=>document.getElementById(id)?.value?.trim()||'';

  state.disputesList=state.disputesList||[
    {id:'DP-441',booking:'BK-20418',customer:'أحمد الشمري',provider:'شركة الصحراء',subject:'مبلغ التأمين',amount:'1,850 ر.س',status:'مفتوح',detail:'صور التسليم توضح عدم وجود ضرر قبل بدء الحجز.',replies:[{at:'اليوم 10:20',who:'النظام',txt:'تم استلام التظلم.'},{at:'اليوم 11:05',who:'الإدارة',txt:'طُلب رد من المزود خلال 48 ساعة.'}]},
    {id:'DP-428',booking:'BK-20396',customer:'وليد الحربي',provider:'مسار',subject:'رسوم تأخير',amount:'240 ر.س',status:'معلق',detail:'يطلب العميل مراجعة وقت الإرجاع المثبت في النظام.',replies:[{at:'أمس 16:40',who:'العميل',txt:'أُرجعت السيارة في الموعد حسب التطبيق.'}]}
  ];
  state.objections=state.objections||[
    {id:'OB-118',booking:'BK-20418',customer:'أحمد الشمري',provider:'شركة الصحراء',amount:'1,850 ر.س',reason:'رسوم تأمين',status:'مفتوحة',detail:'يعترض العميل على خصم مبلغ التأمين رغم عدم وجود أضرار موثّقة.'},
    {id:'OB-112',booking:'BK-20396',customer:'وليد الحربي',provider:'مسار',amount:'240 ر.س',reason:'رسوم تأخير',status:'بانتظار قرار',detail:'يطلب مراجعة وقت الإرجاع المسجّل في النظام.'},
    {id:'OB-104',booking:'BK-20371',customer:'سلمان العنزي',provider:'كي رنت',amount:'110 ر.س',reason:'رسوم تنظيف',status:'مغلقة',detail:'أُغلق بعد تقديم صور التسليم من المزود.'}
  ];

  Object.assign(WafraOps,{
    openDispute:id=>{
      const d=state.disputesList.find(x=>x.id===id); if(!d) return;
      openM(dlg(`تفاصيل التظلم ${d.id}`,
        `<div class="dl-grid">
          <div class="it"><div class="k">رقم الحجز</div><div class="v">${d.booking}</div></div>
          <div class="it"><div class="k">العميل</div><div class="v">${d.customer}</div></div>
          <div class="it"><div class="k">المزود</div><div class="v">${d.provider}</div></div>
          <div class="it"><div class="k">الموضوع</div><div class="v">${d.subject}</div></div>
          <div class="it"><div class="k">القيمة محل الاعتراض</div><div class="v">${d.amount}</div></div>
          <div class="it"><div class="k">الحالة</div><div class="v">${d.status}</div></div>
        </div>
        <h4 style="margin:14px 0 8px">تفاصيل التظلم</h4><p>${d.detail}</p>`,
        `<button class="btn ghost" onclick="closeM();WafraOps.openBooking('${d.booking}')">فتح الحجز</button>
         <button class="btn ghost" onclick="closeM();WafraOps.showDisputeReplies('${d.id}')">عرض الردود</button>
         <button class="btn coral" onclick="closeM();WafraOps.requestDisputeReply('${d.id}')">طلب رد</button>`
      ));
    },
    showDisputeReplies:id=>{
      const d=state.disputesList.find(x=>x.id===id); if(!d) return;
      const rows=(d.replies||[]).map(r=>[r.at,r.who,r.txt]);
      openM(dlg(`سجل الردود — ${id}`,
        rows.length?table(['الوقت','الطرف','المحتوى'],rows):`<p class="note info">لا توجد ردود مسجّلة بعد.</p>`,
        `<button class="btn coral" onclick="closeM();WafraOps.requestDisputeReply('${id}')">طلب رد جديد</button><button class="btn ghost" onclick="closeM()">إغلاق</button>`
      ));
    },
    requestDisputeReply:id=>{
      openM(dlg(`طلب رد — ${id}`,
        `${fld('الطرف المطلوب',`<select id="dsp-reply-party" class="native-input"><option>المزود</option><option>العميل</option><option>كلا الطرفين</option></select>`)}
         ${fld('المهلة',`<select id="dsp-reply-sla" class="native-input"><option>24 ساعة</option><option selected>48 ساعة</option><option>72 ساعة</option></select>`)}
         ${fld('المطلوب في الرد',`<textarea id="dsp-reply-msg" class="native-input" rows="3" placeholder="مثال: أرفق صور التسليم ووقت الإرجاع المسجّل…"></textarea>`)}`,
        `<button class="btn coral" onclick="WafraOps.sendDisputeReplyRequest('${id}')">إرسال الطلب</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`
      ));
    },
    sendDisputeReplyRequest:id=>{
      const msg=val('dsp-reply-msg');
      if(!msg){toast('اكتب المطلوب في الرد أولاً.');return;}
      const d=state.disputesList.find(x=>x.id===id);
      if(d){
        d.replies=d.replies||[];
        d.replies.push({at:'الآن',who:'الإدارة',txt:`طلب رد (${val('dsp-reply-party')} · ${val('dsp-reply-sla')}): ${msg}`});
        if(d.status==='مفتوح') d.status='معلق';
        save();
      }
      closeM(); render(); toast(`تم إرسال طلب الرد لـ ${id}.`);
    },

    openObjection:id=>{
      const a=(state.objections||[]).find(x=>x.id===id); if(!a) return;
      if(!a.detail){
        a.detail=({
          'OB-118':'يعترض العميل على خصم مبلغ التأمين رغم عدم وجود أضرار موثّقة.',
          'OB-112':'يطلب مراجعة وقت الإرجاع المسجّل في النظام.',
          'OB-104':'أُغلق بعد تقديم صور التسليم من المزود.'
        })[a.id]||`اعتراض على ${a.reason} بمبلغ ${a.amount}.`;
      }
      const closed=a.status==='مغلقة';
      openM(dlg(`استعراض الاعتراض ${a.id}`,
        `<div class="dl-grid">
          <div class="it"><div class="k">الحجز</div><div class="v">${a.booking}</div></div>
          <div class="it"><div class="k">العميل</div><div class="v">${a.customer}</div></div>
          <div class="it"><div class="k">المزود</div><div class="v">${a.provider}</div></div>
          <div class="it"><div class="k">المبلغ</div><div class="v">${a.amount}</div></div>
          <div class="it"><div class="k">السبب</div><div class="v">${a.reason}</div></div>
          <div class="it"><div class="k">الحالة</div><div class="v">${a.status}</div></div>
        </div>
        <h4 style="margin:14px 0 8px">تفاصيل الاعتراض</h4>
        <p>${a.detail}</p>
        ${a.infoRequest?`<div class="note info" style="margin-top:12px"><b>طلب معلومات سابق:</b> ${a.infoRequest}</div>`:''}
        ${a.note?`<div class="note" style="margin-top:8px"><b>ملاحظة القرار:</b> ${a.note}</div>`:''}`,
        closed
          ?`<button class="btn ghost" onclick="closeM()">إغلاق</button><button class="btn ghost" onclick="closeM();WafraOps.openBooking('${a.booking}')">فتح الحجز</button>`
          :`<button class="btn ghost" onclick="closeM();WafraOps.openBooking('${a.booking}')">فتح الحجز</button>
            <button class="btn ghost" onclick="WafraOps.requestObjectionInfo('${a.id}')">طلب معلومات</button>
            <button class="btn coral" onclick="WafraOps.resolveObjectionForm('${a.id}')">قبول وإغلاق</button>`
      ));
    },
    requestObjectionInfo:id=>{
      const a=(state.objections||[]).find(x=>x.id===id); if(!a) return;
      openM(dlg(`طلب معلومات — ${id}`,
        `<p class="sub" style="margin:0 0 12px">حدد المعلومات المطلوبة من العميل أو المزود لمتابعة الاعتراض.</p>
         ${fld('المطلوب منه',`<select id="obj-info-from" class="native-input"><option>العميل</option><option>المزود</option><option>كلا الطرفين</option></select>`)}
         ${fld('نوع المعلومات',`<select id="obj-info-type" class="native-input"><option>صور / مرفقات</option><option>توضيح كتابي</option><option>إثبات وقت / موقع</option><option>فاتورة أو إيصال</option><option>أخرى</option></select>`)}
         ${fld('ما هي المعلومات المطلوبة؟',`<textarea id="obj-info-detail" class="native-input" rows="4" placeholder="اكتب بوضوح ما المطلوب إرفاقه أو توضيحه…"></textarea>`)}
         ${fld('المهلة',`<select id="obj-info-sla" class="native-input"><option>24 ساعة</option><option selected>48 ساعة</option><option>72 ساعة</option></select>`)}`,
        `<button class="btn coral" onclick="WafraOps.saveObjectionInfoRequest('${id}')">إرسال طلب المعلومات</button><button class="btn ghost" onclick="closeM();WafraOps.openObjection('${id}')">رجوع</button>`
      ));
    },
    saveObjectionInfoRequest:id=>{
      const detail=val('obj-info-detail');
      if(!detail){toast('اكتب المعلومات المطلوبة أولاً.');return;}
      const a=state.objections.find(x=>x.id===id); if(!a) return;
      a.infoRequest=`من ${val('obj-info-from')} · ${val('obj-info-type')} · مهلة ${val('obj-info-sla')}: ${detail}`;
      a.status='بانتظار قرار';
      save(); closeM(); render();
      toast(`تم إرسال طلب المعلومات لـ ${id}.`);
    },
    resolveObjectionForm:id=>{
      const a=(state.objections||[]).find(x=>x.id===id); if(!a) return;
      openM(dlg(`قبول وإغلاق — ${id}`,
        `${fld('ملخص القرار',`<textarea id="obj-resolve-note" class="native-input" rows="3" placeholder="اكتب قرار الإغلاق والسبب للعميل والمزود"></textarea>`)}
         ${fld('الاسترداد',`<select id="obj-resolve-refund" class="native-input"><option>بدون استرداد</option><option>استرداد جزئي</option><option>استرداد كامل</option></select>`)}`,
        `<button class="btn coral" onclick="WafraOps.resolveObjection('${id}','مغلقة')">تأكيد الإغلاق</button><button class="btn ghost" onclick="closeM();WafraOps.openObjection('${id}')">رجوع</button>`
      ));
    },
    resolveObjection:(id,status)=>{
      const a=state.objections.find(x=>x.id===id); if(!a) return;
      const note=val('obj-resolve-note')||document.getElementById('objection-note-local')?.value?.trim()||'';
      if(status==='مغلقة'&&!note){toast('اكتب ملخص القرار أولاً.');return;}
      a.status=status;
      a.note=note+(val('obj-resolve-refund')?` · ${val('obj-resolve-refund')}`:'');
      save(); closeM(); render(); toast('تم تحديث حالة الاعتراض.');
    }
  });

  const disputeActs=d=>{
    const view=`<button class="btn ghost sm" onclick="WafraOps.openDispute('${d.id}')">إطلاع</button>`;
    if(d.status==='مغلق') return `${view}<button class="btn ghost sm" onclick="WafraOps.showDisputeReplies('${d.id}')">عرض الردود</button>`;
    if(d.status==='معلق') return `${view}<button class="btn ghost sm" onclick="WafraOps.requestDisputeReply('${d.id}')">طلب رد</button>`;
    return `${view}<button class="btn ghost sm" onclick="WafraOps.showDisputeReplies('${d.id}')">عرض الردود</button>`;
  };

  S.disputes=()=>{
    const f=window.__disputeFilter||{};
    const rows=state.disputesList.filter(d=>!f.status||d.status===f.status);
    return phead('قائمة التظلمات','البحث برقم الحجز أو المزود أو رقم العميل مع ردود التظلم',[],
      `<button class="btn ghost sm" onclick="WafraOps.exportLocal&&WafraOps.exportLocal('قائمة التظلمات','Excel')">Excel ⤓</button>
       <button class="btn ghost sm" onclick="WafraOps.exportLocal&&WafraOps.exportLocal('قائمة التظلمات','PDF')">PDF ⤓</button>`)
      +card(`<div class="filters">${fld('الحالة',`<select class="native-input" onchange="window.__disputeFilter={status:this.value||''};render()"><option value="">كل الحالات</option>${['مفتوح','معلق','مغلق'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>`)}<label class="fsearch">⌕ <input placeholder="اكتب للبحث…"></label></div>
        <div class="card-b">${table(['رقم التظلم','رقم الحجز','العميل','المزود','الموضوع','الحالة','الإجراءات'],
          rows.map(d=>[d.id,d.booking,d.customer,d.provider,d.subject,pill(d.status,d.status==='مفتوح'?'r':d.status==='معلق'?'a':'n'),disputeActs(d)]))}</div>`);
  };

  S.objections=()=>{
    const active=window.__objectionsTab||'الكل';
    const items=state.objections.filter(x=>active==='الكل'||x.status===active);
    const tone=s=>s==='مغلقة'?'g':s==='بانتظار قرار'?'a':'r';
    return phead('اعتراضات الرسوم والغرامات','مراجعة الاعتراضات وقراراتها — طلب المعلومات يظهر شاشة مستقلة',[],
      `<button class="btn ghost" onclick="WafraOps.exportCurrent&&WafraOps.exportCurrent('اعتراضات-الرسوم','Excel')">Excel ⤓</button>`)
      +card(`<div class="tabs">${['الكل','مفتوحة','بانتظار قرار','مغلقة'].map(x=>`<button class="tab ${active===x?'on':''}" onclick="WafraOps.objectionsTab('${x}')">${x}</button>`).join('')}</div>
        <div class="filters"><label class="fsearch">⌕ <input placeholder="ابحث برقم الاعتراض أو الحجز"></label></div>
        <div class="card-b">${table(['الاعتراض','الحجز','العميل','المزود','المبلغ','السبب','الحالة','الإجراء'],
          items.map(x=>[x.id,x.booking,x.customer,x.provider,x.amount,x.reason,pill(x.status,tone(x.status)),
            `<button class="btn ghost sm" onclick="WafraOps.openObjection('${x.id}')">استعراض</button>`]))}</div>`);
  };

  if(!WafraOps.objectionsTab) WafraOps.objectionsTab=t=>{window.__objectionsTab=t;render();};
})();
</script>

.fi-card .ic.b{background:#EAF0FF;color:#2C68D8}

.fi-card .ic.t{background:#E7F7F5;color:#1AA6A6}
.fi-card .ic.p{background:#F3EEFF;color:#6B5CE7}
.fin-date-range{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

.st-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}

.st-kpi:before{content:'';position:absolute;inset-inline-end:0;top:0;bottom:0;width:4px;background:var(--navy)}
.st-kpi.g:before{background:#20A16E}.st-kpi.r:before{background:var(--coral)}.st-kpi.a:before{background:#E8A23A}.st-kpi.b:before{background:#2C68D8}

.st-kpi .v{font:800 22px Cairo;color:var(--ink);direction:ltr;text-align:right;line-height:1.2}

.st-sec{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}

.st-status{display:inline-flex;align-items:center;gap:7px;font:700 12px Cairo;color:var(--ink-2);white-space:nowrap;background:#F5F7FB;border:1px solid #E6EAF3;border-radius:99px;padding:5px 12px;max-width:none}

.st-status-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}

          <div class="it"><div class="k">السبب</div><div class="v">${f.reason}</div></div>
        </div>
      `,`<button class="btn ghost" onclick="closeM()">إغلاق</button>${f.status==='مستحقة'?`<button class="btn st-approve" onclick="closeM();WafraOps.collectFine('${f.id}')">تحصيل</button><button class="btn danger" onclick="closeM();WafraOps.waiveFine('${f.id}')">إعفاء</button>`:''}`));
    },
    collectFine:id=>{
      payStore=loadStore();
      const f=(payStore.fines||[]).find(x=>x.id===id); if(!f||f.status!=='مستحقة') return;
      f.status='محصّلة'; f.statusCls='ok';
      saveStore(payStore); toast(`تم تحصيل الغرامة ${id}.`); render();
    },
    waiveFine:id=>{
      payStore=loadStore();
      const f=(payStore.fines||[]).find(x=>x.id===id); if(!f||f.status!=='مستحقة') return;
      f.status='معفاة'; f.statusCls='done';
      saveStore(payStore); toast(`تم إعفاء الغرامة ${id}.`); render();
    },
    openCreateSettlement:()=>{
      const now=new Date();
      const curY=now.getFullYear();
      const curM=now.getMonth()+1;
      const months=[[1,'يناير'],[2,'فبراير'],[3,'مارس'],[4,'أبريل'],[5,'مايو'],[6,'يونيو'],[7,'يوليو'],[8,'أغسطس'],[9,'سبتمبر'],[10,'أكتوبر'],[11,'نوفمبر'],[12,'ديسمبر']];
      const years=[curY-1,curY,curY+1];
      openM(modal('إنشاء دورة تسوية جديدة',`
        ${fld('السنة',`<select id="set-year" class="native-input">${years.map(y=>`<option value="${y}" ${y===curY?'selected':''}>${y}</option>`).join('')}</select>`)}
        ${fld('شهر دورة الفوترة',`<select id="set-month" class="native-input">${months.map(([v,l])=>`<option value="${v}" ${v===curM?'selected':''}>${l}</option>`).join('')}</select>`)}
        ${note('info','دورة شهرية','سيتم إنشاء مسودة تسوية للفترة المحددة. إن وُجدت دورة بنفس الشهر فلن يُسمح بالتكرار.')}
      `,`<button class="btn ghost" onclick="closeM()">إلغاء</button><button class="btn coral" onclick="WafraOps.saveSettlement()">إنشاء الدورة</button>`));
    },
    saveSettlement:()=>{
      payStore=loadStore();
      const year=Number(document.getElementById('set-year')?.value);
      const month=Number(document.getElementById('set-month')?.value);
      if(!year||!month){toast('اختر السنة والشهر.');return;}
      const p=n=>String(n).padStart(2,'0');
      const id=`SET-${year}-${p(month)}`;
      if(payStore.settlements.some(x=>x.id===id)){
        toast(`دورة التسوية ${id} موجودة مسبقاً.`);
        return;
      }
      const last=new Date(year,month,0).getDate();
      const row={
        id,
        from:`01/${p(month)}/${year}`,
        to:`${p(last)}/${p(month)}/${year}`,
        n:0,sales:'0.00',pay:'0.00',plat:'0.00',disc:'0.00',net:'0.00',
        status:'مسودة قيد المراجعة',statusCls:'wait',approved:'—',approve:true
      };
      payStore.settlements=[row,...payStore.settlements];
      saveStore(payStore);
      closeM();
      toast(`تم إنشاء دورة التسوية ${id}.`);
      location.hash='settlements';
      render();
    },
    openCreateDispute:()=>{
      openM(modal('إنشاء طلب تعويض جديد',`
        ${fld('رقم الحجز المرتبط',`<input id="dsp-booking" class="native-input" placeholder="مثال: 8821">`)}
        ${fld('الفرع / المكتب',`<select id="dsp-branch" class="native-input"><option value="">اختر الفرع...</option><option>فرع الرياض - العليا</option><option>فرع جدة - التحلية</option><option>فرع مكة المركزي</option><option>فرع الخبر التشغيلي</option></select>`)}
        ${fld('اسم العميل',`<input id="dsp-customer" class="native-input" placeholder="مثال: أحمد محمد">`)}
        ${fld('اسم الشركة',`<select id="dsp-company" class="native-input"><option>شركة الصحراء</option><option>كي رنت</option><option>مسار</option><option>الوسام كار</option></select>`)}
        ${fld('سبب الخصم / التعويض',`<select id="dsp-reason" class="native-input"><option value="">اختر السبب...</option><option>عدم نظافة السيارة</option><option>تأخير تسليم المفتاح</option><option>سلوك غير لائق</option><option>إلغاء متأخر</option><option>أخرى</option></select>`)}
        ${fld('نوع التعويض',`<select id="dsp-type" class="native-input"><option>خصم من إجمالي الحجز</option><option>كوبون تعويضي</option></select>`)}
        ${fld('المبلغ (ريال)',`<input id="dsp-amount" class="native-input" type="number" min="1" step="0.01" placeholder="100">`)}
        ${fld('الطرف المتحمل',`<select id="dsp-liable" class="native-input"><option>المزود</option><option>المنصة</option></select>`)}
        ${fld('مهلة الرد (ساعات)',`<input id="dsp-sla" class="native-input" type="number" value="36" min="1">`)}
        ${fld('ملاحظات / رفع مرفقات',`<textarea id="dsp-notes" class="native-input" rows="3" placeholder="أضف ملاحظات أو وصف المرفقات"></textarea>`)}
      `,`<button class="btn ghost" onclick="closeM()">إلغاء</button><button class="btn coral" onclick="WafraOps.saveDispute()">حفظ الطلب</button>`));
    },
    saveDispute:()=>{
      payStore=loadStore();
      const booking=(document.getElementById('dsp-booking')?.value||'').trim();
      const branch=document.getElementById('dsp-branch')?.value||'';
      const customer=(document.getElementById('dsp-customer')?.value||'').trim();
      const company=document.getElementById('dsp-company')?.value||'';
      const reason=document.getElementById('dsp-reason')?.value||'';
      const compType=document.getElementById('dsp-type')?.value||'خصم من إجمالي الحجز';
      const amount=(document.getElementById('dsp-amount')?.value||'').trim();
      const liable=document.getElementById('dsp-liable')?.value||'المزود';
      const sla=Number(document.getElementById('dsp-sla')?.value||36);
      const notes=(document.getElementById('dsp-notes')?.value||'').trim();
      if(!booking||!branch||!customer||!reason||!amount){toast('أكمل الحقول الأساسية أولاً.');return;}
      const n=(payStore.disputes||[]).reduce((m,d)=>Math.max(m,Number(String(d.id).replace(/\D/g,''))||0),1094)+1;
      const row={
        id:`DSP-${n}`,booking,company,branch,region:branch.includes('جدة')?'جدة':branch.includes('مكة')?'مكة':branch.includes('خبر')?'الخبر':'الرياض',
        customer,created:nowStr(),reason,compType,amount:Number(amount).toFixed(2),liable,slaHours:sla,slaLeft:sla,
        status:'بانتظار رد المزود',actionAt:nowStr(),attachments:notes||'—'
      };
      payStore.disputes=[row,...(payStore.disputes||[])];
      saveStore(payStore);
      closeM();
      toast(`تم إنشاء طلب التعويض ${row.id}.`);
      location.hash='compDisputes';
      render();
    },
    previewDispute:id=>{
      payStore=loadStore();
      const d=(payStore.disputes||[]).find(x=>x.id===id); if(!d) return;
      openM(modal(`تفاصيل النزاع ${d.id}`,`
        <div class="dsp-detail-grid">
          <div class="dsp-box"><div class="k">رقم النزاع</div><div class="v">${d.id}</div></div>
          <div class="dsp-box"><div class="k">رقم الحجز</div><div class="v">#${d.booking}</div></div>
          <div class="dsp-box"><div class="k">الفرع / المكتب</div><div class="v">${d.branch}</div></div>
          <div class="dsp-box"><div class="k">المنطقة</div><div class="v">${d.region}</div></div>
          <div class="dsp-box"><div class="k">العميل</div><div class="v">${d.customer}</div></div>
          <div class="dsp-box"><div class="k">تاريخ الإنشاء</div><div class="v">${d.created}</div></div>
          <div class="dsp-box"><div class="k">السبب</div><div class="v">${d.reason}</div></div>
          <div class="dsp-box"><div class="k">نوع التعويض</div><div class="v">${d.compType}</div></div>
          <div class="dsp-box"><div class="k">المبلغ</div><div class="v">${d.amount} ريال</div></div>
          <div class="dsp-box"><div class="k">الطرف المتحمل</div><div class="v">${d.liable}</div></div>
          <div class="dsp-box"><div class="k">الشركة</div><div class="v">${d.company}</div></div>
          <div class="dsp-box"><div class="k">الحالة</div><div class="v">${dspStatusPill(d.status)}</div></div>
        </div>
        <div class="dsp-attach">📎 المرفقات: ${d.attachments||'—'}</div>
      `,`<button class="btn ghost" onclick="closeM()">إغلاق</button>${d.status==='تم الاعتراض'?`<button class="btn coral" onclick="closeM();WafraOps.resolveDispute('${d.id}')">حسم النزاع</button>`:''}`));
    },
    acceptDispute:id=>{
      payStore=loadStore();
      const d=(payStore.disputes||[]).find(x=>x.id===id); if(!d) return;
      d.status='تم القبول'; d.actionAt=nowStr(); d.slaLeft=0;
      saveStore(payStore); toast(`تم قبول النزاع ${id}.`); render();
    },
    objectDispute:id=>{
      payStore=loadStore();
      const d=(payStore.disputes||[]).find(x=>x.id===id); if(!d) return;
      d.status='تم الاعتراض'; d.actionAt=nowStr();
      saveStore(payStore); toast(`تم تسجيل اعتراض على ${id}.`); render();
    },
    resolveDispute:id=>{
      payStore=loadStore();
      const d=(payStore.disputes||[]).find(x=>x.id===id); if(!d) return;
      openM(modal(`حسم النزاع ${d.id}`,`
        ${note('warn','المزود اعترض على هذا النزاع','قم بمراجعة الأدلة واتخاذ القرار النهائي: قبول الاعتراض يلغي الخصم، ورفضه يثبّت الخصم.')}
        <div class="dl-grid" style="margin-top:12px">
          <div class="it"><div class="k">المبلغ</div><div class="v">${d.amount} ر.س</div></div>
          <div class="it"><div class="k">الطرف المتحمل</div><div class="v">${d.liable}</div></div>
          <div class="it"><div class="k">السبب</div><div class="v">${d.reason}</div></div>
          <div class="it"><div class="k">الحجز</div><div class="v">#${d.booking}</div></div>
        </div>
      `,`<button class="btn ghost" onclick="closeM()">إلغاء</button>
         <button class="btn st-approve" onclick="WafraOps.finalizeDispute('${id}','accept')">✓ قبول الاعتراض (إلغاء الخصم)</button>
         <button class="btn danger" onclick="WafraOps.finalizeDispute('${id}','reject')">✕ رفض الاعتراض (تثبيت الخصم)</button>`));
    },
    finalizeDispute:(id,decision)=>{
      payStore=loadStore();
      const d=(payStore.disputes||[]).find(x=>x.id===id); if(!d) return;
      /* قبول الاعتراض = إلغاء الخصم · رفض الاعتراض = تثبيت الخصم */
      d.status=decision==='accept'?'مغلق آلياً':'تم القبول';
      d.actionAt=nowStr(); d.slaLeft=0;
      saveStore(payStore); closeM();
      toast(decision==='accept'
        ? `تم قبول اعتراض ${id} وإلغاء الخصم.`
        : `تم رفض اعتراض ${id} وتثبيت الخصم.`);
      render();
    },
    approveSettlementRow:id=>{
      payStore=loadStore();
      const row=payStore.settlements.find(x=>x.id===id);
      if(!row||!row.approve){toast('هذه التسوية معتمدة مسبقاً أو غير قابلة للاعتماد.');return;}
      const invId=id.replace(/^SET-/,'INV-');
      if(payStore.invoices.some(x=>x.setId===id||x.id===invId)){
        toast(`المطالبة ${invId} موجودة مسبقاً في متابعة الفواتير.`);
        location.hash='invoices';
        return;
      }
      const issued=todayStr();
      row.status='معتمدة وقيد التحويل';
      row.statusCls='ok';
      row.approved=issued;
      row.approve=false;
      payStore.invoices.unshift({
        id:invId,setId:id,from:row.from,to:row.to,amount:row.net,
        issued,transferred:'—',bankRef:'—',
        status:'قيد التحويل البنكي',statusCls:'wait'
      });
      saveStore(payStore);
      toast(`تم اعتماد ${id} وإصدار المطالبة الرسمية ${invId}.`);
      location.hash='invoices';
    },
    previewInvoice:id=>{
      payStore=loadStore();
      const inv=payStore.invoices.find(x=>x.id===id);
      if(!inv) return;
      openM(modal(`معاينة المطالبة ${inv.id}`,`
        <div class="dl-grid">
          <div class="it"><div class="k">رقم المطالبة الرسمية</div><div class="v">${inv.id}</div></div>
          <div class="it"><div class="k">رقم التسوية المرجعي</div><div class="v">${inv.setId}</div></div>
          <div class="it"><div class="k">فترة الفوترة</div><div class="v">${inv.from} — ${inv.to}</div></div>
          <div class="it"><div class="k">المبلغ الإجمالي المفوتر</div><div class="v">${inv.amount} ر.س</div></div>
          <div class="it"><div class="k">تاريخ الإصدار</div><div class="v">${inv.issued}</div></div>
          <div class="it"><div class="k">حالة السداد</div><div class="v">${stStatus(inv.status,inv.statusCls)}</div></div>
          <div class="it"><div class="k">المرجع البنكي</div><div class="v">${inv.bankRef||'—'}</div></div>
          <div class="it"><div class="k">تاريخ التحويل</div><div class="v">${inv.transferred||'—'}</div></div>
        </div>
        ${note('info','مطالبة رسمية نهائية','هذه هي المطالبة المالية الرسمية الصادرة بعد اعتماد التسوية.')}
      `,`<button class="btn ghost" onclick="closeM()">إغلاق</button><button class="btn coral" onclick="WafraOps.downloadInvoicePdf('${inv.id}')">تحميل PDF</button>`));
    },
    downloadInvoicePdf:id=>toast(`تم تجهيز النسخة المعتمدة والمختومة من المطالبة ${id} بصيغة PDF.`),
    confirmBankTransfer:id=>{
      payStore=loadStore();
      const inv=payStore.invoices.find(x=>x.id===id);
      if(!inv) return;
      openM(modal(`تأكيد التحويل البنكي — ${inv.id}`,`
        <p class="sub" style="margin:0 0 12px">أرفق رقم المرجع البنكي (Ref ID) وإيصال التحويل. بعد الحفظ تصبح الحالة: تم التحويل بنجاح.</p>
        ${fld('المرجع البنكي / رقم الإيصال',`<input id="inv-bank-ref" class="native-input" placeholder="مثال: SA-99887766" value="${inv.bankRef!=='—'?inv.bankRef:''}">`)}
        ${fld('تاريخ التحويل الفعلي',`<input id="inv-transfer-date" class="native-input" type="date" value="${todayStr()}">`)}
        ${fld('إيصال التحويل',`<input id="inv-receipt" class="native-input" type="file" accept=".pdf,.png,.jpg,.jpeg">`)}
      `,`<button class="btn ghost" onclick="closeM()">إلغاء</button>
         <button class="btn coral" onclick="WafraOps.saveBankTransfer('${id}')">تأكيد التحويل</button>`));
    },
    saveBankTransfer:id=>{
      payStore=loadStore();
      const inv=payStore.invoices.find(x=>x.id===id);
      if(!inv) return;
      const ref=(document.getElementById('inv-bank-ref')?.value||'').trim();
      const dt=document.getElementById('inv-transfer-date')?.value||todayStr();
      if(!ref){toast('أدخل المرجع البنكي أولاً.');return;}
      inv.bankRef=ref;
      inv.transferred=dt;
      inv.status='تم التحويل بنجاح';
      inv.statusCls='ok';
      const setRow=payStore.settlements.find(x=>x.id===inv.setId);
      if(setRow){setRow.status='تم التحويل';setRow.statusCls='done';}
      saveStore(payStore);
      closeM();
      toast(`تم تأكيد التحويل البنكي للمطالبة ${id}.`);
      render();
    }
  });

  S.settlements=()=>{
    window.__payTab='settlements';
    payStore=loadStore();
    return payShell('settlements',settlementsBody());
  };
  S.invoices=()=>{
    window.__payTab='invoices';
    payStore=loadStore();
    return payShell('invoices',invoicesBody());
  };
  S.compDisputes=()=>{
    window.__payTab='disputes';
    payStore=loadStore();
    return payShell('disputes',disputesBody());
  };
  S.fines=()=>{
    window.__payTab='fines';
    payStore=loadStore();
    return payShell('fines',finesBody());
  };

  /* تحديث تسمية القائمة */
  const finNav=NAV.find(g=>g.g==='المالية');
  if(finNav){
    const inv=finNav.items.find(i=>i.k==='invoices');
    if(inv) inv.t='متابعة الفواتير';
    if(!finNav.items.some(i=>i.k==='compDisputes')){
      const i=finNav.items.findIndex(x=>x.k==='settlements');
      finNav.items.splice(i>=0?i:3,0,{k:'compDisputes',t:'المنازعات والتعويضات',i:'⚖',n:2});
    }
  }
  if(window.TITLES){
    window.TITLES.invoices='متابعة الفواتير';
    window.TITLES.compDisputes='المنازعات والتعويضات';
    window.TITLES.fines='الغرامات';
  }

})();
</script>

.rbac-mod-grid{display:flex;flex-wrap:wrap;gap:8px}
.rbac-tg{width:40px;height:22px;border-radius:99px;background:#D8DEE9;position:relative;flex:0 0 40px;border:0;cursor:pointer;padding:0;transition:background .15s}
.rbac-tg::after{content:'';position:absolute;top:2.5px;inset-inline-end:2.5px;width:17px;height:17px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.rbac-tg.on::after{inset-inline-end:auto;inset-inline-start:2.5px}
