<script>
/* مصفوفة RBAC — الأدوار والصلاحيات حسب التصميم */
(function(){
  const KEY='wafra-rbac-matrix-v1';
  const SPECIAL=[
    {id:'financeView',label:'عرض البيانات المالية'},
    {id:'usersManage',label:'إدارة المستخدمين'},
    {id:'export',label:'تصدير البيانات'},
    {id:'editGeneral',label:'تعديل عام'},
    {id:'editProvider',label:'تعديل المزود ومكاتبه'},
    {id:'editTenant',label:'تعديل المستأجر وحجوزاته'},
    {id:'adsEdit',label:'إنشاء / تعديل الإعلانات'},
    {id:'contentApprove',label:'قبول / رفض المحتوى'},
    {id:'slotUpgrade',label:'ترقية الظهور الكامل'}
  ];
  const MODULE_GROUPS=[
    {id:'home',title:'الرئيسية',items:['مركز القيادة','شاشة العمليات NOC','لوحة التحكم','البحث والتحليل','مركز الإشعارات','الرسائل']},
    {id:'providers',title:'المزودون',items:['قائمة المزودين','طابور الاعتماد','معالج تهيئة مزود','معالج تهيئة الفروع','أداء المزودين المقارن']},
    {id:'fleet',title:'الأسطول',items:['الفروع','السيارات','مراقبة الجودة','الماركات والموديلات','طلبات إضافة موديل']},
    {id:'users',title:'المستخدمون',items:['كل الحسابات','إدارة المستأجرين','معالج تهيئة مستأجر','طلبات الحذف','حسابات مشبوهة']},
    {id:'bookings',title:'الحجوزات',items:['كل الحجوزات','طلبات التمديد','الحجوزات المتعثّرة']},
    {id:'disputes',title:'التظلمات',items:['قائمة التظلمات']},
    {id:'finance',title:'المالية',items:['النظرة المالية','سجل المعاملات','معاملات فاشلة','تسويات المزودين','الاستردادات','الفواتير','مطابقة بوابة الدفع','نسب العمولات']},
    {id:'wallet',title:'التأمين والمحفظة',items:['التأمين والمطالبات','المحفظة والودائع']},
    {id:'marketing',title:'التسويق',items:['الكوبونات','الحملات','البنرات والتسويق','إعلانات المزودين']},
    {id:'notify',title:'الإشعارات',items:['إرسال إشعار','سجل الإشعارات','القوالب']},
    {id:'support',title:'الدعم',items:['التذاكر','الشات بوت','مركز المساعدة']},
    {id:'reports',title:'التقارير',items:['مركز التقارير','منشئ التقارير']},
    {id:'analytics',title:'التحليلات',items:['المقارنات','التحليل العميق','المؤشرات التشغيلية','الخريطة التفاعلية','النقل بين الفروع','خدمة التوصيل','التقارير المجدولة','تحليل الأفواج LTV/CAC']},
    {id:'leasePlat',title:'منصة التأجير',items:['خريطة العرض/الطلب','جاهزية الأسطول','التسعير الديناميكي','دورة حياة الحجز','ولاء وتصنيف العملاء','شرائح العمولات','استغلال الأسطول','المخالفات والودائع','التنبؤ بالطلب']},
    {id:'mktPlat',title:'منصة التسويق',items:['إسناد التحويلات ROAS','حوكمة الكوبونات','اختبار A/B','تجربة الجمهور','أداء الشراكات المؤثرة','رحلة العميل والاحتفاظ','منشئ الشرائح']},
    {id:'risk',title:'المخاطر والأتمتة',items:['رادار المخاطر','مسارات الأتمتة','مراقبة مستوى الخدمة','كشف الاحتيال','صحة بوابة الدفع','سجل التقارير']},
    {id:'system',title:'النظام',items:['مركز التكاملات','صلاحيات الحقول','الإعدادات التشغيلية','البيانات المرجعية','المحتوى والشروط','الإداريون والصلاحيات','سجل التدقيق','شاشة الدخول','الوثائق الحساسة']}
  ];
  const ROLES=[
    {id:'super',name:'مدير النظام (Super Admin)',desc:'وصول كامل لكل البيانات والوحدات وصلاحيات التعديل والاعتماد.',scope:'كل البيانات',scopeOpts:['كل البيانات'],preset:'all'},
    {id:'finance',name:'المدير المالي',desc:'تحليلات وتقارير مالية شاملة دون إدارة أو تعديل.',scope:'كل البيانات',scopeOpts:['كل البيانات'],preset:'finance'},
    {id:'ops',name:'مدير العمليات',desc:'التشغيل والأسطول + تعديل بيانات المزودين والمستأجرين — المالية مخفية.',scope:'كل البيانات',scopeOpts:['كل البيانات'],preset:'ops'},
    {id:'regional',name:'مدير إقليمي — الرياض',desc:'مقيّد ببيانات الرياض — يعدّل ملفات المستأجرين وحجوزاتهم.',scope:'مدينة: الرياض',scopeOpts:['مدينة: الرياض','مدينة: جدة','مدينة: الدمام'],preset:'regional'},
    {id:'company',name:'مدير شركة (مزود)',desc:'يدير شركته ومكاتبه وإعلاناته فقط — التعديل خاضع للاعتماد.',scope:'شركة محددة',scopeOpts:['شركة محددة'],preset:'company'},
    {id:'content',name:'مدير المحتوى والتسويق',desc:'يعتمد الإعلانات والبنرات ويدير خانات الظهور والحملات.',scope:'كل البيانات',scopeOpts:['كل البيانات'],preset:'content'},
    {id:'support',name:'مسؤول الدعم',desc:'الدعم وتعديل ملفات المستأجرين لحل المشكلات دون وصول مالي.',scope:'كل البيانات',scopeOpts:['كل البيانات'],preset:'support'}
  ];
  const allModulesOn=()=>{const o={};MODULE_GROUPS.forEach(g=>g.items.forEach(i=>o[i]=true));return o};
  const modulesOn=(names)=>{const o={};MODULE_GROUPS.forEach(g=>g.items.forEach(i=>o[i]=names.includes(i)));return o};
  const specialAll=on=>{const o={};SPECIAL.forEach(s=>o[s.id]=!!on);return o};
  function preset(kind){
    if(kind==='all') return {special:specialAll(true),modules:allModulesOn(),scope:'كل البيانات'};
    if(kind==='finance') return {special:{financeView:true,usersManage:false,export:true,editGeneral:false,editProvider:false,editTenant:false,adsEdit:false,contentApprove:false,slotUpgrade:false},modules:modulesOn(['النظرة المالية','سجل المعاملات','معاملات فاشلة','تسويات المزودين','الاستردادات','الفواتير','مطابقة بوابة الدفع','نسب العمولات','مركز التقارير','منشئ التقارير','التقارير المجدولة','المقارنات','التحليل العميق']),scope:'كل البيانات'};
    if(kind==='ops') return {special:{financeView:false,usersManage:false,export:true,editGeneral:true,editProvider:true,editTenant:true,adsEdit:false,contentApprove:false,slotUpgrade:false},modules:modulesOn(['مركز القيادة','شاشة العمليات NOC','لوحة التحكم','البحث والتحليل','مركز الإشعارات','الرسائل','قائمة المزودين','طابور الاعتماد','معالج تهيئة مزود','معالج تهيئة الفروع','أداء المزودين المقارن','الفروع','السيارات','مراقبة الجودة','الماركات والموديلات','طلبات إضافة موديل','كل الحسابات','إدارة المستأجرين','كل الحجوزات','طلبات التمديد','الحجوزات المتعثّرة','قائمة التظلمات','رادار المخاطر','مسارات الأتمتة','مراقبة مستوى الخدمة']),scope:'كل البيانات'};
    if(kind==='regional') return {special:{financeView:true,usersManage:false,export:true,editGeneral:true,editProvider:false,editTenant:true,adsEdit:false,contentApprove:false,slotUpgrade:false},modules:modulesOn(['لوحة التحكم','مركز الإشعارات','الرسائل','إدارة المستأجرين','كل الحجوزات','طلبات التمديد','الحجوزات المتعثّرة','قائمة التظلمات','التذاكر']),scope:'مدينة: الرياض'};
    if(kind==='company') return {special:{financeView:true,usersManage:false,export:true,editGeneral:true,editProvider:true,editTenant:false,adsEdit:true,contentApprove:false,slotUpgrade:false},modules:modulesOn(['لوحة التحكم','الفروع','السيارات','إعلانات المزودين','كل الحجوزات','النظرة المالية','تسويات المزودين']),scope:'شركة محددة'};
    if(kind==='content') return {special:{financeView:false,usersManage:false,export:true,editGeneral:true,editProvider:false,editTenant:false,adsEdit:true,contentApprove:true,slotUpgrade:true},modules:modulesOn(['الكوبونات','الحملات','البنرات والتسويق','إعلانات المزودين','إرسال إشعار','سجل الإشعارات','القوالب','إسناد التحويلات ROAS','حوكمة الكوبونات','اختبار A/B','تجربة الجمهور','أداء الشراكات المؤثرة','رحلة العميل والاحتفاظ','منشئ الشرائح','المحتوى والشروط']),scope:'كل البيانات'};
    return {special:{financeView:false,usersManage:false,export:false,editGeneral:false,editProvider:false,editTenant:true,adsEdit:false,contentApprove:false,slotUpgrade:false},modules:modulesOn(['التذاكر','الشات بوت','مركز المساعدة','إدارة المستأجرين','كل الحجوزات','قائمة التظلمات','مركز الإشعارات','الرسائل']),scope:'كل البيانات'};
  }
  function defaults(){
    const d={active:'super',roles:{}};
    ROLES.forEach(r=>{d.roles[r.id]=preset(r.preset)});
    return d;
  }
  function load(){
    try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!raw) return defaults();
      const base=defaults();
      base.active=raw.active||'super';
      ROLES.forEach(r=>{base.roles[r.id]=Object.assign({},base.roles[r.id],raw.roles&&raw.roles[r.id]||{},{special:Object.assign({},base.roles[r.id].special,(raw.roles&&raw.roles[r.id]&&raw.roles[r.id].special)||{}),modules:Object.assign({},base.roles[r.id].modules,(raw.roles&&raw.roles[r.id]&&raw.roles[r.id].modules)||{})});});
      return base;
    }catch(e){return defaults()}
  }
  function save(st){localStorage.setItem(KEY,JSON.stringify(st))}
  const tg=(on,fn)=>`<button type="button" class="rbac-tg ${on?'on':''}" onclick="${fn}"></button>`;

  window.WafraRBAC={
    select(id){const st=load();st.active=id;save(st);render()},
    toggleSpecial(id){const st=load();const r=st.roles[st.active];r.special[id]=!r.special[id];save(st);render()},
    toggleModule(name){const st=load();const r=st.roles[st.active];r.modules[name]=!r.modules[name];save(st);render()},
    toggleGroup(gid,on){const st=load();const r=st.roles[st.active];const g=MODULE_GROUPS.find(x=>x.id===gid);if(!g)return;g.items.forEach(i=>r.modules[i]=!!on);save(st);render()},
    setScope(v){const st=load();st.roles[st.active].scope=v;save(st);render()},
    editRole(){const st=load();const role=ROLES.find(x=>x.id===st.active);if(window.__toast)window.__toast('وضع التعديل مفعّل لـ '+role.name+' — غيّر المفاتيح مباشرة');},
    render(){
      const st=load();
      const role=ROLES.find(x=>x.id===st.active)||ROLES[0];
      const data=st.roles[role.id];
      const totalMods=MODULE_GROUPS.reduce((n,g)=>n+g.items.length,0);
      const onMods=MODULE_GROUPS.reduce((n,g)=>n+g.items.filter(i=>data.modules[i]).length,0);
      const finOk=!!data.special.financeView;
      const expOk=!!data.special.export;

      const rolesCol=ROLES.map(r=>`<button type="button" class="rbac-role ${r.id===role.id?'on':''}" onclick="WafraRBAC.select('${r.id}')">
        <div class="ic">👤</div>
        <h3>${r.name}</h3>
        <p>${r.desc}</p>
        <span class="rbac-scope">🛡 ${st.roles[r.id].scope||r.scope}</span>
      </button>`).join('');

      const specialHtml=SPECIAL.map(s=>`<div class="rbac-pill"><span>${s.label}</span>${tg(!!data.special[s.id],`WafraRBAC.toggleSpecial('${s.id}')`)}</div>`).join('');

      const modulesHtml=MODULE_GROUPS.map(g=>{
        const cnt=g.items.filter(i=>data.modules[i]).length;
        const allOn=cnt===g.items.length;
        return `<div class="rbac-mod">
          <div class="rbac-mod-h">
            <div><b>${g.title}</b><span class="cnt">${cnt}/${g.items.length}</span></div>
            <button type="button" class="all" onclick="WafraRBAC.toggleGroup('${g.id}',${!allOn})">${allOn?'إلغاء الكل':'تحديد الكل'}</button>
          </div>
          <div class="rbac-mod-grid">${g.items.map(i=>`<div class="rbac-pill"><span>${i}</span>${tg(!!data.modules[i],`WafraRBAC.toggleModule('${i.replace(/'/g,"\\'")}')`)}</div>`).join('')}</div>
        </div>`;
      }).join('');

      const scopeOpts=(role.scopeOpts||['كل البيانات']).map(o=>`<option ${data.scope===o?'selected':''}>${o}</option>`).join('');

      return phead('الصلاحيات والأدوار (RBAC)','تحكم دقيق في الوحدات والبيانات التي يصل إليها كل دور — مع معاينة فورية لما يراه المستخدم',['FR-ADA-03','FR-ADA-04','FR-ADA-05','FR-ADA-07'],
        `<button class="btn" onclick="WafraCMS.newAdmin()">＋ إضافة إداري</button>`)
      + `<div class="rbac-layout">
          <aside class="rbac-roles">${rolesCol}</aside>
          <section class="rbac-main">
            <div class="rbac-main-h">
              <h2>مصفوفة صلاحيات: ${role.name}</h2>
              <button class="btn" onclick="WafraRBAC.editRole()">✦ تعديل هذا الدور</button>
            </div>
            <div class="rbac-stats">
              <div class="rbac-stat"><div class="k">الوحدات المتاحة</div><div class="v">${onMods} / ${totalMods}</div></div>
              <div class="rbac-stat"><div class="k">البيانات المالية</div><div class="v ${finOk?'ok':''}">${finOk?'ظاهرة':'مخفية'}</div></div>
              <div class="rbac-stat"><div class="k">التصدير</div><div class="v ${expOk?'ok':''}">${expOk?'مسموح':'غير مسموح'}</div></div>
              <div class="rbac-stat"><div class="k">نطاق البيانات</div><div class="v">${data.scope||role.scope}</div></div>
            </div>
            <div class="rbac-sec"><h4>الصلاحيات الخاصة</h4><div class="rbac-special">${specialHtml}</div></div>
            <div class="rbac-sec"><h4>نطاق البيانات — مستوى الصف</h4>
              <div class="rbac-scope-row">
                <select onchange="WafraRBAC.setScope(this.value)">${scopeOpts}</select>
                <span style="font:500 12px Cairo;color:var(--muted)">يقيّد ما يراه الدور من بيانات دون حجب الوحدة كاملة.</span>
              </div>
            </div>
            <div class="rbac-sec"><h4>الوصول للوحدات</h4>${modulesHtml}</div>
          </section>
        </div>`;
    }
  };
  S.admins=()=>WafraRBAC.render();
})();
</script>

<script>
/* صلاحيات الحقول الحساسة — مصفوفة إظهار/إخفاء حسب الدور */
(function(){
  const KEY='wafra-field-perms-v1';
  const roles=[
    {id:'finance',letter:'ما',color:'#3B6FE2',name:'المدير المالي'},
    {id:'ops',letter:'ع',color:'#5B6B8C',name:'مدير العمليات'},
    {id:'regional',letter:'ر',color:'#C45C26',name:'مدير إقليمي'},
    {id:'company',letter:'ش',color:'#2F7D57',name:'مدير شركة'},
    {id:'content',letter:'ت',color:'#8A651A',name:'مدير المحتوى والتسويق'},
    {id:'support',letter:'ه',color:'#6B5B95',name:'مسؤول الدعم'}
  ];
  const fields=[
    {id:'nationalId',label:'رقم الهوية'},
    {id:'iban',label:'الآيبان البنكي'},
    {id:'mobile',label:'الجوال'},
    {id:'email',label:'البريد الإلكتروني'}
  ];
  const defaults={
    nationalId:{finance:false,ops:false,regional:false,company:false,content:false,support:false},
    iban:{finance:true,ops:false,regional:false,company:true,content:false,support:false},
    mobile:{finance:true,ops:true,regional:true,company:true,content:true,support:true},
    email:{finance:true,ops:true,regional:true,company:true,content:true,support:true}
  };
  function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){return JSON.parse(JSON.stringify(defaults))}}
  function save(m){localStorage.setItem(KEY,JSON.stringify(m))}
  window.WafraFieldPerms={
    toggle(field,role){
      const m=load();
      m[field]=m[field]||{};
      m[field][role]=!m[field][role];
      save(m);
      if(window.__toast) window.__toast(m[field][role]?'الحقل ظاهر لهذا الدور':'الحقل مقنّع لهذا الدور');
      render();
    }
  };
  S.fieldPermissions=()=>{
    const m=load();
    const head=roles.map(r=>`<th><div class="sfp-role"><span class="badge-ltr" style="background:${r.color}">${r.letter}</span><span class="nm">${r.name}</span></div></th>`).join('');
    const rows=fields.map(f=>{
      const row=m[f.id]||defaults[f.id];
      const cells=roles.map(r=>{
        const on=!!row[r.id];
        return `<td><button type="button" class="sfp-tg ${on?'on':''}" aria-label="${f.label} — ${r.name}" onclick="WafraFieldPerms.toggle('${f.id}','${r.id}')"></button></td>`;
      }).join('');
      return `<tr><td>${f.label}</td>${cells}</tr>`;
    }).join('');
    return phead('صلاحيات الحقول الحساسة','تحكم دقيق بإظهار أو إخفاء الحقول الحساسة حسب الدور',['FR-ADA-FIELD-01'])
      + `<div class="sfp-card">

            <h2>صلاحيات الحقول الحساسة</h2>

<script>
/* طبقة حية: أزرار الإجراءات تغيّر الحالة + ترقيم صفحات ببيانات كافية في كل الشاشات. */
(function(){
  const toast = (m)=>{ if(typeof window.__toast==='function') window.__toast(m); else if(typeof window.toast==='function') window.toast(m); };
  const setStatus = (row, status)=>{ if(typeof window.setRowStatus==='function') window.setRowStatus(row, status); };

  function inferAction(label){
    const t=String(label||'').replace(/\s+/g,' ').trim();
    if(/^(إيقاف|تعطيل|تعليق|Suspend)$/i.test(t) || /إيقاف|تعطيل/.test(t)) return {status:'موقوف', msg:'تم الإيقاف وتحديث الحالة'};
    if(/^(تفعيل|إعادة تفعيل|تنشيط)$/i.test(t) || /تفعيل|إعادة التفعيل/.test(t)) return {status:'نشط', msg:'تم التفعيل وتحديث الحالة'};
    if(/اعتماد|موافقة|قبول|Approve/i.test(t)) return {status:'معتمد', msg:'تم الاعتماد وتحديث الحالة'};
    if(/رفض|Reject/i.test(t)) return {status:'مرفوض', msg:'تم الرفض وتحديث الحالة'};
    if(/إكمال|إنهاء|إغلاق|Mark complete/i.test(t)) return {status:'مكتمل', msg:'تم تحديث الحالة إلى مكتمل'};
    if(/نشر|Publish/i.test(t)) return {status:'منشور', msg:'تم النشر'};
    if(/إخفاء|Hide/i.test(t)) return {status:'مخفي', msg:'تم الإخفاء'};
    if(/حذف|Delete/i.test(t)) return {remove:true, msg:'تم الحذف'};
    if(/استرداد|Refund/i.test(t)) return {status:'مسترد', msg:'تم تسجيل الاسترداد'};
    if(/حلّ|حل |تسوية النزاع/i.test(t)) return {status:'محلول', msg:'تم حل النزاع'};
    if(/تعيين|Assign/i.test(t)) return {status:'مُعيَّن', msg:'تم التعيين'};
    return null;
  }

  function nearestRow(el){
    return el.closest('tr') || el.closest('.n-item') || el.closest('.todo') || el.closest('.conv') || el.closest('.role-card') || el.closest('.cms-card');
  }

  function applyBtnAction(btn){
    if(btn.dataset.liveHandled==='1') return false;
    if(btn.closest('.modal-f') || btn.closest('#mc')) return false;
    const label=btn.textContent.replace(/\s+/g,' ').trim();
    if(!label || /تصدير|تنزيل|Excel|PDF|CSV|رجوع|إلغاء|إغلاق|بحث|تصفية/.test(label)) return false;
    const act=inferAction(label);
    if(!act) return false;
    const row=nearestRow(btn);
    if(act.remove){
      if(row){ row.remove(); toast(act.msg); return true; }
      return false;
    }
    if(row){
      setStatus(row, act.status);
      if(/تفعيل|إيقاف/.test(label)){
        const next=/إيقاف|تعطيل/.test(label)?'تفعيل':'إيقاف';
        if(btn.tagName==='BUTTON' && btn.textContent.trim().length<20) btn.textContent=next;
      }
      toast(act.msg+' ← '+act.status);
      return true;
    }
    toast(act.msg);
    return true;
  }

  document.addEventListener('click', e=>{
    const btn=e.target.closest('button.btn, button.ix-wbtn, button.ix-gbtn, .st-approve, .st-reject');
    if(!btn) return;
    const label=btn.textContent.replace(/\s+/g,' ').trim();
    /* لا تعترض أزرار التحليلات/التقارير التي لها معالجات مخصّصة */
    if(/إنشاء تقرير|تشغيل التحليل|تشغيل الآن|حفظ التقرير|اعتماد الفائز|فتح التحقيق|تنفيذ التحويل|تنفيذ الزيادة|حملة استرجاع|إرسال الحملة/.test(label)) return;
    const oc=btn.getAttribute('onclick')||'';
    if(oc || typeof btn.onclick==='function'){
      const act=inferAction(label);
      if(act && !act.remove){
        const row=nearestRow(btn);
        if(row) setTimeout(()=>setStatus(row, act.status), 0);
      }
      return;
    }
    if(applyBtnAction(btn)){ e.preventDefault(); e.stopPropagation(); }
    else {
      if(label && !/تصدير|تنزيل|Excel|PDF|CSV|رجوع|إلغاء|إغلاق/.test(label)) toast(label+' — تم التنفيذ');
    }
  }, true);

  /* ترقية دوال WafraOps التجريبية لتحديث الحالة فعلياً */
  const ops=window.WafraOps=window.WafraOps||{};
  const prevDemo=ops.demoAction;
  ops.demoAction=function(t){
    const act=inferAction(t);
    const row=document.querySelector('tr:hover, .n-item:hover');
    if(act&&row){ if(act.remove) row.remove(); else setStatus(row, act.status); toast((act.msg||t)+ (act.status?' ← '+act.status:'')); return; }
    if(typeof prevDemo==='function') return prevDemo(t);
    toast(`${t}: تم التنفيذ وتحديث البيانات.`);
  };
  ops.bookingAction=function(t){
    const row=document.querySelector('#view tr:hover')||document.querySelector('#view tbody tr');
    const act=inferAction(t)||{status:'قيد المعالجة', msg:t};
    if(row) setStatus(row, act.status);
    toast((act.msg||t)+' — تم تحديث الحجز');
  };
  ops.requestAction=function(t){
    const row=document.querySelector('#view tr:hover');
    if(row) setStatus(row, t);
    toast('تم تحديث طلب الموديل إلى: '+t);
  };
  ops.toggleVehicle=function(t){
    const row=[...document.querySelectorAll('#view tbody tr')].find(r=>r.textContent.includes(t))||document.querySelector('#view tr:hover');
    const cur=row?.querySelector('.badge')?.textContent||'';
    const next=/موقف|موقفة|غير متاح/.test(cur)?'متاحة':'موقفة';
    if(row) setStatus(row, next);
    toast(`تم تغيير حالة السيارة إلى ${next}`);
  };
  ops.notice=function(t){ toast(t+' — تم تنفيذ الإجراء'); };

  /* بعد كل enhance: تأكد أن الجداول المُوسَّعة تُعاد ترقيمها */
  const prevEnhance=window.enhance;
  window.enhance=function(root){
    if(typeof prevEnhance==='function') prevEnhance(root);
    root=root||document;
    root.querySelectorAll('.pager .tot').forEach(tot=>{
      const card=tot.closest('.card');
      const table=card?.querySelector('table');
      if(!table||!table.__wired) return;
      const visible=[...table.querySelectorAll('tbody tr')].filter(r=>!r.classList.contains('grp')&&!r.classList.contains('no-res'));
      if(visible.length>0) tot.textContent='إجمالي النتائج: '+visible.length.toLocaleString('en-US');
    });
  };

  window.WafraLive={inferAction, applyBtnAction, setStatus};
})();
</script>
