  function bannerCard(b){return `<article class="cms-card"><div class="cms-visual ${b.style||''}"><b>${esc(b.title)}</b></div><div class="cms-body"><h3>${esc(b.slot)}</h3><div class="cms-meta">${esc(b.audience)} · الأولوية ${b.priority}<br>${b.from} — ${b.to}<br>ظهور ${b.impressions} · نقرات ${b.clicks}</div><div class="cms-actions">${button('تعديل',`WafraCMS.editBanner(${b.id})`,'primary')}${button(b.status==='منشور'?'إيقاف':'نشر',`WafraCMS.toggleBanner(${b.id})`)}${button('معاينة','WafraCMS.previewBanner('+b.id+')')}</div></div></article>`}
  function pageCard(p){return `<article class="cms-card"><div class="cms-body"><span class="perm-chip">${esc(p.type)}</span><h3 style="margin-top:10px">${esc(p.title)}</h3><div class="cms-meta">${esc(p.lang)} · ${esc(p.status)}<br>آخر تحديث: ${esc(p.updated)}</div><div class="cms-actions">${button('تحرير',`WafraCMS.editPage(${p.id})`,'primary')}${button('معاينة',`WafraCMS.previewPage(${p.id})`)}</div></div></article>`}
  window.WafraCMS={
    render(tab='overview'){
      const s=state(); const head=phead('مركز إدارة المحتوى (CMS)','إدارة خانات الواجهة، البانرات، والصفحات بالعربية والإنجليزية',['FR-ADX-03','FR-BAN-01','FR-BAN-02','FR-BAN-03'],`<button class="btn" onclick="WafraCMS.newBanner()">＋ بانر جديد</button>`);
      const nav=`<div class="cms-tabs">${[['overview','نظرة عامة'],['banners','البانرات'],['pages','الصفحات والنصوص'],['slots','خانات الظهور'],['audit','سجل النشر']].map(x=>`<button class="cms-tab ${tab===x[0]?'on':''}" onclick="WafraCMS.route('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
      let body='';
      if(tab==='overview') body=note('info','يُحفظ هذا النموذج داخل المتصفح','الربط الفعلي يتطلب API خادمي للتحقق من الأذونات، رفع الوسائط، ونشر المحتوى.')+`<div class="cms-grid">${s.slots.map((x,i)=>`<div class="role-card"><span class="perm-chip">${x.state}</span><h3>${x.title}</h3><p>${x.channel}</p><b>${x.content}</b><div class="cms-actions" style="margin-top:12px">${button('فتح المحتوى',`WafraCMS.route('${i===2?'pages':'banners'}')`,'primary')}</div></div>`).join('')}</div>`;
      if(tab==='banners') body=`<div class="cms-grid">${s.banners.map(bannerCard).join('')}</div>`;
      if(tab==='pages') body=`<div class="cms-grid">${s.pages.map(pageCard).join('')}</div>`;
      if(tab==='slots') body=card(cardH('خانات المحتوى المنشور','تحديد الموضع والجمهور والأولوية قبل النشر')+table(['الخانة','القناة','الحالة','المحتوى الحالي','الإجراء'],s.slots.map((x,i)=>[x.title,x.channel,bdg(x.state,x.state==='متاح'?'n':'g'),x.content,`<button class="iact" onclick="WafraCMS.route('${i===2?'pages':'banners'}')">فتح</button>`])));
      if(tab==='audit') body=card(cardH('سجل تغييرات المحتوى','للمراجعة في النموذج؛ في الإنتاج يكون سجلاً خادمياً غير قابل للتعديل')+table(['الوقت','الإجراء','التفاصيل'],(s.audit.length?s.audit:[{time:'—',action:'لا تغييرات محلية بعد',detail:'ابدأ بتعديل بانر أو صفحة'}]).map(x=>[x.time,x.action,x.detail])));
      return head+nav+body;
    },
    route(tab){location.hash='cms'; window.__cmsTab=tab; render()},
    newBanner(){this.bannerModal()},
    editBanner(id){this.bannerModal(state().banners.find(x=>x.id===id))},
    bannerModal(b){b=b||{id:0,title:'',slot:'الرئيسية — أعلى',audience:'كل العملاء',status:'مسودة',from:'',to:'',priority:1,style:''}; openM(modal(b.id?'تعديل بانر':'بانر جديد',`<input type="hidden" id="cms-id" value="${b.id}"><label class="field-label">عنوان البانر</label><input class="cms-field" id="cms-title" value="${esc(b.title)}" placeholder="مثال: عروض الشتاء"><div class="form-grid"><div><label class="field-label">خانة الظهور</label><select class="cms-field" id="cms-slot"><option ${b.slot.includes('أعلى')?'selected':''}>الرئيسية — أعلى</option><option ${b.slot.includes('وسط')?'selected':''}>الرئيسية — وسط</option><option ${b.slot.includes('البحث')?'selected':''}>صفحة البحث</option></select></div><div><label class="field-label">الجمهور</label><input class="cms-field" id="cms-audience" value="${esc(b.audience)}"></div><div><label class="field-label">بداية العرض</label><input class="cms-field" id="cms-from" type="date" value="${b.from}"></div><div><label class="field-label">نهاية العرض</label><input class="cms-field" id="cms-to" type="date" value="${b.to}"></div></div><label class="field-label">الأولوية</label><input class="cms-field" id="cms-priority" type="number" min="1" value="${b.priority}"><div class="audit-mini">قبل النشر الفعلي: تحقّق من الصورة والرابط وتعارض المواعيد على الخادم.</div>`,`<button class="btn" onclick="WafraCMS.saveBanner()">حفظ كمسودة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    saveBanner(){const s=state(),id=+document.getElementById('cms-id').value;const b={id:id||Date.now(),title:document.getElementById('cms-title').value.trim()||'بانر بلا عنوان',slot:document.getElementById('cms-slot').value,audience:document.getElementById('cms-audience').value.trim()||'كل العملاء',status:'مسودة',from:document.getElementById('cms-from').value,to:document.getElementById('cms-to').value,priority:+document.getElementById('cms-priority').value||1,style:'',clicks:'—',impressions:'—'};if(id){const i=s.banners.findIndex(x=>x.id===id);s.banners[i]={...s.banners[i],...b}}else s.banners.unshift(b);save(s);log(id?'تعديل بانر':'إنشاء بانر',b.title);closeM();this.route('banners')},
    toggleBanner(id){const s=state(),b=s.banners.find(x=>x.id===id);b.status=b.status==='منشور'?'موقوف':'منشور';save(s);log(b.status==='منشور'?'نشر بانر':'إيقاف بانر',b.title);this.route('banners')},
    previewBanner(id){const b=state().banners.find(x=>x.id===id);openM(modal('معاينة البانر',`<div class="cms-visual ${b.style||''}" style="min-height:240px;border-radius:12px"><b>${esc(b.title)}</b></div><p class="cms-meta">${esc(b.slot)} · ${esc(b.audience)}</p>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`))},
    editPage(id){const p=state().pages.find(x=>x.id===id);openM(modal('تحرير: '+esc(p.title),`<input type="hidden" id="page-id" value="${p.id}"><label class="field-label">العنوان</label><input class="cms-field" id="page-title" value="${esc(p.title)}"><label class="field-label">المحتوى</label><textarea class="cms-field" id="page-body">${esc(p.body)}</textarea><div class="audit-mini">يدعم الإنتاج مسودة ومراجعة ومعاينة ونشر منفصل لكل لغة.</div>`,`<button class="btn" onclick="WafraCMS.savePage()">حفظ المسودة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    savePage(){const s=state(),p=s.pages.find(x=>x.id===+document.getElementById('page-id').value);p.title=document.getElementById('page-title').value.trim()||p.title;p.body=document.getElementById('page-body').value.trim();p.status='مسودة';p.updated='الآن';save(s);log('تعديل صفحة أو نص',p.title);closeM();this.route('pages')},
    previewPage(id){const p=state().pages.find(x=>x.id===id);openM(modal('معاينة: '+esc(p.title),`<h2 style="font-size:20px;margin-bottom:14px">${esc(p.title)}</h2><p style="white-space:pre-wrap;line-height:2">${esc(p.body)}</p>`,`<button class="btn ghost" onclick="closeM()">إغلاق</button>`))},
    renderAdmins(){return window.WafraRBAC?window.WafraRBAC.render():phead('الإداريون والصلاحيات','جاري التحميل…');},
    newAdmin(){openM(modal('إضافة إداري',`<label class="field-label">الاسم</label><input id="admin-name" class="cms-field"><label class="field-label">البريد الإلكتروني</label><input id="admin-email" type="email" class="cms-field"><div class="form-grid"><div><label class="field-label">الدور</label><select id="admin-role" class="cms-field">${roles.map(r=>`<option>${r.name}</option>`).join('')}</select></div><div><label class="field-label">نطاق البيانات</label><select id="admin-scope" class="cms-field"><option>كل البيانات</option><option>نطاق: الرياض</option><option>نطاق: جدة</option><option>نطاق: الشركة</option></select></div></div>`,`<button class="btn" onclick="WafraCMS.saveAdmin()">إضافة</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`))},
    saveAdmin(){const name=document.getElementById('admin-name').value.trim(),email=document.getElementById('admin-email').value.trim();if(!name||!email){alert('أدخل الاسم والبريد الإلكتروني');return}const s=state();s.admins.push({name,email,role:document.getElementById('admin-role').value,scope:document.getElementById('admin-scope').value,last:'لم يسجل الدخول',sessions:0,twofa:true,active:true});save(s);log('إضافة إداري',name);closeM();location.hash='admins';render()},
    toggleAdmin(i){const s=state(),a=s.admins[i];a.active=!a.active;save(s);log(a.active?'تفعيل حساب إداري':'تعطيل حساب إداري',a.name);location.hash='admins';render()}
  };
  S.cms=()=>WafraCMS.render(window.__cmsTab||'overview');
  /* المحتوى والشروط تبقى الصفحة القانونية الكاملة؛ صفحات CMS تُدار من مسار cms */
  S.banners=()=>WafraCMS.render('banners');
  S.admins=()=>WafraCMS.renderAdmins();
  const system=NAV.find(x=>x.g==='النظام'); if(system&&!system.items.some(x=>x.k==='cms')) system.items.splice(3,0,{k:'cms',t:'CMS المحتوى والبنرات',i:'✦'});
  const oldRender=window.render; window.render=function(){oldRender(); if(cur==='cms'&&!window.__cmsTab)window.__cmsTab='overview'};
  render();
})();
</script>

<script>
/* طبقة التشغيل الموحّدة: التعديلات التالية تحفظ داخل المتصفح في النموذج فقط. */
(function(){
  const escOps=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const opsKey='wafra-ops-v1';
  const defaults={providers:[
    ['شركة الصحراء لتأجير السيارات','1010445872','الرياض','7','214','نشط'],
    ['كي رنت','4030217744','جدة','5','168','نشط'],
    ['أسطول الشمال','3550119283','تبوك','2','41','طلب اعتماد'],
    ['رحال ليموزين','1010992301','الرياض','1','18','موقف']
  ], fees:[['الرياض','جدة','180','مفعّل'],['الرياض','الدمام','140','مفعّل'],['جدة','مكة المكرمة','85','مفعّل']], serviceOn:true, vehicleStates:{sunny:'موقفة',k5:'موقفة'}};
  const read=()=>{try{return {...defaults,...JSON.parse(localStorage.getItem(opsKey)||'{}')}}catch(e){return structuredClone(defaults)}};
  const save=x=>localStorage.setItem(opsKey,JSON.stringify(x));
  const tone=s=>s==='نشط'||s==='مفعّل'||s==='متاح'?'g':s==='موقف'||s==='غير متاح'?'r':'a';
  const openOpsModal=(title,body,foot)=>openM(modal(title,body,foot));
  window.WafraOps={
    addProvider(){openOpsModal('إضافة مزود',`<div class="frow">${fld('اسم الشركة',`<input id="op-name" class="native-input" value="مؤسسة وفرا للتأجير">`)}${fld('السجل التجاري',`<input id="op-cr" class="native-input" value="1010885521">`)}</div><div class="frow">${fld('المدينة الرئيسية',sel('الرياض'))}${fld('الحالة',`<select id="op-status" class="native-input"><option>طلب اعتماد</option><option>نشط</option><option>موقف</option></select>`)}</div>${fld('تجهيز المناطق',`<select class="native-input"><option>المنطقة الوسطى</option><option>المنطقة الشرقية</option><option>المنطقة الغربية</option><option>المنطقة الشمالية</option><option>المنطقة الجنوبية</option></select>`,'تحدد منطقة تجهيز المزود، ويمكن إضافة مناطق أخرى من ملفه.')}`,`<button class="btn coral" onclick="WafraOps.saveProvider()">حفظ المزود</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)},
    saveProvider(){const s=read();s.providers.unshift([document.getElementById('op-name').value||'مزود جديد',document.getElementById('op-cr').value||'—','الرياض','0','0',document.getElementById('op-status').value]);save(s);closeM();location.hash='vendors';render();},
    addFee(){openOpsModal('إضافة رسوم تسليم بين المدن',`<div class="frow">${fld('مدينة الاستلام',sel('الرياض'))}${fld('مدينة التسليم',sel('الدمام'))}</div>${fld('الرسوم (ر.س)',`<input id="op-fee" class="native-input" value="150" type="number">`,'تظهر للعميل قبل الدفع وتضاف إلى إجمالي الحجز.')}`,`<button class="btn coral" onclick="WafraOps.saveFee()">إضافة الرسوم</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)},
    saveFee(){const s=read();s.fees.unshift(['الرياض','الدمام',document.getElementById('op-fee').value||'0','مفعّل']);save(s);closeM();render();},
    toggleDelivery(){const s=read();s.serviceOn=!s.serviceOn;save(s);render();},
    modelRequest(action){openOpsModal(action==='delete'?'حذف طلب إضافة موديل':'تعديل طلب إضافة موديل',action==='delete'?note('warn','هل تريد حذف الطلب؟','سيُحذف طلب MG 5 فقط ولن تتأثر سيارات المزوّد.'):`${fld('الماركة',sel('كيا'))}${fld('اسم الموديل',`<input class="native-input" value="سيلتوس">`)}${fld('السنة',`<input class="native-input" value="2026">`)}`,`<button class="btn ${action==='delete'?'danger':'coral'}" onclick="closeM();__toast('تم ${action==='delete'?'حذف':'حفظ'} طلب الموديل.');">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)},
    toggleVehicle(id){const s=read();s.vehicleStates=s.vehicleStates||{};s.vehicleStates[id]=s.vehicleStates[id]==='موقفة'?'متاحة':'موقفة';save(s);render();__toast(s.vehicleStates[id]==='موقفة'?'تم إيقاف السيارة وإخفاؤها من الحجز.':'تم تفعيل السيارة وإتاحتها للحجز.');},
    editEntity(name,kind){const branch=kind==='فرع';openOpsModal(`تعديل ${branch?'الفرع':'المزود'} — ${escOps(name)}`,`<div style="padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#EEF3FF,#FFF8F7);margin-bottom:16px"><b style="font-size:15px;color:var(--navy)">${branch?'بيانات الفرع والتجهيز':'بيانات المزود والتشغيل'}</b><div style="font-size:12px;color:var(--ink-2);margin-top:4px">عدّل البيانات ثم احفظ التغييرات لتظهر في الملف التشغيلي.</div></div><div class="frow">${fld(branch?'اسم الفرع':'اسم المزود',`<input class="native-input" value="${escOps(name)}">`)}${fld('الحالة',`<select class="native-input"><option>نشط</option><option>موقف</option><option>طلب اعتماد</option></select>`)}</div><div class="frow">${fld('المنطقة',`<select class="native-input"><option>المنطقة الوسطى</option><option>المنطقة الشرقية</option><option>المنطقة الغربية</option><option>المنطقة الشمالية</option><option>المنطقة الجنوبية</option></select>`)}${fld(branch?'السيارات المتاحة':'المدينة الرئيسية',`<input class="native-input" value="${branch?'0':'الرياض'}">`)}</div>${fld('ملاحظة داخلية',`<textarea class="native-input" rows="3">مراجعة البيانات التشغيلية وتحديثها.</textarea>`,'تظهر لفريق الإدارة فقط.')}`,`<button class="btn coral" onclick="closeM();__toast('تم حفظ التعديلات بنجاح.');">حفظ التعديلات</button><button class="btn ghost" onclick="closeM()">إلغاء</button>`)},
  };

  S.vendors=()=>{const s=read();return phead('المزودون والفروع','إدارة المزودين وفروعهم وحالة الاعتماد من مكان واحد',[],`<button class="btn coral" onclick="WafraOps.addProvider()">＋ إضافة مزود</button>`)+note('info','حالات المزود المعتمدة','الحالات المتاحة فقط: نشط، موقف، وطلب اعتماد.')+card(tabs([{t:'الكل',n:s.providers.length,on:1},{t:'نشط',n:s.providers.filter(x=>x[5]==='نشط').length},{t:'موقف',n:s.providers.filter(x=>x[5]==='موقف').length},{t:'طلب اعتماد',n:s.providers.filter(x=>x[5]==='طلب اعتماد').length}])+filters(['الحالة','المنطقة','المدينة'],'ابحث باسم المزود أو السجل التجاري…')+table(['المزود','السجل التجاري','المدينة','الفروع','السيارات','تجهيز المناطق','الحالة','الإجراءات'],s.providers.map((x,i)=>[{v:escOps(x[0])+`<span class="sub">إدارة الفروع والسيارات</span>`,c:'strong'},{v:x[1],c:'num'},x[2],x[3],x[4],i%3===0?'الوسطى · الشرقية':i%3===1?'الغربية':'الشمالية',bdg(x[5],tone(x[5])),`<div class="acts-cell"><a class="btn ghost sm" href="#vendorFile" title="فتح ملف الشركة">👁</a><button class="btn ghost sm" onclick="WafraOps.editEntity('${escOps(x[0])}','مزود')" title="تعديل">✎</button></div>`]))+pager(s.providers.length,10));};

  S.branches=()=>phead('الفروع والمزودون','الفروع تابعة للمزود، مع مناطق التجهيز وتوفر السيارات',[],`<a class="btn ghost" href="#vendors">إدارة المزودين</a>`)+card(tabs([{t:'الكل',n:184,on:1},{t:'نشط ومتاح',n:151},{t:'نشط بلا سيارات',n:6},{t:'موقف',n:6}])+filters(['المزود','المنطقة','المدينة','الحالة'],'ابحث باسم الفرع أو المزود…')+table(['الفرع / المزود','المنطقة','المدينة','تجهيز المناطق','السيارات المتاحة','الخدمات','الحالة','الإجراءات'],[
  [{v:'فرع مطار الملك خالد<span class="sub">شركة الصحراء لتأجير السيارات</span>',c:'strong'},'الوسطى','الرياض','الوسطى · الشرقية','48','استلام مطار · توصيل',bdg('نشط','g'),`<div class="acts-cell"><a class="btn ghost sm" href="#vendorFile" title="فتح ملف الشركة">👁</a><button class="btn ghost sm" onclick="WafraOps.editEntity('فرع مطار الملك خالد','فرع')">✎</button></div>`],
  [{v:'فرع جدة الشمالية<span class="sub">شركة الصحراء لتأجير السيارات</span>',c:'strong'},'الغربية','جدة','الغربية','31','حضوري · توصيل',bdg('نشط','g'),`<div class="acts-cell"><a class="btn ghost sm" href="#vendorFile" title="فتح ملف الشركة">👁</a><button class="btn ghost sm" onclick="WafraOps.editEntity('فرع جدة الشمالية','فرع')">✎</button></div>`],
  [{v:'فرع الخبر التشغيلي<span class="sub">مسار لتأجير المركبات</span>',c:'strong'},'الشرقية','الخبر','الشرقية','0','توصيل للباب',bdg('نشط بلا سيارات','a'),`<div class="acts-cell"><a class="btn ghost sm" href="#vendorFile" title="فتح ملف الشركة">👁</a><button class="btn ghost sm" onclick="WafraOps.editEntity('فرع الخبر التشغيلي','فرع')">✎</button></div>`],

  const customerNav=NAV.find(g=>g.g==='العملاء');
  if(customerNav&&!customerNav.items.some(i=>i.k==='ratingManage'))customerNav.items.push({k:'ratingManage',t:'إدارة التقييمات',i:'★'},{k:'ratingCriteria',t:'معايير التقييم',i:'☷'});

})();
</script>

<script>
/* استكمال ملاحظات Admin2 وAdmin-3: شاشات عربية فعلية وبيانات محلية قابلة للتفاعل. */
(function(){
  const ping=msg=>WafraOps.demoAction(msg);
  const btn=(t,fn='WafraOps.demoAction')=>`<button class="btn ghost sm" onclick="${fn}('${t}')">${t}</button>`;
  const search=(placeholder)=>`<label class="fsearch">⌕ <input placeholder="${placeholder}" oninput="WafraOps.searchHint(this.value)"></label>`;
  const exports=(name)=>`<button class="btn ghost sm" onclick="WafraOps.exportLocal('${name}','Excel')">Excel ⤓</button><button class="btn ghost sm" onclick="WafraOps.exportLocal('${name}','PDF')">PDF ⤓</button>`;
  const controls=(items)=>`<div class="filters">${items.join('')}${search('اكتب للبحث…')}</div>`;
  const check=(id)=>`<input aria-label="تحديد ${id}" type="checkbox" class="wafra-check" onchange="WafraOps.selectQuality(this)">`;
  const detailTabs=(active)=>`<div class="tabs">${['الملخص','تفاصيل الحجز','الخط الزمني','الاستلام','الإرجاع','المحادثة','الفاتورة','سجل الإجراءات'].map(t=>`<button class="tab ${active===t?'on':''}" onclick="WafraOps.bookingTab('${t}')">${t}</button>`).join('')}</div>`;
  Object.assign(WafraOps,{
    searchHint:v=>v&&ping(`البحث التجريبي: ${v}`),
    exportLocal:(n,f)=>ping(`تم تجهيز تصدير ${n} بصيغة ${f}.`),
    selectQuality:()=>{const n=document.querySelectorAll('.wafra-check:checked').length; ping(n?`تم تحديد ${n} بلاغات.`:'ألغيت التحديد.');},
    closeQuality:()=>{const n=document.querySelectorAll('.wafra-check:checked').length; ping(n?`تم إغلاق ${n} بلاغات بعد التأكيد.`:'اختر بلاغاً واحداً على الأقل أولاً.');},
    bookingTab:t=>{window.__bookingTab=t;render();},
    requestResponse:t=>ping(`${t}: تم فتح نموذج الرد وإضافته لسجل الإجراء.`),
    approveRequest:t=>ping(`تم ${t} الطلب تجريبياً وتحديث حالته.`),
    approveRefund:id=>{if(confirm(`اعتماد استرداد ${id}؟`))ping(`تمت الموافقة على الاسترداد ${id}.`);},
    rejectRefund:id=>{if(confirm(`رفض استرداد ${id}؟`))ping(`تم رفض الاسترداد ${id}.`);},
    settleRecon:id=>{if(confirm(`تسوية فرق المعاملة ${id}؟`))ping(`تم فتح تسوية الفرق لـ ${id}.`);},
    toggleTemplate:(name,action)=>ping(`تم ${action} القالب «${name}».`),
    openRetentionCampaign:(name,bookings,idleDays)=>{
      window.__jrCamp={name,bookings,idleDays,incentive:'pct',channel:'push',value:'15'};
      const first=String(name).split(/\s+/)[0]||name;
      const msg=`عزيزنا ${name}، اشتقنا لك في وفرا! خصم 15% على إيجارك القادم. احجز الآن قبل انتهاء العرض.`;
      const seg=(group,opts,cur)=>`<div class="jr-seg" data-group="${group}">${opts.map(([k,l])=>`<button type="button" class="jr-seg-btn ${cur===k?'on':''}" onclick="WafraOps.setRetentionOpt('${group}','${k}')">${l}</button>`).join('')}</div>`;
      openM(modal(`حملة استرجاع — ${name}`, `
        <div class="jr-sub">خامل منذ ${idleDays} يوم · ${bookings} حجز سابق</div>
        ${fld('الحافز', seg('incentive',[['remind','تذكير فقط'],['amount','كوبون مبلغ'],['pct','كوبون نسبة']],'pct'))}
        <div id="jr-incentive-field">${fld('نسبة الخصم (%)', `<input id="jr-val" class="native-input" type="number" value="15" min="1" max="90" oninput="WafraOps.refreshRetentionMsg()">`)}</div>
        ${fld('القناة', seg('channel',[['email','بريد'],['sms','SMS'],['push','إشعار']],'push'))}
        ${fld('نص الرسالة', `<textarea id="jr-msg" class="native-input" rows="4">${msg}</textarea>`)}
        <div class="jr-coupon-hint"><span>🎟</span><div>سينشأ كوبون خاص بالعميل عند الإرسال.</div></div>
      `, `<button type="button" class="btn" onclick="WafraOps.sendRetentionCampaign()">إرسال الحملة</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button>`));
    },
    setRetentionOpt:(group,key)=>{
      const st=window.__jrCamp||(window.__jrCamp={});
      st[group]=key;
      document.querySelectorAll(`.jr-seg[data-group="${group}"] .jr-seg-btn`).forEach(b=>{
        b.classList.toggle('on', b.textContent.trim()===({remind:'تذكير فقط',amount:'كوبون مبلغ',pct:'كوبون نسبة',email:'بريد',sms:'SMS',push:'إشعار'}[key]));
      });
      const field=document.getElementById('jr-incentive-field');
      if(field && group==='incentive'){
        if(key==='remind') field.innerHTML=`<div class="jr-remind-note">تذكير بدون خصم — يُرسل النص فقط دون إنشاء كوبون.</div>`;
        else if(key==='amount') field.innerHTML=fld('مبلغ الخصم (ر.س)', `<input id="jr-val" class="native-input" type="number" value="50" min="1" oninput="WafraOps.refreshRetentionMsg()">`);
        else field.innerHTML=fld('نسبة الخصم (%)', `<input id="jr-val" class="native-input" type="number" value="15" min="1" max="90" oninput="WafraOps.refreshRetentionMsg()">`);
        const hint=document.querySelector('.jr-coupon-hint');
        if(hint) hint.style.display=key==='remind'?'none':'';
        WafraOps.refreshRetentionMsg();
      }
    },
    refreshRetentionMsg:()=>{
      const st=window.__jrCamp||{};
      const name=st.name||'العميل';
      const ta=document.getElementById('jr-msg');
      if(!ta) return;
      const v=document.getElementById('jr-val')?.value||'15';
      const inc=st.incentive||'pct';
      if(inc==='remind') ta.value=`عزيزنا ${name}، اشتقنا لك في وفرا! عد إلينا واحجز سيارتك المفضلة اليوم.`;
      else if(inc==='amount') ta.value=`عزيزنا ${name}، اشتقنا لك في وفرا! خصم ${v} ر.س على إيجارك القادم. احجز الآن قبل انتهاء العرض.`;
      else ta.value=`عزيزنا ${name}، اشتقنا لك في وفرا! خصم ${v}% على إيجارك القادم. احجز الآن قبل انتهاء العرض.`;
    },
    sendRetentionCampaign:()=>{
      const st=window.__jrCamp||{};
      const ch={email:'بريد',sms:'SMS',push:'إشعار'}[st.channel||'push']||'إشعار';
      const inc={remind:'تذكير فقط',amount:'كوبون مبلغ',pct:'كوبون نسبة'}[st.incentive||'pct'];
      const v=document.getElementById('jr-val')?.value;
      closeM();
      ping(`أُرسلت حملة استرجاع لـ «${st.name||'العميل'}» عبر ${ch} · ${inc}${v&&st.incentive!=='remind'?` (${v}${st.incentive==='pct'?'%':' ر.س'})`:''}.`);
    },
    toggleCouponGov:(code,action)=>ping(`تم ${action} الكوبون ${code}.`),
    investigateCoupon:code=>{
      const catalog={
        VIP20:{disc:'20%',uses:'141',cost:'19.2 ألف ر.س',maxUse:'23 مرة',devices:'20',share:'53%'},
        WEEKEND10:{disc:'10%',uses:'497',cost:'33.8 ألف ر.س',maxUse:'31 مرة',devices:'48',share:'41%'},

      };
      const d=catalog[code]||{disc:'—',uses:'—',cost:'—',maxUse:'—',devices:'—',share:'—'};
      window.__cgCode=code;
      const chk=(id,label,on)=>`<label class="cg-chk"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${label}</span></label>`;

        <div class="cg-sub">خصم ${d.disc} · ${d.uses} استخدام</div>
        <div class="cg-evid">
          <b class="cg-evid-t">الأدلة المرصودة</b>
          <div class="cg-evid-grid">
            <div><span>إجمالي الاستخدامات</span><strong>${d.uses}</strong></div>
            <div><span>كلفة الخصم</span><strong>${d.cost}</strong></div>
            <div><span>أعلى استخدام من عميل واحد</span><strong class="danger">${d.maxUse}</strong></div>
            <div><span>عدد الأجهزة المميزة</span><strong>${d.devices}</strong></div>
            <div class="full"><span>معدل المشاركة العامة المقدّر</span><strong class="warn">${d.share}</strong></div>
          </div>
        </div>
        <div class="frow">
          ${fld('سبب الاشتباه', `<select id="cg-reason" class="native-input">

<script>
/* دوال عرض مشتركة للمسارات المضافة؛ تبقى مستقلة عن نطاق كل شاشة. */
function money(value){ return {v:String(value)+' ر.س',c:'num'}; }
function pill(value){
  const good=['نشط','مفعلة','مكتمل','معتمد','مقبول','ضمن الهدف','متاحة','مكتفية','مغلق'];
  const bad=['متأخر','مرفوض','موقفة','غير نشط','عجز','مفتوح'];
  return bdg(value,good.includes(value)?'g':bad.includes(value)?'r':'a');
}

  const SA_KEY='wafra-sa-engine-v1';
  const loadSaved=()=>{try{return JSON.parse(localStorage.getItem(SA_KEY)||'{}')||{};}catch(e){return{};}};
  const persist=s=>{try{localStorage.setItem(SA_KEY,JSON.stringify({tab:s.tab,field:s.field,op:s.op,value:s.value}));}catch(e){}};
  const state=()=>{
    if(!window.__saEngine){
      const saved=loadSaved();
      window.__saEngine={
        tab:saved.tab&&(saved.tab in datasets)?saved.tab:'companies',
        field:saved.field||'',
        op:saved.op||'يحتوي',
        value:saved.value||''
      };
    }
    return window.__saEngine;
  };
  const cellStr=c=>(c&&typeof c==='object'&&'v' in c)?String(c.v):String(c??'');
  const notice=msg=>(typeof window.__toast==='function'?window.__toast:typeof toast==='function'?toast:console.log)(msg);
  const hbars=items=>{
    const max=Math.max(...items.map(x=>x[1]),1);
    return `<div class="sa-hbar">${items.map(x=>`<div class="row"><span class="nm">${x[0]}</span><span class="track"><i style="width:${Math.round(x[1]/max*100)}%;background:${x[2]||'var(--navy)'}"></i></span><span class="pc">${x[1]}</span></div>`).join('')}</div>`;
  };

  Object.assign(WafraOps,{
    saTab:k=>{const s=state();s.tab=k;s.field='';s.value='';persist(s);render();},
    saFieldChange:()=>{const s=state();s.field=document.getElementById('sa-field')?.value||'';s.value='';persist(s);render();},
    saRun:()=>{const s=state();s.field=document.getElementById('sa-field')?.value||'';s.op=document.getElementById('sa-op')?.value||'يحتوي';s.value=document.getElementById('sa-value')?.value||'';persist(s);render();notice('تم تشغيل البحث والتحليل على النتائج الحالية.');},
    saClear:()=>{const s=state();s.field='';s.op='يحتوي';s.value='';persist(s);render();notice('تم مسح الفلاتر.');},
    saSave:()=>{persist(state());notice('تم حفظ التبويب والاستعلام.');},
    saChip:t=>{const s=state();s.value=t||'';persist(s);render();notice('تم تطبيق الاستعلام.');},
    saAddFilter:()=>notice('تمت إضافة صف فلتر جديد للجلسة الحالية.'),
    goSearchAnalysis:()=>{
      const key='searchAnalysis';
      const cur=(location.hash.replace(/^#/,'').split('?')[0])||'dashboard';
      if(cur===key){render();return;}
      location.hash=key;

  /* إعادة الرسم إذا نُقر نفس الرابط وكانت الهاش لم تتغيّر (بعد فشل سابق) */
  if(typeof document!=='undefined'){
    document.addEventListener('click',function(e){

      const k=(a.getAttribute('href')||'').replace(/^#/,'').split('?')[0];
      if(!k) return;
      const cur=(location.hash.replace(/^#/,'').split('?')[0])||'dashboard';
      if(cur===k){e.preventDefault();render();}
    },true);
  }

  S.searchAnalysis=()=>{
    try{
      const s=state();
      const tab=(s.tab in datasets)?s.tab:'companies';
      s.tab=tab;
      const data=datasets[tab];
      const fieldOpts=fields[tab]||fields.companies;
      const field=fieldOpts.includes(s.field)?s.field:fieldOpts[0];
      s.field=field;
      const q=(s.value||'').trim();
      const filtered=(!q)?data.rows:data.rows.filter(r=>r.map(cellStr).join(' ').includes(q));
      const tabBar=`<div class="sa-tabs">${tabs.map(t=>`<button type="button" class="sa-tab ${tab===t.k?'on':''}" onclick="WafraOps.saTab('${t.k}')"><span class="ic">${t.i}</span>${t.t}</button>`).join('')}</div>`;
      const freeText=/(سعر|قيمة العقد|تاريخ|بريد|جوال|هوية|رقم الشركة|رقم الهوية)/.test(field);
      const hinted=((valueHints[tab]||{})[field])||[];
      const forceSelect=(tab==='cars'||tab==='contracts')&&!freeText;
      const opts=hinted.length?hinted:(forceSelect?['—']:[]);
      const valueControl=opts.length
        ? `<select id="sa-value" class="sa-sel sa-value-sel"><option value="">اختر القيمة</option>${opts.filter(v=>v!=='—').map(v=>`<option value="${v.replace(/"/g,'&quot;')}" ${v===s.value?'selected':''}>${v}</option>`).join('')}</select>`
        : `<input id="sa-value" class="sa-inp" value="${(s.value||'').replace(/"/g,'&quot;')}" placeholder="القيمة">`;
      const filterCard=`<div class="sa-filter-card"><div class="sa-filter-row">
        <select id="sa-field" class="sa-sel" onchange="WafraOps.saFieldChange()">${fieldOpts.map(f=>`<option ${f===field?'selected':''}>${f}</option>`).join('')}</select>
        <select id="sa-op" class="sa-sel">${ops.map(o=>`<option ${o===(s.op||'يحتوي')?'selected':''}>${o}</option>`).join('')}</select>
        ${valueControl}
        <button type="button" class="sa-btn primary" onclick="WafraOps.saRun()">⌕ تحليل البحث</button>
        <button type="button" class="sa-btn" onclick="WafraOps.saAddFilter()">＋ إضافة فلتر</button>
      </div><div class="sa-actions">
        <button type="button" class="sa-btn ghost" onclick="WafraOps.saClear()">مسح الكل</button>
        <button type="button" class="sa-btn ghost" onclick="WafraOps.saSave()">حفظ الاستعلام</button>
        <div class="grow"></div>
        <div class="sa-exports">
          <button type="button" class="sa-btn" onclick="WafraOps.exportCurrent('محرك-البحث','PDF')">PDF</button>
          <button type="button" class="sa-btn" onclick="WafraOps.exportCurrent('محرك-البحث','Excel')">Excel</button>
          <button type="button" class="sa-btn" onclick="WafraOps.exportCurrent('محرك-البحث','CSV')">CSV</button>
        </div>
      </div></div>`;
      const chipRow=`<div class="sa-chips">${chips.map(c=>`<button type="button" class="sa-chip" onclick="WafraOps.saChip(this.querySelector('b').textContent)"><span class="bolt">⚡</span><div><b>${c.t}</b><span>${c.d}</span></div></button>`).join('')}</div>`;
      const stats=`<div class="sa-stats">${data.stats.map(x=>`<div class="sa-stat"><div class="k">${x.k}</div><div class="v">${x.v}${x.s?`<small>${x.s}</small>`:''}</div></div>`).join('')}</div>`;
      const body=`<div class="sa-grid">
        <div class="sa-panel"><div class="sa-panel-h">توزيع النتائج</div><div class="sa-panel-b">${hbars(data.chart)}</div></div>
        <div class="sa-panel"><div class="sa-panel-h">نتائج ${tabs.find(t=>t.k===tab)?.t||''} · ${filtered.length}</div><div class="sa-panel-b sa-table-wrap">${table(data.cols,filtered)}</div></div>
        ${chipRow}
      </div>`;
      return phead('محرك البحث والتحليل','ابحث داخل جميع بيانات المنصّة، اجمع أكثر من فلتر، واحصل على النتائج والرسوم فوراً',[])
        +`<div class="sa-wrap">${tabBar}${filterCard}${stats}${body}</div>`;
    }catch(err){
      console.error(err);
      return phead('محرك البحث والتحليل','تعذّر عرض الشاشة',[])+note('dngr','خطأ في العرض',String(err&&err.message||err));
    }
  };

  const home=NAV.find(g=>g.g===null);
  if(home&&!home.items.some(i=>i.k==='searchAnalysis'))home.items.splice(1,0,{k:'searchAnalysis',t:'محرك البحث والتحليل',i:'⌕'});
  if(window.TITLES)window.TITLES.searchAnalysis='محرك البحث والتحليل';
  if(((location.hash.replace(/^#/,'').split('?')[0])||'')==='searchAnalysis')render();
})();
</script>

  const defaultState=()=>({type:'cartype',a:'تويوتا',b:'هيونداي'});
  const state=()=>{
    if(!window.__cmpState) window.__cmpState=defaultState();
    return window.__cmpState;
  };
  const typeOf=k=>TYPES.find(t=>t.k===k)||TYPES[4];
  const entity=name=>DATA[name]||DATA['تويوتا'];
  const scoreSum=e=>e.scores.reduce((a,b)=>a+b,0);

  const radar=(aName,bName,aScores,bScores)=>{
    const labels=['الإيرادات','العقود','الإشغال','متوسط العقد','الرضا'];
    const cx=160,cy=150,r=100,n=5;
    const pt=(scores,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const v=scores[i]/100;return [cx+Math.cos(ang)*r*v,cy+Math.sin(ang)*r*v];};
    const ring=level=>{
      const pts=[]; for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;pts.push(`${cx+Math.cos(ang)*r*level},${cy+Math.sin(ang)*r*level}`);}
      return pts.join(' ');
    };
    const poly=scores=>scores.map((_,i)=>pt(scores,i).join(',')).join(' ');
    const axes=labels.map((lb,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/n;
      const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      const lx=cx+Math.cos(ang)*(r+22), ly=cy+Math.sin(ang)*(r+18);
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D7DEEE" stroke-width="1"/><text x="${lx}" y="${ly}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="#5A657C">${lb}</text>`;
    }).join('');
    return `<svg viewBox="0 0 320 310" role="img" aria-label="البصمة الأدائية">
      <polygon points="${ring(1)}" fill="#F5F7FC" stroke="#D7DEEE" stroke-width="1"/>
      <polygon points="${ring(.75)}" fill="none" stroke="#E4E9F3" stroke-width="1"/>
      <polygon points="${ring(.5)}" fill="none" stroke="#E4E9F3" stroke-width="1"/>
      <polygon points="${ring(.25)}" fill="none" stroke="#E4E9F3" stroke-width="1"/>
      ${axes}
      <polygon points="${poly(aScores)}" fill="rgba(41,59,133,.28)" stroke="#293B85" stroke-width="2"/>
      <polygon points="${poly(bScores)}" fill="rgba(226,61,61,.18)" stroke="#E23D3D" stroke-width="2"/>
      ${aScores.map((_,i)=>{const [x,y]=pt(aScores,i);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#293B85"/>`;}).join('')}
      ${bScores.map((_,i)=>{const [x,y]=pt(bScores,i);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#E23D3D"/>`;}).join('')}
    </svg>`;
  };

  const bars=(aName,bName,aScores,bScores)=>{
    const labels=['الإيرادات','العقود','الإشغال','متوسط','الرضا'];
    const W=360,H=260,padL=36,padR=16,padT=18,padB=42;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const groupW=plotW/labels.length;
    const barW=Math.min(18,groupW*0.28);
    const grid=[0,25,50,75,100].map(v=>{
      const y=padT+plotH-(v/100)*plotH;
      return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#EEF1F7" stroke-width="1"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-family="Cairo" font-size="10" fill="#9AA3B5">${v}</text>`;
    }).join('');
    const groups=labels.map((lb,i)=>{
      const gx=padL+i*groupW+groupW/2;
      const ha=(aScores[i]/100)*plotH, hb=(bScores[i]/100)*plotH;
      return `<g>
        <rect x="${gx-barW-3}" y="${padT+plotH-ha}" width="${barW}" height="${ha}" rx="4" fill="#293B85"/>
        <rect x="${gx+3}" y="${padT+plotH-hb}" width="${barW}" height="${hb}" rx="4" fill="#E23D3D"/>
        <text x="${gx}" y="${H-14}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="#5A657C">${lb}</text>
      </g>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مقارنة المؤشرات">${grid}${groups}</svg>`;
  };

  Object.assign(WafraOps,{
    cmpSetType:k=>{
      const t=typeOf(k); const st=state();
      st.type=k;
      if(k==='year'){st.a='2022';st.b='2023';}
      else if(k==='month'){st.a='أغسطس 2026';st.b='سبتمبر 2026';}
      else if(k==='cartype'){st.a='تويوتا';st.b='هيونداي';}
      else{st.a=t.items[0];st.b=t.items[1]||t.items[0];}
      render();
    },
    cmpSetA:v=>{state().a=v;render();},
    cmpSetB:v=>{state().b=v;render();},
    cmpAddItem:()=>{
      const t=typeOf(state().type);
      const msg=t.mode==='period'?'أضف فترة ثالثة للمقارنة':'أضف عنصراً ثالثاً للمقارنة';
      (WafraOps.demoAction||(m=>alert(m)))(msg);
    }
  });

  const baseAnalytics=S.analytics;
  S.analytics=()=>{
    const active=window.__analyticsTab||'search';
    if(active!=='compare') return baseAnalytics();

    const st=state();
    const t=typeOf(st.type);
    if(!t.items.includes(st.a)) st.a=t.items[0];
    if(!t.items.includes(st.b)) st.b=t.items[1]||t.items[0];
    const A=entity(st.a), B=entity(st.b);
    const aWins=scoreSum(A)>=scoreSum(B);
    const isPeriod=t.mode==='period';
    const labelA=isPeriod?'الفترة 1':'العنصر 1';
    const labelB=isPeriod?'الفترة 2':'العنصر 2';
    const addLabel=isPeriod?'＋ فلتر':'＋ عنصر';

    const filters=`<div class="cmp-filters">
      <div class="cmp-field"><label>نوع المقارنة</label>
        <select onchange="WafraOps.cmpSetType(this.value)">${TYPES.map(x=>`<option value="${x.k}" ${x.k===st.type?'selected':''}>${x.t}</option>`).join('')}</select>
      </div>
      <div class="cmp-field"><label>${labelA}</label>
        <select onchange="WafraOps.cmpSetA(this.value)">${t.items.map(x=>`<option value="${x}" ${x===st.a?'selected':''}>${x}</option>`).join('')}</select>
      </div>
      <div class="cmp-field"><label>${labelB}</label>
        <select onchange="WafraOps.cmpSetB(this.value)">${t.items.map(x=>`<option value="${x}" ${x===st.b?'selected':''}>${x}</option>`).join('')}</select>
      </div>
      <div class="cmp-field"><label>&nbsp;</label>
        <button type="button" class="cmp-add" onclick="WafraOps.cmpAddItem()">${addLabel}</button>
      </div>
    </div>`;

    const metricLabels=METRICS.map(m=>`<span>${m.l}</span>`).join('');
    const vals=e=>METRICS.map(m=>`<b>${e[m.k]}</b>`).join('');

    let compareBody;
    if(isPeriod){
      const current=st.b;
      compareBody=`<div class="cmp-cards">
        <div class="cmp-card a"><div class="cmp-name">${st.a}</div>${METRICS.map(m=>`<div class="cmp-row"><span class="lbl">${m.l}</span><span class="val">${A[m.k]}</span></div>`).join('')}</div>
        <div class="cmp-card b"><div class="cmp-name">${st.b}${current?` <span class="cmp-badge cur">حالي</span>`:''}</div>${METRICS.map(m=>`<div class="cmp-row"><span class="lbl">${m.l}</span><span class="val">${B[m.k]}</span></div>`).join('')}</div>
      </div>`;
    }else{
      compareBody=`<div class="cmp-vs">
        <div class="cmp-side a ${aWins?'win':''}">
          <div class="cmp-name">${st.a}${aWins?' <span class="cmp-badge">الأعلى</span>':''}</div>
          <div class="cmp-vals">${vals(A)}</div>
        </div>
        <div class="cmp-metrics">${metricLabels}</div>
        <div class="cmp-side b ${!aWins?'win':''}">
          <div class="cmp-name">${st.b}${!aWins?' <span class="cmp-badge">الأعلى</span>':''}</div>
          <div class="cmp-vals">${vals(B)}</div>
        </div>
      </div>`;
    }

    const legend=`<div class="cmp-legend"><span><i style="background:#293B85"></i>${st.a}</span><span><i style="background:#E23D3D"></i>${st.b}</span></div>`;
    const charts=`<div class="cmp-charts">
      <div class="cmp-panel"><div class="cmp-panel-h"><span>البصمة الأدائية</span>${legend}</div><div class="cmp-panel-b">${radar(st.a,st.b,A.scores,B.scores)}</div></div>
      <div class="cmp-panel"><div class="cmp-panel-h"><span>مقارنة المؤشرات</span>${legend}</div><div class="cmp-panel-b">${bars(st.a,st.b,A.scores,B.scores)}</div></div>
    </div>`;

    return phead('المقارنات','قارن الأداء جنباً إلى جنب بين أي عدد من الشركات، مدن، مناطق، فروع، أنواع سيارات، أو فترات زمنية',[],`<button type="button" class="btn coral" onclick="WafraOps.createAnalyticsReport()">＋ إنشاء تقرير</button>`)
      +card(tabbar(active)+`<div class="cmp-wrap" style="padding:14px">${filters}${compareBody}${charts}</div>`);
  };
})();

<script>
/* التحليل الفني — معرض الرسوم مطابق لنموذج التصميم. */
(function(){
  const tabs=[['search','البحث والتحليل'],['compare','المقارنات'],['technical','التحليل الفني'],['operations','المؤشرات التشغيلية'],['financial','النظرة المالية'],['map','الخريطة التفاعلية'],['delivery','خدمة التوصيل'],['scheduled','التقارير المجدولة'],['sla','مراقبة مستوى الخدمة'],['transfer','النقل بين الفروع']];
  const tabbar=active=>`<div class="tabs">${tabs.map(([key,label])=>`<button class="tab ${active===key?'on':''}" onclick="WafraOps.switchAnalyticsTab('${key}')">${label}</button>`).join('')}</div>`;
  const C={navy:'#293B85',red:'#E23D3D',amber:'#EAA631',green:'#20A16E',blue:'#2C68D8',purple:'#8367C7',teal:'#1AA6A6',pink:'#E85D8E',ink:'#1E2A44',muted:'#7A869E',line:'#E4E9F3'};

  const panel=(kind,title,body,legend)=>`<div class="ta-panel"><div class="ta-panel-h"><span><span class="kind">${kind} ·</span> ${title}</span>${legend||''}</div><div class="ta-panel-b">${body}</div></div>`;
  const leg=items=>`<div class="ta-legend">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

  const lineChart=()=>{
    const months=['فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر'];
    const a=[86,92,84,90,95,88,93,89], b=[48,52,44,56,50,58,46,54];
    const W=420,H=220,p={l:36,r:14,t:18,b:36}, pw=W-p.l-p.r, ph=H-p.t-p.b;
    const x=i=>p.l+(i/(months.length-1))*pw, y=v=>p.t+ph-(v/100)*ph;
    const path=vals=>vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
    const grid=[0,25,50,75,100].map(v=>`<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="${C.line}"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end" font-family="Cairo" font-size="10" fill="${C.muted}">${v}</text>`).join('');
    const labels=months.map((m,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-family="Cairo" font-size="10" font-weight="700" fill="${C.muted}">${m}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الاتجاه الشهري">${grid}
      <path d="${path(a)}" fill="none" stroke="${C.navy}" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="${path(b)}" fill="none" stroke="${C.red}" stroke-width="2.5" stroke-linejoin="round"/>
      ${a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${C.navy}"/>`).join('')}
      ${b.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${C.red}"/>`).join('')}
      ${labels}</svg>`;
  };

  const barChart=()=>{
    const cities=[['جدة',32,'#293B85'],['الرياض',28,'#E23D3D'],['مكة',18,'#EAA631'],['أبها',14,'#20A16E'],['الدمام',12,'#2C68D8'],['الخبر',10,'#8367C7'],['بريدة',8,'#1AA6A6']];
    const W=420,H=220,p={l:44,r:12,t:16,b:40}, pw=W-p.l-p.r, ph=H-p.t-p.b, mx=35;
    const bw=pw/cities.length*0.55, gap=pw/cities.length;
    const y=v=>p.t+ph-(v/mx)*ph;
    const grid=[0,10,20,30].map(v=>`<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-family="Cairo" font-size="9" fill="${C.muted}">${v}M</text>`).join('');
    const bars=cities.map(([n,v,c],i)=>{
      const cx=p.l+i*gap+gap/2;
      return `<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${p.t+ph-y(v)}" rx="5" fill="${c}"/><text x="${cx}" y="${H-12}" text-anchor="middle" font-family="Cairo" font-size="10" font-weight="700" fill="${C.muted}">${n}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الإيرادات حسب المدينة">${grid}${bars}</svg>`;
  };

  const heatMap=()=>{
    const days=['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'];
    const rows=[['الرياض',[72,98,86,90,78,64,40]],['جدة',[68,84,76,80,70,58,36]],['مكة',[54,62,58,66,60,48,28]],['الدمام',[48,55,52,58,50,42,25]]];
    const color=v=>{
      const t=Math.min(1,Math.max(0,(v-20)/90));
      const r=Math.round(220-t*180), g=Math.round(230-t*150), b=Math.round(255-t*70);
      return `rgb(${r},${g},${b})`;
    };
    const ink=v=>v>=70?'#fff':'#2A3550';
    return `<table class="ta-heat"><thead><tr><th></th>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(([c,vals])=>`<tr><td class="rl">${c}</td>${vals.map(v=>`<td style="background:${color(v)};color:${ink(v)}">${v}</td>`).join('')}</tr>`).join('')}
    </tbody></table>`;
  };

  const pieChart=()=>{
    const segs=[['عالمية',14,C.navy],['فاخرة',28,C.red],['عائلية',22,C.amber],['اقتصادية',20,C.green],['تجارية',16,C.blue]];
    const total=segs.reduce((s,x)=>s+x[1],0);
    let a=-90;
    const paths=segs.map(([n,v,c])=>{
      const sweep=v/total*360, a1=a*Math.PI/180, a2=(a+sweep)*Math.PI/180; a+=sweep;
      const x1=110+88*Math.cos(a1), y1=110+88*Math.sin(a1);
      const x2=110+88*Math.cos(a2), y2=110+88*Math.sin(a2);
      const large=sweep>180?1:0;
      return `<path d="M110,110 L${x1},${y1} A88,88 0 ${large} 1 ${x2},${y2} Z" fill="${c}"/>`;
    }).join('');
    return `<svg viewBox="0 0 220 220" role="img" aria-label="توزيع الأسطول">${paths}<circle cx="110" cy="110" r="48" fill="#fff"/></svg>`;
  };

  const funnel=()=>{
    const steps=[['زيارات المنصة','4,879 · 100%',C.navy,100],['عمليات بحث','3,989 · 81.7%',C.red,82],['حجوزات','2,674 · 54.8%',C.amber,58],['عقود مبرمة','1,674 · 34.3%',C.green,40],['عملاء متكررون','836 · 17.1%',C.blue,24]];
    return `<div class="ta-funnel">${steps.map(([t,v,c,w])=>`<div class="row"><div class="bar" style="width:${w}%;background:${c}"><b>${t}</b><span>${v}</span></div></div>`).join('')}</div>`;
  };

  const treemap=()=>{
    const cells=[
      {t:'التميّز',v:'8,946 ر.س',c:C.navy,cls:''},{t:'النخبة',v:'6,568 ر.س',c:C.amber,cls:''},{t:'الوفرة',v:'5,432 ر.س',c:C.blue,cls:''},{t:'إتقان',v:'4,321 ر.س',c:C.teal,cls:''},
      {t:'جوار',v:'2,110 ر.س',c:C.red,cls:''},{t:'السعة',v:'1,988 ر.س',c:C.green,cls:''},{t:'المستقبل',v:'1,877 ر.س',c:C.purple,cls:''},{t:'الخليج',v:'1,765 ر.س',c:C.pink,cls:''},
      {t:'الينبوع',v:'1,654 ر.س',c:'#3A4F8C',cls:''},{t:'الطموح',v:'3,420 ر.س',c:'#5B4DB0',cls:'big'}
    ];
    return `<div class="ta-tree">${cells.map(x=>`<div class="c ${x.cls}" style="background:${x.c}"><b>${x.t}</b><span>${x.v}</span></div>`).join('')}</div>`;
  };

  const radarCities=()=>{
    const labels=['الرياض','جدة','مكة','الدمام','الخبر','المدينة'];
    const scores=[92,78,70,64,60,68];
    const cx=150,cy=140,r=95,n=6;
    const pt=(sc,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const v=sc/100;return [cx+Math.cos(ang)*r*v,cy+Math.sin(ang)*r*v];};
    const ring=lv=>{const pts=[];for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;pts.push(`${cx+Math.cos(ang)*r*lv},${cy+Math.sin(ang)*r*lv}`);}return pts.join(' ');};
    const poly=scores.map((s,i)=>pt(s,i).join(',')).join(' ');
    const axes=labels.map((lb,i)=>{
      const ang=-Math.PI/2+i*2*Math.PI/n;
      const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
      const lx=cx+Math.cos(ang)*(r+22),ly=cy+Math.sin(ang)*(r+18);
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${C.line}"/><text x="${lx}" y="${ly}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}">${lb}</text>`;
    }).join('');
    return `<svg viewBox="0 0 300 300" role="img" aria-label="مؤشرات المدن">
      <polygon points="${ring(1)}" fill="#F5F7FC" stroke="${C.line}"/><polygon points="${ring(.66)}" fill="none" stroke="${C.line}"/><polygon points="${ring(.33)}" fill="none" stroke="${C.line}"/>
      ${axes}<polygon points="${poly}" fill="rgba(44,104,216,.25)" stroke="${C.blue}" stroke-width="2"/>
      ${scores.map((s,i)=>{const [x,y]=pt(s,i);return `<circle cx="${x}" cy="${y}" r="3.5" fill="${C.navy}"/>`;}).join('')}
    </svg>`;
  };

  const geoMap=()=>{
    const bubbles=[[210,250,28],[160,210,18],[190,270,14],[280,230,16],[300,210,12],[120,160,10],[240,300,11],[100,250,8]];
    return `<svg viewBox="0 0 420 360" role="img" aria-label="التوزيع الجغرافي">
      <path d="M90 200 L150 90 L230 70 L300 110 L360 180 L390 260 L350 320 L280 340 L200 330 L120 290 Z" fill="#DCE6F8" stroke="#A9BCEB" stroke-width="2"/>
      <path d="M150 180 L190 140 L240 155 L270 200 L240 240 L180 235 Z" fill="#C9D7F2" opacity=".7"/>
      ${bubbles.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${C.red}" fill-opacity=".78" stroke="#fff" stroke-width="2"/>`).join('')}
    </svg>`;
  };

  const gauge=()=>{
    const pct=72, start=Math.PI, end=0, cx=120, cy=120, r=78;
    const ang=start-(pct/100)*Math.PI;
    const x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
    const arc=(a0,a1,color,w=16)=>{
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      return `<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    return `<svg viewBox="0 0 240 160" role="img" aria-label="الإشغال">
      ${arc(Math.PI,0,'#E8EDF7',16)}
      ${arc(Math.PI,ang,C.green,16)}
      <circle cx="${x}" cy="${y}" r="7" fill="${C.green}" stroke="#fff" stroke-width="3"/>
      <text x="120" y="118" text-anchor="middle" font-family="Cairo" font-size="34" font-weight="800" fill="${C.ink}">72%</text>
      <text x="120" y="142" text-anchor="middle" font-family="Cairo" font-size="12" font-weight="700" fill="${C.muted}">نسبة الإشغال</text>
    </svg>`;
  };

  const bubbleChart=()=>{
    const cities=[
      {n:'الرياض',x:1180,y:32000,r:38,c:C.navy},{n:'جدة',x:980,y:24000,r:32,c:C.red},
      {n:'مكة',x:720,y:16000,r:26,c:C.amber},{n:'الدمام',x:560,y:12000,r:22,c:C.green},
      {n:'الخبر',x:480,y:9000,r:18,c:C.purple},{n:'المدينة',x:400,y:7000,r:16,c:C.teal}
    ];
    const W=420,H=240,p={l:48,r:16,t:16,b:40}, pw=W-p.l-p.r, ph=H-p.t-p.b;
    const X=v=>p.l+(v/1600)*pw, Y=v=>p.t+ph-(v/40000)*ph;
    const grid=[0,10000,20000,30000,40000].map(v=>`<line x1="${p.l}" y1="${Y(v)}" x2="${W-p.r}" y2="${Y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-family="Cairo" font-size="9" fill="${C.muted}">${v/1000}k</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="فقاعات المدن">${grid}
      <text x="${W/2}" y="${H-8}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}">الأسطول</text>
      <text x="14" y="${H/2}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}" transform="rotate(-90 14 ${H/2})">إيراد (ألف)</text>
      ${cities.map(c=>`<circle cx="${X(c.x)}" cy="${Y(c.y)}" r="${c.r}" fill="${c.c}" fill-opacity=".55" stroke="${c.c}" stroke-width="1.5"/>`).join('')}
    </svg>`;
  };

  const scatterChart=()=>{
    const pts=[[120,18],[180,22],[220,28],[260,35],[300,30],[340,42],[380,38],[420,48],[460,55],[500,44],[540,36],[580,28],[620,22],[680,18],[740,14],[800,12],[200,12],[350,20],[450,32],[520,50],[560,40],[600,25]];
    const W=420,H=240,p={l:40,r:14,t:16,b:40}, pw=W-p.l-p.r, ph=H-p.t-p.b;
    const X=v=>p.l+(v/900)*pw, Y=v=>p.t+ph-(v/60)*ph;
    const grid=[0,15,30,45,60].map(v=>`<line x1="${p.l}" y1="${Y(v)}" x2="${W-p.r}" y2="${Y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-family="Cairo" font-size="9" fill="${C.muted}">${v}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="السعر مقابل التأجير">${grid}
      <text x="${W/2}" y="${H-8}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}">السعر اليومي</text>
      <text x="12" y="${H/2}" text-anchor="middle" font-family="Cairo" font-size="11" font-weight="700" fill="${C.muted}" transform="rotate(-90 12 ${H/2})">عدد المرات</text>
      ${pts.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="${C.navy}" fill-opacity=".75"/>`).join('')}
      <circle cx="${X(460)}" cy="${Y(55)}" r="10" fill="${C.blue}" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
      <text x="${X(460)+14}" y="${Y(55)+4}" font-family="Cairo" font-size="11" font-weight="800" fill="${C.ink}">سيارات</text>
    </svg>`;
  };

  const baseAnalytics=S.analytics;
  S.analytics=()=>{
    const active=window.__analyticsTab||'search';
    if(active!=='technical') return baseAnalytics();

    const body=`<div class="ta-wrap">
      <div class="ta-grid2">
        ${panel('Line','الاتجاه الشهري',lineChart(),leg([[C.navy,'عوائد'],[C.red,'مصاريف']]))}
        ${panel('Bar','الإيرادات حسب المدينة',barChart())}
        ${panel('Heat Map','كثافة الطلب (مدينة × يوم)',heatMap())}
        ${panel('Pie','توزيع الأسطول حسب الفئة',pieChart(),leg([[C.navy,'عالمية'],[C.red,'فاخرة'],[C.amber,'عائلية'],[C.green,'اقتصادية'],[C.blue,'تجارية']]))}
      </div>
      <div class="ta-grid2">
        ${panel('Funnel','قمع التحويل',funnel())}
        ${panel('Treemap','حصة الإيرادات بالشركات',treemap())}
      </div>
      <div class="ta-grid3">
        ${panel('Radar','مؤشرات المدن',radarCities(),leg([[C.blue,'إجمالي']]))}
        ${panel('Geo','التوزيع الجغرافي',geoMap())}
        ${panel('Gauge','الإشغال',gauge())}
      </div>
      <div class="ta-grid2">
        ${panel('Bubble','المدن (أسطول × إيراد × حجم)',bubbleChart(),leg([[C.navy,'الرياض'],[C.red,'جدة'],[C.amber,'مكة'],[C.green,'الدمام'],[C.purple,'الخبر'],[C.teal,'المدينة']]))}
        ${panel('Scatter','السعر مقابل مرات التأجير',scatterChart())}
      </div>
    </div>`;

    return phead(`التحليل الفني <span class="ta-beta">بيتا</span>`,'لوحات تحليلية متقدمة لأداء المنصة: اتجاهات، كثافة طلب، قمع تحويل، وتوزيع جغرافي',[],`<button class="btn ghost" onclick="WafraOps.demoAction('تصدير Excel')">Excel ⤓</button><button class="btn ghost" onclick="WafraOps.demoAction('تصدير PDF')">PDF ⤓</button>`)
      +card(tabbar(active)+body);
  };
})();
</script>

<script>
/* المؤشرات التشغيلية — واجهة مطابقة لنموذج التصميم. */
(function(){
  const tabs=[['search','البحث والتحليل'],['compare','المقارنات'],['technical','التحليل الفني'],['operations','المؤشرات التشغيلية'],['financial','النظرة المالية'],['map','الخريطة التفاعلية'],['delivery','خدمة التوصيل'],['scheduled','التقارير المجدولة'],['sla','مراقبة مستوى الخدمة'],['transfer','النقل بين الفروع']];
  const tabbar=active=>`<div class="tabs">${tabs.map(([key,label])=>`<button class="tab ${active===key?'on':''}" onclick="WafraOps.switchAnalyticsTab('${key}')">${label}</button>`).join('')}</div>`;
  const C={navy:'#293B85',blue:'#2C68D8',green:'#20A16E',red:'#E23D3D',amber:'#EAA631',ink:'#1E2A44',muted:'#7A869E',line:'#E4E9F3'};

  const kpiCard=(ic,label,value,tone)=>{
    const cls=tone==='danger'?'danger':tone==='warn'?'warn':'';
    return `<div class="op-kpi"><div class="ic ${cls}">${ic}</div><div class="l">${label}</div><div class="v">${value}</div></div>`;
  };

  const contractBars=()=>{
    const items=[['مفتوح',3705,C.blue],['مغلق',4120,C.green],['ملغي',1707,C.red],['منتهي',4200,C.navy],['متأخر',1300,C.amber]];
    const W=420,H=250,p={l:42,r:12,t:16,b:40},pw=W-p.l-p.r,ph=H-p.t-p.b,mx=4500;
    const y=v=>p.t+ph-(v/mx)*ph;
    const gap=pw/items.length,bw=gap*0.48;
    const grid=[0,1500,3000,4500].map(v=>`<line x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}" stroke="${C.line}"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-family="Cairo" font-size="10" fill="${C.muted}">${v.toLocaleString('en')}</text>`).join('');
    const bars=items.map(([n,v,c],i)=>{
      const cx=p.l+i*gap+gap/2;

  };

  const gauge=(pct,color,label)=>{
    const start=Math.PI, cx=70, cy=68, r=48;
    const ang=start-(Math.min(100,pct)/100)*Math.PI;
    const arc=(a0,a1,col,w=12)=>{
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      return `<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;

    const tipX=cx+r*Math.cos(ang), tipY=cy+r*Math.sin(ang);
    const txt=Number.isInteger(pct)?`${pct}%`:`${pct}%`;
    return `<div class="op-gauge"><svg viewBox="0 0 140 100" role="img" aria-label="${label}">

      kpiCard('▣','العقود المغلقة','8,230'),
      kpiCard('✕','العقود الملغاة','1,707'),
      kpiCard('◷','متوسط مدة الإيجار','22.5 <small>يوم</small>'),
      kpiCard('🚚','متوسط وقت التسليم','31 <small>د</small>'),
      kpiCard('⏱','متوسط وقت الاستجابة','61 <small>د</small>')
    ].join('');

    const row2=[
      kpiCard('👤','عدد العملاء','520'),
      kpiCard('👥','عدد المستخدمين','64'),
      kpiCard('🏢','عدد الشركات','28'),
      kpiCard('📍','عدد الفروع','242'),
      kpiCard('⚑','عدد الشكاوى','779','danger'),
      kpiCard('🎫','عدد التذاكر','310','warn')
    ].join('');

    const gauges=`<div class="op-gauges">
      ${gauge(73,C.green,'معدل الإشغال')}
      ${gauge(11.4,C.red,'معدل الإلغاء')}
      ${gauge(98,C.green,'معدل التحصيل')}
      ${gauge(99.6,C.green,'معدل الاحتفاظ بالعملاء')}
      ${gauge(96.5,C.green,'معدل تكرار الاستئجار')}
    </div>`;

    const body=`<div class="op-wrap">
      <div class="op-kpis">${row1}</div>
      <div class="op-kpis row2">${row2}</div>
      <div class="op-grid">
        <div class="op-panel"><div class="op-panel-h">حالة العقود</div><div class="op-panel-b">${contractBars()}</div></div>
        <div class="op-panel"><div class="op-panel-h">المعدلات التشغيلية</div><div class="op-panel-b">${gauges}</div></div>
      </div>
    </div>`;

    return phead('المؤشرات التشغيلية','مؤشرات الأداء التشغيلي (Operational KPIs) محسوبة تلقائياً من بيانات المنصة',[],`<button class="btn ghost" onclick="WafraOps.demoAction('تصدير المؤشرات التشغيلية')">⤒ تصدير</button>`)
      +card(tabbar(active)+body);
  };
})();

      ['مكة التشغيلية','9',`<span class="ox-pill g">4.1</span>`]

    const worst=[
      ['الخبر التشغيلي','7',`<span class="ox-pill r">8.5</span>`],
      ['تبوك','5',`<span class="ox-pill r">8.3</span>`],

  const heads={

  const baseAnalytics=S.analytics;
  S.analytics=()=>{
    const active=window.__analyticsTab||'search';

<script>
/* تقارير الذكاء — نفس النصوص والألوان من نماذج التصميم. */
(function(){
  const money=v=>({v:String(v)+' ر.س',c:'num'});
  const toast=msg=>{
    const old=document.querySelector('.wafra-demo-toast'); old?.remove();
    const el=document.createElement('div'); el.className='toast on wafra-demo-toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
  };
  const kpi=(ic,l,v)=>`<div class="ix-kpi"><div class="top"><span class="ic">${ic}</span><span>${l}</span></div><div class="bot"><div class="v">${v}</div></div></div>`;
  const yExport=()=>`<button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent(document.querySelector('.phead h1')?.textContent||'تقرير','Excel')">⤓ Excel</button><button type="button" class="ix-ybtn" onclick="WafraOps.exportCurrent('تقرير','PDF')">📄 PDF</button>`;
  const saveBtn=(t='حفظ العرض')=>`<button type="button" class="ix-wbtn" onclick="WafraOps.demoAction('${t}')">💾 ${t}</button>`;
  const search=(ph)=>`<label class="ix-search">⌕ <input value="${(window.__ixQ||'').replace(/"/g,'&quot;')}" placeholder="${ph}" oninput="WafraOps.ixFilter(this.value)"></label>`;
  const tools=(ph,extra='')=>`<div class="ix-tools"><div class="grow">${search(ph)}</div><div class="acts">${extra}${yExport()}${saveBtn()}</div></div>`;
  const toolsNoSearch=(extra='')=>`<div class="ix-tools"><div class="acts">${yExport()}${extra||saveBtn()}</div></div>`;
  const foot=(n,pages=1)=>`<div class="ix-foot"><span>صفحة 1 من ${pages}</span><span>${n} سجل</span><div class="ix-pages">${Array.from({length:Math.min(pages,5)},(_,i)=>`<button type="button" class="${i===0?'on':''}">${i+1}</button>`).join('')}</div></div>`;
  const sel=(id,opts,all)=>{
    const cur=(window.__ixSel&&window.__ixSel[id])||'';
    return `<select class="ix-ysel" id="${id}" onchange="WafraOps.ixSelect('${id}',this.value)"><option value="" ${!cur?'selected':''}>${all}</option>${opts.map(o=>`<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('')}</select>`;
  };

  const LC_FLOW=[
    {stage:'بانتظار التسليم',tone:'r',next:'تم التسليم',btn:'تأكيد تم التسليم'},
    {stage:'تم التسليم',tone:'g',next:'قيد الاستخدام',btn:'تأكيد قيد الاستخدام'},
    {stage:'قيد الاستخدام',tone:'g',next:'بانتظار الفحص',btn:'تأكيد بانتظار الفحص'},
    {stage:'بانتظار الفحص',tone:'a',next:'مكتمل',btn:'تأكيد مكتمل'},
    {stage:'مكتمل',tone:'g',next:null,btn:null}
  ];
  const lcMeta=s=>LC_FLOW.find(x=>x.stage===s)||LC_FLOW[0];
  const ensureLc=()=>{
    if(!window.__ixLifecycle) window.__ixLifecycle=[
      {id:'BK-20010',customer:'أحمد العتيبي',car:'نيسان التيما 2021',stage:'بانتظار التسليم',photos:'2',docs:'✓',damage:'—'},
      {id:'BK-20014',customer:'عبدالله الزهراني',car:'هيونداي أكسنت 2020',stage:'تم التسليم',photos:'4',docs:'✓',damage:'—'},
      {id:'BK-20018',customer:'سارة القحطاني',car:'تويوتا لاندكروزر 2025',stage:'قيد الاستخدام',photos:'6',docs:'✓',damage:'—'},
      {id:'BK-20022',customer:'فهد الشمري',car:'كامري 2026',stage:'بانتظار الفحص',photos:'8',docs:'✓',damage:'—'},
      {id:'BK-20026',customer:'نورة الدوسري',car:'K5 2026',stage:'بانتظار التسليم',photos:'0',docs:'○',damage:'—'},
      {id:'BK-20030',customer:'خالد الحربي',car:'كورولا 2025',stage:'قيد الاستخدام',photos:'5',docs:'✓',damage:'—'}
    ];
    return window.__ixLifecycle;
  };
  const SEG_OPTS=['موثوق','عادي','مراقب','عالي المخاطر'];
  const segTone=s=>({موثوق:'g',عادي:'n',مراقب:'a','عالي المخاطر':'r'}[s]||'n');
  const segDeposit=s=>({موثوق:['0%','أساسي'],عادي:['0%','أساسي'],مراقب:['25%','شامل'],'عالي المخاطر':['50%','شامل']}[s]||['0%','أساسي']);
  const ensureLy=()=>{
    if(!window.__ixLoyalty) window.__ixLoyalty=[
      {name:'بدر الشمري',city:'تبوك',bookings:'42',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'يوسف الحربي',city:'الخبر',bookings:'28',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'أحمد العتيبي',city:'نجران',bookings:'68',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'نورة القحطاني',city:'مكة المكرمة',bookings:'35',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'},
      {name:'سارة الدوسري',city:'أبها',bookings:'19',score:'100',segment:'مراقب',deposit:'25%',insurance:'شامل'},
      {name:'خالد المطيري',city:'الرياض',bookings:'54',score:'100',segment:'عالي المخاطر',deposit:'50%',insurance:'شامل'},
      {name:'ريم الشمري',city:'جدة',bookings:'14',score:'100',segment:'موثوق',deposit:'0%',insurance:'أساسي'},
      {name:'وليد العنزي',city:'الدمام',bookings:'22',score:'100',segment:'عادي',deposit:'0%',insurance:'أساسي'}
    ];
    return window.__ixLoyalty;
  };

  Object.assign(WafraOps,{
    ixFilter:v=>{window.__ixQ=(v||'').trim();render();},
    ixSelect:(id,v)=>{window.__ixSel=window.__ixSel||{};window.__ixSel[id]=v;render();},
    ixAction:t=>toast(t),
    advanceLifecycle:id=>{
      const row=ensureLc().find(x=>x.id===id); if(!row) return;
      const meta=lcMeta(row.stage);
      if(!meta.next){toast('الحجز مكتمل مسبقاً');return;}
      row.stage=meta.next;
      if(row.stage!=='بانتظار التسليم') row.docs='✓';
      if(row.photos==='0') row.photos='2';
      toast('تم تحديث '+id+' إلى: '+row.stage);
      render();
    },
    openLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const opts=SEG_OPTS.map(o=>`<option value="${o}" ${o===row.segment?'selected':''}>${o}</option>`).join('');
      openM(modal('تعديل شريحة العميل',
        `<div style="margin-bottom:10px;font:800 14px Cairo;color:var(--ink)">${row.name}</div>
         ${note('info','تنبيه','الشريحة المحسوبة حالياً: '+row.segment+'. التعديل اليدوي يتجاوز الحساب الآلي.')}
         ${fld('الشريحة الجديدة',`<select id="ly-seg-new" class="native-input">${opts}</select>`)}`,
        `<button type="button" class="btn coral" onclick='WafraOps.saveLoyaltySegment(${JSON.stringify(row.name)})'>حفظ</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button>`,
        true));
    },
    saveLoyaltySegment:name=>{
      const row=ensureLy().find(x=>x.name===name); if(!row) return;
      const next=document.getElementById('ly-seg-new')?.value||row.segment;
      row.segment=next;
      const d=segDeposit(next); row.deposit=d[0]; row.insurance=d[1];
      closeM(); toast('تم تحديث شريحة '+name+' إلى '+next); render();
    },
    openReport:k=>{
      const map={supply:'supplyDemand',readiness:'fleetReadiness',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
      location.hash='#'+(map[k]||'supplyDemand');
    }
  });

  const q=()=>(window.__ixQ||'').toLowerCase();
  const sf=(rows,cols)=>!q()?rows:rows.filter(r=>cols.some(i=>String(r[i]&&r[i].v!==undefined?r[i].v:r[i]).toLowerCase().includes(q())));

  /* 1 — خريطة العرض والطلب */

  const loadFrStore=()=>{

    return {providers:defaultFrProviders(),cars:defaultFrCars(),hidden:{}};

    const r=[];

    if(c.insExp) r.push('تأمين منتهي');

    return r.length?r:['—'];

    if(s.cars[pid]&&s.cars[pid].length) return s.cars[pid];

      const ed=window.__frEdit; if(!ed) return;

      c.brand=(document.getElementById('fr-brand')?.value||c.brand).trim();
      c.model=(document.getElementById('fr-model')?.value||c.model).trim();
      c.year=Number(document.getElementById('fr-year')?.value||c.year);
      c.color=document.getElementById('fr-color')?.value||c.color;
      c.cat=document.getElementById('fr-cat')?.value||c.cat;
      c.price=Number(document.getElementById('fr-price')?.value||c.price);
      c.status=document.getElementById('fr-status')?.value||c.status;

      c.insExp=!!document.getElementById('fr-ins')?.checked;

    const qv=q();
    if(qv) rows=rows.filter(r=>[r.car,r.provider,r.cat,r.label].some(x=>String(x).toLowerCase().includes(qv)));
    const eco=limits['اقتصادية'];
    return phead('التسعير الديناميكي المُراقَب','المزوّدون يسعّرون ذاتياً — الشاشة تضع حدّاً أدنى وأقصى لكل فئة وترصد الخارج عن النطاق (سعر مرتفع / إغراق سعري)',[],
      `<button class="btn" onclick="WafraOps.openDpLimits()">تعديل الحدود السعرية</button>`)
    +`<div class="dp-kpis">
        ${dpKpi('↗','#FDECEC','أسعار مرتفعة (استغلال)',nHigh)}
        ${dpKpi('↘','#FFF4DE','إغراق سعري',nDump)}
        ${dpKpi('🚗','#EAF0FF','سيارات مخالفة',allViol.length)}
      </div>`
    +`<div class="dp-hint">${note('info','الحدود الحالية',`اقتصادية ${eco.min}–${eco.max} ر.س · سعر أعلى من الأقصى = استغلال الذروة · سعر أقل من الأدنى = إغراق سعري`)}</div>`
    +`<div class="ix-wrap">
        ${tools('ابحث بالسيارة أو المزود…',sel('dpCat',Object.keys(limits),'كل الفئات'))}
        <div class="ix-panel"><div class="ix-panel-b">${table(
          ['السيارة','المزوّد','الفئة','السعر','الحدّ','المخالفة','إجراءات'],
          rows.map(r=>[
            {v:r.car,c:'strong'},
            r.provider,
            r.cat,
            {v:`<span class="dp-price ${r.type}">${Number(r.price).toLocaleString('en-US')} ر.س</span>`},
            {v:`${r.bound} ${Number(r.limit).toLocaleString('en-US')} ر.س`,c:'num'},
            bdg(r.label,r.tone),
            `<div class="dp-acts"><button type="button" class="ix-gbtn" style="background:#20A16E" onclick="WafraOps.dpCorrect('${r.id}')">تصحيح للحد</button><button type="button" class="ix-wbtn" onclick="WafraOps.dpAlert('${r.id}')">تنبيه المزود</button></div>`
          ])
        )}${foot(rows.length,1)}</div></div>
      </div>`;
  };

  const items=[
    {k:'supplyDemand',t:'خريطة العرض والطلب',i:'▣'},
    {k:'fleetReadiness',t:'جاهزية الأسطول',i:'◎'},
    {k:'fleetDynamic',t:'التسعير الديناميكي',i:'↕'},
    {k:'fleetUtil',t:'استغلال الأسطول',i:'◔'},
    {k:'demandForecast',t:'التنبؤ بالطلب',i:'↗'},
    {k:'bookingLifecycle',t:'دورة حياة الحجز',i:'⟳'},
    {k:'customerLoyalty',t:'ولاء وتصنيف العملاء — تعديل الشرائح',i:'★'},
    {k:'commissionTiers',t:'شرائح العمولة',i:'%'},
    {k:'violationsDeposits',t:'المخالفات والودائع',i:'⚑'}
  ];
  let reports=NAV.find(g=>g.g==='التقارير');
  if(!reports){reports={g:'التقارير',items:[]};NAV.push(reports);}
  items.forEach(it=>{
    const ex=reports.items.find(x=>x.k===it.k);
    if(ex) ex.t=it.t; else {
      if(it.k==='fleetDynamic'){
        const i=reports.items.findIndex(x=>x.k==='fleetReadiness');
        reports.items.splice(i>=0?i+1:2,0,it);
      } else reports.items.push(it);
    }
  });
  if(window.TITLES) items.forEach(it=>window.TITLES[it.k]=it.t);
  if(typeof renderNav==='function') renderNav();

  S.reportDetail=()=>{
    const map={supply:'supplyDemand',readiness:'fleetReadiness',dynamic:'fleetDynamic',utilization:'fleetUtil',forecast:'demandForecast',lifecycle:'bookingLifecycle',loyalty:'customerLoyalty',commission:'commissionTiers',violations:'violationsDeposits'};
    const k=map[window.__reportKey||'supply']||'supplyDemand';
    return (S[k]||S.supplyDemand)();
  };
})();
</script>
